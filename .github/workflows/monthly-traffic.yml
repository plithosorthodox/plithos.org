name: Record monthly traffic

on:
  schedule:
    # The second run is an idempotent retry in case GitHub delays a scheduled job.
    - cron: "17 10 2,3 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Completed UTC month to collect, in YYYY-MM form"
        required: false
        type: string

concurrency:
  group: monthly-traffic
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WEB_ANALYTICS_SITE_TAG: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_SITE_TAG }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Rebase onto the current remote branch
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git rebase "origin/$DEFAULT_BRANCH"

      - name: Run exporter tests
        run: python3 -m unittest tests.test_traffic_snapshot

      - name: Select month
        id: period
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$REQUESTED_MONTH" ]; then
            month="$REQUESTED_MONTH"
          else
            month="$(python3 -c 'import datetime as d; x=d.datetime.now(d.timezone.utc).date().replace(day=1)-d.timedelta(days=1); print(x.strftime("%Y-%m"))')"
          fi
          echo "month=$month" >> "$GITHUB_OUTPUT"

      - name: Export aggregate snapshot
        run: python3 tools/export_traffic_snapshot.py --month "${{ steps.period.outputs.month }}"

      - name: Commit a new snapshot
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- analytics/traffic)" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/traffic
          git commit -m "Record traffic snapshot for ${{ steps.period.outputs.month }} [skip ci]"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Rebase and push explicitly
        if: steps.commit.outputs.created == 'true'
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git rebase "origin/$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
