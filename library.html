Thee we ascribe glory: to the Father, and to the Son, and to the Holy Spirit, now and ever","el":"Ὅτι ἅγιος εἶ, ὁ Θεὸς ἡμῶν, καὶ σοὶ τὴν δόξαν ἀναπέμπομεν, τῷ Πατρὶ καὶ τῷ Υἱῷ καὶ τῷ Ἁγίῳ Πνεύματι, νῦν καὶ ἀεὶ","cu":"Яко свят еси, Боже наш, и Тебе славу возсылаем, Отцу и Сыну и Святому Духу, ныне и присно","ro":"Că sfânt ești Dumnezeul nostru și Ție slavă înălțăm, Tatălui și Fiului și Sfântului Duh, acum și pururea","de":"Denn heilig bist Du, unser Gott, und Dir senden wir die Verherrlichung empor, dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar"},"m":"aloud"},{"r":"deacon","t":{"en":"and unto ages of ages.","el":"καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"и во веки веков.","ro":"și în vecii vecilor.","de":"und in die Ewigkeit der Ewigkeit."}},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}}]},"2":{"title":"The Trisagion, the Epistle, and the Gospel","lines":[{"r":"rubric","x":"THE TRISAGION. While the priest finishes the Trisagion prayer at the altar, the people sing (three times):","t":{"en":"THE TRISAGION. While the priest finishes the Trisagion prayer at the altar, the people sing (three times):","el":"ΤΟ ΤΡΙΣΑΓΙΟΝ. Ἐνῷ ὁ ἱερεὺς ὁλοκληρώνει τὴν εὐχὴν τοῦ Τρισαγίου εἰς τὸ θυσιαστήριον, ὁ λαὸς ψάλλει (τρίς):","cu":"ТРИСВЯТОЕ. Пока священник оканчивает молитву Трисвятого во алтаре, людие поют (трижды):","ro":"TRISAGHIONUL. În timp ce preotul sfârșește rugăciunea Trisaghionului în altar, strana cântă (de trei ori):","de":"DAS TRISHAGION. Während der Priester am Altar das Trishagion-Gebet beendet, singt das Volk (dreimal):"}},{"r":"choir","t":{"en":"Holy God, Holy Mighty, Holy Immortal: have mercy on us.","el":"Ἅγιος ὁ Θεός, Ἅγιος Ἰσχυρός, Ἅγιος Ἀθάνατος, ἐλέησον ἡμᾶς.","cu":"Святый Боже, Святый Крепкий, Святый Безсмертный, помилуй нас.","ro":"Sfinte Dumnezeule, Sfinte tare, Sfinte fără de moarte, miluiește-ne pe noi.","de":"Heiliger Gott, heiliger Starker, heiliger Unsterblicher, erbarme Dich unser."}},{"r":"choir","t":{"en":"Glory to the Father, and to the Son, and to the Holy Spirit, now and ever and unto ages of ages. Amen. Holy Immortal: have mercy on us.","el":"Δόξα Πατρὶ καὶ Υἱῷ καὶ Ἁγίῳ Πνεύματι, καὶ νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν. Ἅγιος Ἀθάνατος, ἐλέησον ἡμᾶς.","cu":"Слава Отцу и Сыну и Святому Духу, и ныне и присно и во веки веков. Аминь. Святый Безсмертный, помилуй нас.","ro":"Slavă Tatălui și Fiului și Sfântului Duh, și acum și pururea și în vecii vecilor. Amin. Sfinte fără de moarte, miluiește-ne pe noi.","de":"Ehre sei dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit. Amen. Heiliger Unsterblicher, erbarme Dich unser."}},{"r":"choir","t":{"en":"Holy God, Holy Mighty, Holy Immortal: have mercy on us.","el":"Ἅγιος ὁ Θεός, Ἅγιος Ἰσχυρός, Ἅγιος Ἀθάνατος, ἐλέησον ἡμᾶς.","cu":"Святый Боже, Святый Крепкий, Святый Безсмертный, помилуй нас.","ro":"Sfinte Dumnezeule, Sfinte tare, Sfinte fără de moarte, miluiește-ne pe noi.","de":"Heiliger Gott, heiliger Starker, heiliger Unsterblicher, erbarme Dich unser."}},{"r":"rubric","x":"(On Nativity, Theophany, Pascha and Bright Week, Pentecost, and Lazarus Saturday, \"As many as have been baptized into Christ\" replaces the Trisagion; on feasts of the Cross, \"Thy Cross we venerate.\")","t":{"en":"(On Nativity, Theophany, Pascha and Bright Week, Pentecost, and Lazarus Saturday, \"As many as have been baptized into Christ\" replaces the Trisagion; on feasts of the Cross, \"Thy Cross we venerate.\")","el":"(Κατὰ τὰ Χριστούγεννα, τὰ Θεοφάνια, τὸ Πάσχα καὶ τὴν Διακαινήσιμον, τὴν Πεντηκοστὴν καὶ τὸ Σάββατον τοῦ Λαζάρου, ἀντὶ τοῦ Τρισαγίου ψάλλεται «Ὅσοι εἰς Χριστὸν ἐβαπτίσθητε»· κατὰ τὰς ἑορτὰς τοῦ Σταυροῦ, «Τὸν Σταυρόν σου προσκυνοῦμεν».)","cu":"(В Рождество, Богоявление, Пасху и Светлую седмицу, Пятидесятницу и Лазареву субботу вместо Трисвятого поется «Елицы во Христа крестистеся»; в праздники Креста — «Кресту Твоему покланяемся».)","ro":"(La Nașterea Domnului, Bobotează, Paști și Săptămâna Luminată, Rusalii și Sâmbăta lui Lazăr, în locul Trisaghionului se cântă „Câți în Hristos v-ați botezat”; la praznicele Crucii, „Crucii Tale ne închinăm”.)","de":"(An Weihnachten, Theophanie, Pascha und der Lichten Woche, Pfingsten und dem Lazarus-Samstag wird statt des Trishagion „Die ihr auf Christus getauft seid” gesungen; an den Kreuzfesten „Dein Kreuz verehren wir”.)"}},{"r":"rubric","x":"THE EPISTLE. The deacon calls for attention; the prokeimenon of the day is sung.","t":{"en":"THE EPISTLE. The deacon calls for attention; the prokeimenon of the day is sung.","el":"Ο ΑΠΟΣΤΟΛΟΣ. Ὁ διάκονος καλεῖ εἰς προσοχήν· ψάλλεται τὸ προκείμενον τῆς ἡμέρας.","cu":"АПОСТОЛ. Диакон призывает ко вниманию; поется прокимен дня.","ro":"APOSTOLUL. Diaconul cheamă la luare-aminte; se cântă prochimenul zilei.","de":"DIE EPISTEL. Der Diakon ruft zur Aufmerksamkeit; das Prokeimenon des Tages wird gesungen."}},{"r":"deacon","t":{"en":"Let us attend.","el":"Πρόσχωμεν.","cu":"Вонмем.","ro":"Să luăm aminte.","de":"Lasset uns aufmerken."}},{"r":"priest","t":{"en":"Peace be unto all.","el":"Εἰρήνη πᾶσι.","cu":"Мир всем.","ro":"Pace tuturor.","de":"Friede allen."}},{"r":"rubric","x":"The reader announces the prokeimenon and reading of the day, then reads the appointed Epistle.","t":{"en":"The reader announces the prokeimenon and reading of the day, then reads the appointed Epistle.","el":"Ὁ ἀναγνώστης ἀναγγέλλει τὸ προκείμενον καὶ τὸ ἀνάγνωσμα τῆς ἡμέρας, καὶ ἀναγινώσκει τὸν ὁρισμένον Ἀπόστολον.","cu":"Чтец возглашает прокимен и чтение дня, и читает положенный Апостол.","ro":"Cititorul vestește prochimenul și citirea zilei, apoi citește Apostolul rânduit.","de":"Der Lektor verkündet das Prokeimenon und die Lesung des Tages und liest die bestimmte Epistel."}},{"r":"reader","t":{"en":"The reading is from … (the Acts of the Apostles, or the Epistle of the holy Apostle Paul, or the Catholic Epistle).","el":"Προκείμενον … Πρὸς … ἡ ἀνάγνωσις (ἢ Πράξεων τῶν Ἀποστόλων τὸ ἀνάγνωσμα).","cu":"Прокимен … К … чтение (или Деяний святых апостолов чтение).","ro":"Din … citire (din Faptele Apostolilor, ori din Epistola Sfântului Apostol Pavel).","de":"Lesung aus … (der Apostelgeschichte, oder dem Brief des heiligen Apostels Paulus)."}},{"r":"rubric","x":"The Epistle of the day is read.","t":{"en":"The Epistle of the day is read.","el":"Ἀναγινώσκεται ὁ Ἀπόστολος τῆς ἡμέρας.","cu":"Читается Апостол дня.","ro":"Se citește Apostolul zilei.","de":"Die Epistel des Tages wird gelesen."}},{"r":"priest","t":{"en":"Peace be unto thee that readest.","el":"Εἰρήνη σοι τῷ ἀναγινώσκοντι.","cu":"Мир ти, чтущему.","ro":"Pace ție, celui ce citești.","de":"Friede dir, dem Lesenden."}},{"r":"choir","t":{"en":"Alleluia, alleluia, alleluia.","el":"Ἀλληλούϊα, ἀλληλούϊα, ἀλληλούϊα.","cu":"Аллилуйя, аллилуйя, аллилуйя.","ro":"Aliluia, aliluia, aliluia.","de":"Alleluia, alleluia, alleluia."}},{"r":"rubric","x":"While the Alleluia is sung, the priest prays quietly the Prayer before the Gospel:","t":{"en":"While the Alleluia is sung, the priest prays quietly the Prayer before the Gospel:","el":"Ἐνῷ ψάλλεται τὸ Ἀλληλούϊα, ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν εὐχὴν πρὸ τοῦ Εὐαγγελίου:","cu":"Во время пения Аллилуия священник тайно читает молитву прежде Евангелия:","ro":"În timp ce se cântă Aliluia, preotul citește în taină Rugăciunea dinaintea Evangheliei:","de":"Während das Alleluia gesungen wird, betet der Priester still das Gebet vor dem Evangelium:"}},{"r":"priest","t":{"en":"Shine in our hearts, O Master who lovest mankind, the pure light of the knowledge of Thee, and open the eyes of our mind to understand Thy gospel teachings. Implant in us also the fear of Thy blessed commandments, that, trampling down all carnal desires, we may pursue a spiritual life, both thinking and doing all things well-pleasing to Thee. For Thou art the illumination of our souls and bodies, O Christ our God, and to Thee we ascribe glory, together with Thine eternal Father and Thine all-holy and good and life-giving Spirit, now and ever and unto ages of ages.","el":"Ἔλλαμψον ἐν ταῖς καρδίαις ἡμῶν, φιλάνθρωπε Δέσποτα, τὸ τῆς σῆς θεογνωσίας ἀκήρατον φῶς καὶ τοὺς τῆς διανοίας ἡμῶν ὀφθαλμοὺς διάνοιξον εἰς τὴν τῶν εὐαγγελικῶν σου κηρυγμάτων κατανόησιν. Ἔνθες ἡμῖν καὶ τὸν τῶν μακαρίων σου ἐντολῶν φόβον, ἵνα τὰς σαρκικὰς ἐπιθυμίας πάσας καταπατήσαντες πνευματικὴν πολιτείαν μετέλθωμεν, πάντα τὰ πρὸς εὐαρέστησιν τὴν σὴν καὶ φρονοῦντες καὶ πράττοντες. Σὺ γὰρ εἶ ὁ φωτισμὸς τῶν ψυχῶν καὶ τῶν σωμάτων ἡμῶν, Χριστὲ ὁ Θεός, καὶ σοὶ τὴν δόξαν ἀναπέμπομεν σὺν τῷ ἀνάρχῳ σου Πατρὶ καὶ τῷ παναγίῳ καὶ ἀγαθῷ καὶ ζωοποιῷ σου Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων","ro":"Strălucește în inimile noastre, Iubitorule de oameni, Stăpâne, lumina cea curată a cunoașterii Dumnezeirii Tale și deschide ochii gândului nostru spre înțelegerea evanghelicelor Tale propovăduiri. Pune în noi și frica fericitelor Tale porunci, ca toate poftele trupului călcând, viețuire duhov nicească să petrecem, cugetând și făcând toate cele ce sunt spre bună-plăcerea Ta. Că Tu ești luminarea sufle te lor și a trupurilor noastre, Hristoase Dumneze ule și Ție slavă înălțăm, împreună și Celui fără de început al Tău Părinte și Preasfântului și bunului și de viață făcătorului Tău Duh, acum și pururea și în vecii vecilor","de":"Lass in unseren Herzen aufleuchten, menschenliebender Gebieter, das reine Licht Deiner Gotteserkenntnis und öffne die Augen unseres Sinnes für das Verständnis Deiner evangelischen Verkündigungen. Lege in uns auch die Furcht vor Deinen seligen Geboten, damit wir alle fleischlichen Begierden niedertreten und ein geistliches Leben führen und alles denken und tun, was Dir wohlgefällt. Denn Du bist die Erleuchtung unserer Seelen und Leiber, Christus, unser Gott, und Dir senden wir die Verherrlichung empor, mit Deinem anfanglosen Vater und Deinem allheiligen und guten und lebendigmachenden Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit.","cu":"Возсияй в сердцах наших, Человеколюбче Владыко, Твоего богоразумия нетленный свет, и мысленныя наши отверзи очи во евангельских Твоих проповеданий разумение, вложи в нас и блаженных Твоих заповедей страх, да, плотския похоти вся поправше, духовное жительство пройдем, вся, яже ко благоугождению Твоему, и мудрствующе и деюще."},"m":"silently"},{"r":"rubric","x":"THE GOSPEL. The deacon asks a blessing to read; the priest blesses him.","t":{"en":"THE GOSPEL. The deacon asks a blessing to read; the priest blesses him.","el":"ΤΟ ΕΥΑΓΓΕΛΙΟΝ. Ὁ διάκονος ζητεῖ εὐλογίαν νὰ ἀναγνώσῃ· ὁ ἱερεὺς τὸν εὐλογεῖ.","cu":"ЕВАНГЕЛИЕ. Диакон испрашивает благословение на чтение; священник благословляет его.","ro":"EVANGHELIA. Diaconul cere binecuvântare spre a citi; preotul îl binecuvântează.","de":"DAS EVANGELIUM. Der Diakon erbittet den Segen zur Lesung; der Priester segnet ihn."}},{"r":"deacon","t":{"en":"Bless, master, the proclaimer of the holy Apostle and Evangelist N.","el":"Εὐλόγησον, δέσποτα, τὸν εὐαγγελιστὴν τοῦ ἁγίου ἐνδόξου Ἀποστόλου καὶ Εὐαγγελιστοῦ N.","cu":"Благослови, владыко, благовестителя святаго апостола и евангелиста, имярек.","ro":"Binecuvântează, stăpâne, pe binevestitorul Sfântului Apostol și Evanghelist N.","de":"Segne, Gebieter, den Verkünder des heiligen Apostels und Evangelisten N."}},{"r":"priest","t":{"en":"May God, through the prayers of the holy, glorious Apostle and Evangelist N., grant thee to proclaim the good tidings with great power, to the fulfilment of the gospel of His beloved Son, our Lord Jesus Christ.","el":"Ὁ Θεός, διὰ πρεσβειῶν τοῦ ἁγίου ἐνδόξου Ἀποστόλου καὶ Εὐαγγελιστοῦ N., δῴη σοι ῥῆμα τῷ εὐαγγελιζομένῳ δυνάμει πολλῇ, εἰς ἐκπλήρωσιν τοῦ Εὐαγγελίου τοῦ ἀγαπητοῦ Υἱοῦ αὐτοῦ, Κυρίου δὲ ἡμῶν Ἰησοῦ Χριστοῦ.","cu":"Бог, молитвами святаго славнаго апостола и евангелиста, имярек, да даст тебе глагол благовествующему силою многою, во исполнение Евангелия возлюбленнаго Сына Своего, Господа нашего Иисуса Христа.","ro":"Dumnezeu, pentru rugăciunile Sfântului, măritului Apostol și Evanghelist N., să-ți dea ție, celui ce binevestești, cuvânt cu putere multă, spre plinirea Evangheliei iubitului Său Fiu, Domnul nostru Iisus Hristos.","de":"Gott gebe dir durch die Fürbitten des heiligen, ruhmreichen Apostels und Evangelisten N., dem Verkündenden das Wort mit großer Kraft, zur Erfüllung des Evangeliums Seines geliebten Sohnes, unseres Herrn Jesus Christus."}},{"r":"priestdeacon","t":{"en":"Wisdom! Stand upright! Let us hear the holy Gospel.","el":"Σοφία. Ὀρθοί. Ἀκούσωμεν τοῦ ἁγίου Εὐαγγελίου.","cu":"Премудрость, прости, услышим святаго Евангелия.","ro":"Înțelepciune, drepți! Să ascultăm Sfânta Evanghelie.","de":"Weisheit! Aufrecht! Lasset uns hören das heilige Evangelium."},"m":"aloud"},{"r":"priest","t":{"en":"Peace be unto all.","el":"Εἰρήνη πᾶσι.","cu":"Мир всем.","ro":"Pace tuturor.","de":"Friede allen."}},{"r":"choir","t":{"en":"And to thy spirit.","el":"Καὶ τῷ πνεύματί σου.","cu":"И духови твоему.","ro":"Și duhului tău.","de":"Und deinem Geiste."}},{"r":"deacon","t":{"en":"The reading is from the holy Gospel according to N.","el":"Ἐκ τοῦ κατὰ N. ἁγίου Εὐαγγελίου τὸ ἀνάγνωσμα.","cu":"От, имярек, святаго Евангелия чтение.","ro":"Din Sfânta Evanghelie de la N. citire.","de":"Lesung aus dem heiligen Evangelium nach N."}},{"r":"choir","t":{"en":"Glory to Thee, O Lord, glory to Thee.","el":"Δόξα σοι, Κύριε, δόξα σοι.","cu":"Слава Тебе, Господи, слава Тебе.","ro":"Slavă Ție, Doamne, slavă Ție.","de":"Ehre sei Dir, o Herr, Ehre sei Dir."}},{"r":"rubric","x":"The Gospel of the day is proclaimed.","t":{"en":"The Gospel of the day is proclaimed.","el":"Ἀναγινώσκεται τὸ Εὐαγγέλιον τῆς ἡμέρας.","cu":"Возглашается Евангелие дня.","ro":"Se citește Evanghelia zilei.","de":"Das Evangelium des Tages wird verkündet."}},{"r":"choir","t":{"en":"Glory to Thee, O Lord, glory to Thee.","el":"Δόξα σοι, Κύριε, δόξα σοι.","cu":"Слава Тебе, Господи, слава Тебе.","ro":"Slavă Ție, Doamne, slavă Ție.","de":"Ehre sei Dir, o Herr, Ehre sei Dir."}},{"r":"rubric","x":"THE AUGMENTED LITANY (the Litany of Fervent Supplication). To each petition the people answer, 'Lord, have mercy' (three times).","t":{"en":"THE AUGMENTED LITANY (the Litany of Fervent Supplication). To each petition the people answer, 'Lord, have mercy' (three times).","el":"Η ΕΚΤΕΝΗΣ (ἡ Ἐκτενὴς Ἱκεσία). Εἰς ἕκαστον αἴτημα ὁ λαὸς ἀποκρίνεται «Κύριε, ἐλέησον» (τρίς).","cu":"СУГУБАЯ ЕКТЕНИЯ (прилежное моление). На каждое прошение людие отвещают «Господи, помилуй» (трижды).","ro":"ECTENIA ÎNTREITĂ (a cererii stăruitoare). La fiecare cerere, strana răspunde „Doamne, miluiește” (de trei ori).","de":"DIE INSTÄNDIGE EKTENIE (das eindringliche Flehen). Auf jede Bitte antwortet das Volk „Herr, erbarme Dich” (dreimal)."}},{"r":"deacon","t":{"en":"Let us all say with our whole soul and with our whole mind, let us say.","el":"Εἴπωμεν πάντες ἐξ ὅλης τῆς ψυχῆς καὶ ἐξ ὅλης τῆς διανοίας ἡμῶν εἴπωμεν.","cu":"Рцем вси от всея души, и от всего помышления нашего рцем.","ro":"Să zicem toți, din tot sufletul și din tot cugetul nostru să zicem.","de":"Lasset uns alle sagen aus ganzer Seele und aus unserem ganzen Sinn lasset uns sagen."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"O Lord Almighty, the God of our fathers, we pray Thee, hearken and have mercy.","el":"Κύριε Παντοκράτορ, ὁ Θεὸς τῶν Πατέρων ἡμῶν, δεόμεθά σου, ἐπάκουσον καὶ ἐλέησον.","cu":"Господи Вседержителю, Боже отец наших, молим Ти ся, услыши и помилуй.","ro":"Doamne atotputernice, Dumnezeul părinților noștri, rugămu-ne Ție, auzi-ne și ne miluiește.","de":"Herr, Allerhalter, Gott unserer Väter, wir bitten Dich, erhöre uns und erbarme Dich."}},{"r":"deacon","t":{"en":"Have mercy on us, O God, according to Thy great mercy; we pray Thee, hearken and have mercy.","el":"Ἐλέησον ἡμᾶς, ὁ Θεός, κατὰ τὸ μέγα ἔλεός σου, δεόμεθά σου, ἐπάκουσον καὶ ἐλέησον.","cu":"Помилуй нас, Боже, по велицей милости Твоей, молим Ти ся, услыши и помилуй.","ro":"Miluiește-ne pe noi, Dumnezeule, după mare mila Ta, rugămu-ne Ție, auzi-ne și ne miluiește.","de":"Erbarme Dich unser, o Gott, nach Deinem großen Erbarmen, wir bitten Dich, erhöre uns und erbarme Dich."}},{"r":"rubric","x":"The deacon prays for the hierarch and clergy; here the local bishop is named:","t":{"en":"The deacon prays for the hierarch and clergy; here the local bishop is named:","el":"Ὁ διάκονος δέεται ὑπὲρ τοῦ ἀρχιερέως καὶ τοῦ κλήρου· ἐνταῦθα μνημονεύεται ὁ ἐπιχώριος ἐπίσκοπος:","cu":"Диакон молится о архиерее и причте; зде поминается местный епископ:","ro":"Diaconul se roagă pentru ierarh și cler; aici se pomenește episcopul locului:","de":"Der Diakon betet für den Hierarchen und den Klerus; hier wird der Ortsbischof genannt:"}},{"r":"commem","x":"Again we pray for our father and Archbishop N., and for all our brotherhood in Christ. (The reigning hierarch is named according to local use.)","t":{"en":"Again we pray for our father and Archbishop N., and for all our brotherhood in Christ. (The reigning hierarch is named according to local use.)","el":"Ἔτι δεόμεθα ὑπὲρ τοῦ πατρὸς καὶ ἀρχιεπισκόπου ἡμῶν (δεῖνος) καὶ πάσης τῆς ἐν Χριστῷ ἀδελφότητος ἡμῶν. (Ὁ οἰκεῖος ἀρχιερεὺς μνημονεύεται κατὰ τὴν τοπικὴν τάξιν.)","cu":"Еще молимся о отце и архиепископе нашем, имярек, и о всем во Христе братстве нашем. (Правящий архиерей поминается по местному уставу.)","ro":"Încă ne rugăm pentru părintele și arhiepiscopul nostru (N) și pentru toată frățietatea noastră cea întru Hristos. (Ierarhul cârmuitor se pomenește după rânduiala locului.)","de":"Wiederum beten wir für unseren Vater und Erzbischof N. und für unsere ganze Bruderschaft in Christus. (Der regierende Hierarch wird nach örtlichem Brauch genannt.)"}},{"r":"deacon","t":{"en":"Again we pray for mercy, life, peace, health, salvation, and visitation for the servants of God, and for the pardon and remission of their sins.","el":"Ἔτι δεόμεθα ὑπὲρ ἐλέους, ζωῆς, εἰρήνης, ὑγείας, σωτηρίας, ἐπισκέψεως, συγχωρήσεως καὶ ἀφέσεως τῶν ἁμαρτιῶν τῶν δούλων τοῦ Θεοῦ.","cu":"Еще молимся о милости, жизни, мире, здравии, спасении, посещении, прощении и оставлении грехов рабов Божиих.","ro":"Încă ne rugăm pentru milă, viață, pace, sănătate, mântuire, cercetare, lăsarea și iertarea păcatelor robilor lui Dumnezeu.","de":"Wiederum beten wir um Erbarmen, Leben, Frieden, Gesundheit, Heil, Heimsuchung, Vergebung und Nachlass der Sünden der Knechte Gottes."}},{"r":"deacon","t":{"en":"Again we pray for the blessed and ever-memorable founders of this holy church, and for all our fathers and brethren who have fallen asleep before us, the Orthodox here and everywhere laid to rest.","el":"Ἔτι δεόμεθα ὑπὲρ τῶν μακαρίων καὶ ἀειμνήστων κτητόρων τῆς ἁγίας Ἐκκλησίας ταύτης, καὶ ὑπὲρ πάντων τῶν προαναπαυσαμένων πατέρων καὶ ἀδελφῶν ἡμῶν.","cu":"Еще молимся о блаженных и приснопамятных создателех святаго храма сего, и о всех преждепочивших отцех и братиях наших.","ro":"Încă ne rugăm pentru fericiții și pururea pomeniții ctitori ai sfântului locașului acestuia și pentru toți cei mai înainte adormiți părinți și frați ai noștri.","de":"Wiederum beten wir für die seligen und stets gedenkwürdigen Stifter dieser heiligen Kirche und für alle vor uns entschlafenen Väter und Brüder."}},{"r":"deacon","t":{"en":"Again we pray for those who bring offerings and do good in this holy and all-venerable church, for those who labour and those who sing, and for the people here present who await Thy great and rich mercy.","el":"Ἔτι δεόμεθα ὑπὲρ τῶν καρποφορούντων καὶ καλλιεργούντων ἐν τῷ ἁγίῳ καὶ πανσέπτῳ ναῷ τούτῳ, κοπιώντων, ψαλλόντων καὶ ὑπὲρ τοῦ περιεστῶτος λαοῦ.","cu":"Еще молимся о плодоносящих и добродеющих во святем и всечестнем храме сем, труждающихся, поющих и предстоящих людех.","ro":"Încă ne rugăm pentru cei ce aduc daruri și fac bine în sfânt și întru tot cinstit locașul acesta, pentru cei ce se ostenesc, pentru cei ce cântă și pentru poporul ce stă de față.","de":"Wiederum beten wir für die Spender und Wohltäter in diesem heiligen und allverehrten Tempel, für die sich Mühenden, die Singenden und das umstehende Volk."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"rubric","x":"The priest prays quietly the Prayer of Fervent Supplication, then concludes aloud:","t":{"en":"The priest prays quietly the Prayer of Fervent Supplication, then concludes aloud:","el":"Ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν εὐχὴν τῆς ἐκτενοῦς ἱκεσίας καὶ καταλήγει ἐκφώνως:","cu":"Священник тайно читает молитву прилежного моления и оканчивает велегласно:","ro":"Preotul citește în taină Rugăciunea cererii stăruitoare și încheie cu glas tare:","de":"Der Priester betet still das Gebet des eindringlichen Flehens und beschließt laut:"}},{"r":"priest","t":{"en":"O Lord our God, accept this fervent supplication from Thy servants, and have mercy on us according to the multitude of Thy mercies; and send down Thy compassions upon us and upon all Thy people, who await Thy rich mercy.","el":"Κύριε ὁ Θεὸς ἡμῶν, τὴν ἐκτενῆ ταύτην ἱκεσίαν πρόσδεξαι παρὰ τῶν σῶν δούλων καὶ ἐλέησον ἡμᾶς κατὰ τὸ πλῆθος τοῦ ἐλέους σου· καὶ τοὺς οἰκτιρμούς σου κατάπεμψον ἐφ’ ἡμᾶς καὶ ἐπὶ πάντα τὸν λαόν σου, τὸν ἀπεκδεχόμενον τὸ παρὰ σοῦ μέγα καὶ πλούσιον ἔλεος","ro":"Doamne, Dumnezeul nostru, primește această rugăciune stăruitoare de la robii Tăi și ne miluiește pe noi, după mulțimea milei Tale, și trimite îndurările Tale peste noi și peste tot poporul Tău, care așteaptă de la Tine mare și bogată milă.","de":"Herr, unser Gott, nimm dieses inständige Bittgebet von Deinen Knechten an, erbarme Dich unser nach der Fülle Deines Erbarmens, und sende Dein Mitleid herab auf uns und auf Dein ganzes Volk, das da erwartet von Dir das reiche Erbarmen","cu":"Господи Боже наш, прилежное сие моление приими от Твоих раб, и помилуй нас по множеству милости Твоея, и щедроты Твоя низпосли на ны, и на вся люди Твоя, чающыя от Тебе богатыя милости."},"m":"silently"},{"r":"priest","t":{"en":"For Thou art a merciful God who lovest mankind, and to Thee we ascribe glory: to the Father, and to the Son, and to the Holy Spirit, now and ever and unto ages of ages.","el":"Ὅτι ἐλεήμων καὶ φιλάνθρωπος Θεὸς ὑπάρχεις, καὶ σοὶ τὴν δόξαν ἀναπέμπομεν, τῷ Πατρὶ καὶ τῷ Υἱῷ καὶ τῷ Ἁγίῳ Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Яко милостив и человеколюбец Бог еси, и Тебе славу возсылаем, Отцу и Сыну и Святому Духу, ныне и присно и во веки веков.","ro":"Că milostiv și iubitor de oameni Dumnezeu ești și Ție slavă înălțăm, Tatălui și Fiului și Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Denn ein barmherziger und menschenliebender Gott bist Du, und Dir senden wir die Verherrlichung empor, dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"rubric","x":"THE LITANY OF THE CATECHUMENS. (In many parishes the deacon's petitions here are abridged or said quietly.) To each: 'Lord, have mercy.'","t":{"en":"THE LITANY OF THE CATECHUMENS. (In many parishes the deacon's petitions here are abridged or said quietly.) To each: 'Lord, have mercy.'","el":"Η ΣΥΝΑΠΤΗ ΤΩΝ ΚΑΤΗΧΟΥΜΕΝΩΝ. (Εἰς πολλὰς ἐνορίας τὰ αἰτήματα τοῦ διακόνου ἐνταῦθα συντέμνονται ἢ λέγονται μυστικῶς.) Εἰς ἕκαστον: «Κύριε, ἐλέησον.»","cu":"ЕКТЕНИЯ ОБ ОГЛАШЕННЫХ. (Во многих приходах прошения диакона зде сокращаются или произносятся тайно.) На каждое: «Господи, помилуй.»","ro":"ECTENIA CELOR CHEMAȚI. (În multe parohii, cererile diaconului de aici se prescurtează sau se rostesc în taină.) La fiecare: „Doamne, miluiește.”","de":"DIE EKTENIE DER KATECHUMENEN. (In vielen Gemeinden werden die Bitten des Diakons hier gekürzt oder still gesprochen.) Auf jede: „Herr, erbarme Dich.”"}},{"r":"deacon","t":{"en":"Catechumens, pray to the Lord.","el":"Εὔξασθε οἱ κατηχούμενοι τῷ Κυρίῳ.","cu":"Помолитеся, оглашеннии, Господеви.","ro":"Rugați-vă, cei chemați, Domnului.","de":"Betet, ihr Katechumenen, zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"Let us, the faithful, pray for the catechumens: that the Lord may have mercy on them, teach them the word of truth, reveal to them the gospel of righteousness, and unite them to His holy, catholic, and apostolic Church.","el":"Οἱ πιστοὶ ὑπὲρ τῶν κατηχουμένων δεηθῶμεν, ἵνα ὁ Κύριος αὐτοὺς ἐλεήσῃ· κατηχήσῃ αὐτοὺς τὸν λόγον τῆς ἀληθείας· ἀποκαλύψῃ αὐτοῖς τὸ Εὐαγγέλιον τῆς δικαιοσύνης· ἑνώσῃ αὐτοὺς τῇ ἁγίᾳ αὐτοῦ καθολικῇ καὶ ἀποστολικῇ Ἐκκλησίᾳ.","cu":"Вернии, о оглашенных помолимся, да Господь помилует их, огласит их словом истины, открыет им Евангелие правды, соединит их Святей Своей Соборней и Апостольстей Церкви.","ro":"Noi, credincioșii, pentru cei chemați să ne rugăm, ca Domnul să-i miluiască pe dânșii, să-i învețe pe ei cuvântul adevărului, să le descopere lor Evanghelia dreptății, să-i unească pe ei cu sfânta Sa sobornicească și apostolească Biserică.","de":"Wir Gläubigen, lasset uns für die Katechumenen beten, dass der Herr sich ihrer erbarme, sie das Wort der Wahrheit lehre, ihnen das Evangelium der Gerechtigkeit offenbare und sie Seiner heiligen, katholischen und apostolischen Kirche eine."}},{"r":"deacon","t":{"en":"Help us, save them, have mercy on them, and keep them, O God, by Thy grace.","el":"Ἀντιλαβοῦ, σῶσον, ἐλέησον καὶ διαφύλαξον αὐτούς, ὁ Θεός, τῇ σῇ χάριτι.","cu":"Заступи, спаси, помилуй и сохрани их, Боже, Твоею благодатию.","ro":"Apără, mântuiește, miluiește și-i păzește pe dânșii, Dumnezeule, cu harul Tău.","de":"Stehe bei, errette, erbarme Dich und behüte sie, o Gott, durch Deine Gnade."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"Catechumens, bow your heads to the Lord.","el":"Οἱ κατηχούμενοι, τὰς κεφαλὰς ὑμῶν τῷ Κυρίῳ κλίνατε.","cu":"Оглашеннии, главы ваша Господеви приклоните.","ro":"Cei chemați, capetele voastre Domnului plecați-le.","de":"Ihr Katechumenen, neiget eure Häupter dem Herrn."}},{"r":"choir","t":{"en":"To Thee, O Lord.","el":"Σοί, Κύριε.","cu":"Тебе, Господи.","ro":"Ție, Doamne.","de":"Dir, o Herr."}},{"r":"rubric","x":"The priest prays quietly the Prayer for the Catechumens, then concludes aloud:","t":{"en":"The priest prays quietly the Prayer for the Catechumens, then concludes aloud:","el":"Ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν εὐχὴν ὑπὲρ τῶν κατηχουμένων καὶ καταλήγει ἐκφώνως:","cu":"Священник тайно читает молитву об оглашенных и оканчивает велегласно:","ro":"Preotul citește în taină Rugăciunea pentru cei chemați și încheie cu glas tare:","de":"Der Priester betet still das Gebet für die Katechumenen und beschließt laut:"}},{"r":"priest","t":{"en":"O Lord our God, who dwellest on high and regardest the things that are lowly, who for the salvation of mankind didst send forth Thine only-begotten Son, our God and Lord Jesus Christ: look upon Thy servants the catechumens, who have bowed their necks to Thee, and grant them in due season the laver of regeneration, the remission of sins, and the robe of incorruption; unite them to Thy holy, catholic, and apostolic Church, and number them with Thy chosen flock.","el":"Κύριε ὁ Θεὸς ἡμῶν, ὁ ἐν ὑψηλοῖς κατοικῶν καὶ τὰ ταπεινὰ ἐφορῶν, ὁ τὴν σωτηρίαν τῷ γένει τῶν ἀνθρώπων ἐξαποστείλας, τὸν μονογενῆ σου Υἱὸν καὶ Θεόν, τὸν Κύριον ἡμῶν Ἰησοῦν Χριστόν, ἐπίβλεψον ἐπὶ τοὺς δούλους σου τοὺς κατηχουμένους, τοὺς ὑποκεκλικότας σοι τὸν ἑαυτῶν αὐχένα· καὶ καταξίωσον αὐτοὺς ἐν καιρῷ εὐθέτῳ τοῦ λουτροῦ τῆς παλιγγενεσίας, τῆς ἀφέσεως τῶν ἁμαρτιῶν καὶ τοῦ ἐνδύματος τῆς ἀφθαρσίας· ἕνωσον αὐτοὺς τῇ Ἁγίᾳ σου Καθολικῇ καὶ Ἀποστολικῇ Ἐκκλησίᾳ· καὶ συγκαταρίθμησον αὐτοὺς τῇ ἐκλεκτῇ σου ποίμνῃ","ro":"Doamne Dumnezeul nostru, Cel ce întru cele de sus locuiești și spre cei smeriți privești, Care ai trimis mântuire neamului omenesc pe Unul-Născut Fiul Tău și Dumnezeu, pe Domnul nostru Iisus Hristos, caută spre robii Tăi cei chemați, care și-au plecat grumajii înaintea Ta, și-i învrednicește pe dânșii, la vremea potrivită, de baia nașterii celei de a doua, de iertarea păcatelor și de veșmântul nestricăciunii; unește-i pe dânșii cu sfânta Ta sobornicească și apostolească Biserică și-i numără pe dânșii cu turma Ta cea aleasă","de":"der Du in den Höhen wohnst und auf das Niedrige schaust, der Du dem Menschengeschlecht das Heil herabgesandt hast, Deinen einziggezeugten Sohn , Gott, unseren Herrn Jesus Christus: blicke auf Deine Knechte, die Katechumenen, die Dir ihren Nacken gebeugt haben, und würdige sie zur rechten Zeit des Bades der Wiedergeburt, der Vergebung ‹ihrer› Sünden und des Gewandes der Unvergänglichkeit; vereinige sie mit Deiner heiligen, allumfassenden und apostolischen Kirche und zähle sie Deiner auserwählten Herde hinzu","cu":"Господи Боже наш, на высоких живый и на смиренныя призираяй, спасение роду человеческому низпославый, Единороднаго Сына Твоего и Бога, Господа нашего Иисуса Христа, призри на рабы Твоя оглашенныя, подклоншыя Тебе своя выя, и сподоби я во время благополучное бани пакибытия, оставления грехов и одежди нетления, соедини их святей Твоей соборней и апостольстей Церкви, и сопричти их избранному Твоему стаду."},"m":"silently"},{"r":"priest","t":{"en":"That with us they also may glorify Thine all-honourable and majestic name, of the Father, and of the Son, and of the Holy Spirit, now and ever and unto ages of ages.","el":"Ἵνα καὶ αὐτοὶ σὺν ἡμῖν δοξάζωσι τὸ πάντιμον καὶ μεγαλοπρεπὲς ὄνομά σου, τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ Ἁγίου Πνεύματος, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Да и тии с нами славят пречестное и великолепое имя Твое, Отца и Сына и Святаго Духа, ныне и присно и во веки веков.","ro":"Ca și aceștia împreună cu noi să slăvească preacinstitul și de mare cuviință numele Tău, al Tatălui și al Fiului și al Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Auf dass auch sie mit uns verherrlichen Deinen allverehrten und hocherhabenen Namen, des Vaters und des Sohnes und des Heiligen Geistes, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"rubric","x":"The catechumens are dismissed:","t":{"en":"The catechumens are dismissed:","el":"Ἀπολύονται οἱ κατηχούμενοι:","cu":"Оглашеннии отпускаются:","ro":"Scoaterea celor chemați:","de":"Die Katechumenen werden entlassen:"}},{"r":"deacon","t":{"en":"As many as are catechumens, depart; catechumens, depart; as many as are catechumens, depart. Let none of the catechumens remain.","el":"Ὅσοι κατηχούμενοι, προέλθετε· οἱ κατηχούμενοι, προέλθετε· ὅσοι κατηχούμενοι, προέλθετε. Μή τις τῶν κατηχουμένων.","cu":"Елицы оглашеннии, изыдите; оглашеннии, изыдите; елицы оглашеннии, изыдите. Да никто от оглашенных.","ro":"Câți sunteți chemați, ieșiți; cei chemați, ieșiți; câți sunteți chemați, ieșiți. Nimeni din cei chemați.","de":"Alle, die ihr Katechumenen seid, gehet hinaus; ihr Katechumenen, gehet hinaus; alle Katechumenen, gehet hinaus. Keiner der Katechumenen."}},{"r":"rubric","x":"THE PRAYERS OF THE FAITHFUL. The catechumens having departed, the deacon bids the faithful pray; the priest prays quietly the First Prayer of the Faithful.","t":{"en":"THE PRAYERS OF THE FAITHFUL. The catechumens having departed, the deacon bids the faithful pray; the priest prays quietly the First Prayer of the Faithful.","el":"ΑΙ ΕΥΧΑΙ ΤΩΝ ΠΙΣΤΩΝ. Ἀναχωρησάντων τῶν κατηχουμένων, ὁ διάκονος προτρέπει τοὺς πιστοὺς εἰς δέησιν· ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν Α´ εὐχὴν τῶν πιστῶν.","cu":"МОЛИТВЫ ВЕРНЫХ. По исшествии оглашенных диакон призывает верных к молитве; священник тайно читает первую молитву верных.","ro":"RUGĂCIUNILE CREDINCIOȘILOR. După ieșirea celor chemați, diaconul îndeamnă pe credincioși la rugăciune; preotul citește în taină Rugăciunea întâi a credincioșilor.","de":"DIE GEBETE DER GLÄUBIGEN. Nachdem die Katechumenen hinausgegangen sind, fordert der Diakon die Gläubigen zum Gebet auf; der Priester betet still das erste Gebet der Gläubigen."}},{"r":"deacon","t":{"en":"As many as are faithful: again and again, in peace let us pray to the Lord.","el":"Ὅσοι πιστοί, ἔτι καὶ ἔτι ἐν εἰρήνῃ τοῦ Κυρίου δεηθῶμεν.","cu":"Елицы вернии, паки и паки миром Господу помолимся.","ro":"Câți suntem credincioși, iară și iară, cu pace, Domnului să ne rugăm.","de":"Alle, die wir gläubig sind, wieder und wieder in Frieden lasset uns beten zum Herrn."}},{"r":"priest","t":{"en":"We give thanks unto Thee, O Lord God of hosts, who hast made us worthy to stand even now before Thy holy altar and to fall down before Thy compassions for our sins and the errors of the people. Accept, O God, our supplication; make us worthy to offer Thee prayers and supplications and bloodless sacrifices for all Thy people; and enable us, whom Thou hast appointed to this Thy ministry by the power of Thy Holy Spirit, to call upon Thee without condemnation at all times and in every place, that, hearkening to us, Thou mayest be merciful to us in the fullness of Thy goodness.","el":"Εὐχαριστοῦμέν σοι, Κύριε ὁ Θεὸς τῶν δυνάμεων, τῷ καταξιώσαντι ἡμᾶς παραστῆναι καὶ νῦν τῷ ἁγίῳ σου θυσιαστηρίῳ καὶ προσπεσεῖν τοῖς οἰκτιρμοῖς σου ὑπὲρ τῶν ἡμετέρων ἁμαρτημάτων καὶ τῶν τοῦ λαοῦ ἀγνοημάτων. Πρόσδεξαι, ὁ Θεός, τὴν δέησιν ἡμῶν· ποίησον ἡμᾶς ἀξίους γενέσθαι τοῦ προσφέρειν σοι δεήσεις καὶ ἱκεσίας καὶ θυσίας ἀναιμάκτους ὑπὲρ παντὸς τοῦ λαοῦ σου· καὶ ἱκάνωσον ἡμᾶς, οὓς ἔθου εἰς τὴν διακονίαν σου ταύτην, ἐν τῇ δυνάμει τοῦ Πνεύματός σου τοῦ Ἁγίου, ἀκαταγνώστως καὶ ἀπροσκόπτως, ἐν καθαρῷ τῷ μαρτυρίῳ τῆς συνειδήσεως ἡμῶν, ἐπικαλεῖσθαί σε ἐν παντὶ καιρῷ καὶ τόπῳ, ἵνα, εἰσακούων ἡμῶν, ἵλεως ἡμῖν εἴης ἐν τῷ πλήθει τῆς σῆς ἀγαθότητος","ro":"Mulțumim Ție, Doamne, Dumnezeul Puterilor, Care ne-ai învrednicit pe noi a sta și acum înaintea sfântului Tău jertfelnic și a cădea la îndurările Tale, pentru păcatele noastre și pentru păcatele cele din neștiință ale poporului. Primește Dumnezeule, rugăciunea noastră; fă-ne să fim vrednici a-Ți aduce rugăciuni, cereri și jertfe fără de sânge pentru tot poporul Tău; și ne învrednicește pe noi, pe care ne-ai pus întru această slujbă a Ta, cu puterea Duhului Tău celui Sfânt, ca fără de osândă și fără de sminteală, întru mărturia curată a cugetului nostru, să Te chemăm pe Tine în toată vremea și în tot locul și, auzindu-ne pe noi, milostiv să ne fii nouă, întru mulțimea bunătății Tale","de":"Wir danken Dir, Herr, Gott der Mächte, der Du uns gewürdigt hast, auch jetzt vor Deinem heiligen Opfertisch zu stehen und vor Deinem Mitleid niederzufallen wegen unserer Sünden und der unwissentlichen Verfehlungen des Volkes. Nimm, o Gott, unser Gebet an, und mache uns würdig, Dir Gebete, flehentliche Bitten und unblutige Opfer darzubringen für Dein ganzes Volk. Und befähige uns, die Du in diesen Deinen Dienst gestellt hast, Dich in der Kraft Deines Heiligen Geistes ohne Verurteilung und Anstoß mit dem reinen Zeugnis unseres Gewissens anzurufen zu jeder Zeit und an jedem Ort, auf dass Du uns erhörst und uns gnädig seiest in der Fülle Deiner Güte","cu":"Благодарим Тя, Господи Боже Сил, сподобившаго нас предстати и ныне святому Твоему жертвеннику, и припасти ко щедротам Твоим о наших гресех и о людских неведениих. Приими, Боже, моление наше, сотвори ны достойны быти, еже приносити Тебе моления и мольбы и жертвы безкровныя о всех людех Твоих, и удовли нас, ихже положил еси в службу Твою сию, силою Духа Твоего Святаго, неосужденно и непреткновенно, в чистем свидетельстве совести нашея, призывати Тя на всякое время и место, да, послушая нас, милостив нам будеши во множестве Твоея благости."},"m":"silently"},{"r":"deacon","t":{"en":"Help us, save us, have mercy on us, and keep us, O God, by Thy grace.","el":"Ἀντιλαβοῦ, σῶσον, ἐλέησον καὶ διαφύλαξον ἡμᾶς, ὁ Θεός, τῇ σῇ χάριτι.","cu":"Заступи, спаси, помилуй и сохрани нас, Боже, Твоею благодатию.","ro":"Apără, mântuiește, miluiește și ne păzește pe noi, Dumnezeule, cu harul Tău.","de":"Stehe bei, errette, erbarme Dich und behüte uns, o Gott, durch Deine Gnade."}},{"r":"priest","t":{"en":"For to Thee belong all glory, honour, and worship: to the Father, and to the Son, and to the Holy Spirit, now and ever and unto ages of ages.","el":"Ὅτι πρέπει σοι πᾶσα δόξα, τιμὴ καὶ προσκύνησις, τῷ Πατρὶ καὶ τῷ Υἱῷ καὶ τῷ Ἁγίῳ Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Яко подобает Тебе всякая слава, честь и поклонение, Отцу и Сыну и Святому Духу, ныне и присно и во веки веков.","ro":"Că Ție se cuvine toată slava, cinstea și închinăciunea, Tatălui și Fiului și Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Denn Dir gebührt alle Verherrlichung, Ehre und Anbetung, dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"rubric","x":"The priest prays quietly the Second Prayer of the Faithful.","t":{"en":"The priest prays quietly the Second Prayer of the Faithful.","el":"Ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν Β´ εὐχὴν τῶν πιστῶν.","cu":"Священник тайно читает вторую молитву верных.","ro":"Preotul citește în taină Rugăciunea a doua a credincioșilor.","de":"Der Priester betet still das zweite Gebet der Gläubigen."}},{"r":"deacon","t":{"en":"Again and again, in peace let us pray to the Lord.","el":"Ἔτι καὶ ἔτι ἐν εἰρήνῃ τοῦ Κυρίου δεηθῶμεν.","cu":"Паки и паки миром Господу помолимся.","ro":"Iară și iară, cu pace, Domnului să ne rugăm.","de":"Wieder und wieder in Frieden lasset uns beten zum Herrn."}},{"r":"priest","t":{"en":"Again and oftentimes we fall down before Thee and pray Thee, O Good One and Lover of mankind, that, regarding our supplication, Thou wouldest cleanse our souls and bodies from every defilement of flesh and spirit, and grant us to stand guiltless and uncondemned before Thy holy altar. Grant also, O God, to those who pray with us, progress in life and faith and spiritual understanding; grant that they may always worship Thee with fear and love, partake of Thy holy Mysteries without guilt or condemnation, and be counted worthy of Thy heavenly kingdom.","el":"Πάλιν καὶ πολλάκις σοὶ προσπίπτομεν καὶ σοῦ δεόμεθα, ἀγαθὲ καὶ φιλάνθρωπε, ὅπως, ἐπιβλέψας ἐπὶ τὴν δέησιν ἡμῶν, καθαρίσῃς ἡμῶν τὰς ψυχὰς καὶ τὰ σώματα ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος· καὶ δῴης ἡμῖν ἀνένοχον καὶ ἀκατάκριτον τὴν παράστασιν τοῦ ἁγίου σου θυσιαστηρίου. Χάρισαι δέ, ὁ Θεός, καὶ τοῖς συνευχομένοις ἡμῖν προκοπὴν βίου καὶ πίστεως καὶ συνέσεως πνευματικῆς· δὸς αὐτοῖς πάντοτε, μετὰ φόβου καὶ ἀγάπης λατρεύειν σοι, ἀνενόχως καὶ ἀκατακρίτως μετέχειν τῶν ἁγίων σου μυστηρίων καὶ τῆς ἐπουρανίου σου βασιλείας ἀξιωθῆναι","ro":"Iarăși și de multe ori cădem la Tine și ne rugăm Ție, Bunule și Iubitorule de oameni, ca privind spre rugăciunea noastră, să curățești sufletele și trupurile noastre de toată necurăția trupului și a duhului și să ne dai nouă să stăm nevinovați și fără de osândă înaintea sfântului Tău jertfelnic. Și dăruiește, Dumnezeule, și celor ce se roagă împreună cu noi spor în viață, în credință și în înțelegerea cea duhov nicească. Dă lor să-Ți slujească totdeauna cu frică și cu dragoste și întru nevinovăție și fără osândă să se împărtășească cu Sfintele Tale Taine și să se învrednicească de cereasca Ta împărăție","de":"Wieder und vielmals fallen wir vor Dir nieder und bitten Dich, Gütiger und Menschenliebender, dass Du, herabblickend auf unser Flehen, unsere Seelen und Leiber reinigest von jeder Befleckung des Fleisches und des Geistes, und uns gewährest, schuldlos und ohne Verdammnis vor Deinem heiligen Altar zu stehen. Gewähre, o Gott, auch denen, die mit uns beten, Fortschritt im Leben und Glauben und geistlichen Verständnis; gib ihnen, dass sie Dich allezeit mit Furcht und Liebe anbeten, schuldlos und ohne Verdammnis an Deinen heiligen Mysterien teilhaben und Deines himmlischen Reiches gewürdigt werden.","cu":"Паки и многажды Тебе припадаем и Тебе молимся, Благий и Человеколюбче, яко да, призрев на моление наше, очистиши нашя душы и телеса от всякия скверны плоти и духа, и даси нам неповинное и неосужденное предстояние святаго Твоего жертвенника. Даруй же, Боже, и молящымся с нами преспеяние жития и веры и разума духовнаго: даждь им всегда со страхом и любовию служити Тебе, неповинно и неосужденно причащатися святых Твоих Таин, и небеснаго Твоего Царствия сподобитися."},"m":"silently"},{"r":"deacon","t":{"en":"Help us, save us, have mercy on us, and keep us, O God, by Thy grace.","el":"Ἀντιλαβοῦ, σῶσον, ἐλέησον καὶ διαφύλαξον ἡμᾶς, ὁ Θεός, τῇ σῇ χάριτι.","cu":"Заступи, спаси, помилуй и сохрани нас, Боже, Твоею благодатию.","ro":"Apără, mântuiește, miluiește și ne păzește pe noi, Dumnezeule, cu harul Tău.","de":"Stehe bei, errette, erbarme Dich und behüte uns, o Gott, durch Deine Gnade."}},{"r":"priest","t":{"en":"That being ever guarded by Thy might, we may ascribe glory unto Thee: to the Father, and to the Son, and to the Holy Spirit, now and ever and unto ages of ages.","el":"Ὅπως ὑπὸ τοῦ κράτους σου πάντοτε φυλαττόμενοι, σοὶ δόξαν ἀναπέμπωμεν, τῷ Πατρὶ καὶ τῷ Υἱῷ καὶ τῷ Ἁγίῳ Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Яко да под державою Твоею всегда храними, Тебе славу возсылаем, Отцу и Сыну и Святому Духу, ныне и присно и во веки веков.","ro":"Ca sub stăpânirea Ta totdeauna fiind păziți, Ție slavă să înălțăm, Tatălui și Fiului și Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Auf dass wir, allezeit beschützt unter Deiner Macht, Dir die Verherrlichung emporsenden, dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}}]},"3":{"title":"The Cherubic Hymn and the Great Entrance","lines":[{"r":"rubric","x":"THE CHERUBIC HYMN. The Gifts are prepared for the procession. The people sing:","t":{"en":"THE CHERUBIC HYMN. The Gifts are prepared for the procession. The people sing:","el":"Ο ΧΕΡΟΥΒΙΚΟΣ ΥΜΝΟΣ. Ἑτοιμάζονται τὰ Δῶρα διὰ τὴν λιτανείαν. Ὁ λαὸς ψάλλει:","cu":"ХЕРУВИМСКАЯ ПЕСНЬ. Дары уготовляются ко входу. Людие поют:","ro":"IMNUL HERUVIMIC. Darurile se pregătesc pentru ieșire. Strana cântă:","de":"DER CHERUBIM-HYMNUS. Die Gaben werden für die Prozession bereitet. Das Volk singt:"}},{"r":"people","t":{"en":"We who mystically represent the Cherubim and sing the thrice-holy hymn to the life-giving Trinity, let us now lay aside all earthly care.","el":"Οἱ τὰ Χερουβεὶμ μυστικῶς εἰκονίζοντες καὶ τῇ ζωοποιῷ Τριάδι τὸν τρισάγιον ὕμνον προσᾴδοντες, πᾶσαν τὴν βιωτικὴν ἀποθώμεθα μέριμναν.","cu":"Иже Херувимы тайно образующе, и Животворящей Троице трисвятую песнь припевающе, всякое ныне житейское отложим попечение.","ro":"Noi, care pe heruvimi cu taină închipuim și făcătoarei de viață Treimi întreit-sfântă cântare aducem, toată grija cea lumească să o lepădăm.","de":"Die wir die Cherubim geheimnisvoll abbilden und der lebenschaffenden Dreifaltigkeit den dreimalheiligen Hymnus singen, lasset uns jetzt alle Sorge dieses Lebens ablegen."}},{"r":"rubric","x":"While the hymn is sung, the priest prays quietly the Prayer of the Cherubic Hymn:","t":{"en":"While the hymn is sung, the priest prays quietly the Prayer of the Cherubic Hymn:","el":"Ἐνῷ ψάλλεται ὁ ὕμνος, ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν εὐχὴν τοῦ Χερουβικοῦ:","cu":"Во время пения песни священник тайно читает молитву Херувимской песни:","ro":"În timp ce se cântă imnul, preotul citește în taină Rugăciunea Imnului Heruvimic:","de":"Während der Hymnus gesungen wird, betet der Priester still das Gebet des Cherubim-Hymnus:"}},{"r":"priest","t":{"en":"None is worthy among them that are bound with carnal desires and pleasures to approach or draw near or to minister unto Thee, O King of glory; for to serve Thee is great and fearful even to the heavenly powers. Yet because of Thine ineffable and immeasurable love for mankind, Thou didst become man without change or alteration and wast named our High Priest, and didst deliver unto us the ministry of this liturgical and bloodless sacrifice, as Master of all. For Thou alone, O Lord our God, rulest over the things of heaven and earth; who art borne upon the throne of the Cherubim, the Lord of the Seraphim and King of Israel, who alone art holy and restest in the holies. Thee therefore I implore, who alone art good and ready to hear: look upon me, Thy sinful and unprofitable servant, and cleanse my soul and heart from an evil conscience; and enable me, by the power of Thy Holy Spirit, clothed with the grace of the priesthood, to stand before this Thy holy table and perform the sacred mystery of Thy holy and most pure Body and Thy precious Blood. For unto Thee I draw near, bowing my neck, and I pray Thee: turn not Thy face from me, neither cast me out from among Thy children, but vouchsafe that these gifts may be offered unto Thee by me, Thy sinful and unworthy servant. For Thou art He that offereth and is offered, that receiveth and is distributed, O Christ our God, and to Thee we ascribe glory, together with Thine eternal Father and Thine all-holy and good and life-giving Spirit, now and ever and unto ages of ages.","el":"Οὐδεὶς ἄξιος τῶν συνδεδεμένων ταῖς σαρκικαῖς ἐπιθυμίαις καὶ ἡδοναῖς προσέρχεσθαι ἢ προσεγγίζειν ἢ λειτουργεῖν σοι, Βασιλεῦ τῆς δόξης· τὸ γὰρ διακονεῖν σοι μέγα καὶ φοβερὸν καὶ αὐταῖς ταῖς ἐπουρανίαις δυνάμεσιν. Ἀλλ’ ὅμως, διὰ τὴν ἄφατον καὶ ἀμέτρητόν σου φιλανθρωπίαν, ἀτρέπτως καὶ ἀναλλοιώτως γέγονας ἄνθρωπος καὶ ἀρχιερεὺς ἡμῶν ἐχρημάτισας καὶ τῆς λειτουργικῆς ταύτης καὶ ἀναιμάκτου θυσίας τὴν ἱερουργίαν παρέδωκας ἡμῖν, ὡς Δεσπότης τῶν ἁπάντων. Σὺ γὰρ μόνος, Κύριε ὁ Θεὸς ἡμῶν, δεσπόζεις τῶν ἐπουρανίων καὶ τῶν ἐπιγείων, ὁ ἐπὶ θρόνου Χερουβικοῦ ἐποχούμενος, ὁ τῶν Σεραφὶμ Κύριος καὶ βασιλεὺς τοῦ Ἰσραήλ, ὁ μόνος ἅγιος καὶ ἐν ἁγίοις ἀναπαυόμενος. Σὲ τοίνυν δυσωπῶ τὸν μόνον ἀγαθὸν καὶ εὐήκοον· ἐπίβλεψον ἐπ’ ἐμὲ τὸν ἁμαρτωλὸν καὶ ἀχρεῖον δοῦλόν σου καὶ καθάρισόν μου τὴν ψυχὴν καὶ τὴν καρδίαν ἀπὸ συνειδήσεως πονηρᾶς καὶ ἱκάνωσόν με τῇ δυνάμει τοῦ Ἁγίου σου Πνεύματος, ἐνδεδυμένον τὴν τῆς ἱερατείας χάριν, παραστῆναι τῇ ἁγίᾳ σου ταύτῃ τραπέζῃ καὶ ἱερουργῆσαι τὸ ἅγιον καὶ ἄχραντόν σου σῶμα καὶ τὸ τίμιον αἷμα. Σοὶ γὰρ προσέρχομαι, κλίνας τὸν ἐμαυτοῦ αὐχένα, καὶ δέομαί σου· Μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπ’ ἐμοῦ, μηδὲ ἀποδοκιμάσῃς με ἐκ παίδων σου, ἀλλ’ ἀξίωσον προσενεχθῆναί σοι ὑπ’ ἐμοῦ τοῦ ἁμαρτωλοῦ καὶ ἀναξίου δούλου σου τὰ δῶρα ταῦτα. Σὺ γὰρ εἶ ὁ προσφέρων καὶ προσφερόμενος καὶ προσδεχόμενος καὶ διαδιδόμενος, Χριστὲ ὁ Θεὸς ἡμῶν, καὶ σοὶ τὴν δόξαν ἀναπέμπομεν σὺν τῷ ἀνάρχῳ σου Πατρὶ καὶ τῷ παναγίῳ καὶ ἀγαθῷ καὶ ζωοποιῷ σου Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν","ro":"Nimeni din cei legați cu pofte și cu desfătări trupești nu este vrednic să vină, să se apropie, sau să slujească Ție, Împăratul slavei; căci a sluji Ție este lucru mare și înfricoșător chiar pentru puterile cele cerești. Dar, totuși, pentru iubirea Ta de oameni cea negrăită și nemăsurată, fără mutare și fără schimbare Te-ai făcut om, și Arhiereu al nostru Te-ai făcut, și, ca un Stăpân a toate, ne-ai dat slujba sfântă a acestei jertfe liturgice și fără sânge; că singur Tu, Doamne Dumnezeul nostru, stăpânești cele cerești și cele pământești, Care Te porți pe scaunul heruvimilor, Domnul serafimilor și Împăratul lui Israel, Cel ce singur ești Sfânt și întru sfinți Te odihnești. Deci pe Tine Te rog, Cel ce singur ești bun și binevoitor, caută spre mine păcătosul și netrebnicul robul Tău, și-mi curățește sufletul și inima de cugete viclene; și învrednicește-mă, cu puterea Sfântului Tău Duh, pe mine, cel ce sunt îmbrăcat cu harul preoției, să stau înaintea sfintei Tale mese acesteia și să jertfesc sfântul și preacuratul Tău Trup și scumpul Tău Sânge. Căci la Tine vin, plecându-mi grumajii mei și mă rog Ție: Să nu întorci fața Ta de la mine, nici să mă lepezi dintre slujitorii Tăi, ci binevoiește să-Ți fie aduse darurile acestea de mine păcătosul și nevrednicul robul Tău. Că Tu ești Cel ce aduci și Cel ce Te aduci, Cel ce primești și Cel ce Te împarți, Hristoase, Dumnezeul nostru, și Ție slavă înălțăm, împreună și Celui fără de început al Tău Părinte și Preasfântului și bunului și de viață făcătorului Tău Duh, acum și pururea și în vecii vecilor. Amin","de":"Keiner der mit fleischlichen Begierden und Lüsten Gefesselten ist würdig, vor Dich hinzutreten, sich Dir zu nahen oder Dir zu dienen, König der Herrlichkeit; denn Dir zu dienen, ist groß und furchtbar, selbst den himmlischen Mächten. Gleichwohl aber wegen Deiner unsagbaren und unermesslichen Menschenliebe ohne Wandel und Veränderung Mensch geworden, wurdest Du unser Hoherpriester und hast uns als Gebieter über alles den Priesterdienst dieses liturgischen und unblutigen Opfers übergeben; denn Du allein, Herr, unser Gott, gebietest über die Himmlischen und Irdischen, Du auf cherubischem Thron Getragener, Herr der Seraphim und König Israels, der Du allein heilig bist und im Heiligen ruhst. Dich bestürme ich nun, den einzig Guten und gütig Erhörenden: Blicke auf mich, Deinen sündigen und unnützen Knecht, und reinige meine Seele und mein Herz vom bösen Gewissen und befähige mich durch die Kraft Deines Heiligen Geistes, bekleidet mit der Gnade des Priestertums, vor diesem Deinem Heiligen Tisch zu stehen und den Priesterdienst zu vollziehen an Deinem heiligen und allreinen Leib und an Deinem kostbaren Blut. Denn vor Dich trete ich hin, meinen Nacken geneigt, und bitte Dich: Wende nicht Dein Angesicht von mir ab und verwirf mich nicht aus ‹der Schar› Deiner Diener, sondern würdige mich, Deinen sündigen und unwürdigen Knecht, Dir diese Gaben darzubringen. Denn Du bist der Darbringende und der Dargebrachte, der Empfangende und der Ausgeteilte, Christus , unser Gott, und Dir senden wir die Verherrlichung empor, samt Deinem anfanglosen Vater und Deinem allheiligen und guten und lebenschaffenden Geiste, jetzt und immerdar und in die Ewigkeit der Ewigkeit. Amen","cu":"Никтоже достоин от связавшихся плотскими похотьми и сластьми приходити или приближитися, или служити Тебе, Царю славы: еже бо служити Тебе велико и страшно и самем Небесным Силам. Но обаче неизреченнаго ради и безмернаго Твоего человеколюбия непреложно и неизменно был еси человек, и Архиерей нам был еси, и служебныя сея и безкровныя жертвы священнодействие предал еси нам, яко Владыка всех. Ты бо един, Господи Боже наш, владычествуеши небесными и земными, Иже на престоле Херувимстем носимый, Иже Серафимов Господь и Царь Израилев, Иже Един Свят и во святых почиваяй. Тя убо молю, Единаго Благаго и Благопослушливаго: призри на мя грешнаго и непотребнаго раба Твоего, и очисти мою душу и сердце от совести лукавыя, и удовли мя силою Святаго Твоего Духа, оболчена благодатию священства, предстати святей Твоей сей трапезе, и священнодействовати святое и пречистое Твое Тело и честную Кровь. К Тебе бо прихожду, приклонь мою выю, и молю Ти ся: да не отвратиши лица Твоего от мене, ниже отриниши мене от отрок Твоих, но сподоби принесенным Тебе быти мною грешным и недостойным рабом Твоим даром сим. Ты бо еси приносяй и приносимый, и приемляй и раздаваемый, Христе Боже наш, и Тебе славу возсылаем, со Безначальным Твоим Отцем, и Пресвятым и Благим и Животворящим Твоим Духом, ныне и присно и во веки веков."},"m":"silently"},{"r":"rubric","x":"After the prayer, the priest censes the holy table, the icons, and the people, saying quietly the psalm of repentance. The deacon and priest prepare to bear the Gifts:","t":{"en":"After the prayer, the priest censes the holy table, the icons, and the people, saying quietly the psalm of repentance. The deacon and priest prepare to bear the Gifts:","el":"Μετὰ τὴν εὐχήν, ὁ ἱερεὺς θυμιᾷ τὴν ἁγίαν τράπεζαν, τὰς εἰκόνας καὶ τὸν λαόν, λέγων μυστικῶς τὸν ψαλμὸν τῆς μετανοίας. Ὁ διάκονος καὶ ὁ ἱερεὺς ἑτοιμάζονται νὰ μεταφέρουν τὰ Δῶρα:","cu":"По молитве священник кадит святой престол, иконы и людей, глаголя тайно псалом покаянный. Диакон и священник готовятся нести Дары:","ro":"După rugăciune, preotul tămâiază sfânta masă, icoanele și poporul, zicând în taină psalmul pocăinței. Diaconul și preotul se pregătesc să poarte Darurile:","de":"Nach dem Gebet beräuchert der Priester den heiligen Tisch, die Ikonen und das Volk und spricht still den Bußpsalm. Diakon und Priester bereiten sich, die Gaben zu tragen:"}},{"r":"deacon","t":{"en":"Lift up, master.","el":"Ἔπαρον, δέσποτα.","cu":"Возми, владыко.","ro":"Ridică, stăpâne.","de":"Erhebe, Gebieter."}},{"r":"priest","t":{"en":"Lift up your hands to the holy place, and bless the Lord.","el":"Ἄρατε τὰς χεῖρας ὑμῶν εἰς τὰ ἅγια καὶ εὐλογεῖτε τὸν Κύριον.","cu":"Возмите руки ваша во святая и благословите Господа.","ro":"Ridicați mâinile voastre la cele sfinte și binecuvântați pe Domnul.","de":"Erhebet eure Hände zum Heiligtum und preiset den Herrn."}},{"r":"rubric","x":"THE GREAT ENTRANCE. The Gifts are carried in solemn procession to the holy table. As they pass, the living and the departed are commemorated:","t":{"en":"THE GREAT ENTRANCE. The Gifts are carried in solemn procession to the holy table. As they pass, the living and the departed are commemorated:","el":"Η ΜΕΓΑΛΗ ΕΙΣΟΔΟΣ. Τὰ Δῶρα μεταφέρονται ἐν πομπῇ πρὸς τὴν ἁγίαν τράπεζαν. Καθὼς διέρχονται, μνημονεύονται οἱ ζῶντες καὶ οἱ κεκοιμημένοι:","cu":"ВЕЛИКИЙ ВХОД. Дары торжественно несутся ко святому престолу. Во время шествия поминаются живые и усопшие:","ro":"INTRAREA MARE. Darurile sunt purtate în alai solemn spre sfânta masă. În trecere, se pomenesc cei vii și cei adormiți:","de":"DER GROSSE EINZUG. Die Gaben werden in feierlicher Prozession zum heiligen Tisch getragen. Im Vorübergehen wird der Lebenden und der Entschlafenen gedacht:"}},{"r":"commem","x":"Here the deacon and priest commemorate the episcopate, the civil authorities, the founders and benefactors of this holy house, the clergy, and all the Orthodox faithful, living and departed, according to local use; to each the people answer, \"May the Lord God remember them in His kingdom.\"","t":{"en":"Here the deacon and priest commemorate the episcopate, the civil authorities, the founders and benefactors of this holy house, the clergy, and all the Orthodox faithful, living and departed, according to local use; to each the people answer, \"May the Lord God remember them in His kingdom.\"","el":"Ἐνταῦθα ὁ διάκονος καὶ ὁ ἱερεὺς μνημονεύουν τὴν ἱεραρχίαν, τὰς ἀρχάς, τοὺς κτήτορας καὶ εὐεργέτας τοῦ ἁγίου οἴκου τούτου, τὸν κλῆρον καὶ πάντας τοὺς ὀρθοδόξους πιστούς, ζῶντας καὶ κεκοιμημένους, κατὰ τὴν τοπικὴν τάξιν· εἰς ἕκαστον ὁ λαὸς ἀποκρίνεται: «Μνησθείη Κύριος ὁ Θεὸς αὐτῶν ἐν τῇ βασιλείᾳ αὐτοῦ.»","cu":"Зде диакон и священник поминают иерархию, власти, создателей и благотворителей святаго храма сего, причт и всех православных верных, живых и усопших, по местному уставу; на каждое людие отвещают: «Да помянет их Господь Бог во Царствии Своем.»","ro":"Aici diaconul și preotul pomenesc ierarhia, autoritățile, ctitorii și binefăcătorii sfântului locaș acesta, clerul și pe toți credincioșii ortodocși, vii și adormiți, după rânduiala locului; la fiecare, strana răspunde: „Pomenească-i pe ei Domnul Dumnezeu întru împărăția Sa.”","de":"Hier gedenken Diakon und Priester der Hierarchie, der Obrigkeit, der Stifter und Wohltäter dieses heiligen Hauses, des Klerus und aller orthodoxen Gläubigen, der Lebenden und der Entschlafenen, nach örtlichem Brauch; auf jedes antwortet das Volk: „Es gedenke ihrer der Herr, unser Gott, in Seinem Reiche.”"}},{"r":"people","t":{"en":"Amen. Remember us, O Lord, when Thou comest in Thy kingdom.","el":"Ἀμήν. Μνήσθητι ἡμῶν, Κύριε, ὅταν ἔλθῃς ἐν τῇ βασιλείᾳ σου.","cu":"Аминь. Помяни нас, Господи, егда приидеши во Царствии Твоем.","ro":"Amin. Pomenește-ne pe noi, Doamne, când vei veni întru împărăția Ta.","de":"Amen. Gedenke unser, o Herr, wenn Du kommst in Deinem Reiche."},"m":"silently"},{"r":"rubric","x":"The Gifts having been set upon the holy table, the people complete the hymn:","t":{"en":"The Gifts having been set upon the holy table, the people complete the hymn:","el":"Τεθέντων τῶν Δώρων ἐπὶ τῆς ἁγίας τραπέζης, ὁ λαὸς ὁλοκληρώνει τὸν ὕμνον:","cu":"По поставлении Даров на святом престоле людие оканчивают песнь:","ro":"După așezarea Darurilor pe sfânta masă, strana sfârșește imnul:","de":"Nachdem die Gaben auf den heiligen Tisch gestellt sind, vollendet das Volk den Hymnus:"}},{"r":"people","t":{"en":"That we may receive the King of all, invisibly escorted by the angelic hosts. Alleluia, alleluia, alleluia.","el":"Ὡς τὸν βασιλέα τῶν ὅλων ὑποδεξόμενοι, ταῖς ἀγγελικαῖς ἀοράτως δορυφορούμενον τάξεσιν. Ἀλληλούϊα, ἀλληλούϊα, ἀλληλούϊα.","cu":"Яко да Царя всех подымем, ангельскими невидимо дориносима чинми. Аллилуйя, аллилуйя, аллилуйя.","ro":"Ca pe Împăratul tuturor să-L primim, pe Cel nevăzut înconjurat de cetele îngerești. Aliluia, aliluia, aliluia.","de":"Auf dass wir den König des Alls empfangen, der von den Engelscharen unsichtbar geleitet wird. Alleluia, alleluia, alleluia."}},{"r":"rubric","x":"Placing the Gifts on the holy table, the priest says quietly the burial troparia and commemorates the deacon, who commemorates the priest:","t":{"en":"Placing the Gifts on the holy table, the priest says quietly the burial troparia and commemorates the deacon, who commemorates the priest:","el":"Τοποθετῶν τὰ Δῶρα ἐπὶ τῆς ἁγίας τραπέζης, ὁ ἱερεὺς λέγει μυστικῶς τὰ τροπάρια τῆς ταφῆς καὶ μνημονεύει τὸν διάκονον, ὁ δὲ διάκονος τὸν ἱερέα:","cu":"Полагая Дары на святом престоле, священник глаголет тайно тропари погребения и поминает диакона, диакон же — священника:","ro":"Așezând Darurile pe sfânta masă, preotul zice în taină troparele îngropării și pomenește pe diacon, iar diaconul pe preot:","de":"Indem er die Gaben auf den heiligen Tisch legt, spricht der Priester still die Grabtroparien und gedenkt des Diakons, der Diakon aber des Priesters:"}},{"r":"priest","t":{"en":"The noble Joseph, taking down Thy most pure body from the tree, wrapped it in clean linen with sweet spices, and laid it in a new tomb. In the tomb with the body, in Hades with the soul as God, in paradise with the thief, and on the throne with the Father and the Spirit wast Thou, O Christ, filling all things, Thyself uncircumscribed.","el":"Ὁ εὐσχήμων Ἰωσήφ, ἀπὸ τοῦ ξύλου καθελὼν τὸ ἄχραντόν σου Σῶμα, σινδόνι καθαρᾷ εἰλήσας καὶ ἀρώμασιν, ἐν μνήματι καινῷ κηδεύσας ἀπέθετο. Ἐν τάφῳ σωματικῶς, ἐν ᾅδου δὲ μετὰ ψυχῆς ὡς Θεός, ἐν παραδείσῳ δὲ μετὰ λῃστοῦ, καὶ ἐν θρόνῳ ὑπῆρχες, Χριστέ, μετὰ Πατρὸς καὶ Πνεύματος, πάντα πληρῶν ὁ ἀπερίγραπτος.","cu":"Благообразный Иосиф, с древа снем пречистое Тело Твое, плащаницею чистою обвив, и вонями во гробе нове закрыв положи. Во гробе плотски, во аде же с душею яко Бог, в раи же с разбойником, и на престоле был еси, Христе, со Отцем и Духом, вся исполняяй, Неописанный.","ro":"Iosif cel cu bun chip, de pe lemn luând preacurat trupul Tău, cu giulgiu curat înfășurându-l și cu miresme, în mormânt nou îngropându-l, l-a pus. În mormânt cu trupul, în iad cu sufletul ca un Dumnezeu, în rai cu tâlharul și pe scaun ai fost, Hristoase, împreună cu Tatăl și cu Duhul, toate umplându-le, Cel necuprins.","de":"Der edle Joseph nahm Deinen makellosen Leib vom Holze herab, hüllte ihn in reines Linnen mit Wohlgerüchen und legte ihn in ein neues Grab. Im Grabe dem Leibe nach, in der Unterwelt mit der Seele als Gott, im Paradiese mit dem Schächer, und auf dem Throne warst Du, Christus, mit dem Vater und dem Geiste, alles erfüllend, der Unumschriebene."},"m":"silently"},{"r":"priestdeacon","t":{"en":"May the Lord God remember thy priesthood (thy diaconate) in His kingdom, always, now and ever and unto ages of ages.","el":"Μνησθείη Κύριος ὁ Θεὸς τῆς ἱερωσύνης σου (τῆς διακονίας σου) ἐν τῇ βασιλείᾳ αὐτοῦ, πάντοτε, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Да помянет Господь Бог священство твое (диаконство твое) во Царствии Своем, всегда, ныне и присно и во веки веков.","ro":"Pomenească Domnul Dumnezeu preoția ta (diaconia ta) întru împărăția Sa, totdeauna, acum și pururea și în vecii vecilor.","de":"Es gedenke der Herr, unser Gott, deines Priestertums (deines Diakonates) in Seinem Reiche, allezeit, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"silently"},{"r":"rubric","x":"THE LITANY OF COMPLETION. To each of the first petitions the people answer, \"Lord, have mercy.\"","t":{"en":"THE LITANY OF COMPLETION. To each of the first petitions the people answer, \"Lord, have mercy.\"","el":"ΤΑ ΠΛΗΡΩΤΙΚΑ. Εἰς ἕκαστον τῶν πρώτων αἰτημάτων ὁ λαὸς ἀποκρίνεται: «Κύριε, ἐλέησον.»","cu":"ПРОСИТЕЛЬНАЯ ЕКТЕНИЯ. На каждое из первых прошений людие отвещают: «Господи, помилуй.»","ro":"ECTENIA CERERILOR. La fiecare dintre cele dintâi cereri, strana răspunde: „Doamne, miluiește.”","de":"DIE BITTEKTENIE. Auf jede der ersten Bitten antwortet das Volk: „Herr, erbarme Dich.”"}},{"r":"deacon","t":{"en":"Let us complete our prayer to the Lord.","el":"Πληρώσωμεν τὴν δέησιν ἡμῶν τῷ Κυρίῳ.","cu":"Исполним молитву нашу Господеви.","ro":"Să plinim rugăciunea noastră Domnului.","de":"Lasset uns vollenden unser Gebet zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For the precious Gifts here set forth, let us pray to the Lord.","el":"Ὑπὲρ τῶν προτεθέντων τιμίων Δώρων τοῦ Κυρίου δεηθῶμεν.","cu":"О предложенных Честных Дарех Господу помолимся.","ro":"Pentru cinstitele daruri ce sunt puse înainte, Domnului să ne rugăm.","de":"Für die dargebrachten kostbaren Gaben lasset uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For this holy house, and for those who enter it with faith, reverence, and the fear of God, let us pray to the Lord.","el":"Ὑπὲρ τοῦ ἁγίου οἴκου τούτου καὶ τῶν μετὰ πίστεως, εὐλαβείας καὶ φόβου Θεοῦ εἰσιόντων ἐν αὐτῷ τοῦ Κυρίου δεηθῶμεν.","cu":"О святем храме сем, и с верою, благоговением и страхом Божиим входящих в онь, Господу помолимся.","ro":"Pentru sfânt locașul acesta și pentru cei ce cu credință, cu evlavie și cu frică de Dumnezeu intră într-însul, Domnului să ne rugăm.","de":"Für dieses heilige Haus und für alle, die mit Glauben, Ehrfurcht und Gottesfurcht es betreten, lasset uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For our deliverance from all tribulation, wrath, danger, and necessity, let us pray to the Lord.","el":"Ὑπὲρ τοῦ ῥυσθῆναι ἡμᾶς ἀπὸ πάσης θλίψεως, ὀργῆς, κινδύνου καὶ ἀνάγκης τοῦ Κυρίου δεηθῶμεν.","cu":"О избавитися нам от всякия скорби, гнева и нужды, Господу помолимся.","ro":"Pentru izbăvirea noastră de tot necazul, mânia, primejdia și nevoia, Domnului să ne rugăm.","de":"Für unsere Errettung aus aller Bedrängnis, Zorn, Gefahr und Not lasset uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"rubric","x":"The priest prays quietly the Prayer of the Offering (the Prayer of the Proskomide):","t":{"en":"The priest prays quietly the Prayer of the Offering (the Prayer of the Proskomide):","el":"Ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν εὐχὴν τῆς προσκομιδῆς:","cu":"Священник тайно читает молитву приношения (молитву проскомидии):","ro":"Preotul citește în taină Rugăciunea Punerii-înainte (a Proscomidiei):","de":"Der Priester betet still das Gebet der Darbringung (das Gebet der Proskomidie):"}},{"r":"priest","t":{"en":"O Lord God Almighty, who alone art holy, who acceptest the sacrifice of praise from those who call upon Thee with their whole heart: receive also the supplication of us sinners, and bring it to Thy holy altar; enable us to offer Thee gifts and spiritual sacrifices for our sins and for the errors of the people; and make us worthy to find grace in Thy sight, that our sacrifice may be well-pleasing unto Thee, and that the good Spirit of Thy grace may rest upon us, and upon these gifts here set forth, and upon all Thy people.","el":"Κύριε ὁ Θεὸς ὁ παντοκράτωρ, ὁ μόνος ἅγιος, ὁ δεχόμενος θυσίαν αἰνέσεως παρὰ τῶν ἐπικαλουμένων σε ἐν ὅλῃ καρδίᾳ, πρόσδεξαι καὶ ἡμῶν τῶν ἁμαρτωλῶν τὴν δέησιν καὶ προσάγαγε τῷ ἁγίῳ σου θυσιαστηρίῳ· καὶ ἱκάνωσον ἡμᾶς προσενεγκεῖν σοι δῶρά τε καὶ θυσίας πνευματικὰς ὑπὲρ τῶν ἡμετέρων ἁμαρτημάτων καὶ τῶν τοῦ λαοῦ ἀγνοημάτων. Καὶ καταξίωσον ἡμᾶς εὑρεῖν χάριν ἐνώπιόν σου, τοῦ γενέσθαι σοι εὐπρόσδεκτον τὴν θυσίαν ἡμῶν καὶ ἐπισκηνῶσαι τὸ Πνεῦμα τῆς χάριτός σου τὸ ἀγαθὸν ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ προκείμενα δῶρα ταῦτα καὶ ἐπὶ πάντα τὸν λαόν σου","ro":"Doamne, Dumnezeule, Atotțiitorule, Cel ce singur ești Sfânt, Care primești jertfă de laudă de la cei ce Te cheamă pe Tine cu toată inima, primește și rugăciunea noastră a păcătoșilor și o du la sfântul Tău jertfelnic; fă-ne vrednici a-Ți aduce Ție daruri și jertfe duhovnicești, pentru păcatele noastre și pentru cele din neștiință ale poporului. Și ne învrednicește să aflăm har înaintea Ta, ca să fie bineprimită jertfa noastră și să se sălășluiască Duhul cel bun al harului Tău peste noi, peste aceste daruri puse înainte și peste tot poporul Tău","de":"Herr, Gott, Allherrscher, einzig Heiliger, der Du das Opfer des Lobes annimmst von denen, die Dich mit ganzem Herzen anrufen, nimm auch das Gebet von uns Sündern entgegen und leite es hin zu Deinem heiligen Opfertisch; befähige uns, Dir geistliche Gaben und Opfer darzubringen für unsere Sünden und die unwissentlichen Verfehlungen des Volkes. Und würdige uns, Gnade zu finden vor Dir, auf dass unser Opfer Dir wohlgefällig werde und der gute Geist Deiner Gnade sich niederlasse auf uns, auf diese vorliegenden Gaben und auf Dein ganzes Volk.","cu":"Господи Боже Вседержителю, Едине Святе, приемляй жертву хваления от призывающих Тя всем сердцем, приими и нас грешных моление, и принеси ко святому Твоему жертвеннику, и удовли нас приносити Тебе дары же и жертвы духовныя о наших гресех и о людских неведениих: и сподоби нас обрести благодать пред Тобою, еже быти Тебе благоприятней жертве нашей, и вселитися Духу благодати Твоея благому в нас, и на предлежащих Дарех сих, и на всех людех Твоих."},"m":"silently"},{"r":"deacon","t":{"en":"Help us, save us, have mercy on us, and keep us, O God, by Thy grace.","el":"Ἀντιλαβοῦ, σῶσον, ἐλέησον καὶ διαφύλαξον ἡμᾶς, ὁ Θεός, τῇ σῇ χάριτι.","cu":"Заступи, спаси, помилуй и сохрани нас, Боже, Твоею благодатию.","ro":"Apără, mântuiește, miluiește și ne păzește pe noi, Dumnezeule, cu harul Tău.","de":"Stehe bei, errette, erbarme Dich und behüte uns, o Gott, durch Deine Gnade."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"That the whole day may be perfect, holy, peaceful, and sinless, let us ask of the Lord.","el":"Τὴν ἡμέραν πᾶσαν τελείαν, ἁγίαν, εἰρηνικὴν καὶ ἀναμάρτητον παρὰ τοῦ Κυρίου αἰτησώμεθα.","cu":"Дне всего совершенна, свята, мирна и безгрешна у Господа просим.","ro":"Ziua toată desăvârșită, sfântă, în pace și fără de păcat, la Domnul să cerem.","de":"Dass der ganze Tag vollkommen, heilig, friedlich und ohne Sünde sei, lasset uns erbitten vom Herrn."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"An angel of peace, a faithful guide, a guardian of our souls and bodies, let us ask of the Lord.","el":"Ἄγγελον εἰρήνης, πιστὸν ὁδηγόν, φύλακα τῶν ψυχῶν καὶ τῶν σωμάτων ἡμῶν παρὰ τοῦ Κυρίου αἰτησώμεθα.","cu":"Ангела мирна, верна наставника, хранителя душ и телес наших у Господа просим.","ro":"Înger de pace, credincios îndreptător, păzitor al sufletelor și al trupurilor noastre, la Domnul să cerem.","de":"Einen Engel des Friedens, einen treuen Führer, einen Hüter unserer Seelen und Leiber, lasset uns erbitten vom Herrn."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"Pardon and remission of our sins and transgressions, let us ask of the Lord.","el":"Συγγνώμην καὶ ἄφεσιν τῶν ἁμαρτιῶν καὶ τῶν πλημμελημάτων ἡμῶν παρὰ τοῦ Κυρίου αἰτησώμεθα.","cu":"Прощения и оставления грехов и прегрешений наших у Господа просим.","ro":"Milă și iertare de păcatele și de greșealele noastre, la Domnul să cerem.","de":"Verzeihung und Nachlass unserer Sünden und Vergehen, lasset uns erbitten vom Herrn."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"Things good and profitable for our souls, and peace for the world, let us ask of the Lord.","el":"Τὰ καλὰ καὶ συμφέροντα ταῖς ψυχαῖς ἡμῶν καὶ εἰρήνην τῷ κόσμῳ παρὰ τοῦ Κυρίου αἰτησώμεθα.","cu":"Добрых и полезных душам нашим, и мира мирови у Господа просим.","ro":"Cele bune și de folos sufletelor noastre și pace lumii, la Domnul să cerem.","de":"Das Gute und Nützliche für unsere Seelen und Frieden für die Welt, lasset uns erbitten vom Herrn."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"That we may complete the remaining time of our life in peace and repentance, let us ask of the Lord.","el":"Τὸν ὑπόλοιπον χρόνον τῆς ζωῆς ἡμῶν ἐν εἰρήνῃ καὶ μετανοίᾳ ἐκτελέσαι παρὰ τοῦ Κυρίου αἰτησώμεθα.","cu":"Прочее время живота нашего в мире и покаянии скончати у Господа просим.","ro":"Cealaltă vreme a vieții noastre în pace și pocăință a o săvârși, la Domnul să cerem.","de":"Dass wir die übrige Zeit unseres Lebens in Frieden und Buße vollenden, lasset uns erbitten vom Herrn."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"A Christian ending to our life, painless, blameless, and peaceful, and a good defence before the dread judgment seat of Christ, let us ask.","el":"Χριστιανὰ τὰ τέλη τῆς ζωῆς ἡμῶν, ἀνώδυνα, ἀνεπαίσχυντα, εἰρηνικά, καὶ καλὴν ἀπολογίαν τὴν ἐπὶ τοῦ φοβεροῦ βήματος τοῦ Χριστοῦ αἰτησώμεθα.","cu":"Христианския кончины живота нашего, безболезненны, непостыдны, мирны, и добраго ответа на Страшнем Судищи Христове просим.","ro":"Sfârșit creștinesc vieții noastre, fără durere, neînfruntat, în pace, și răspuns bun la înfricoșătoarea judecată a lui Hristos, să cerem.","de":"Ein christliches Ende unseres Lebens, schmerzlos, ohne Scham, friedlich, und eine gute Verantwortung vor dem furchtbaren Richterstuhl Christi, lasset uns erbitten."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"Commemorating our most holy, pure, blessed, and glorious Lady, the Theotokos and ever-virgin Mary, with all the saints, let us commend ourselves and one another and our whole life to Christ our God.","el":"Τῆς παναγίας, ἀχράντου, ὑπερευλογημένης, ἐνδόξου Δεσποίνης ἡμῶν Θεοτόκου καὶ ἀειπαρθένου Μαρίας μετὰ πάντων τῶν Ἁγίων μνημονεύσαντες, ἑαυτοὺς καὶ ἀλλήλους καὶ πᾶσαν τὴν ζωὴν ἡμῶν Χριστῷ τῷ Θεῷ παραθώμεθα.","cu":"Пресвятую, Пречистую, Преблагословенную, Славную Владычицу нашу Богородицу и Приснодеву Марию, со всеми святыми помянувше, сами себе и друг друга, и весь живот наш Христу Богу предадим.","ro":"Pe Preasfânta, curata, preabinecuvântata, mărita stăpâna noastră, de Dumnezeu Născătoarea și pururea Fecioara Maria, cu toți sfinții să o pomenim, pe noi înșine și unii pe alții și toată viața noastră lui Hristos Dumnezeu să o dăm.","de":"Unserer allheiligen, allreinen, über alles gesegneten und herrlichen Gebieterin, der Gottesgebärerin und immerwährenden Jungfrau Maria, mit allen Heiligen wollen wir gedenken, uns selbst und einander und unser ganzes Leben Christus, unserem Gott, anbefehlen."}},{"r":"choir","t":{"en":"To Thee, O Lord.","el":"Σοί, Κύριε.","cu":"Тебе, Господи.","ro":"Ție, Doamne.","de":"Dir, o Herr."}},{"r":"priest","t":{"en":"Through the compassions of Thine only-begotten Son, with whom Thou art blessed, together with Thine all-holy and good and life-giving Spirit, now and ever and unto ages of ages.","el":"Διὰ τῶν οἰκτιρμῶν τοῦ μονογενοῦς σου Υἱοῦ, μεθ’ οὗ εὐλογητὸς εἶ, σὺν τῷ παναγίῳ καὶ ἀγαθῷ καὶ ζωοποιῷ σου Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Щедротами Единороднаго Сына Твоего, с Нимже благословен еси, со Пресвятым и Благим и Животворящим Твоим Духом, ныне и присно и во веки веков.","ro":"Cu îndurările Unuia-Născut Fiului Tău, cu Care ești binecuvântat, împreună cu Preasfântul și bunul și de viață făcătorul Tău Duh, acum și pururea și în vecii vecilor.","de":"Durch das Erbarmen Deines einziggezeugten Sohnes, mit dem Du gepriesen bist, samt Deinem allheiligen und guten und lebendigmachenden Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"priest","t":{"en":"Peace be unto all.","el":"Εἰρήνη πᾶσι.","cu":"Мир всем.","ro":"Pace tuturor.","de":"Friede allen."}},{"r":"choir","t":{"en":"And to thy spirit.","el":"Καὶ τῷ πνεύματί σου.","cu":"И духови твоему.","ro":"Și duhului tău.","de":"Und deinem Geiste."}},{"r":"deacon","t":{"en":"Let us love one another, that with one mind we may confess:","el":"Ἀγαπήσωμεν ἀλλήλους, ἵνα ἐν ὁμονοίᾳ ὁμολογήσωμεν.","cu":"Возлюбим друг друга, да единомыслием исповемы.","ro":"Să ne iubim unii pe alții, ca într-un gând să mărturisim.","de":"Lasset uns einander lieben, auf dass wir einmütig bekennen:"}},{"r":"choir","t":{"en":"The Father, and the Son, and the Holy Spirit: the Trinity, one in essence and undivided.","el":"Πατέρα, Υἱὸν καὶ Ἅγιον Πνεῦμα, Τριάδα ὁμοούσιον καὶ ἀχώριστον.","cu":"Отца и Сына и Святаго Духа, Троицу Единосущную и Нераздельную.","ro":"Pe Tatăl, pe Fiul și pe Sfântul Duh, Treimea cea de o ființă și nedespărțită.","de":"Den Vater und den Sohn und den Heiligen Geist, die Dreifaltigkeit, wesenseins und unteilbar."}},{"r":"rubric","x":"The clergy exchange the kiss of peace, each saying quietly:","t":{"en":"The clergy exchange the kiss of peace, each saying quietly:","el":"Οἱ κληρικοὶ ἀνταλλάσσουν τὸν ἀσπασμὸν τῆς εἰρήνης, ἕκαστος λέγων μυστικῶς:","cu":"Священнослужители дают друг другу целование мира, кийждо глаголя тайно:","ro":"Slujitorii își dau sărutarea păcii, fiecare zicând în taină:","de":"Die Geistlichen geben einander den Friedenskuss, ein jeder still sprechend:"}},{"r":"priest","t":{"en":"I will love Thee, O Lord, my strength; the Lord is my foundation, my refuge, and my deliverer.","el":"Ἀγαπήσω σε, Κύριε, ἡ ἰσχύς μου· Κύριος στερέωμά μου καὶ καταφυγή μου καὶ ῥύστης μου.","cu":"Возлюблю Тя, Господи, крепосте моя: Господь утверждение мое, и прибежище мое, и Избавитель мой.","ro":"Iubi-Te-voi, Doamne, virtutea mea; Domnul este întărirea mea și scăparea mea și izbăvitorul meu.","de":"Ich will Dich lieben, Herr, meine Stärke; der Herr ist meine Feste, meine Zuflucht und mein Erretter."},"m":"silently"},{"r":"deacon","t":{"en":"The doors! The doors! In wisdom let us attend.","el":"Τὰς θύρας, τὰς θύρας· ἐν σοφίᾳ πρόσχωμεν.","cu":"Двери, двери, премудростию вонмем.","ro":"Ușile, ușile, cu înțelepciune să luăm aminte.","de":"Die Türen! Die Türen! In Weisheit lasset uns aufmerken."},"m":"aloud"}]},"4":{"title":"The Creed","lines":[{"r":"rubric","x":"THE CREED. The deacon having proclaimed \"The doors! The doors!\", the people confess the faith of Nicaea and Constantinople:","t":{"en":"THE CREED. The deacon having proclaimed \"The doors! The doors!\", the people confess the faith of Nicaea and Constantinople:","el":"ΤΟ ΣΥΜΒΟΛΟΝ ΤΗΣ ΠΙΣΤΕΩΣ. Ἀφοῦ ὁ διάκονος ἐκφωνήσῃ «Τὰς θύρας, τὰς θύρας!», ὁ λαὸς ὁμολογεῖ τὴν πίστιν τῆς Νικαίας καὶ τῆς Κωνσταντινουπόλεως:","cu":"СИМВОЛ ВЕРЫ. По возглашении диакона «Двери, двери!» людие исповедуют веру Никейскую и Цареградскую:","ro":"CREZUL. După ce diaconul a rostit „Ușile, ușile!”, poporul mărturisește credința de la Niceea și Constantinopol:","de":"DAS GLAUBENSBEKENNTNIS. Nachdem der Diakon „Die Türen! Die Türen!” ausgerufen hat, bekennt das Volk den Glauben von Nizäa und Konstantinopel:"}},{"r":"choir","t":{"en":"I believe in one God, the Father Almighty, Maker of heaven and earth, and of all things visible and invisible.","el":"Πιστεύω εἰς ἕνα Θεόν, Πατέρα παντοκράτορα, ποιητὴν οὐρανοῦ καὶ γῆς, ὁρατῶν τε πάντων καὶ ἀοράτων","cu":"Верую во Единаго Бога Отца Вседержителя, Творца небу и земли, видимым же всем и невидимым","ro":"Cred întru unul Dumnezeu, Tatăl atotțiitorul, Făcătorul cerului și al pământului, al tuturor celor văzute și nevăzute","de":"Ich glaube an den einen Gott, den Vater, den Allherrscher, den Schöpfer des Himmels und der Erde, alles Sichtbaren und Unsichtbaren"}},{"r":"choir","t":{"en":"And in one Lord Jesus Christ, the Son of God, the only-begotten, begotten of the Father before all ages; Light of Light, true God of true God, begotten, not made, of one essence with the Father, by Whom all things were made; Who for us men and for our salvation came down from heaven, and was incarnate of the Holy Spirit and the Virgin Mary, and became man; and was crucified for us under Pontius Pilate, and suffered, and was buried; and the third day He rose again, according to the Scriptures; and ascended into heaven, and sitteth at the right hand of the Father; and He shall come again with glory to judge the living and the dead; Whose kingdom shall have no end.","el":"Καὶ εἰς ἕνα Κύριον Ἰησοῦν Χριστόν, τὸν Υἱὸν τοῦ Θεοῦ τὸν μονογενῆ, τὸν ἐκ τοῦ Πατρὸς γεννηθέντα πρὸ πάντων τῶν αἰώνων· φῶς ἐκ φωτός, Θεὸν ἀληθινὸν ἐκ Θεοῦ ἀληθινοῦ, γεννηθέντα οὐ ποιηθέντα, ὁμοούσιον τῷ Πατρί, δι’ οὗ τὰ πάντα ἐγένετο. Τὸν δι’ ἡμᾶς τοὺς ἀνθρώπους καὶ διὰ τὴν ἡμετέραν σωτηρίαν κατελθόντα ἐκ τῶν οὐρανῶν καὶ σαρκωθέντα ἐκ Πνεύματος Ἁγίου καὶ Μαρίας τῆς παρθένου καὶ ἐνανθρωπήσαντα. Σταυρωθέντα τε ὑπὲρ ἡμῶν ἐπὶ Ποντίου Πιλάτου καὶ παθόντα καὶ ταφέντα. Καὶ ἀναστάντα τῇ τρίτῃ ἡμέρᾳ, κατὰ τὰς Γραφάς. Καὶ ἀνελθόντα εἰς τοὺς οὐρανοὺς καὶ καθεζόμενον ἐκ δεξιῶν τοῦ Πατρός. Καὶ πάλιν ἐρχόμενον μετὰ δόξης κρίναι ζῶντας καὶ νεκρούς, οὗ τῆς βασιλείας οὐκ ἔσται τέλος","cu":"И во Единаго Господа Иисуса Христа, Сына Божия, Единороднаго, Иже от Отца рожденнаго прежде всех век. Света от Света, Бога истинна от Бога истинна, рожденна, несотворенна, Единосущна Отцу, Имже вся быша. Нас ради, человек, и нашего ради спасения сшедшаго с Небес, и воплотившагося от Духа Свята и Марии Девы, и вочеловечшася. Распятаго же за ны при Понтийстем Пилате, и страдавша, и погребенна. И воскресшаго в третий день по Писанием. И восшедшаго на Небеса, и седяща одесную Отца. И паки грядущаго со славою судити живым и мертвым. Его же Царствию не будет конца","ro":"Și întru unul Domn Iisus Hristos, Fiul lui Dumnezeu, Unul Născut, Care din Tatăl S-a născut mai înainte de toți vecii: Lumină din Lumină, Dumnezeu adevărat din Dumnezeu adevărat, născut iar nu făcut, Cel de o ființă cu Tatăl, prin Care toate s-au făcut; Care pentru noi oamenii și pentru a noastră mântuire, S-a pogorât din ceruri și S-a întrupat de la Duhul Sfânt și din Fecioara Maria și S-a făcut om; Și S-a răstignit pentru noi în zilele lui Ponțiu Pilat și a pătimit și S-a îngropat; Și a înviat a treia zi, după Scripturi; Și S-a înălțat la ceruri și șade de-a dreapta Tatălui; Și iarăși va să vină cu slavă să judece viii și morții, a Cărui împărăție nu va avea sfârșit","de":"und an den einen Herrn Jesus Christus , Gottes einziggezeugten Sohn, den aus dem Vater Gezeugten vor aller Zeit, Licht vom Lichte, wahren Gott vom wahren Gott, gezeugt, nicht geschaffen, den dem Vater Wesenseinen, durch den alles geworden ist, den für uns Menschen un
