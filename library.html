<style>
:root{
  --desk:#e7e6e0; --leaf:#f7f6f3; --rail:#efeee9;
  --ink:#1b1a18; --ink-soft:#46443f; --muted:#8b8881; --rule:#d8d7d0;
  --porphyry:#6e2b3b; --porphyry-deep:#531f2c; --gold:#9c7b33;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --display:'Fraunces',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
::selection{background:rgba(110,43,59,.16)}

/* masthead */
.masthead{position:sticky;top:0;z-index:10;display:flex;align-items:baseline;gap:24px;
  padding:14px 26px;background:rgba(231,230,224,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
/* The masthead follows the same surface token as every other page, in both
   themes. It used to carry the color as a literal, with a second literal
   patched over it for dark, which is how these two pages drifted a shade
   away from the rest of the site. The page sheet loads after the shared one,
   so this rule is the one that lands. */
.masthead{background:var(--leaf)}
:root[data-theme="dark"] .masthead{background:var(--leaf)}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}.brandlogo{display:block;line-height:0}.brandmark{height:clamp(60px,8.5vw,80px);width:auto;display:block}
.wordmark{font-family:var(--display);font-weight:600;font-size:25px;letter-spacing:.01em;color:var(--porphyry)}
/* The same line the other six pages carry, in the same hand. It was 10.5px
   in grey here and 11px in gold everywhere else. */
.brandtagline{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.searchwrap{flex:1 1 auto;display:flex;align-items:center;gap:10px;max-width:980px;flex-wrap:wrap}
.hitgrp{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.tagrow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:7px}
.tagdim{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:0 0 auto;min-width:74px}
/* A flex item will not shrink below its own content unless it is told it
   may, and an input carries a default width of its own. So the search box
   and the catalog count held the masthead wider than the window, and the
   whole page scrolled sideways the moment the count appeared. Letting the
   three of them shrink, and letting the masthead wrap when there is no room
   left, keeps the page inside the screen at every width. */
.masthead{flex-wrap:wrap}
.searchwrap,.searchbox,#q{min-width:0}
.searchbox{flex:1 1 auto;display:flex;align-items:center;gap:10px;background:var(--leaf);
  border:1px solid var(--rule);border-radius:2px;padding:9px 13px}
.searchbox:focus-within{border-color:var(--porphyry)}
.searchbox svg{flex:0 0 auto;color:var(--muted)}
#q{flex:1 1 auto;border:none;outline:none;background:none;font-family:var(--serif);font-size:16px;color:var(--ink)}
#q::placeholder{color:var(--muted)}
.tally{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);white-space:nowrap;flex:0 0 auto}

/* shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);height:calc(100% - 57px)}
.rail{border-right:1px solid var(--rule);background:var(--rail);overflow-y:auto;padding:22px 0 60px}
.stage{overflow-y:auto;position:relative}

/* rail */
.railhead{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:0 22px 6px}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 20px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);
  border:1px solid var(--rule);border-radius:2px;padding:4px 8px;background:var(--leaf)}
.chip[aria-pressed="true"]{background:var(--porphyry);color:#f6f1ee;border-color:var(--porphyry)}
.group{margin:0 0 4px}
.grouphd{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--porphyry);
  padding:14px 22px 6px;display:flex;justify-content:space-between}
.grouphd span{color:var(--muted)}
.work{display:block;width:100%;text-align:left;padding:7px 22px;border-left:2px solid transparent}
.work:hover{background:#e9e8e2}
.work[aria-current="true"]{border-left-color:var(--porphyry);background:#e9e8e2}
.work .wt{font-family:var(--display);font-weight:500;font-size:15.5px;line-height:1.22;color:var(--ink)}
.wnative{font-size:14.5px;color:var(--muted);margin-top:3px;line-height:1.35}.alhead{display:grid;grid-template-columns:4.8em repeat(var(--ncol),minmax(0,1fr));gap:0 14px;margin:2px 0 7px;border-bottom:1px solid var(--rule);padding-bottom:4px}.alhead .alh{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.aline{display:grid;grid-template-columns:4.8em repeat(var(--ncol),minmax(0,1fr));gap:0 14px;padding:3px 0;align-items:start;border-top:1px solid #f0efe9}.alabel{font-size:10.5px;line-height:1.25;color:var(--muted);padding-top:1px;font-weight:600}.almanner{display:block;font-weight:400;font-style:italic;font-size:9.5px;color:var(--muted);text-transform:none;letter-spacing:0}.acell{font-family:var(--serif);font-size:15px;line-height:1.5;color:var(--ink)}.aline.r-priest .alabel,.aline.r-priestdeacon .alabel,.aline.r-bishop .alabel{color:var(--porphyry)}.aline.r-deacon .alabel{color:#7a5f28}.aline.r-choir .alabel,.aline.r-people .alabel{color:#2f6b6b}.aline.r-reader .alabel{color:#3f5891}.alrubl{margin:0 0 .3em}.alrubl:last-child{margin-bottom:0}.alcoml{margin:0 0 .3em}.alcoml:last-child{margin-bottom:0}/* --- scripture read side by side. The Liturgy's aligned grid, with a verse
   number where its speaker label goes. --- */
.edrow{display:grid;grid-template-columns:2.6em repeat(var(--ncol),minmax(0,1fr));gap:0 20px;
  padding:12px 0;align-items:start;border-bottom:1px solid rgba(0,0,0,.05)}
.edrow:last-child{border-bottom:0}
.edrow .bvn{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding-top:5px}
.edcell .anchor{margin-bottom:5px}
.edcell p{font-family:var(--serif);font-size:16px;line-height:1.68;margin:0 0 9px}
.edcell.gap{color:var(--muted);font-style:italic;font-size:13.5px}
.bvrow{display:grid;grid-template-columns:3.2em repeat(var(--ncol),minmax(0,1fr));gap:0 16px;
  padding:5px 0;align-items:start;border-bottom:1px solid rgba(0,0,0,.04)}
.bvrow:last-child{border-bottom:0}
.bvrow .bvn{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding-top:4px}
.bvcell{font-family:var(--serif);font-size:16px;line-height:1.62}
.bvcell.gap{color:var(--muted);font-style:italic;font-size:13.5px}
.scriphd{display:grid;grid-template-columns:3.2em repeat(var(--ncol),minmax(0,1fr));gap:0 16px;
  margin:2px 0 7px;border-bottom:1px solid var(--rule);padding-bottom:5px}
.scriphd .alh{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tradwarn{border-left:3px solid var(--gold);background:rgba(156,123,51,.06);border-radius:0 8px 8px 0;
  padding:10px 14px;margin:10px 0;font-family:var(--serif);font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.alrubric{font-style:italic;color:#6f6452;font-size:12.5px;line-height:1.5;margin:5px 0;padding:5px 10px;border-left:2px solid var(--gold);background:rgba(156,123,51,.05)}.alcommem{font-style:italic;color:var(--muted);font-size:12.5px;line-height:1.45;padding:6px 10px;margin:5px 0;border-left:2px solid var(--rule);background:rgba(0,0,0,.02)}@media(max-width:620px){.acell{font-size:13.5px}.alhead,.aline{gap:0 8px;grid-template-columns:3.6em repeat(var(--ncol),minmax(0,1fr))}.alabel{font-size:9px}}
.work .wa{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--muted);margin-top:2px}

/* reading leaf */
.leafwrap{display:flex;justify-content:center;padding:46px 40px 140px}
.leaf{background:var(--leaf);width:min(860px,100%);padding:54px clamp(26px,5vw,70px) 90px;
  border:1px solid var(--rule);box-shadow:0 1px 0 rgba(0,0,0,.02),0 24px 60px -40px rgba(40,30,20,.35)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--porphyry)}
.worktitle{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.2vw,44px);line-height:1.08;margin:12px 0 0;letter-spacing:-.01em}
.byline{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-soft);margin-top:16px;line-height:1.7}
.byline b{color:var(--ink);font-weight:500}
.lead{font-size:19px;line-height:1.6;color:var(--ink-soft);margin:26px 0 0;padding-bottom:30px;border-bottom:1px solid var(--rule);font-style:italic}
.lead::first-letter{font-style:normal}

.unit{display:grid;grid-template-columns:124px minmax(0,1fr);gap:22px;padding:30px 0;border-bottom:1px solid #ece9e2;scroll-margin-top:74px}
.unit:last-child{border-bottom:none}
.anchor{font-family:var(--mono);font-size:11px;line-height:1.5;letter-spacing:.02em;color:var(--porphyry);
  padding-top:5px;position:sticky;top:74px;align-self:start;height:max-content}
.passage{max-width:64ch}
.passage p{margin:0 0 1.05em}
.passage p:last-child{margin-bottom:0}
.unit.flash .anchor{animation:flash 1.6s ease}
@keyframes flash{0%,30%{color:var(--gold)}100%{color:var(--porphyry)}}

/* results */
.results{max-width:880px;margin:0 auto;padding:34px 40px 140px}
.resbar{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:6px}
.resbar h2{font-family:var(--display);font-weight:500;font-size:21px;margin:0}
.resbar .echo{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.clearbtn{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--porphyry);border-bottom:1px solid transparent}
.clearbtn:hover{border-bottom-color:var(--porphyry)}
.hit{display:block;width:100%;text-align:left;padding:18px 0;border-bottom:1px solid #e7e5de}
.hit:hover{background:#f0efe9}
.hitmeta{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:7px}
.hitmeta .ha{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-soft)}
.hitmeta .hw{font-family:var(--display);font-weight:500;font-size:15px;color:var(--ink)}
.hitmeta .hc{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--porphyry);margin-left:auto}
.snip{font-size:16px;line-height:1.56;color:var(--ink-soft)}
.snip mark{background:linear-gradient(transparent 62%,rgba(156,123,51,.32) 62%);color:inherit;padding:0 1px}
.reshint{font-size:14px;color:var(--muted);margin:14px 0 0}
.scriphd{margin-top:34px}
.scripbar{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--muted)}
.scripbtn{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;color:var(--porphyry);border-bottom:1px solid var(--rule);padding-bottom:2px}
.scripbtn:hover,.scripbtn:focus-visible{border-bottom-color:var(--porphyry)}

/* empty / about */
.empty{max-width:560px;margin:12vh auto 0;padding:0 40px;text-align:center}
.empty .mk{font-family:var(--display);font-weight:600;font-size:34px;color:var(--porphyry)}
.empty p{color:var(--ink-soft);font-size:17px;line-height:1.6}
.empty .hint{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);margin-top:22px}
.empty .hint b{color:var(--ink-soft);font-weight:500}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  /* The catalog is the Library's own search, and it is never put away: on a
     phone it sits above the books rather than behind a drawer, which is where
     nobody found it. The shell stops being a fixed-height two-column frame
     and becomes one scrolling column. */
  html,body{height:auto}
  .shell{height:auto;display:block}
  .rail{position:static;width:auto;transform:none;box-shadow:none;border-right:0;
        border-bottom:1px solid var(--rule);overflow:visible;padding:16px 0 18px}
  .stage{overflow:visible}
  .brandtagline{display:none}
  .leafwrap{padding:24px 14px 120px}
  .leaf{padding:34px 22px 70px}
  .unit{grid-template-columns:1fr;gap:8px}
  .anchor{position:static;padding-top:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dl{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.dl .dll{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dl button{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;border:1px solid var(--rule);border-radius:2px;padding:5px 10px;color:var(--ink-soft);background:var(--leaf)}
.dl button:hover{border-color:var(--porphyry);color:var(--porphyry)}
@media print{
  .masthead,.rail,.dl,.tally{display:none!important}
  .shell{display:block;height:auto}
  .stage{overflow:visible}
  .leafwrap{padding:0}
  .leaf{box-shadow:none;border:none;width:100%;max-width:100%;padding:0}
  .unit{break-inside:avoid;page-break-inside:avoid}
  .anchor{position:static}
  body{background:#fff}
}
.leaf.bible .biblebooks{display:flex;flex-wrap:wrap;gap:5px;margin:16px 0 12px}
.leaf.bible .bbook{font-family:var(--mono);font-size:11px;padding:5px 9px;border:1px solid var(--rule);border-radius:2px;background:var(--leaf);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.leaf.bible .bbook:hover{border-color:var(--porphyry);color:var(--porphyry)}
.leaf.bible .bbook.on{background:var(--porphyry);color:#fff;border-color:var(--porphyry)}
.leaf.bible .biblenav{display:flex;align-items:baseline;gap:10px;margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.leaf.bible .bcl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.leaf.bible .biblechaps{display:flex;flex-wrap:wrap;gap:4px}
.leaf.bible .bchap{font-family:var(--mono);font-size:11px;min-width:30px;padding:4px 7px;border:1px solid var(--rule);border-radius:2px;background:var(--leaf);color:var(--ink-soft);cursor:pointer;text-align:center}
.leaf.bible .bchap:hover{border-color:var(--gold);color:var(--gold)}
.leaf.bible .bchap.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.leaf.bible .bibletext{font-family:var(--serif);font-size:17px;line-height:1.72;color:var(--ink)}
.leaf.bible .bverse{margin:0 0 8px}
.leaf.bible .bvn{font-family:var(--mono);font-size:11px;color:var(--porphyry);font-weight:500;margin-right:8px;vertical-align:super}
.groupdesc{font-size:11.5px;color:var(--muted);font-style:italic;margin:1px 0 11px;line-height:1.45}
.lit{margin:0 0 .55em;line-height:1.55}
.role{font-weight:700}
.role-priest{color:var(--porphyry)}
.role-deacon{color:var(--gold)}
.role-choir{color:#2f6b6b}
.role-reader{color:#3f5891}
.rubric{font-style:italic;color:var(--muted);font-size:.92em}
.rubricline{text-align:center;color:var(--muted);font-style:italic}
.litpassage{margin-top:.4em}
.litkey{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0 2px;padding:9px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:12.5px;align-items:center}
.parcols{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:.5em}
.parcol{min-width:0;padding:0 18px;border-right:1px solid var(--rule)}
.parcol:first-child{padding-left:0}
.parcol:last-child{padding-right:0;border-right:none}
.litwrap{max-width:760px}
.litwrap.litcols-2{max-width:1000px}
.litwrap.litcols-3{max-width:1240px}
.litwrap.litcols-4{max-width:1460px}
.litwrap.litcols-5{max-width:1560px}
.litsub{color:var(--muted);font-size:13px;margin:2px 0 13px}
.litchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.litchip{font:inherit;font-size:13px;padding:6px 14px;border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--ink-soft);cursor:pointer;transition:all .12s}
.litchip:hover{border-color:var(--ink-soft)}
.litchip.on{background:var(--porphyry);color:#fff;border-color:var(--porphyry)}
.litnav{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 22px;padding:11px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.litnavb{font:inherit;font-size:11px;padding:4px 9px;border:1px solid var(--rule);border-radius:5px;background:transparent;color:var(--muted);cursor:pointer}
.litnavb:hover{color:var(--ink);border-color:var(--ink-soft)}
.litsec{margin:0 0 28px;scroll-margin-top:14px}
.litsech{font-weight:700;font-size:14px;color:var(--porphyry);margin:0 0 11px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.parcols.cols-1{grid-template-columns:1fr}
.parcols.cols-3{grid-template-columns:1fr 1fr 1fr}
.parcols.cols-4{grid-template-columns:repeat(4,1fr)}
.parcols.cols-5{grid-template-columns:repeat(5,1fr)}
.parcollang{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:7px;font-weight:700}

/* sections + scripture */
.sectionsel{width:100%;font:inherit;font-size:14px;font-weight:600;padding:9px 11px;margin:0 0 6px;border:1px solid var(--rule);border-radius:8px;background:var(--leaf);color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none}
.sectionsel:focus{outline:2px solid var(--porphyry);outline-offset:1px}
.railempty{padding:14px 4px;color:var(--muted);font-size:13px;line-height:1.55}
.scripw .wnative{opacity:.82;font-style:normal}
.bgrp{margin:0 0 9px}
.bgrphd{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:9px 0 5px}
.scripbooks{margin:6px 0 13px}
.leaf.bible .scripbooks .biblebooks{margin:0}
.caveat{margin:8px 0 15px;border:1px solid var(--rule);border-radius:8px;background:var(--rail)}

.caveat>summary::-webkit-details-marker{display:none}

.caveat[open]>summary:before{content:"\2304\00a0"}
.caveat p{margin:0;padding:0 13px 12px;font-size:13.5px;line-height:1.58;color:var(--ink-soft)}


.langpick{position:relative}
.langcaret{color:var(--muted);font-size:9px;margin-left:1px}
.langflag{display:block;width:21px;height:14px;border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.14);flex:none}
.langcur{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--ink);background:var(--leaf);border:1px solid var(--rule);border-radius:2px;padding:5px 8px;cursor:pointer}
.langmenu{position:absolute;top:calc(100% + 4px);left:0;z-index:80;background:var(--leaf);border:1px solid var(--rule);border-radius:3px;box-shadow:0 8px 24px rgba(20,16,14,.2);padding:4px;min-width:170px;max-height:62vh;overflow:auto}
.langmenu[hidden]{display:none}
.langopt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-family:var(--mono);font-size:12px;color:var(--ink);background:none;border:0;border-radius:2px;padding:7px 8px;cursor:pointer;white-space:nowrap}
.langopt:hover{background:#f1f0ea}
.langopt[aria-selected="true"]{background:#ece9e2;font-weight:600}
@media(max-width:620px){.langmenu{left:auto;right:0}}
.uilangsel{font:inherit;font-size:13px;font-weight:600;padding:5px 9px;border:1px solid var(--rule);border-radius:7px;background:var(--leaf);color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none;max-width:150px}
.uilangsel:focus{outline:2px solid var(--porphyry);outline-offset:1px}

/* --- home / collections --- */
.home{width:min(1000px,100%);margin:0 auto;padding:54px clamp(22px,5vw,64px) 90px}
.homehero{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.4vw,46px);line-height:1.06;letter-spacing:-.01em;color:var(--ink);margin:0 0 10px}
.homesub{font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--ink-soft);margin:0 0 40px;max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:15px}
.tile{display:block;text-align:left;background:var(--leaf);border:1px solid var(--rule);border-radius:11px;padding:22px 22px 18px;cursor:pointer;transition:box-shadow .16s ease,transform .16s ease,border-color .16s ease}
.tile:hover{border-color:var(--porphyry);box-shadow:0 14px 34px -20px rgba(40,30,20,.55);transform:translateY(-2px)}
.tilename{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.15;color:var(--ink);margin:0 0 7px}
.tiledesc{font-family:var(--serif);font-size:13.5px;line-height:1.42;color:var(--ink-soft);margin:0 0 16px}
.tilemeta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--porphyry)}
/* --- how the Church received a work, where that is a question --- */
.caution{border-left:3px solid var(--porphyry);background:rgba(110,43,59,.055);border-radius:0 8px 8px 0;
  padding:13px 17px;margin:20px 0 0;font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--ink-soft)}
.cautionhd{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--porphyry);margin-bottom:5px}
.cardnote{display:inline-block;margin-top:2px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--porphyry);border:1px solid var(--porphyry);border-radius:20px;padding:2px 8px}
/* --- provenance: who wrote it, who rendered it, who published it, when --- */
.prov{display:grid;grid-template-columns:max-content 1fr;gap:2px 18px;margin-top:18px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;line-height:1.6;color:var(--ink-soft)}
.prov dt{color:var(--muted);text-transform:uppercase;font-size:9.5px;letter-spacing:.12em;padding-top:3px;white-space:nowrap}
.prov dd{margin:0}
@media(max-width:520px){.prov{grid-template-columns:1fr;gap:0 0}.prov dt{padding-top:9px}}
/* --- browsing the whole shelf by author, century, and purpose --- */
.facet{margin:0 0 2px;border-bottom:1px solid var(--rule)}
.facet:last-of-type{border-bottom:0}
.facethd{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--porphyry);padding:10px 22px;cursor:pointer;
  list-style:none}
.facethd::-webkit-details-marker{display:none}
.facethd:hover{background:var(--leaf)}
.facetname{flex:0 0 auto}
/* What the reader has chosen, said on the front of the drawer so a shut one
   is never hiding a filter he has forgotten. */
.facetsel{flex:1 1 auto;min-width:0;text-transform:none;letter-spacing:.02em;font-size:10.5px;
  color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facetn{flex:1 1 auto;text-align:right;color:var(--muted);letter-spacing:.06em}
.facetcaret{flex:0 0 auto;color:var(--muted);font-size:9px;transition:transform .15s ease}
.facet[open] .facetcaret{transform:rotate(180deg)}
.facetclear{padding:0 22px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.facetclear button{font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
.facetclear button:hover{color:var(--porphyry)}
.facetlist{display:flex;flex-wrap:wrap;gap:5px;padding:0 22px 12px}
.facetlist .chip{text-transform:none;letter-spacing:.02em;font-size:11px;padding:4px 9px}
.facetlist .chip b{font-weight:400;color:var(--muted);margin-left:5px}
.facetlist .chip[aria-pressed="true"] b{color:#e6d5da}
.facetmore{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:0 22px 12px;text-decoration:underline;cursor:pointer}
.facetmore:hover{color:var(--porphyry)}
.findbox{display:block;width:calc(100% - 44px);margin:0 22px 14px;font:inherit;font-size:13px;padding:7px 10px;
  border:1px solid var(--rule);border-radius:8px;background:var(--leaf);color:var(--ink)}
.findbox:focus{outline:2px solid var(--porphyry);outline-offset:1px}
.browse{width:min(1000px,100%);margin:0 auto;padding:44px clamp(22px,5vw,64px) 90px}
.browsehd{font-family:var(--display);font-weight:500;font-size:clamp(24px,3.2vw,32px);line-height:1.1;margin:0 0 8px}
.browsesub{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--porphyry);margin:0 0 8px}
.browseon{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 26px}
.browseon .chip{text-transform:none;letter-spacing:.02em;font-size:11.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:15px}
.card{display:flex;flex-direction:column;background:var(--leaf);border:1px solid var(--rule);border-radius:11px;
  padding:19px 20px 16px;transition:box-shadow .16s ease,border-color .16s ease}
.card:hover{border-color:var(--porphyry);box-shadow:0 14px 34px -20px rgba(40,30,20,.55)}
/* A button centres its content vertically no matter what `display` it is
   given, so on a card stretched to its neighbour's height the title sank to
   the middle and the cards in a row started at three different places. Making
   it a column that packs to the top is the only thing that overrides it. */
.cardopen{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;
  text-align:left;cursor:pointer;flex:1}
.cardtitle{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.16;color:var(--ink);margin:0 0 5px}
.cardauthor{font-family:var(--serif);font-size:13.5px;line-height:1.35;color:var(--ink-soft);margin:0 0 4px}
.cardedition{font-family:var(--mono);font-size:10px;letter-spacing:.03em;line-height:1.5;color:var(--muted);margin:0 0 9px}
.cardtags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.cardtag{background:none;cursor:default;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--porphyry);
  border:1px solid var(--rule);border-radius:20px;padding:2px 8px}
button.cardtag{cursor:pointer;transition:border-color .14s ease,color .14s ease,background .14s ease}
button.cardtag:hover{border-color:var(--porphyry);background:var(--desk)}
button.cardtag:focus-visible{outline:2px solid var(--porphyry);outline-offset:1px}
.carddesc{font-family:var(--serif);font-size:13px;line-height:1.44;color:var(--ink-soft);margin:0}

.cardlife:hover{border-bottom-color:var(--porphyry)}
.bylife{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--porphyry);text-decoration:none;
  border-bottom:1px solid var(--rule)}
.bylife:hover{border-bottom-color:var(--porphyry)}

.sectionsel{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%236e2b3b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:32px}

1],"century":1,"period":"1st century","topics":["Reading Scripture","Christ, God and man","Christ foretold in the prophets"]},{"work_id":"bible-zh","title":"The New Testament (Chinese)","author":"The Apostles and Evangelists","source_class":"scripture","language":"zh","date":"1st century","genre":"scripture","pub_year":1919,"description":"The New Testament in Chinese, in the Union Version, in simplified characters.","themes":[],"feast_day":null,"is_saint":true,"source":"Chinese Union Version","saint":null,"purpose":"Holy Scripture","centuries":[1],"century":1,"period":"1st century","topics":["Reading Scripture","Christ, God and man","Christ foretold in the prophets"],"translator":null},{"work_id":"nicene-constantinopolitan-creed","title":"The Nicene-Constantinopolitan Creed","author":"The Ecumenical Councils","source_class":"conciliar","date":"325/381","genre":"canon_conciliar","translator":"Henry R. Percival","pub_year":1900,"description":"The confession of faith promulgated by the First Council of Nicaea in 325 and expanded at the First Council of Constantinople in 381. It states belief in God the Father, in the Son as consubstantial with the Father and incarnate for salvation, crucified, risen, and to come again, and in the Holy Spirit, and it affirms one Church, one baptism, and the resurrection of the dead.","themes":["christology","scripture_prophecy","resurrection","incarnation","trinity","soteriology"],"feast_day":null,"is_saint":false,"source":"Nicene and Post-Nicene Fathers, Series 2, Vol. 14","digitized":"CCEL","language":"en","saint":null,"purpose":"Canon law and the Councils","centuries":[4],"century":4,"period":"4th century","publisher":"Christian Literature Company, New York","topics":["The Holy Trinity","Christ, God and man","The Holy Spirit","The councils and the canons"],"lazy":true},{"work_id":"seven-ecumenical-councils","title":"The Seven Ecumenical Councils: Canons and Definitions","author":"The Ecumenical Councils","source_class":"conciliar","date":"325-787","genre":"canon_conciliar","translator":"Henry R. Percival","pub_year":1900,"description":"This volume gathers, in the edition of Henry R. Percival (1900), the definitions and canons of the seven councils received as ecumenical, together with the canons of several local synods received into the canonical tradition, each given with the editor's notes. It runs in order of date: the First Council of Nicaea in 325 with its creed and canons (unit 1); the canons of the local councils of Ancyra, Gangra, Neocaesarea, Antioch, Laodicea, and others (unit 2); the First Council of Constantinople in 381 (unit 3); the Council of Ephesus in 431 (unit 4); the Council of Chalcedon in 451 and its definition of faith (unit 5); the Second Council of Constantinople in 553 (unit 6); the Third Council of Constantinople in 680 to 681 (unit 7); the canons of the Council in Trullo, also called the Quinisext (unit 8); the canons of the synods of Sardica, Carthage, Constantinople, and others (unit 9); the Second Council of Nicaea in 787 on the holy images (unit 10); and an appendix of canons and rulings not carrying full conciliar authority (unit 11).","themes":["canon_discipline","heresy_anathema","incarnation","death_corruption","resurrection","trinity","soteriology","creation_fall","scripture_prophecy","christology","idolatry_paganism","theosis"],"feast_day":null,"is_saint":false,"source":"Nicene and Post-Nicene Fathers, Series 2, Vol. 14","digitized":"CCEL","language":"en","saint":null,"purpose":"Canon law and the Councils","centuries":[4,5,6,7,8],"century":4,"period":"4th century","publisher":"Christian Literature Company, New York","topics":["The councils and the canons","Christ, God and man","Icons and images","Answering heresy"],"lazy":true},{"work_id":"athanasius-on-the-incarnation","title":"On the Incarnation of the Word","author":"St Athanasius the Great","source_class":"patristic","date":"c. 318","genre":"apologetic","translator":"Archibald Robertson","pub_year":1891,"description":"Composed about 318, this treatise argues across nine chapters (sections 1 to 57) that the Word of God took a human body to meet the consequences of the fall. It opens with the creation of mankind in the image of God and the entry of death and corruption through the transgression (sections 1 to 5), then sets out the divine dilemma between God's goodness and the law of death and its resolution in the Word taking flesh (sections 6 to 18). It treats the death of Christ and the reasons for death upon the cross (sections 19 to 25) and the resurrection of the body and the ending of death's hold (sections 26 to 32). It then answers objections in turn, from the Jewish Scriptures and prophecy (sections 33 to 40) and from Greek reasoning (sections 41 to 55), including the effect of the cross on idolatry, the oracles, and magic, and it closes with an exhortation to the reading of Scripture and to purity of life (sections 56 to 57).","themes":["death_corruption","incarnation","resurrection","christology","creation_fall","soteriology","idolatry_paganism","scripture_prophecy","heresy_anathema","theosis"],"feast_day":"01-18","is_saint":true,"source":"Nicene and Post-Nicene Fathers, Series 2, Vol. 4","digitized":"CCEL","language":"en","saint":"Saint Athanasius the Great, Archbishop of Alexandria","purpose":"Doctrine","centuries":[4],"century":4,"period":"4th century","publisher":"Christian Literature Company, New York","topics":["Christ, God and man","Deification","Creation"],"lazy":true},{"work_id":"epistle-of-barnabas","title":"The Epistle of Barnabas","author":"St Barnabas the Apostle","source_class":"patristic","date":"late 1st-early 2nd century","genre":"treatise","translator":"Alexander Roberts and James Donaldson","pub_year":1885,"description":"An early treatise, transmitted under the name of Barnabas, that reads the Hebrew Scriptures as pointing throughout to Christ. It treats the sacrifices, the covenant, circumcision, the food laws, the Sabbath, and the temple as figures to be understood spiritually, and it closes with the teaching of the two ways, of light and of darkness.","themes":["soteriology","death_corruption","creation_fall","scripture_prophecy","idolatry_paganism","resurrection","incarnation","christology","heresy_anathema","theosis"],"feast_day":"06-11","is_saint":true,"source":"Ante-Nicene Fathers, Vol. 1","digitized":"CCEL","language":"en","saint":"Apostle Barnabas of the Seventy","purpose":"Letters","centuries":[1,2],"century":1,"period":"1st century","publisher":"Christian Literature Publishing Company, Buffalo","caution":"This letter was read in some churches in the early centuries and stands in the Codex Sinaiticus after the New Testament, but it is not among the canonical Scriptures and was not received as such.","topics":["Christ foretold in the prophets","Reading Scripture"],"edition_of":"epistle-of-barnabas","lazy":true},{"work_id":"basil-on-the-holy-spirit","title":"On the Holy Spirit","author":"St Basil the Great","source_class":"patristic","date":"c. 375","genre":"dogmatic","translator":"Blomfield Jackson","pub_year":1895,"description":"Written about 375 to Amphilochius of Iconium, this treatise defends the full divinity of the Holy Spirit and the practice of glorifying the Spirit together with the Father and the Son. It begins from the disputed prepositions used of the divine Persons in Scripture and in worship, argues from baptism and from the form of the doxology, and appeals to the tradition handed down in the Church, written and unwritten. It sets out the relation of the Spirit to the Father and the Son and the Spirit's work in creation and sanctification, and closes with an account of the divisions of the author's own day.","themes":["trinity","incarnation","creation_fall","death_corruption","resurrection","soteriology","idolatry_paganism","canon_discipline","scripture_prophecy","heresy_anathema","christology","theosis"],"feast_day":"01-01","is_saint":true,"source":"Nicene and Post-Nicene Fathers, Series 2, Vol. 8","digitized":"CCEL","language":"en","saint":"Saint Basil the Great, Archbishop of Caesarea in Cappadocia","purpose":"Doctrine","centuries":[4],"century":4,"period":"4th century","publisher":"Christian Literature Company, New York","topics":["The Holy Spirit","The Holy Trinity","Apostolic tradition"],"lazy":true},{"work_id":"basil-hexaemeron","title":"The Hexaemeron","author":"St Basil the Great","source_class":"patristic","date":"c. 378","genre":"homiletic_exegetical","translator":"Blomfield Jackson","pub_year":1895,"description":"A series of homilies on the six days of creation in Genesis, delivered about 378. They treat in order the beginning of heaven and earth, the unformed earth and the waters, the gathering of the seas and the appearing of dry land and of plants, the lights set in the firmament, the creatures of the waters, and the birds and land animals, joining the exposition of the text to observation of the natural world.","themes":["creation_fall","incarnation","resurrection","death_corruption","heresy_anathema","soteriology","idolatry_paganism","scripture_prophecy","canon_discipline","trinity","theosis","christology"],"feast_day":"01-01","is_saint":true,"source":"Nicene and Post-Nicene Fathers, Series 2, Vol. 8","digitized":"CCEL","language":"en","saint":"Saint Basil the Great, Archbishop of Caesarea in Cappadocia","purpose":"Scripture opened","centuries":[4],"century":4,"period":"4th century","publisher":"Christian Literature Company, New York","topics":["Creation","Reading Scripture"],"lazy":true},{"work_id":"cyril-jerusalem-catechetical-lectures","title":"The Catechetical Lectures","author":"St Cyril of Jerusalem","source_class":"patristic","date":"c. 350","genre":"catechetical","translator":"Edwin Hamilton Gifford","pub_year":1894,"description":"The baptismal catechesis delivered at Jerusalem about 350. It opens with a procatechesis addressed to those preparing for baptism, continues with lectures expounding repentance, the articles of the creed, the doctrine of God, the Incarnation, the Cross and Resurrection, the Holy Spirit, and the Church, and concludes with the mystagogical catecheses on baptism, chrismation, and the Eucharist addressed to the newly baptized.","themes":["soteriology","death_corruption","scripture_prophecy","heresy_anathema","incarnation","trinity","resurrection","christology","creation_fall","canon_discipline","theosis","idolatry_paganism"],"feast_day":"03-18","is_saint":true,"source":"Nicene and Post-Nicene Fathers, Series 2, Vol. 7","digitized":"CCEL","language":"en","saint":"Saint Cyril, Archbishop of Jerusalem","purpose":"Instruction of catechumens","centuries":[4],"century":4,"period":"4th century","publisher":"Christian Literature Company, New York","topics":["Baptism and chrismation","The Eucharist","The Divine Liturgy","The Holy Trinity","Christ, God and man","The last things"],"lazy":true},{"work_id":"gregory-nazianzen-select-orations","title":"Select Orations","author":"St Gregory the Theologian","source_class":"patristic","date":"4th century","genre":"oration","translator":"Charles Gordon Browne and James Edward Swallow","pub_year":1894,"description":"A selection from the orations of Gregory of Nazianzus, gathering occasional, festal, and doctrinal addresses from his ministry at Nazianzus and Constantinople. It includes the invectives, funeral orations and panegyrics, and orations on feasts of the Church, together with the five Theological Orations delivered at Constantinople in 380, which treat the knowledge of God, the doctrine of the Son, and the doctrine of the Holy Spirit.","themes":["incarnation","christology","trinity","death_corruption","soteriology","heresy_anathema","creation_fall","resurrection","scripture_prophecy","idolatry_paganism","canon_discipline","theosis"],"feast_day":"01-25","is_saint":true,"source":"Nicene and Post-Nicene Fathers, Series 2, Vol. 7","digitized":"CCEL","language":"en","saint":"Saint Gregory the Theologian, Archbishop const LIT_ALIGN={"divine-liturgy-chrysostom":{"0":{"title":"Opening and the Great Litany","lines":[{"r":"deacon","t":{"en":"Master, give the blessing.","el":"Εὐλόγησον, Δέσποτα.","cu":"Владыко, благослови.","ro":"Binecuvintează, Stăpâne.","de":"Segne, Gebieter."}},{"r":"rubric","x":"The priest lifts the holy Gospel, signs the antimension with it, and exclaims:","t":{"en":"The priest lifts the holy Gospel, signs the antimension with it, and exclaims:","el":"Ὁ ἱερεὺς ὑψώνει τὸ ἅγιον Εὐαγγέλιον, σταυρώνει μὲ αὐτὸ τὸ ἀντιμήνσιον καὶ ἐκφωνεῖ:","cu":"Священник возвышает святое Евангелие, назнаменует им антиминс и возглашает:","ro":"Preotul ridică sfânta Evanghelie, însemnează cu ea antimisul și zice cu glas tare:","de":"Der Priester erhebt das heilige Evangelium, bezeichnet damit das Antimension und ruft aus:"}},{"r":"priest","t":{"en":"Blessed be the kingdom of the Father, and of the Son, and of the Holy Spirit, now and ever and unto ages of ages.","el":"Εὐλογημένη ἡ βασιλεία τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ Ἁγίου Πνεύματος, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Благословено Царство Отца и Сына и Святаго Духа, ныне и присно и во веки веков.","ro":"Binecuvântată este Împărăția Tatălui și a Fiului și a Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Gesegnet ist das Königtum des Vaters und des Sohnes und des Heiligen Geistes, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"rubric","x":"The Great Litany (the Litany of Peace). From before the holy doors the deacon offers each petition; to each the people answer, \"Lord, have mercy.\"","t":{"en":"The Great Litany (the Litany of Peace). From before the holy doors the deacon offers each petition; to each the people answer, \"Lord, have mercy.\"","el":"Ἡ Μεγάλη Συναπτή (τὰ Εἰρηνικά). Πρὸ τῶν ἁγίων θυρῶν ὁ διάκονος ἐκφωνεῖ τὰ αἰτήματα· εἰς ἕκαστον ὁ λαὸς ἀποκρίνεται: «Κύριε, ἐλέησον.»","cu":"Великая ектения (мирная). Пред святыми дверьми диакон возглашает прошения; на каждое людие отвещают: «Господи, помилуй.»","ro":"Ectenia mare (a păcii). Înaintea sfintelor uși, diaconul rostește fiecare cerere; la fiecare, strana răspunde: „Doamne, miluiește.”","de":"Die Große Ektenie (die Friedensbitten). Vor den heiligen Türen spricht der Diakon jede Bitte; auf jede antwortet das Volk: „Herr, erbarme Dich.”"}},{"r":"deacon","t":{"en":"In peace let us beseech the Lord.","el":"Ἐν εἰρήνῃ τοῦ Κυρίου δεηθῶμεν.","cu":"Миром Господу помолимся.","ro":"Cu pace Domnului să ne rugăm.","de":"In Frieden lasst uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For the peace from above and the salvation of our souls, let us beseech the Lord.","el":"Ὑπὲρ τῆς ἄνωθεν εἰρήνης καὶ τῆς σωτηρίας τῶν ψυχῶν ἡμῶν τοῦ Κυρίου δεηθῶμεν.","cu":"О Свышнем мире и спасении душ наших. Господу помолимся.","ro":"Pentru pacea de sus și pentru mântuirea sufletelor noastre, Domnului să ne rugăm.","de":"Um den Frieden von oben und die Errettung unserer Seelen lasst uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For the peace of the whole world, for the stability of the Holy Churches of God, and for the union of them all, let us beseech the Lord.","el":"Ὑπὲρ τῆς εἰρήνης τοῦ σύμπαντος κόσμου, εὐσταθείας τῶν ἁγίων τοῦ Θεοῦ Ἐκκλησιῶν καὶ τῆς τῶν πάντων ἑνώσεως τοῦ Κυρίου δεηθῶμεν.","cu":"О мире всего мира, благостоянии Святых Божиих Церквей и соединении всех. Господу помолимся.","ro":"Pentru pacea a toată lumea, pentru bună starea sfintelor lui Dumnezeu Biserici și pentru unirea tuturor, Domnului să ne rugăm.","de":"Um den Frieden der ganzen Welt, den Wohlbestand der heiligen Kirchen Gottes und die Einheit aller lasst uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For this Holy House, and for those that enter it with faith, reverence, and the fear of God, let us beseech the Lord.","el":"Ὑπὲρ τοῦ ἁγίου οἴκου τούτου καὶ τῶν μετὰ πίστεως, εὐλαβείας καὶ φόβου Θεοῦ εἰσιόντων ἐν αὐτῷ τοῦ Κυρίου δεηθῶμεν.","cu":"О святем храме сем и с верою, благоговением и страхом Божиим входящих в онь. Господу помолимся.","ro":"Pentru sfântă biserica aceasta și pentru cei ce cu credință, cu evlavie și cu frică de Dumnezeu intră într-însa, Domnului să ne rugăm.","de":"Für dieses heilige Haus und alle, die mit Glauben, Frömmigkeit und Gottesfurcht hier eintreten, lasst uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For godly and Orthodox Christians let us beseech the Lord.","el":"Ὑπὲρ τῶν εὐσεβῶν καὶ ὀρθοδόξων χριστιανῶν τοῦ Κυρίου δεηθῶμεν.","ro":"Pentru cei binecredincioși și drept-slăvitori creștini, Domnului să ne rugăm.","de":"Für die frommen und rechtgläubigen Christen lasset uns beten zum Herrn.","cu":"О благочестивых и православных христианех, Господу помолимся."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich.","cu":"Господи, помилуй."}},{"r":"deacon","t":{"en":"For this city, and for every city and land, and for the faithful who dwell in them, let us beseech the Lord.","el":"Ὑπὲρ τῆς πόλεως ταύτης, πάσης πόλεως καὶ χώρας, καὶ τῶν πίστει οἰκούντων ἐν αὐταῖς τοῦ Κυρίου δεηθῶμεν.","cu":"О граде сем (или: о веси сей; если в монастыре, то. о святей обители сей), всяком граде, стране и верою живущих в них. Господу помолимся.","ro":"Pentru sfânt locașul acesta, țara aceasta și pentru toate orașele și satele și pentru cei ce cu credință locuiesc într-însele, Domnului să ne rugăm.","de":"Für diese Stadt (oder dieses Dorf, oder dieses heilige Kloster), für jede Stadt, alles Land und die Gläubigen, die darin leben, lasst uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For seasonable weather, for the abundance of the fruits of the earth, and for peaceful times, let us beseech the Lord.","el":"Ὑπὲρ εὐκρασίας ἀέρων, εὐφορίας τῶν καρπῶν τῆς γῆς καὶ καιρῶν εἰρηνικῶν τοῦ Κυρίου δεηθῶμεν.","cu":"О благорастворении воздухов, о изобилии плодов земных и временех мирных. Господу помолимся.","ro":"Pentru buna-întocmire a văzduhului, pentru îmbelșugarea roadelor pământului și pentru vremuri pașnice, Domnului să ne rugăm.","de":"Um günstige Witterung, reichen Ertrag der Früchte der Erde und friedliche Zeiten, lasst uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For those that travel by land or by water, for the sick, for those that suffer, for captives, and for their salvation, let us beseech the Lord.","el":"Ὑπὲρ πλεόντων, ὁδοιπορούντων, νοσούντων, καμνόντων, αἰχμαλώτων καὶ τῆς σωτηρίας αὐτῶν τοῦ Κυρίου δεηθῶμεν.","cu":"О плавающих, путешествующих, недугующих, страждущих, плененных и о спасении их. Господу помолимся.","ro":"Pentru cei ce călătoresc pe ape, pe uscat și prin aer, pentru cei bolnavi, pentru cei ce se ostenesc, pentru cei robiți și pentru mântuirea lor, Domnului să ne rugăm.","de":"Für die Reisenden, die Kranken, Notleidenden und Gefangenen und um ihre Errettung lasst uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For our deliverance from all tribulation, wrath, danger, and necessity, let us beseech the Lord.","el":"Ὑπὲρ τοῦ ρυσθῆναι ἡμᾶς ἀπὸ πάσης θλίψεως, ὀργῆς, κινδύνου καὶ ἀνάγκης τοῦ Κυρίου δεηθῶμεν.","cu":"О избавитися нам от всякия скорби, гнева и нужды. Господу помолимся.","de":"Dass wir erlöst werden von aller Bedrängnis, Zorn, [Gefahr] und Not, lasst uns beten zum Herrn.","ro":"Pentru izbăvirea noastră de tot necazul, mânia, primejdia și nevoia, Domnului să ne rugăm."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","de":"Herr, erbarme Dich.","ro":"Doamne, miluiește."}},{"r":"deacon","t":{"en":"Succour, save, comfort, and protect us, O God, with Thy favour.","el":"Ἀντιλαβοῦ, σῶσον, ἐλέησον καὶ διαφύλαξον ἡμᾶς, ὁ Θεός, τῇ σῇ χάριτι.","cu":"Заступи, спаси, помилуй и сохрани нас, Боже, Твоею благодатию.","ro":"Apără, mântuiește, miluiește și ne păzește pe noi, Dumnezeule, cu harul Tău.","de":"Stehe bei, errette, erbarme Dich und behüte uns, o Gott, durch Deine Gnade."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"Commemorating our most holy, pure, blessed, and glorious Lady, the Theotokos and ever-virgin Mary, with all the saints, let us commend ourselves and one another and our whole life to Christ our God.","el":"Τῆς παναγίας, ἀχράντου, ὑπερευλογημένης, ἐνδόξου, δεσποίνης ἡμῶν, Θεοτόκου καὶ ἀειπαρθένου Μαρίας, μετὰ πάντων τῶν ἁγίων μνημονεύσαντες, ἑαυτοὺς καὶ ἀλλήλους καὶ πᾶσαν τὴν ζωὴν ἡμῶν Χριστῷ τῷ Θεῷ παραθώμεθα.","cu":"Пресвятую, Пречистую, Преблагословенную, Славную Владычицу нашу Богородицу и Приснодеву Марию, со всеми святыми помянувше, сами себе и друг друга, и весь живот наш Христу Богу предадим.","ro":"Pe Preasfânta, curata, preabinecuvântata, mărita stăpâna noastră, de Dumnezeu Născătoarea și pururea Fecioara Maria, cu toți sfinții pomenind-o, pe noi înșine și unii pe alții și toată viața noastră lui Hristos Dumnezeu să o dăm.","de":"Unserer allheiligen, allreinen, über alles gesegneten und herrlichen Gebieterin, der Gottesgebärerin und Immerjungfrau Maria, mit allen Heiligen eingedenk, lasst uns uns selbst und einander und unser ganzes Leben Christus, Gott, anbefehlen."}},{"r":"choir","t":{"en":"To Thee, O Lord.","el":"Σοί, Κύριε.","cu":"Тебе, Господи.","ro":"Ție, Doamne.","de":"Dir, o Herr."}},{"r":"rubric","x":"While the antiphon is sung, the priest quietly prays the Prayer of the First Antiphon, then concludes it aloud.","t":{"en":"While the antiphon is sung, the priest quietly prays the Prayer of the First Antiphon, then concludes it aloud.","el":"Ἐνῷ ψάλλεται τὸ ἀντίφωνον, ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν εὐχὴν τοῦ Α´ ἀντιφώνου καὶ τὴν καταλήγει ἐκφώνως.","cu":"Во время пения антифона священник тайно читает молитву первого антифона и оканчивает ее велегласно.","ro":"În timp ce se cântă antifonul, preotul citește în taină Rugăciunea Antifonului întâi și o încheie cu glas tare.","de":"Während das Antiphon gesungen wird, betet der Priester still das Gebet des ersten Antiphons und beschließt es laut."}},{"r":"priest","m":"silently","t":{"en":"Lord, our God, Whose power is inconceivable and glory incomprehensible, Whose mercy is immeasurable, and tenderness to man unspeakable, do Thou, O Master, according to Thy goodness, look down upon us, and upon this Holy House, and show us and those that pray with us, the riches of Thy mercy and pity.","el":"Κύριε ὁ Θεὸς ἡμῶν, οὗ τὸ κράτος ἀνείκαστον καὶ ἡ δόξα ἀκατάληπτος, οὗ τὸ ἔλεος ἀμέτρητον καὶ ἡ φιλανθρωπία ἄφατος· αὐτός, Δέσποτα, κατὰ τὴν εὐσπλαγχνίαν σου, ἐπίβλεψον ἐφ’ ἡμᾶς καὶ ἐπὶ τὸν ἅγιον οἶκον τοῦτον, καὶ ποίησον μεθ’ ἡμῶν καὶ τῶν συνευχομένων ἡμῖν πλούσια τὰ ἐλέη σου καὶ τοὺς οἰκτιρμούς σου.","de":"Herr, unser Gott, dessen Macht unvorstellbar und dessen Herrlichkeit unbegreiflich, dessen Erbarmen unermesslich und dessen Menschenliebe unaussprechlich ist, Du selbst, Gebieter, blicke nach Deiner Barmherzigkeit auf uns und dieses heilige Haus, und erweise uns und ‹allen›, die mit uns beten, reichlich Deine Erbarmungen und Dein Mitleid.","ro":"Doamne, Dumnezeul nostru, a Cărui stăpânire este neasemănată și slavă neajunsă, a Cărui milă este nemăsurată și iubire de oameni negrăită, Însuți, Stăpâne, după milostivirea Ta, caută spre noi și spre sfânt locașul acesta și fă cu noi și cu cei ce se roagă împreună cu noi bogatele Tale mile și îndurări.","cu":"Господи Боже наш, Егоже держава несказанна и слава непостижима, Егоже милость безмерна и человеколюбие неизреченно, Сам, Владыко, по благоутробию Твоему, призри на ны и на святый храм сей, и сотвори с нами и молящимися с нами богатыя милости Твоя и щедроты Твоя."}},{"r":"priest","m":"aloud","t":{"en":"For to Thee belong all glory, honour, and worship, to the Father and to the Son and to the Holy Spirit, now and ever and unto ages of ages.","el":"Ὅτι πρέπει σοι πᾶσα δόξα, τιμὴ καὶ προσκύνησις, τῷ Πατρὶ καὶ τῷ Υἱῷ καὶ τῷ Ἁγίῳ Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Яко подобает Тебе всякая слава, честь и поклонение. Отцу и Сыну и Святому Духу, ныне и присно и во веки веков.","ro":"Că Ție se cuvine toată slava, cinstea și închinăciunea, Tatălui și Fiului și Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Denn Dir gebührt alle Verherrlichung, Ehre und Anbetung, dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit."}},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"rubric","x":"The First Antiphon is sung; its verses change with the day. To each verse the people answer:","t":{"en":"The First Antiphon is sung; its verses change with the day. To each verse the people answer:","el":"Ψάλλεται τὸ Α´ ἀντίφωνον· οἱ στίχοι του ἀλλάζουν κατὰ τὴν ἡμέραν. Εἰς ἕκαστον στίχον ὁ λαὸς ἀποκρίνεται:","cu":"Поется первый антифон; стихи его изменяются по дню. На каждый стих людие отвещают:","ro":"Se cântă Antifonul întâi; stihurile lui se schimbă după zi. La fiecare stih, strana răspunde:","de":"Das erste Antiphon wird gesungen; seine Verse wechseln je nach Tag. Auf jeden Vers antwortet das Volk:"}},{"r":"choir","t":{"en":"By the intercessions of the Theotokos, O Saviour, save us.","el":"Ταῖς πρεσβείαις τῆς Θεοτόκου, Σῶτερ, σῶσον ἡμᾶς.","cu":"Молитвами Богородицы, Спасе, спаси нас.","ro":"Pentru rugăciunile Născătoarei de Dumnezeu, Mântuitorule, mântuiește-ne pe noi.","de":"Auf die Fürbitten der Gottesgebärerin, o Erlöser, rette uns."}},{"r":"rubric","x":"The Little Litany.","t":{"en":"The Little Litany.","el":"Ἡ Μικρὰ Συναπτή.","cu":"Малая ектения.","ro":"Ectenia mică.","de":"Die Kleine Ektenie."}},{"r":"deacon","t":{"en":"Again and again, in peace, let us pray to the Lord.","el":"Ἔτι καὶ ἔτι ἐν εἰρήνῃ τοῦ Κυρίου δεηθῶμεν.","cu":"Паки и паки миром Господу помолимся.","ro":"Iară și iară, cu pace, Domnului să ne rugăm.","de":"Wieder und wieder in Frieden lasst uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"Help us, save us, have mercy on us, and keep us, O God, by Thy grace.","el":"Ἀντιλαβοῦ, σῶσον, ἐλέησον καὶ διαφύλαξον ἡμᾶς, ὁ Θεός, τῇ σῇ χάριτι.","cu":"Заступи, спаси, помилуй и сохрани нас, Боже, Твоею благодатию.","ro":"Apără, mântuiește, miluiește și ne păzește pe noi, Dumnezeule, cu harul Tău.","de":"Hilf uns, rette uns, erbarme Dich unser und behüte uns, o Gott, durch Deine Gnade."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"Commemorating our most holy, pure, blessed, and glorious Lady, the Theotokos and ever-virgin Mary, with all the saints, let us commend ourselves and one another and our whole life to Christ our God.","el":"Τῆς παναγίας, ἀχράντου, ὑπερευλογημένης, ἐνδόξου Δεσποίνης ἡμῶν Θεοτόκου καὶ ἀειπαρθένου Μαρίας μετὰ πάντων τῶν Ἁγίων μνημονεύσαντες, ἑαυτοὺς καὶ ἀλλήλους καὶ πᾶσαν τὴν ζωὴν ἡμῶν Χριστῷ τῷ Θεῷ παραθώμεθα.","cu":"Пресвятую, Пречистую, Преблагословенную, Славную Владычицу нашу Богородицу и Приснодеву Марию, со всеми святыми помянувше, сами себе и друг друга, и весь живот наш Христу Богу предадим.","ro":"Pe Preasfânta, curata, preabinecuvântata, mărita stăpâna noastră, de Dumnezeu Născătoarea și pururea Fecioara Maria, cu toți sfinții să o pomenim, pe noi înșine și unii pe alții și toată viața noastră lui Hristos Dumnezeu să o dăm.","de":"Unserer allheiligen, reinen, hochgesegneten und ruhmreichen Gebieterin, der Gottesgebärerin und immerwährenden Jungfrau Maria, mit allen Heiligen wollen wir gedenken, uns selbst und einander und unser ganzes Leben Christus, unserem Gott, anbefehlen."}},{"r":"choir","t":{"en":"To Thee, O Lord.","el":"Σοί, Κύριε.","cu":"Тебе, Господи.","ro":"Ție, Doamne.","de":"Dir, o Herr."}},{"r":"rubric","x":"The Prayer of the Second Antiphon (said quietly, concluded aloud):","t":{"en":"The Prayer of the Second Antiphon (said quietly, concluded aloud):","el":"Ἡ εὐχὴ τοῦ Β´ ἀντιφώνου (λεγομένη μυστικῶς, καταλήγουσα ἐκφώνως):","cu":"Молитва второго антифона (читается тайно, оканчивается велегласно):","ro":"Rugăciunea Antifonului al doilea (citită în taină, încheiată cu glas tare):","de":"Das Gebet des zweiten Antiphons (still gesprochen, laut beschlossen):"}},{"r":"priest","t":{"el":"Κύριε ὁ Θεὸς ἡμῶν, σῶσον τὸν λαόν σου καὶ εὐλόγησον τὴν κληρονομίαν σου· τὸ πλήρωμα τῆς Ἐκκλησίας σου φύλαξον· ἁγίασον τοὺς ἀγαπῶντας τὴν εὐπρέπειαν τοῦ οἴκου σου· σὺ αὐτοὺς ἀντιδόξασον τῇ θεϊκῇ σου δυνάμει καὶ μὴ ἐγκαταλίπῃς ἡμᾶς τοὺς ἐλπίζοντας ἐπὶ σέ.","ro":"Doamne, Dumnezeul nostru, mântuiește poporul Tău și binecuvântează moștenirea Ta; plinirea Bisericii Tale o păzește, sfințește pe cei ce iubesc podoaba casei Tale, Tu pe aceștia îi prea mărește cu dumnezeiască puterea Ta și nu ne lăsa pe noi, cei ce nădăjduim întru Tine.","en":"O Lord our God, save Thy people and bless Thine inheritance; preserve the fullness of Thy Church; sanctify those who love the beauty of Thy house; glorify them in return by Thy divine power, and forsake not us who hope in Thee.","de":"Herr, unser Gott, errette Dein Volk und segne Dein Erbe; die Fülle Deiner Kirche bewahre; heilige die, welche die Schönheit Deines Hauses lieben; verherrliche sie hinwieder durch Deine göttliche Kraft und verlass uns nicht, die wir auf Dich hoffen.","cu":"Господи Боже наш, спаси люди Твоя и благослови достояние Твое, исполнение Церкве Твоея сохрани, освяти любящыя благолепие дому Твоего: Ты тех воспрослави Божественною Твоею силою, и не остави нас, уповающих на Тя."},"m":"silently"},{"r":"priest","t":{"en":"For Thine is the might, and Thine is the kingdom and the power and the glory: of the Father, and of the Son, and of the Holy Spirit, now and ever and unto ages of ages.","el":"Ὅτι σὸν τὸ κράτος καὶ σοῦ ἐστιν ἡ βασιλεία καὶ ἡ δύναμις καὶ ἡ δόξα, τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ Ἁγίου Πνεύματος, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Яко Твоя держава, и Твое есть Царство, и сила, и слава, Отца и Сына и Святаго Духа, ныне и присно и во веки веков.","ro":"Că a Ta este stăpânirea și a Ta este împărăția și puterea și slava, a Tatălui și a Fiului și a Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Denn Dein ist die Herrschaft, und Dein ist das Königtum und die Macht und die Herrlichkeit, des Vaters und des Sohnes und des Heiligen Geistes, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"rubric","x":"The Second Antiphon is sung. To each verse the people answer:","t":{"en":"The Second Antiphon is sung. To each verse the people answer:","el":"Ψάλλεται τὸ Β´ ἀντίφωνον. Εἰς ἕκαστον στίχον ὁ λαὸς ἀποκρίνεται:","cu":"Поется второй антифон. На каждый стих людие отвещают:","ro":"Se cântă Antifonul al doilea. La fiecare stih, strana răspunde:","de":"Das zweite Antiphon wird gesungen. Auf jeden Vers antwortet das Volk:"}},{"r":"choir","t":{"en":"O Son of God, who didst rise from the dead, save us who sing to Thee: Alleluia.","el":"Σῶσον ἡμᾶς, Υἱὲ Θεοῦ, ὁ ἀναστὰς ἐκ νεκρῶν, ψάλλοντάς σοι· Ἀλληλούϊα.","cu":"Спаси ны, Сыне Божий, воскресый из мертвых, поющия Ти: аллилуйя.","ro":"Mântuiește-ne pe noi, Fiul lui Dumnezeu, Cel ce ai înviat din morți, pe noi cei ce-Ți cântăm Ție: Aliluia.","de":"Rette uns, Sohn Gottes, der Du auferstanden bist von den Toten, die wir Dir singen: Alleluia."}},{"r":"rubric","x":"Then \"Only-begotten Son and Word of God\" is sung. The Prayer of the Third Antiphon (its conclusion is sung at the start of the next section):","t":{"en":"Then \"Only-begotten Son and Word of God\" is sung. The Prayer of the Third Antiphon (its conclusion is sung at the start of the next section):","el":"Ἔπειτα ψάλλεται «Ὁ μονογενὴς Υἱὸς καὶ Λόγος τοῦ Θεοῦ». Ἡ εὐχὴ τοῦ Γ´ ἀντιφώνου (ἡ κατάληξίς της ἐκφωνεῖται εἰς τὴν ἀρχὴν τῆς ἑπομένης ἑνότητος):","cu":"Затем поется «Единородный Сыне и Слове Божий». Молитва третьего антифона (возглас ее произносится в начале следующего раздела):","ro":"Apoi se cântă „Unule-Născut, Fiule și Cuvântul lui Dumnezeu”. Rugăciunea Antifonului al treilea (ecfonisul ei se rostește la începutul părții următoare):","de":"Sodann wird „Einziggeborener Sohn und Wort Gottes” gesungen. Das Gebet des dritten Antiphons (sein Ausruf erfolgt zu Beginn des nächsten Abschnitts):"}},{"r":"priest","t":{"en":"O Thou Who hast given us grace at this time with one accord to make our common supplications unto Thee; and dost promise, that when two or three are gathered together in Thy Name, Thou wilt grant their requests: fulfil now, O Lord, the petitions of Thy servants, as may be most expedient for them; granting us in this world knowledge of Thy Truth, and in the world to come","el":"Ὁ τὰς κοινὰς ταύτας καὶ συμφώνους ἡμῖν χαρισάμενος προσευχάς, ὁ καὶ δυσὶ καὶ τρισὶ συμφωνοῦσιν ἐπὶ τῷ ὀνόματί σου τὰς αἰτήσεις παρέχειν ἐπαγγειλάμενος· Αὐτὸς καὶ νῦν τῶν δούλων σου τὰ αἰτήματα πρὸς τὸ συμφέρον πλήρωσον, χορηγῶν ἡμῖν ἐν τῷ παρόντι αἰῶνι τὴν ἐπίγνωσιν τῆς σῆς ἀληθείας καὶ ἐν τῷ μέλλοντι ζωὴν αἰώνιον χαριζόμενος.","ro":"Cel ce ne-ai dăruit nouă aceste rugăciuni obștești și împreună-glăsuite, Cel ce și la doi și la trei, care se unesc în numele Tău, ai făgăduit să le împlinești cererile, Însuți, și acum, plinește cererile cele de folos ale robilor Tăi dându-ne nouă, în veacul de acum, cunoștința adevărului Tău, și în cel ce va să fie, viață veșnică dăruindu-ne.","de":"Der Du uns diese gemeinsamen und einmütigen Gebete geschenkt hast und verheißen hast, den Bitten zweier oder dreier, die in Deinem Namen übereinkommen, zu gewähren: erfülle auch jetzt die Bitten Deiner Knechte zum Nutzen, schenke uns in dieser Welt die Erkenntnis Deiner Wahrheit und in der zukünftigen das ewige Leben.","cu":"Иже общия сия и согласныя даровавый нам молитвы, Иже и двема или трем, согласующымся о имени Твоем, прошения подати обещавый, Сам и ныне раб Твоих прошения к полезному исполни, подая нам в настоящем веце познание Твоея истины, и в будущем живот вечный даруя."},"m":"silently"}]},"1":{"title":"The Antiphons and the Little Entrance","lines":[{"r":"rubric","x":"The Second Antiphon ends. \"Only-begotten Son,\" which confesses Christ's incarnation, death, and divinity, is sung.","t":{"en":"The Second Antiphon ends. \"Only-begotten Son,\" which confesses Christ's incarnation, death, and divinity, is sung.","el":"Τελειώνει τὸ Β´ ἀντίφωνον. Ψάλλεται ὁ ὕμνος «Ὁ μονογενὴς Υἱός», ὁ ὁποῖος ὁμολογεῖ τὴν ἐνανθρώπησιν, τὸν θάνατον καὶ τὴν θεότητα τοῦ Χριστοῦ.","cu":"Оканчивается второй антифон. Поется песнь «Единородный Сыне», исповедующая воплощение, смерть и Божество Христово.","ro":"Se sfârșește Antifonul al doilea. Se cântă imnul „Unule-Născut”, care mărturisește întruparea, moartea și dumnezeirea lui Hristos.","de":"Das zweite Antiphon endet. Es wird der Hymnus „Einziggeborener Sohn” gesungen, der die Menschwerdung, den Tod und die Gottheit Christi bekennt."}},{"r":"people","t":{"en":"Only-begotten Son and Word of God, who, being immortal, didst deign for our salvation to be incarnate of the holy Theotokos and ever-virgin Mary, and without change becamest man, and wast crucified, O Christ our God, trampling down death by death; who art one of the Holy Trinity, glorified together with the Father and the Holy Spirit: save us.","el":"Ὁ μονογενὴς Υἱὸς καὶ Λόγος τοῦ Θεοῦ, ἀθάνατος ὑπάρχων καὶ καταδεξάμενος διὰ τὴν ἡμετέραν σωτηρίαν σαρκωθῆναι ἐκ τῆς ἁγίας Θεοτόκου καὶ ἀειπαρθένου Μαρίας, ἀτρέπτως ἐνανθρωπήσας, σταυρωθείς τε, Χριστὲ ὁ Θεός, θανάτῳ θάνατον πατήσας, εἷς ὢν τῆς Ἁγίας Τριάδος, συνδοξαζόμενος τῷ Πατρὶ καὶ τῷ Ἁγίῳ Πνεύματι, σῶσον ἡμᾶς.","cu":"Единородный Сыне и Слове Божий, Безсмертен Сый и изволивый спасения нашего ради воплотитися от Святыя Богородицы и Приснодевы Марии, непреложно вочеловечивыйся, распныйся же, Христе Боже, смертию смерть поправый, Един Сый Святыя Троицы, спрославляемый Отцу и Святому Духу, спаси нас.","ro":"Unule-Născut, Fiule și Cuvântul lui Dumnezeu, Cel ce ești fără de moarte și ai primit, pentru mântuirea noastră, a Te întrupa din Sfânta Născătoare de Dumnezeu și pururea Fecioara Maria; Care neschimbat Te-ai întrupat și, răstignindu-Te, Hristoase Dumnezeule, cu moartea pe moarte ai călcat; Unul fiind din Sfânta Treime, împreună-slăvit cu Tatăl și cu Duhul Sfânt, mântuiește-ne pe noi.","de":"Einziggeborener Sohn und Wort Gottes, der Du unsterblich bist und um unsres Heiles willen Fleisch anzunehmen geruht hast von der heiligen Gottesgebärerin und immerwährenden Jungfrau Maria, der Du unverändert Mensch geworden und gekreuzigt worden bist, Christus, unser Gott, der Du durch den Tod den Tod zertreten hast, Einer der Heiligen Dreifaltigkeit, verherrlicht mit dem Vater und dem Heiligen Geiste: rette uns."}},{"r":"rubric","x":"The Little Litany.","t":{"en":"The Little Litany.","el":"Ἡ Μικρὰ Συναπτή.","cu":"Малая ектения.","ro":"Ectenia mică.","de":"Die Kleine Ektenie."}},{"r":"deacon","t":{"en":"Again and again, in peace let us pray to the Lord.","el":"Ἔτι καὶ ἔτι ἐν εἰρήνῃ τοῦ Κυρίου δεηθῶμεν.","cu":"Паки и паки миром Господу помолимся.","ro":"Iară și iară, cu pace, Domnului să ne rugăm.","de":"Wieder und wieder in Frieden lasst uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"Help us, save us, have mercy on us, and keep us, O God, by Thy grace.","el":"Ἀντιλαβοῦ, σῶσον, ἐλέησον καὶ διαφύλαξον ἡμᾶς, ὁ Θεός, τῇ σῇ χάριτι.","cu":"Заступи, спаси, помилуй и сохрани нас, Боже, Твоею благодатию.","ro":"Apără, mântuiește, miluiește și ne păzește pe noi, Dumnezeule, cu harul Tău.","de":"Stehe bei, errette, erbarme Dich und behüte uns, o Gott, durch Deine Gnade."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"Commemorating our most holy, pure, blessed, and glorious Lady, the Theotokos and ever-virgin Mary, with all the saints, let us commend ourselves and one another and our whole life to Christ our God.","el":"Τῆς παναγίας, ἀχράντου, ὑπερευλογημένης, ἐνδόξου Δεσποίνης ἡμῶν Θεοτόκου καὶ ἀειπαρθένου Μαρίας μετὰ πάντων τῶν Ἁγίων μνημονεύσαντες, ἑαυτοὺς καὶ ἀλλήλους καὶ πᾶσαν τὴν ζωὴν ἡμῶν Χριστῷ τῷ Θεῷ παραθώμεθα.","cu":"Пресвятую, Пречистую, Преблагословенную, Славную Владычицу нашу Богородицу и Приснодеву Марию, со всеми святыми помянувше, сами себе и друг друга, и весь живот наш Христу Богу предадим.","ro":"Pe Preasfânta, curata, preabinecuvântata, mărita stăpâna noastră, de Dumnezeu Născătoarea și pururea Fecioara Maria, cu toți sfinții să o pomenim, pe noi înșine și unii pe alții și toată viața noastră lui Hristos Dumnezeu să o dăm.","de":"Unserer allheiligen, allreinen, über alles gesegneten und herrlichen Gebieterin, der Gottesgebärerin und immerwährenden Jungfrau Maria, mit allen Heiligen wollen wir gedenken, uns selbst und einander und unser ganzes Leben Christus, unserem Gott, anbefehlen."}},{"r":"choir","t":{"en":"To Thee, O Lord.","el":"Σοί, Κύριε.","cu":"Тебе, Господи.","ro":"Ție, Doamne.","de":"Dir, o Herr."}},{"r":"rubric","x":"The Prayer of the Third Antiphon is concluded aloud:","t":{"en":"The Prayer of the Third Antiphon is concluded aloud:","el":"Ἡ εὐχὴ τοῦ Γ´ ἀντιφώνου καταλήγει ἐκφώνως:","cu":"Молитва третьего антифона оканчивается велегласно:","ro":"Rugăciunea Antifonului al treilea se încheie cu glas tare:","de":"Das Gebet des dritten Antiphons wird laut beschlossen:"}},{"r":"priest","t":{"en":"For Thou art a good God and the Lover of mankind, and to Thee we ascribe glory: to the Father, and to the Son, and to the Holy Spirit, now and ever and unto ages of ages.","el":"Ὅτι ἀγαθὸς καὶ φιλάνθρωπος Θεὸς ὑπάρχεις, καὶ σοὶ τὴν δόξαν ἀναπέμπομεν, τῷ Πατρὶ καὶ τῷ Υἱῷ καὶ τῷ Ἁγίῳ Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Яко благ и Человеколюбец Бог еси, и Тебе славу возсылаем, Отцу и Сыну и Святому Духу, ныне и присно и во веки веков.","ro":"Că bun și iubitor de oameni Dumnezeu ești și Ție slavă înălțăm, Tatălui și Fiului și Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Denn ein guter und menschenliebender Gott bist Du, und Dir senden wir die Verherrlichung empor, dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"rubric","x":"The Third Antiphon (the Beatitudes, or the festal verses appointed for the day) is sung.","t":{"en":"The Third Antiphon (the Beatitudes, or the festal verses appointed for the day) is sung.","el":"Ψάλλεται τὸ Γ´ ἀντίφωνον (οἱ Μακαρισμοὶ ἢ οἱ ἑόρτιοι στίχοι τῆς ἡμέρας).","cu":"Поется третий антифон (Блаженны или праздничные стихи дня).","ro":"Se cântă Antifonul al treilea (Fericirile sau stihurile praznicale ale zilei).","de":"Das dritte Antiphon (die Seligpreisungen oder die Festverse des Tages) wird gesungen."}},{"r":"rubric","x":"THE LITTLE ENTRANCE. The deacon takes up the holy Gospel and comes with the priest before the holy doors. The priest prays quietly:","t":{"en":"THE LITTLE ENTRANCE. The deacon takes up the holy Gospel and comes with the priest before the holy doors. The priest prays quietly:","el":"Η ΜΙΚΡΑ ΕΙΣΟΔΟΣ. Ὁ διάκονος λαμβάνει τὸ ἅγιον Εὐαγγέλιον καὶ ἔρχεται μετὰ τοῦ ἱερέως πρὸ τῶν ἁγίων θυρῶν. Ὁ ἱερεὺς εὔχεται μυστικῶς:","cu":"МАЛЫЙ ВХОД. Диакон вземлет святое Евангелие и исходит со священником пред святыя двери. Священник молится тайно:","ro":"INTRAREA MICĂ. Diaconul ia sfânta Evanghelie și vine cu preotul înaintea sfintelor uși. Preotul se roagă în taină:","de":"DER KLEINE EINZUG. Der Diakon nimmt das heilige Evangelium und tritt mit dem Priester vor die heiligen Türen. Der Priester betet still:"}},{"r":"priest","t":{"en":"O Master, Lord our God, who hast appointed in heaven the orders and hosts of angels and archangels for the ministry of Thy glory: grant that with our entrance there may be an entrance of holy angels, serving with us and with us glorifying Thy goodness.","el":"Δέσποτα Κύριε, ὁ Θεὸς ἡμῶν, ὁ καταστήσας ἐν οὐρανοῖς τάγματα καὶ στρατιὰς ἀγγέλων καὶ ἀρχαγγέλων εἰς λειτουργίαν τῆς σῆς δόξης, ποίησον σὺν τῇ εἰσόδῳ ἡμῶν εἴσοδον ἁγίων ἀγγέλων γενέσθαι, συλλειτουργούντων ἡμῖν καὶ συνδοξολογούντων τὴν σὴν ἀγαθότητα","ro":"Stăpâne Doamne, Dumnezeul nostru, Cel ce ai așezat în ceruri cetele și oștile înge rilor și ale arhanghelilor spre slujba slavei Tale, fă ca împreună cu intrarea noastră să fie și intrarea sfinților îngeri, care slujesc împreună cu noi și împreună slăvesc bunătatea Ta","de":"Gebieter, Herr, unser Gott, der Du in den Himmeln die Ordnungen und Heere der Engel und Erzengel eingesetzt hast zum Dienst Deiner Herrlichkeit, lass mit unserem Einzug den Einzug heiliger Engel geschehen, die gemeinsam mit uns die Liturgie vollziehen und Deine Güte verherrlichen","cu":"Владыко Господи Боже наш, уставивый на небесех чины и воинства Ангел и Архангел в служение Твоея славы, сотвори со входом нашим входу святых Ангелов быти, сослужащих нам и сославословящих Твою благость."},"m":"silently"},{"r":"deacon","t":{"en":"Bless, master, the holy entrance.","el":"Εὐλόγησον, δέσποτα, τὴν ἁγίαν εἴσοδον.","cu":"Благослови, владыко, святый вход.","ro":"Binecuvântează, stăpâne, sfânta intrare.","de":"Segne, Gebieter, den heiligen Einzug."}},{"r":"priest","t":{"en":"Blessed is the entrance of Thy holy ones, always, now and ever and unto ages of ages.","el":"Εὐλογημένη ἡ εἴσοδος τῶν ἁγίων σου, πάντοτε, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Благословен вход святых Твоих всегда, ныне и присно и во веки веков.","ro":"Binecuvântată este intrarea sfinților Tăi, totdeauna, acum și pururea și în vecii vecilor.","de":"Gesegnet ist der Einzug Deiner Heiligen, allezeit, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"rubric","x":"Lifting the holy Gospel before the people, the deacon proclaims:","t":{"en":"Lifting the holy Gospel before the people, the deacon proclaims:","el":"Ὑψώνων τὸ ἅγιον Εὐαγγέλιον ἐνώπιον τοῦ λαοῦ, ὁ διάκονος ἐκφωνεῖ:","cu":"Возвышая святое Евангелие пред людьми, диакон возглашает:","ro":"Înălțând sfânta Evanghelie înaintea poporului, diaconul rostește:","de":"Das heilige Evangelium vor dem Volk erhebend, ruft der Diakon aus:"}},{"r":"deacon","t":{"en":"Wisdom! Stand upright!","el":"Σοφία. Ὀρθοί.","cu":"Премудрость, прости.","ro":"Înțelepciune, drepți!","de":"Weisheit! Aufrecht!"},"m":"aloud"},{"r":"choir","t":{"en":"O come, let us worship and fall down before Christ. O Son of God, who didst rise from the dead, save us who sing to Thee: Alleluia.","el":"Δεῦτε προσκυνήσωμεν καὶ προσπέσωμεν Χριστῷ. Σῶσον ἡμᾶς, Υἱὲ Θεοῦ, ὁ ἀναστὰς ἐκ νεκρῶν, ψάλλοντάς σοι· Ἀλληλούϊα.","cu":"Приидите, поклонимся и припадем ко Христу. Спаси ны, Сыне Божий, воскресый из мертвых, поющия Ти: аллилуйя.","ro":"Veniți să ne închinăm și să cădem la Hristos. Mântuiește-ne pe noi, Fiul lui Dumnezeu, Cel ce ai înviat din morți, pe noi cei ce-Ți cântăm Ție: Aliluia.","de":"Kommt, lasst uns anbeten und niederfallen vor Christus; rette uns, Sohn Gottes, der Du auferstanden bist von den Toten, die wir Dir singen: Alleluia."}},{"r":"rubric","x":"The troparia and kontakia appointed for the day are sung.","t":{"en":"The troparia and kontakia appointed for the day are sung.","el":"Ψάλλονται τὰ τροπάρια καὶ τὰ κοντάκια τῆς ἡμέρας.","cu":"Поются тропари и кондаки дня.","ro":"Se cântă troparele și condacele rânduite zilei.","de":"Die für den Tag bestimmten Troparien und Kontakien werden gesungen."}},{"r":"rubric","x":"Approaching the holy table, the priest prays quietly the Prayer of the Trisagion:","t":{"en":"Approaching the holy table, the priest prays quietly the Prayer of the Trisagion:","el":"Προσερχόμενος εἰς τὴν ἁγίαν τράπεζαν, ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν εὐχὴν τοῦ Τρισαγίου:","cu":"Приближаясь ко святому престолу, священник тайно читает молитву Трисвятого:","ro":"Apropiindu-se de sfânta masă, preotul citește în taină Rugăciunea Trisaghionului:","de":"Sich dem heiligen Tisch nähernd, betet der Priester still das Gebet des Trishagion:"}},{"r":"priest","t":{"en":"O Holy God, who restest in the holies, who art hymned by the Seraphim with the thrice-holy cry and glorified by the Cherubim and worshipped by every heavenly power; who out of nothing hast brought all things into being; who hast created man after Thine own image and likeness and adorned him with Thine every gift; who givest wisdom and understanding to him that asketh, and overlookest not him that sinneth, but hast appointed repentance unto salvation; who hast vouchsafed us, Thy humble and unworthy servants, to stand even at this hour before the glory of Thy holy altar and to offer Thee due worship and praise: do Thou, O Master, accept even from the mouths of us sinners the thrice-holy hymn, and visit us in Thy goodness.","el":"Ὁ Θεὸς ὁ ἅγιος, ὁ ἐν ἁγίοις ἀναπαυόμενος, ὁ τρισαγίῳ φωνῇ ὑπὸ τῶν Σεραφὶμ ἀνυμνούμενος καὶ ὑπὸ τῶν Χερουβὶμ δοξολογούμενος καὶ ὑπὸ πάσης ἐπουρανίου δυνάμεως προσκυνούμενος· ὁ ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι παραγαγὼν τὰ σύμπαντα· ὁ κτίσας τὸν ἄνθρωπον κατ’ εἰκόνα σὴν καὶ ὁμοίωσιν καὶ παντί σου χαρίσματι κατακοσμήσας· ὁ διδοὺς αἰτοῦντι σοφίαν καὶ σύνεσιν καὶ μὴ παρορῶν ἁμαρτάνοντα, ἀλλὰ θέμενος ἐπὶ σωτηρίᾳ μετάνοιαν· ὁ καταξιώσας ἡμᾶς τοὺς ταπεινοὺς καὶ ἀναξίους δούλους σου καὶ ἐν τῇ ὥρᾳ ταύτῃ στῆναι κατενώπιον τῆς δόξης τοῦ ἁγίου σου θυσιαστηρίου καὶ τὴν ὀφειλομένην σοι προσκύνησιν καὶ δοξολογίαν προσάγειν· Αὐτός, Δέσποτα, πρόσδεξαι καὶ ἐκ στόματος ἡμῶν τῶν ἁμαρτωλῶν τὸν τρισάγιον ὕμνον καὶ ἐπίσκεψαι ἡμᾶς ἐν τῇ χρηστότητί σου. Συγχώρησον ἡμῖν πᾶν πλημμέλημα ἑκούσιόν τε καὶ ἀκούσιον· ἁγίασον ἡμῶν τὰς ψυχὰς καὶ τὰ σώματα· καὶ δὸς ἡμῖν ἐν ὁσιότητι λατρεύειν σοι πάσας τὰς ἡμέρας τῆς ζωῆς ἡμῶν· πρεσβείαις τῆς ἁγίας Θεοτόκου καὶ πάντων τῶν ἁγίων τῶν ἀπ’ αἰῶνός σοι εὐαρεστησάντων.","ro":"Dumnezeule cel sfânt, Care întru sfinți Te odihnești, Cel ce cu glas întreit-sfânt ești lăudat de serafimi și slăvit de heruvimi și de toată puterea cerească închinat; Cel ce dintru neființă întru ființă ai adus toate; Care ai zidit pe om după chipul și asemănarea Ta și cu tot harul Tău l-ai împodobit; Cel ce dai înțelepciune și pricepere celui ce cere, și nu treci cu vederea pe cel ce greșește, ci pui pocăința spre mântuire; Care ne-ai învrednicit pe noi, smeriții și nevrednicii robii Tăi, și în ceasul acesta, a sta înaintea slavei sfântului Tău jertfelnic și a-Ți aduce datorita închinare și preaslăvire: Însuți Stăpâne, primește și din gurile noastre, ale păcătoșilor, întreit-sfânta cântare și ne cercetează pe noi întru bunătatea Ta. Iartă-ne nouă toată greșeala cea de voie și cea fără de voie; sfințește sufletele și trupurile noastre și ne dă nouă să slujim Ție cu cuvioșie în toate zilele vieții noastre. Pentru rugăciunile Preasfintei Născătoarei de Dumnezeu și ale tuturor sfinților ","de":"Gott, du Heiliger, der du in den Heiligen ruhst, der du vom Dreimalheilig-Ruf der Seraphim besungen und von den Cherubim verherrlicht und von jeder himmlischen Macht angebetet wirst; der du aus dem Nichtsein ins Sein das All gebracht hast; der du den Menschen nach deinem Bild und Gleichnis erschaffen und ihn mit jeder deiner Gaben geschmückt hast; der du dem Bittenden Weisheit und Einsicht gibst und den Sündigenden nicht übersiehst, sondern zur Rettung Buße bestimmt hast; der du uns, deinen demütigen und unwürdigen Knechten, gewährt hast, auch in dieser Stunde vor der Herrlichkeit deines heiligen Altars zu stehen: nimm, o Gebieter, auch aus dem Munde von uns Sündern den Dreimalheilig-Hymnus an und suche uns heim in deiner Güte.","cu":"Боже Святый, Иже во святых почиваяй, Иже Трисвятым гласом от Серафимов воспеваемый и от Херувимов славословимый, и от всякия Небесныя Силы покланяемый, Иже от небытия во еже быти приведый всяческая, создавый человека по образу Твоему и по подобию, и всяким Твоим дарованием украсивый, даяй просящему премудрость и разум, и не презираяй согрешающаго, но полагаяй на спасение покаяние, сподобивый нас, смиренных и недостойных раб Твоих, и в час сей стати пред славою святаго Твоего жертвенника, и должное Тебе поклонение и славословие приносити: Сам, Владыко, приими и от уст нас грешных Трисвятую песнь, и посети ны благостию Твоею, прости нам всякое согрешение вольное же и невольное, освяти нашя душы и телеса, и даждь нам в преподобии служити Тебе вся дни живота нашего, молитвами святыя Богородицы и всех святых, от века Тебе благоугодивших."},"m":"silently"},{"r":"deacon","t":{"en":"Let us pray to the Lord.","el":"Τοῦ Κυρίου δεηθῶμεν.","cu":"Господу помолимся.","ro":"Domnului să ne rugăm.","de":"Lasst uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"priest","t":{"en":"For holy art Thou, O our God, and to
