let uiLang=(function(){try{var p=localStorage.getItem("plithos.lang");return (p&&RLEX[p])?p:"en";}catch(e){return "en";}})();
function tr(k){return (RLEX[uiLang]&&RLEX[uiLang][k])||RLEX.en[k]||k;}
/* tr() hands back the key itself when nothing carries it, which is right for
   a label that must show something but useless where the English is already
   to hand. trOr() says plainly whether the table has the word, so a shelf
   still reads in English until its language is written, and reads in the
   language the moment it is. */
function trOr(k,fallback){
  var v=(k&&RLEX[uiLang]&&RLEX[uiLang][k])||(k&&RLEX.en[k]);
  return v||fallback;
}
/* What language the page is in, said out loud. This is the only one of
   the seven that never set it: the document went on declaring English
   while the reader was being shown Georgian or Arabic, which is wrong
   for anything that reads the page rather than looks at it - a screen
   reader choosing a voice, a browser deciding whether to offer a
   translation, the hyphenation. dir goes with it, and follows the
   interface rather than the text on the shelf. */
var UIRTL={ar:1,ur:1,arc:1};
function setDocLang(l){
  var d=document.documentElement;
  d.setAttribute("lang",l||"en");
  d.setAttribute("dir",UIRTL[l]?"rtl":"ltr");
}
function setUiLang(l){ if(RLEX[l]) uiLang=l; try{localStorage.setItem("plithos.lang",l);}catch(e){} setDocLang(uiLang); applyChrome();document.dispatchEvent(new CustomEvent("plithos:lang",{detail:l})); renderSectionSel(); }
function applyChrome(){
  setDocLang(uiLang);   /* also on the first paint, not only on a change */
  var tg=document.querySelector(".brandtagline"); if(tg) tg.textContent=tr("tagline");
  var nav=document.querySelectorAll(".topnav a"); if(nav.length>=3){nav[0].textContent=tr("navCalendar");nav[1].textContent=tr("navSaints");nav[2].textContent=tr("navLibrary");}
  var sh=document.querySelector('#rail .railhead'); if(sh) sh.textContent=tr("section");
  var lh=document.getElementById("langhead"); if(lh) lh.textContent=tr("langfilter");
  if(typeof langSync==="function") langSync();
  renderTally();
}
/* Three numbers, because two of them were being read as one and disagreeing.
   The shelf offers 86 titles; those titles stand on 117 editions, since the
   New Testament is printed here in nineteen languages and the Nisibene Hymns
   in two; and the whole of it comes to 778 units of text. Naming each count
   is the only way the shelf and the line above it agree. */
function renderTally(){
  var tl=document.getElementById("tally"); if(!tl) return;
  var titles=(typeof shelf==="function")?shelf().length:WORKS.length;
  tl.textContent=titles+" "+tr("fTitles")+" · "+WORKS.length+" "+tr("editions")+
                 " · "+UNITS.length.toLocaleString()+" "+tr("units");
}
function langSync(){var f=document.getElementById("langcurflag");if(f)f.innerHTML=langFlag(uiLang);var n=document.getElementById("langcurname");if(n)n.textContent=(UI_AUTO[uiLang]||uiLang);}
function langMenuRender(){var m=document.getElementById("langmenu");if(!m)return;m.innerHTML="";UILANGS.forEach(function(p){var b=document.createElement("button");b.type="button";b.className="langopt";b.setAttribute("role","option");b.dataset.lang=p[0];b.setAttribute("aria-selected",p[0]===uiLang?"true":"false");b.innerHTML=langFlag(p[0])+"<span>"+p[1]+"</span>";m.appendChild(b);});}

/* Keep the menu on the screen. It is positioned against the button,
   and nothing held it inside the window: on the Library at a phone's
   width it opened thirty-eight pixels off the left edge, so every flag
   in it was drawn outside the screen and the reader saw a list of bare
   names. On the calendar at a tablet's width it ran off the right
   instead. Measured after it is shown, and shifted back by however
   much it overhangs. */
function langMenuClamp(){var m=document.getElementById("langmenu");if(!m||m.hidden)return;m.style.transform="";var r=m.getBoundingClientRect(),pad=8,dx=0;if(r.left<pad)dx=pad-r.left;else if(r.right>window.innerWidth-pad)dx=(window.innerWidth-pad)-r.right;if(dx)m.style.transform="translateX("+Math.round(dx)+"px)";}
function langMenuOpen(){langMenuRender();var m=document.getElementById("langmenu");if(m)m.hidden=false;var b=document.getElementById("langbtn");if(b)b.setAttribute("aria-expanded","true");langMenuClamp();}
function langMenuClose(){var m=document.getElementById("langmenu");if(m)m.hidden=true;var b=document.getElementById("langbtn");if(b)b.setAttribute("aria-expanded","false");}
function buildLangSel(){
  var btn=document.getElementById("langbtn");if(!btn)return;
  btn.onclick=function(e){e.stopPropagation();var m=document.getElementById("langmenu");if(m&&m.hidden)langMenuOpen();else langMenuClose();};
  var menu=document.getElementById("langmenu");
  if(menu)menu.addEventListener("click",function(e){var b=e.target.closest(".langopt");if(!b)return;setUiLang(b.dataset.lang);langSync();langMenuClose();renderRail();reopenCurrent();});
  document.addEventListener("click",function(e){if(!e.target.closest("#langpick"))langMenuClose();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")langMenuClose();});
  langSync();
}
function reopenCurrent(){
  if(activeSection==="home"){ renderHome(); return; }
  var s=SECTIONS.find(function(x){return x.id===activeSection;})||SECTIONS[0];
  if(s.kind==="browse"){ renderBrowse(); }
  else if(s.kind==="scripture"){ if(scripLang){ openScripture(scripLang,scripLastNr,null);} else openScriptureDefault(); }
  else if(s.kind==="nt"){ if(current&&byId[current]&&byId[current].source_class==="scripture") openWork(current); else openNTDefault(); }
  else if(current&&byId[current]){ openWork(current); }
  else setSection(activeSection);
}

/* ===== Sections + on-demand Scripture ===== */
const SECTIONS=[
  {id:"browse",   label:"The whole shelf",    kind:"browse"},
  {id:"liturgy",  label:"The Divine Liturgy", kind:"class", cls:"liturgical"},
  {id:"scripture",label:"Old Testament",      kind:"scripture"},
  {id:"nt",       label:"New Testament",      kind:"nt"},
  {id:"fathers",  label:"The Fathers",         kind:"class", cls:"patristic"},
  {id:"councils", label:"Councils & Creeds",   kind:"class", cls:"conciliar"},
  {id:"lives",    label:"Lives & Martyrdoms",  kind:"class", cls:"hagiographic"}
];
let activeSection="liturgy";

function plithosLang(){ try{ return localStorage.getItem("plithos.lang")||null; }catch(e){ return null; } }

function renderSectionSel(){
  const sel=document.getElementById("sectionsel");
  const avail=availSections();
  sel.innerHTML=`<option value="home">${esc(trOr("secHome","Home"))}</option>`+avail.map(s=>`<option value="${s.id}">${esc(tr(SEC_TR[s.id]))}</option>`).join("");
  sel.value=activeSection; sel.onchange=()=>{ if(sel.value==="home") renderHome(); else setSection(sel.value); };
}

function setSection(id){
  const s=SECTIONS.find(x=>x.id===id)||SECTIONS[0]; activeSection=s.id;
  const sel=document.getElementById("sectionsel"); if(sel) sel.value=s.id;
  renderRail();
  renderLangControl();
  if(s.kind==="browse"){ renderBrowse(); }
  else if(s.kind==="scripture"){ openScriptureDefault(); }
  else if(s.kind==="nt"){ openNTDefault(); }
  else if(s.cls==="liturgical"){
    const g=Object.values(LITURGY_GROUPS)[0];
    if(g){ let ll=plithosLang(); if(!ll||g.langs.indexOf(ll)<0) ll=(g.langs.indexOf("en")>=0?"en":g.langs[0]); openWork(g.id+"-"+ll); }
  } else { const w=WORKS.find(w=>w.source_class===s.cls); if(w) openWork(w.work_id); }

}

/* The catalog - its search and its tags - is the Library's own way in, and it
   is on screen whatever the reader is doing: reading a Father, turning the
   Psalms, or standing at the front door. Only the list beneath it changes
   with the section. */
function renderRail(){
  const s=SECTIONS.find(x=>x.id===activeSection)||SECTIONS[0];
  renderFacetRail();
  const cat=document.getElementById("catalog");
  if(s.kind==="browse"){ if(cat) cat.innerHTML=""; return; }
  if(s.kind==="scripture"){ renderScripRail(); return; }
  if(s.kind==="nt"){ renderNTRail(); return; }
  renderCatalogSection(s.cls);
}

function renderCatalogSection(cls){
  const cat=document.getElementById("catalog"); let html="";
  if(cls==="liturgical"){
    const groups=Object.values(LITURGY_GROUPS).filter(G=>G.langs.some(l=>{const w=byId[G.id+"-"+l];return w&&passesWork(w);}));
    groups.forEach(G=>{const rep=G.id+"-"+(G.langs.indexOf("en")>=0?"en":G.langs[0]);html+=`<button class="work" data-id="${esc(rep)}"><div class="wt">${esc(G.title)}</div><div class="wa">${esc(G.author)} · ${G.langs.length} ${esc(tr("langsWord"))}</div></button>`;});
    /* The rites that stand here in one language only, and so are not one of
       the groups read in parallel. */
    WORKS.filter(w=>w.source_class==="liturgical" && !liturgyGroupOf(w.work_id)
                 && passesWork(w))
      .forEach(w=>{html+=`<button class="work" data-id="${esc(w.work_id)}"><div class="wt">${esc(w.title)}</div><div class="wa">${esc(w.author)}</div></button>`;});
  } else {
    const ws=WORKS.filter(w=>w.source_class===cls && passesWork(w));
    ws.forEach(w=>{html+=`<button class="work" data-id="${esc(w.work_id)}"><div class="wt">${esc(w.title)}</div><div class="wa">${esc(w.author)}</div></button>`;});
  }
  cat.innerHTML=html||`<div class="railempty">Nothing here yet.</div>`;
  cat.querySelectorAll(".work").forEach(el=>el.onclick=()=>openWork(el.dataset.id));
}

/* ===== The whole shelf, by author, century, and purpose =====
   The catalog could be read but not sorted through. A reader who wanted
   Chrysostom, or the fourth century, or something written to defend the
   faith, had only the search box, which finds words inside books rather
   than books themselves. Here every title stands at once and can be
   narrowed three ways, and a work whose author is among the saints carries
   a link to his life. */
const facets={topics:new Set(),author:new Set(),century:new Set(),purpose:new Set(),translator:new Set()};
let facetFind="", facetAll={topics:false,author:false,purpose:false,translator:false};
const TOPIC_ORDER=["The Holy Trinity", "Christ, God and man", "The Holy Spirit", "Knowing God", "Creation", "Man, soul and body", "Free will and providence", "Angels and demons", "Deification", "The Church", "Apostolic tradition", "Bishops, priests and deacons", "The Theotokos", "The saints and their relics", "Baptism and chrismation", "The Eucharist", "Repentance and confession", "Marriage and virginity", "The Divine Liturgy", "Prayer", "Fasting", "Icons and images", "Almsgiving and the poor", "The monastic life", "The last things", "The departed", "Martyrdom and persecution", "Reading Scripture", "Christ foretold in the prophets", "The councils and the canons", "Answering heresy", "Answering the pagans"];
const FACET_DIMS=[["topics","fTopic"],["author","fAuthor"],["century","fCentury"],["purpose","fPurpose"],["translator","fTranslator"]];
/* Subject leads the rail. It is the question most readers arrive with, and
   unlike the others it is answered without knowing a name or a date. */
const FACET_SHOWN=8;   /* the long lists open at their commonest values */

/* One card per title. The New Testament stands on the shelf in nineteen
   languages and the Divine Liturgy in five; each of those is one book. */
function shelfKey(w){
  if(w.source_class==="liturgical"){const g=liturgyGroupOf(w.work_id); if(g) return "lit:"+g;}
  if(w.source_class==="scripture") return "nt";
  /* A work in its own language and a work in translation are one book. The
     Didache in Greek is not a second Didache. */
  return "w:"+(w.edition_of||w.work_id);
}
const SHELF_TITLE={nt:"The New Testament"};
const SHELF_DESC={nt:"The New Testament in the languages of the Church."};
function shelf(){
  const seen={},out=[];
  WORKS.forEach(function(w){
    const k=shelfKey(w),e=seen[k];
    if(e){ e.langs.push(w.language); if(w.language==="en"){e.rep=w.work_id;e.w=w;} return; }
    seen[k]={key:k,rep:w.work_id,w:w,langs:[w.language]};
    out.push(seen[k]);
  });
  out.forEach(function(e){
    const lit=e.key.indexOf("lit:")===0?LITURGY_GROUPS[e.key.slice(4)]:null;
    e.title=SHELF_TITLE[e.key]||(lit&&lit.title)||e.w.title;
    e.desc=SHELF_DESC[e.key]||e.w.description||"";
  });
  return out;
}

function centLabel(c){
  c=+c; const s=["th","st","nd","rd"], v=c%100;
  /* The English ordinal is built, then looked up like any other term - the
     centuries are already on the shelf as each work's period, so they are
     written once and the rail and the card agree. */
  var en=c+(s[(v-20)%10]||s[v]||s[0])+" century";
  return trOr("lx:"+en,en);
}
function facetValues(e,dim){
  if(dim==="century") return (e.w.centuries||[]).map(String);
  const v=e.w[dim];
  return Array.isArray(v)?v:[v];   /* a work has one author and many subjects */
}
function facetPass(e){
  for(const p of FACET_DIMS){
    const dim=p[0]; if(!facets[dim].size) continue;
    if(!facetValues(e,dim).some(v=>facets[dim].has(v))) return false;
  }
  if(facetFind && fold(e.title+" "+e.w.author+" "+(e.w.translator||"")+" "+(e.w.source||"")).indexOf(facetFind)<0) return false;
  return true;
}
/* Counts ignore the facet they belong to, so a reader never clicks into an
   empty shelf and never loses sight of what else is available. */
function facetCounts(dim){
  const keep=facets[dim]; facets[dim]=new Set();
  const m={};
  shelf().filter(facetPass).forEach(function(e){
    facetValues(e,dim).forEach(function(v){ if(v) m[v]=(m[v]||0)+1; });
  });
  facets[dim]=keep;
  return m;
}
/* Every chip in the rail comes through here, so this is the one place the
   subjects, the authors and the uses have to be asked for in the reader's
   language. A translator is not asked for: his name is the citation of the
   edition this text was taken from, and an edition is reproduced as it was
   printed, not rendered. */
function facetLabel(dim,v){
  if(dim==="century") return centLabel(v);
  if(dim==="translator") return v;
  return trOr("lx:"+v,v);
}
function facetOrder(dim,m){
  const ks=Object.keys(m);
  if(dim==="century") return ks.sort((a,b)=>a-b);
  /* Subjects keep the order the shelf declares them in, which runs from God
     to the creature to the Church to her mysteries. Sorting them by how many
     books happen to treat each one would read as a ranking of the subjects. */
  if(dim==="topics") return ks.sort((a,b)=>TOPIC_ORDER.indexOf(a)-TOPIC_ORDER.indexOf(b));
  return ks.sort((a,b)=>m[b]-m[a]||facetLabel(dim,a).localeCompare(facetLabel(dim,b)));
}

/* Which headings the reader has opened. The rail is rebuilt whenever the
   shelf moves, so this has to live outside it. */
const facetOpen={};

function renderFacetRail(){
  const cat=document.getElementById("facets");
  let html=`<input id="facetfind" class="findbox" type="search" autocomplete="off" spellcheck="false" aria-label="${esc(tr("catalogPh"))}" placeholder="${esc(tr("catalogPh"))}" value="${esc(facetFind)}">`;
  FACET_DIMS.forEach(function(p){
    const dim=p[0], m=facetCounts(dim);
    let ks=facetOrder(dim,m);
    facets[dim].forEach(function(v){ if(ks.indexOf(v)<0) ks.unshift(v); });
    const more=(dim in facetAll) && !facetAll[dim] && ks.length>FACET_SHOWN;
    const show=more?ks.filter((k,i)=>i<FACET_SHOWN||facets[dim].has(k)):ks;
    /* Five headings with forty chips under them is a wall, not a catalog.
       Each heading is a drawer of its own: shut unless the reader opens it,
       or unless he has already chosen from it, in which case what he chose
       is named on the front and the drawer stands open. */
    const on=facets[dim].size, open=on||facetOpen[dim];
    const chosenNames=[];
    facets[dim].forEach(function(v){ chosenNames.push(facetLabel(dim,v)); });
    html+=`<details class="facet" data-facet="${dim}"${open?" open":""}>`+
      `<summary class="facethd"><span class="facetname">${esc(tr(p[1]))}</span>`+
      (on?`<span class="facetsel">${esc(chosenNames.join(", "))}</span>`
        :`<span class="facetn">${ks.length}</span>`)+
      `<span class="facetcaret" aria-hidden="true">\u25be</span></summary>`+
      (on?`<div class="facetclear"><button type="button" data-clear="${dim}">${esc(tr("fClear"))}</button></div>`:"")+
      `<div class="facetlist">`+
      show.map(v=>`<button class="chip" type="button" data-dim="${dim}" data-v="${esc(v)}" aria-pressed="${facets[dim].has(v)?"true":"false"}">${esc(facetLabel(dim,v))}<b>${m[v]||0}</b></button>`).join("")+
      `</div>`+(more?`<button class="facetmore" type="button" data-all="${dim}">${esc(tr("fMore"))} (${ks.length-show.length})</button>`:"")+`</details>`;
  });
  cat.innerHTML=html;
  const fx=document.getElementById("facetfind");
  fx.oninput=function(){ setCatalogFind(fx.value); };
  cat.querySelectorAll(".chip[data-dim]").forEach(function(el){
    el.onclick=function(){
      const s=facets[el.dataset.dim];
      if(s.has(el.dataset.v)) s.delete(el.dataset.v); else s.add(el.dataset.v);
      showShelf(); renderFacetRail(); renderBrowse();
    };
  });
  cat.querySelectorAll("[data-clear]").forEach(function(el){
    el.onclick=function(){ facets[el.dataset.clear].clear(); showShelf(); renderFacetRail(); renderBrowse(); };
  });
  cat.querySelectorAll("[data-all]").forEach(function(el){
    el.onclick=function(){ facetAll[el.dataset.all]=true; renderFacetRail(); };
  });
  cat.querySelectorAll("details.facet").forEach(function(el){
    el.addEventListener("toggle",function(){ facetOpen[el.dataset.facet]=el.open; });
  });
}
/* The find box re-renders on every keystroke; re-rendering the rail under a
   focused input would take the caret with it, so only the counts refresh. */
function renderBrowseCounts(){
  FACET_DIMS.forEach(function(p){
    const dim=p[0], m=facetCounts(dim);
    document.querySelectorAll('.chip[data-dim="'+dim+'"]').forEach(function(el){
      const b=el.querySelector("b"); if(b) b.textContent=m[el.dataset.v]||0;
    });
  });
}

function activeFacetChips(){
  let out="";
  FACET_DIMS.forEach(function(p){
    facets[p[0]].forEach(function(v){
      out+=`<button class="chip" type="button" aria-pressed="true" data-off="${p[0]}" data-v="${esc(v)}">${esc(facetLabel(p[0],v))} ×</button>`;
    });
  });
  return out;
}
/* The Library has one search of its own, and it is the catalog: the box at
   the top of the catalog panel, which is always on screen. It reads titles,
   authors, translators and editions, and every subject, century and purpose
   the shelf is sorted by. Searching the words inside the books belongs to the
   one search that covers the whole site, not to a second box here. */
/* Send the reader back to the top of what he just asked for. On a wide screen
   the stage scrolls inside the frame; on a phone the whole page scrolls, and
   setting scrollTop on an element that is not a scroller does nothing. */
function toTop(el){
  if(el) el.scrollTop=0;
  if(window.innerWidth<=860) window.scrollTo(0,0);
}

/* Bring the shelf to the front without rebuilding the catalog beside it.
   setSection() would re-render the rail, and re-rendering the rail replaces
   the box being typed into: the reader would lose focus after one letter. */
function showShelf(){
  if(activeSection==="browse") return;
  activeSection="browse";
  var sel=document.getElementById("sectionsel"); if(sel) sel.value="browse";
  var cat=document.getElementById("catalog"); if(cat) cat.innerHTML="";
  try{ renderLangControl(); }catch(e){}
}

/* Typing in the catalog. The chips keep their places and only their counts
   move, so the box under the reader's hands is never taken away. */
function setCatalogFind(v){
  facetFind=fold(String(v||"").trim());
  var el=document.getElementById("facetfind");
  if(el && el.value!==v) el.value=v;
  showShelf();
  renderBrowse(); renderBrowseCounts();
}

/* Every tag on the shelf whose name answers to what was typed. A word like
   "martyr" names a subject before it names a title, and a reader who types it
   into the catalog should be handed the subject itself, not left to notice
   that the rail has one. */
/* How many titles a tag holds, with the typed words set aside. The count has
   to be the one the reader gets after pressing it, and pressing it drops the
   words: counting under the words said "Martyrdom and persecution 1" and then
   opened a shelf of nine. */
function tagTotals(dim){
  const keepFind=facetFind, keep=facets[dim];
  facetFind=""; facets[dim]=new Set();
  const m={};
  shelf().filter(facetPass).forEach(function(e){
    facetValues(e,dim).forEach(function(v){ if(v) m[v]=(m[v]||0)+1; });
  });
  facets[dim]=keep; facetFind=keepFind;
  return m;
}

/* Every tag on the shelf whose name answers to what was typed, kept under the
   heading it belongs to. "The Divine Liturgy" is both a subject and a purpose,
   and listing the two side by side without saying which was which offered the
   same words twice. */
function matchingTags(q){
  const f=fold(q||"");
  if(f.length<2) return [];
  const out=[];
  FACET_DIMS.forEach(function(p){
    const dim=p[0], m=tagTotals(dim), hits=[];
    Object.keys(m).sort(function(a,b){return m[b]-m[a];}).forEach(function(v){
      if(fold(facetLabel(dim,v)).indexOf(f)>=0 || fold(String(v)).indexOf(f)>=0)
        hits.push([dim,v,m[v]]);
    });
    if(hits.length) out.push([tr(p[1]),hits]);
  });
  return out;
}

function renderBrowse(){
  const es_=shelf().filter(facetPass);
  const on=activeFacetChips();
  const tg=facetFind?matchingTags(facetFind):[];
  let html=`<div class="browse"><h1 class="browsehd">${esc(tr("secBrowse"))}</h1>`+
    `<p class="browsesub">${es_.length} ${esc(es_.length===1?tr("fTitle"):tr("fTitles"))}</p>`+
    (on?`<div class="browseon">${on}</div>`:"")+
    (tg.length?`<div class="hitgrp">${esc(tr("fTagsMatching"))}</div>`+
      tg.map(function(g){
        return `<div class="tagrow"><span class="tagdim">${esc(g[0])}</span>`+
          g[1].map(function(t){
            return `<button class="cardtag" type="button" data-cf="1" data-dim="${t[0]}" data-v="${esc(String(t[1]))}">`+
                   `${esc(facetLabel(t[0],t[1]))} <b>${t[2]}</b></button>`;
          }).join("")+`</div>`;
      }).join("")+`<div class="hitgrp">${esc(tr("fTitlesMatching"))}</div>`:"");
  if(!es_.length){
    html+=`<p class="carddesc">${esc(tr("fNone"))}</p>`;
  } else {
    html+=`<div class="cards">`+es_.map(function(e){
      const w=e.w;
          /* A tag on a card is the same tag the rail filters on, so each one
             is a door into the rest of the shelf rather than a label. The
             pair is carried, not the text, so a translated label still
             filters on the value the data holds. */
          const tagpairs=[];
          (w.topics||[]).forEach(function(t){tagpairs.push(["topics",t]);});
          if(w.purpose) tagpairs.push(["purpose",w.purpose]);
          ((w.centuries&&w.centuries.length)?w.centuries:(w.century?[w.century]:[]))
            .forEach(function(c){tagpairs.push(["century",String(c)]);});
          if(e.langs.length>1) tagpairs.push([null,e.langs.length+" "+tr("langsWord")]);
      return `<div class="card"><button class="cardopen" type="button" data-id="${esc(e.rep)}">`+
        `<div class="cardtitle">${esc(e.title)}</div>`+
        `<div class="cardauthor">${esc(w.author)}${w.date?" · "+esc(w.date):""}</div>`+
        (w.translator||w.pub_year?`<div class="cardedition">`+
          [w.translator?esc(tr("mTrans"))+" "+esc(w.translator):"",
           w.pub_year?esc(tr("mPub"))+" "+w.pub_year:""].filter(Boolean).join(" · ")+`</div>`:"")+
        
        (e.desc?`<p class="carddesc">${esc(e.desc)}</p>`:"")+
        (w.caution?`<span class="cardnote">${esc(tr("howReceived"))}</span>`:"")+
        `</button>`+
            `<div class="cardtags">`+tagpairs.map(function(p){
              return p[0]
                ? `<button class="cardtag" type="button" data-dim="${p[0]}" data-v="${esc(p[1])}">${esc(facetLabel(p[0],p[1]))}</button>`
                : `<span class="cardtag">${esc(p[1])}</span>`;
            }).join("")+`</div>`+
        (w.saint?`<a class="cardlife" href="/saints#n=${encodeURIComponent(w.saint)}">${esc(tr("readLife"))}</a>`:"")+
        `</div>`;
    }).join("")+`</div>`;
  }
  const st=document.getElementById("stage");
  st.innerHTML=html+`</div>`;
  toTop(st);
  st.querySelectorAll(".cardopen").forEach(function(el){ el.onclick=function(){ openWork(el.dataset.id); }; });
  st.querySelectorAll(".cardtag[data-dim]").forEach(function(el){
    el.onclick=function(){
      /* A tag offered in answer to typed words replaces those words: the
         reader asked for the subject, not for the subject AND the letters
         he happened to type on the way to it. */
      if(el.dataset.cf) setCatalogFind("");
      FACET_DIMS.forEach(function(p){facets[p[0]].clear();});
      facets[el.dataset.dim].add(el.dataset.v);
      showShelf(); renderFacetRail(); renderBrowse();
    };
  });
  st.querySelectorAll("[data-off]").forEach(function(el){
    el.onclick=function(){ facets[el.dataset.off].delete(el.dataset.v); renderFacetRail(); renderBrowse(); };
  });
}

function openNTDefault(){
  const pl=plithosLang(); let wid="bible-"+((pl&&byId["bible-"+pl])?pl:"en");
  if(!byId[wid]){ const f=WORKS.find(w=>w.source_class==="scripture"); wid=f?f.work_id:null; }
  if(wid) openWork(wid);
}
function renderNTRail(){
  const cat=document.getElementById("catalog");
  const nts=WORKS.filter(w=>w.source_class==="scripture").slice().sort((a,b)=>(LANG_LABEL[a.language]||a.language).localeCompare(LANG_LABEL[b.language]||b.language));
  let html=`<div class="group"><div class="grouphd">${esc(tr("ntGroup"))}<span>${nts.length}</span></div>`+nts.map(w=>`<button class="work scripw${w.work_id===current?' on':''}" data-id="${esc(w.work_id)}" data-l="${esc(w.language)}" aria-current="${w.work_id===current?'true':'false'}"><div class="wt">${esc(LANG_LABEL[w.language]||w.language)}</div><div class="wnative" lang="${esc(w.language)}">${esc(NATIVE_NT[w.language]||"New Testament")}</div></button>`).join("")+`</div>`;
  cat.innerHTML=html;
  cat.querySelectorAll(".work").forEach(el=>el.onclick=()=>{ openWork(el.dataset.id); renderNTRail(); });
}
/* ---- Scripture (fetched on demand) ---- */
let SCRIP=null, SCRIP_CACHE={}, scripLang=null;
const SCRIP_GROUP_LABEL={pentateuch:"The Law",historical:"History",wisdom:"Wisdom",prophets:"Prophets",deuterocanon:"Anagignoskomena (Deuterocanon)"};
const SCRIP_CAVEAT="The Orthodox Old Testament follows the Septuagint, the Greek translation used by the Church and quoted throughout the New Testament. It includes books that other traditions call deuterocanonical or apocryphal, among them Tobit, Judith, Wisdom, Sirach, Baruch, the Letter of Jeremiah, the books of Maccabees, 1 Esdras, Psalm 151, and the Prayer of Manasseh, along with the fuller forms of Daniel and Esther. Its Psalms follow Septuagint numbering. Editions translated from the Hebrew Masoretic text, marked as such below, omit these books or set them apart, and number the Psalms differently, usually off by one through most of the Psalter. Each edition is labeled by its tradition.";

function loadScrip(cb){
  if(SCRIP){ cb(); return; }
  /* index.v2.json, not index.json: /scripture/* is held for a week and
     the name carries no version, so a correction to what the books are
     called reached nobody who had already been here until the week was
     out. A new name has no cached copy and lands at once. index.json is
     still published, because pages held from before this ask for it.
     And r.ok is not enough and never was: the catch-all answers a path
     that does not exist with the whole of the calendar and a 200, which
     is now sixteen megabytes. */
  fetch("scripture/index.v2.json").then(r=>{
      var ct=(r.headers.get("content-type")||"").toLowerCase();
      if(!r.ok || ct.indexOf("json")<0) throw 0;
      return r.json();
    }).then(j=>{ SCRIP=j; cb(); })
   .catch(e=>{ document.getElementById("catalog").innerHTML=`<div class="railempty">Scripture could not be loaded. Ensure the <b>scripture</b> folder is deployed beside this page.</div>`; stage.innerHTML=`<div class="empty"><div class="mk">·</div><p>Scripture is not available offline.</p></div>`; });
}

function scripBookName(lang,nr){ return (SCRIP.names[lang]&&SCRIP.names[lang][String(nr)]) || ((SCRIP.books.find(b=>b.nr===nr)||{}).en) || ("Book "+nr); }
/* The buttons that carry a reader from one book to the next are the
   site speaking, not the edition, so they say what the site is set to
   say. A Georgian reader opening the Brenton Septuagint was given his
   headings in Georgian and every book beside them named in English,
   because the list was labelled in the language of the edition rather
   than the language of the reader. The title of the book he is reading
   still stands in the edition's own language, since there the edition
   is speaking. */
function scripNavName(lang,nr){ var ui=plithosLang();
  return (ui&&SCRIP.names[ui]&&SCRIP.names[ui][String(nr)]) || scripBookName(lang,nr); }

function renderScripRail(){
  const cat=document.getElementById("catalog"); cat.innerHTML=`<div class="railempty">${tr("loading")}</div>`;
  loadScrip(()=>{
    const sep=SCRIP.langs.filter(l=>l.tradition==="septuagint"), mas=SCRIP.langs.filter(l=>l.tradition!=="septuagint");
    function grp(title,arr){ if(!arr.length) return ""; return `<div class="group"><div class="grouphd">${esc(title)}<span>${arr.length}</span></div>`+arr.map(l=>`<button class="work scripw${l.code===scripLang?' on':''}" data-l="${esc(l.code)}" aria-current="${l.code===scripLang?'true':'false'}"><div class="wt">${esc(l.name)}</div><div class="wnative" lang="${esc(l.code)}">${esc(l.autonym)} \u00b7 ${esc(l.edition)}</div></button>`).join("")+`</div>`; }
    cat.innerHTML=grp(tr("tierSept"),sep)+grp(tr("tierMas"),mas);
    cat.querySelectorAll(".scripw").forEach(el=>el.onclick=()=>{ openScripture(el.dataset.l,null,null); });
  });
}

function openScriptureDefault(){
  loadScrip(()=>{
    let lang=scripLang; const pl=plithosLang();
    if(!lang && pl && SCRIP.avail[pl]) lang=pl;
    if(!lang || !SCRIP.avail[lang]) lang=(SCRIP.langs[0]||{}).code;
    openScripture(lang,null,null);
  });
}

function openScripture(lang,nr,chap){
  loadScrip(()=>{
    /* The language a reader reads Scripture in is not the language he reads
       the site in. Calling setUiLang here meant that opening the Greek Bible
       turned a Georgian page Greek and wrote el into plithos.lang, so the
       choice followed him to the calendar and the saints. */
    scripLang=lang;
    if(activeSection==="scripture") renderScripRail();
    const meta=SCRIP.langs.find(l=>l.code===lang)||{}; const avail=SCRIP.avail[lang]||[];
    if(!nr || avail.indexOf(nr)<0) nr=avail[0];
    scripLastNr=nr;
    const key=lang+"/"+nr;
    if(SCRIP_CACHE[key]){ renderScripPage(meta,nr,SCRIP_CACHE[key],chap); return; }
    stage.innerHTML=`<div class="empty"><div class="mk">\u00b7</div><p>${tr("loading")}</p></div>`;
    fetch("scripture/"+lang+"/"+nr+".json").then(r=>{if(!r.ok)throw 0;return r.json();}).then(rec=>{ SCRIP_CACHE[key]=rec; renderScripPage(meta,nr,rec,chap); })
     .catch(e=>{ stage.innerHTML=`<div class="empty"><div class="mk">\u00b7</div><p>${tr("errBook")}</p></div>`; });
  });
}

/* Fetch one book in several languages, then hand them to the caller together.
   A language that does not carry the book is dropped rather than shown empty. */
function loadScripLangs(langs,nr,done){
  const out={}; let left=langs.length;
  if(!left) return done(out);
  langs.forEach(function(l){
    const key=l+"/"+nr;
    if(SCRIP_CACHE[key]){ out[l]=SCRIP_CACHE[key]; if(!--left) done(out); return; }
    fetch("scripture/"+l+"/"+nr+".json").then(function(r){
      const ct=(r.headers.get("content-type")||"").toLowerCase();
      if(!r.ok || ct.indexOf("json")<0) throw 0;      /* the catch-all serves the whole app with a 200 */
      return r.json();
    }).then(function(rec){ SCRIP_CACHE[key]=rec; out[l]=rec; })
      .catch(function(){})
      .then(function(){ if(!--left) done(out); });
  });
}

/* ---------- Holy Scripture, searched on asking ----------

   The search box reaches every word of the Fathers, the Councils and the
   Liturgy, because those are held in the page. Scripture is not: the Old
   Testament alone is four megabytes in English and seven in Greek, and it is
   fetched a book at a time as a reader turns to it. So a search for a verse
   found nothing, and nothing on the page said why.

   It is now offered. A reader who searches sees an invitation to open the
   Scriptures as well; taking it fetches the whole of the Old and New
   Testaments in the language he is reading, once, and every search after
   that includes them. Nothing is fetched until he asks, and while it is
   coming he is told how far along it is.

   There is no index built here. Thirty-one thousand verses are short enough
   to read straight through on every keystroke. */
var SCRIPFT={lang:null,verses:null,busy:false,failed:false,seen:0,total:0};

function scripSearchLang(){
  return scripLang || plithosLang() || "en";
}

/* Whether the language a reader is reading in has Scripture at all. Romanian
   has none yet, and offering to open what is not there would be a lie. */
function scripSearchAvailable(){
  var l=scripSearchLang();
  if(SCRIP && SCRIP.avail && (SCRIP.avail[l]||[]).length) return true;
  return !!byId["bible-"+l];
}

function scripFtReady(){
  return SCRIPFT.verses && SCRIPFT.lang===scripSearchLang();
}

/* One flat list of every verse, each carrying enough to be cited and opened.
   The Old Testament arrives a book at a time; the New comes in one bundle. */
function buildScripFt(onStep,done){
  var lang=scripSearchLang();
  if(SCRIPFT.busy) return;
  SCRIPFT={lang:lang,verses:null,busy:true,failed:false,seen:0,total:0};
  var verses=[];
  loadScrip(function(){
    var nrs=(SCRIP.avail[lang]||[]).slice();
    var hasNT=!!byId["bible-"+lang];
    SCRIPFT.total=nrs.length+(hasNT?1:0);
    onStep();

    function step(){ SCRIPFT.seen++; onStep(); }

    function finish(){
      if(SCRIPFT.lang!==lang) return;          /* the reader changed language */
      SCRIPFT.busy=false;
      SCRIPFT.verses=verses;
      SCRIPFT.failed=!verses.length;
      done();
    }

    var left=SCRIPFT.total;
    if(!left){ SCRIPFT.busy=false; SCRIPFT.failed=true; done(); return; }
    function oneDone(){ step(); if(!--left) finish(); }

    nrs.forEach(function(nr){
      var key=lang+"/"+nr;
      function take(rec){
        var name=scripBookName(lang,nr);
        (rec.c||[]).forEach(function(ch,ci){
          ch.forEach(function(t,vi){
            if(t) verses.push({t:t,f:fold(t),n:name,c:ci+1,v:vi+1,ot:1,nr:nr});
          });
        });
      }
      if(SCRIP_CACHE[key]){ take(SCRIP_CACHE[key]); oneDone(); return; }
      fetch("scripture/"+lang+"/"+nr+".json").then(function(r){
        /* A path that does not exist is answered with the whole calendar. */
        var ct=(r.headers.get("content-type")||"").toLowerCase();
        if(!r.ok || ct.indexOf("json")<0) throw 0;
        return r.json();
      }).then(function(rec){ SCRIP_CACHE[key]=rec; take(rec); })
        .catch(function(){})
        .then(oneDone);
    });

    if(hasNT){
      loadBibleLangs([lang],function(){
        var bd=getBible(lang);
        if(bd) NT_ORDER.forEach(function(bk){
          var chs=bd[bk]; if(!chs) return;
          Object.keys(chs).forEach(function(c){
            var vs=chs[c];
            Object.keys(vs).forEach(function(v){
              /* The bundle is keyed by the English name of the book; the
                 reader is shown the one the reader's own edition prints. */
              if(vs[v]) verses.push({t:vs[v],f:fold(vs[v]),n:ntBookName(lang,bk),b:bk,c:+c,v:+v,ot:0});
            });
          });
        });
        oneDone();
      });
    }
  });
}

/* The same reading of a query as the shelf's own search: bare words, and
   anything in quotation marks kept together. */
function searchScripture(query){
  if(!scripFtReady()) return [];
  var phrases=[...query.matchAll(/"([^"]+)"/g)].map(m=>fold(m[1]).trim()).filter(Boolean);
  var terms=tok(query.replace(/"[^"]*"/g," "));
  if(!terms.length && !phrases.length) return [];
  var out=[], vs=SCRIPFT.verses;
  for(var i=0;i<vs.length;i++){
    var low=vs[i].f, s=0, matched=0, ok=true;
    for(var j=0;j<terms.length;j++){
      var at=low.indexOf(terms[j]);
      if(at<0){ ok=false; break; }
      matched++;
      s+= (at===0 || !/[a-z0-9]/.test(low.charAt(at-1))) ? 2 : 1;
    }
    if(!ok) continue;
    for(var k=0;k<phrases.length;k++){
      if(low.indexOf(phrases[k])<0){ ok=false; break; }
      s+=6; matched++;
    }
    if(!ok || !matched) continue;
    /* A short verse carrying the words says more than a long one that
       happens to contain them. */
    s += 60/(40+vs[i].t.length);
    out.push([s,i]);
  }
  out.sort(function(a,b){ return b[0]-a[0]; });
  return out.slice(0,50).map(function(p){
    var v=vs[p[1]];
    return {v:v,terms:terms,phrases:phrases};
  });
}

function openScripHit(v){
  var lang=SCRIPFT.lang;
  if(v.ot){ openScripture(lang,v.nr,v.c); return; }
  var w=byId["bible-"+lang];
  if(!w) return;
  current=w.work_id;
  renderBible(w,v.b,String(v.c));
}

/* Verse numbering is not the same in every tradition: the Septuagint and the
   Masoretic text divide and number the Psalms differently, and a reader
   setting them side by side is looking at two numberings, not one. Say so
   rather than let the rows imply an agreement that is not there. */
function scripTraditions(langs){
  const t={};
  langs.forEach(function(l){
    const m=SCRIP.langs.find(x=>x.code===l)||{};
    t[m.tradition==="septuagint"?"septuagint":"masoretic"]=true;
  });
  return Object.keys(t);
}

function renderScripAligned(nr,cc,recs,langs){
  const n=langs.length;
  let h=`<div class="scriphd" style="--ncol:${n}"><div class="alh"></div>`;
  langs.forEach(function(l){
    const m=SCRIP.langs.find(x=>x.code===l)||{};
    const rtl=m.dir==="rtl"?' dir="rtl"':"";
    h+=`<div class="alh"${rtl}>${esc(m.autonym||m.name||l)}</div>`;
  });
  h+=`</div>`;
  /* Rows run to the longest chapter of the ones shown, so a verse present in
     one edition and absent from another is visible as an absence. */
  let most=0;
  langs.forEach(function(l){ const c=(recs[l].c[cc-1]||[]); if(c.length>most) most=c.length; });
  for(let v=0; v<most; v++){
    h+=`<div class="bvrow" style="--ncol:${n}"><div class="bvn">${v+1}</div>`;
    langs.forEach(function(l){
      const meta=SCRIP.langs.find(x=>x.code===l)||{};
      const dir=meta.dir==="rtl"?' dir="rtl"':"";
      const t=((recs[l].c[cc-1]||[])[v]||"").trim();
      h+= t ? `<div class="bvcell"${dir} lang="${esc(l)}">${esc(t)}</div>`
            : `<div class="bvcell gap">${esc(tr("noVerse"))}</div>`;
    });
    h+=`</div>`;
  }
  return h;
}

function renderScripPage(meta,nr,rec,chap){
  const lang=meta.code, avail=SCRIP.avail[lang]||[]; const dir=meta.dir==="rtl"?' dir="rtl"':"";
  const byGroup={}; SCRIP.books.forEach(b=>{ if(avail.indexOf(b.nr)<0) return; (byGroup[b.group]=byGroup[b.group]||[]).push(b); });
  let books="";
  SCRIP.groups.forEach(g=>{ const arr=byGroup[g]; if(!arr||!arr.length) return; books+=`<div class="bgrp"><div class="bgrphd">${esc(tr(GRP_TR[g]))}</div><div class="biblebooks">`+arr.map(b=>`<button class="bbook${b.nr===nr?' on':''}" data-b="${b.nr}">${esc(scripNavName(lang,b.nr))}</button>`).join("")+`</div></div>`; });
  const chaps=rec.c.map((_,i)=>i+1); let cc=(chap&&chaps.indexOf(+chap)>=0)?+chap:1; const verses=rec.c[cc-1]||[];
  const tradLabel=meta.tradition==="septuagint"?tr("tradSept"):tr("tradMas");
  const caveat=(meta.tradition!=="septuagint"||meta.note)?`<details class="caveat"><summary>${esc(tr("aboutEd"))} (${esc(tradLabel)})</summary><p>${meta.note?esc(meta.note)+" ":""}${esc(SCRIP_CAVEAT)}</p></details>`:"";
  let html=`<div class="leafwrap"><article class="leaf bible"${dir}><div class="eyebrow">${esc(tr("secOT"))} \u00b7 ${esc(meta.autonym||meta.name)}</div><h1 class="worktitle">${esc(scripBookName(lang,nr))}</h1><div class="byline">${esc(meta.edition)} \u00b7 ${esc(meta.license)} \u00b7 ${esc(tradLabel)}</div>${caveat}<div id="scripcmp" class="litlangs"></div><div class="scripbooks">${books}</div><div class="biblenav"><span class="bcl">${esc(tr("chapter"))}</span> <div class="biblechaps">`+chaps.map(c=>`<button class="bchap${c===cc?' on':''}" data-c="${c}">${c}</button>`).join("")+`</div></div><div id="bibletext" class="bibletext">`;
  verses.forEach((t,i)=>{ if(t) html+=`<p class="bverse"><span class="bvn">${i+1}</span>${esc(t)}</p>`; });
  html+=`</div></article></div>`;
  stage.innerHTML=html; toTop(stage);
  stage.querySelectorAll(".bbook").forEach(el=>el.onclick=()=>openScripture(lang,+el.dataset.b,null));
  stage.querySelectorAll(".bchap").forEach(el=>el.onclick=()=>renderScripPage(meta,nr,rec,+el.dataset.c));
  renderScripCompare(meta,nr,rec,cc);
  /* The catalogue is loaded and the book is open, so the rail can now say
     which languages this is being read in. */
  try{ renderLangControl(); }catch(e){}
}

/* The picker, and the aligned text it produces. The chosen languages are the
   reading language plus whatever else the reader adds, in the order the rail
   lists them, so the columns do not reshuffle between chapters. */
function renderScripCompare(meta,nr,rec,cc){
  const box=document.getElementById("scripcmp"); if(!box) return;
  const avail=SCRIP.langs.map(l=>l.code).filter(l=>(SCRIP.avail[l]||[]).indexOf(nr)>=0);
  const others=avail.filter(l=>l!==meta.code);
  const chosen=SCRIPSEL.filter(l=>others.indexOf(l)>=0);
  const label=chosen.length
    ? chosen.map(l=>LANG_LABEL[l]||l).join(", ")
    : tr("addLang");
  box.innerHTML='<button type="button" class="lcbtn" id="scmpbtn" aria-haspopup="true" aria-expanded="false">'+
    '<span class="lclabel">'+esc(tr("alongside"))+': '+esc(label)+'</span><span class="lccaret">\u25be</span></button>'+
    '<div class="lcmenu" id="scmpmenu" role="menu" hidden>'+
    others.map(function(l){var on=chosen.indexOf(l)>=0;
      return '<button type="button" class="lcopt'+(on?" on":"")+'" data-l="'+esc(l)+'" role="menuitemcheckbox" aria-checked="'+(on?"true":"false")+'"><span class="lcbox">'+(on?"\u2713":"")+'</span>'+esc(LANG_LABEL[l]||l)+'</button>';
    }).join("")+'</div>';
  const btn=box.querySelector("#scmpbtn"), menu=box.querySelector("#scmpmenu");
  btn.onclick=function(e){e.stopPropagation();menu.hidden=!menu.hidden;btn.setAttribute("aria-expanded",menu.hidden?"false":"true");};
  menu.querySelectorAll(".lcopt").forEach(function(op){op.onclick=function(e){e.stopPropagation();
    const l=op.dataset.l, i=SCRIPSEL.indexOf(l);
    if(i>=0) SCRIPSEL.splice(i,1); else SCRIPSEL.push(l);
    try{ localStorage.setItem("plithos.scriplangs", JSON.stringify(SCRIPSEL)); }catch(err){}
    renderScripPage(meta,nr,rec,cc);
  };});

  if(!chosen.length) return;
  /* First the language being read, then the others as they were added. */
  const langs=[meta.code].concat(chosen.filter(l=>l!==meta.code));
  const target=document.getElementById("bibletext");
  target.innerHTML=`<div class="empty"><div class="mk">\u00b7</div><p>${esc(tr("loading"))}</p></div>`;
  loadScripLangs(langs,nr,function(recs){
    const have=langs.filter(l=>recs[l]);
    if(have.length<2){ target.innerHTML=""; renderScripPage(meta,nr,rec,cc); return; }
    const trad=scripTraditions(have);
    target.innerHTML=(trad.length>1?`<div class="tradwarn">${esc(tr("tradMix"))}</div>`:"")+
      renderScripAligned(nr,cc,recs,have);
  });
}

/* ---------- wiring ---------- */

/* ===== languages checklist (Liturgy side-by-side) ===== */
function renderLangControl(){
  var head=document.getElementById("langhead"), box=document.getElementById("langctl");
  if(!box) return;
  /* The liturgy the reader has open, not the first one in the table. Taking
     Object.values(...)[0] meant that adding a language to St Basil's or St
     James threw the reader back to St John Chrysostom, because the language
     was being added to Chrysostom the whole time. */
  var g=(currentLit&&LITURGY_GROUPS[currentLit])?LITURGY_GROUPS[currentLit]:null;
  if(!g && current){ var gid0=liturgyGroupOf(current); if(gid0) g=LITURGY_GROUPS[gid0]; }
  if(!g){ return renderScriptureLangs(head,box) || renderWorkLangs(head,box); }
  var langs=g.langs.slice();
  if(head){head.textContent=tr("languages");head.style.display="";}
  box.style.display="";
  var chosen=(LITSEL[g.id]&&LITSEL[g.id].length)?LITSEL[g.id].slice():[langs.indexOf("en")>=0?"en":langs[0]];
  chosen=langs.filter(function(x){return chosen.indexOf(x)>=0;});
  var summary=chosen.map(function(l){return LANG_LABEL[l]||l;}).join(", ")||"Select";
  var items=langs.map(function(l){var on=chosen.indexOf(l)>=0;return '<button type="button" class="lcopt'+(on?" on":"")+'" data-l="'+esc(l)+'" role="menuitemcheckbox" aria-checked="'+(on?"true":"false")+'"><span class="lcbox">'+(on?"\u2713":"")+'</span>'+esc(LANG_LABEL[l]||l)+'</button>';}).join("");
  box.innerHTML='<button type="button" class="lcbtn" id="lcbtn" aria-haspopup="true" aria-expanded="false"><span class="lclabel">'+esc(summary)+'</span><span class="lccaret">\u25be</span></button><div class="lcmenu" id="lcmenu" role="menu" hidden>'+items+'</div>';
  var btn=box.querySelector("#lcbtn"), menu=box.querySelector("#lcmenu");
  btn.onclick=function(e){e.stopPropagation();menu.hidden=!menu.hidden;btn.setAttribute("aria-expanded",menu.hidden?"false":"true");};
  menu.querySelectorAll(".lcopt").forEach(function(op){op.onclick=function(e){e.stopPropagation();
    var l=op.dataset.l, cur=(LITSEL[g.id]&&LITSEL[g.id].length)?LITSEL[g.id].slice():[langs.indexOf("en")>=0?"en":langs[0]];
    var i=cur.indexOf(l); if(i>=0){ if(cur.length>1) cur.splice(i,1); } else { cur.push(l); }
    cur=langs.filter(function(x){return cur.indexOf(x)>=0;});
    setLiturgyLangs(g.id,cur);
  };});
}
/* Holy Scripture, chosen from the same place as everything else. The first
   language named is the one being read; any after it stand in columns beside
   it, exactly as the Liturgy's do. Choosing here does not touch the language
   the site is written in: a reader may keep his page in Georgian and read the
   Greek Bible, or the other way about.

   Returns true when it has taken the control, so the caller can fall through
   to the ordinary works when Scripture is not what is open. */
function renderScriptureLangs(head,box){
  var sec=SECTIONS.find(function(x){return x.id===activeSection;});
  var isOT=sec&&sec.kind==="scripture", isNT=sec&&sec.kind==="nt";
  if(!isOT && !isNT) return false;
  if(isOT && !SCRIP) return false;

  var langs, chosen, primary;
  if(isOT){
    langs=SCRIP.langs.map(function(l){return l.code;});
    primary=scripLang||langs[0];
    chosen=[primary].concat(SCRIPSEL.filter(function(l){return l!==primary&&langs.indexOf(l)>=0;}));
  } else {
    langs=WORKS.filter(function(w){return w.source_class==="scripture";})
               .map(function(w){return w.language;});
    var w=current&&byId[current];
    primary=(w&&w.source_class==="scripture")?w.language:(langs.indexOf("en")>=0?"en":langs[0]);
    chosen=[primary].concat(NTSEL.filter(function(l){return l!==primary&&langs.indexOf(l)>=0;}));
  }

  if(head){head.textContent=tr("languages");head.style.display="";}
  box.style.display="";
  var name=function(l){return UI_AUTO[l]||LANG_LABEL[l]||l;};
  box.innerHTML='<button type="button" class="lcbtn" id="lcbtn" aria-haspopup="true" aria-expanded="false">'+
    '<span class="lclabel">'+esc(chosen.map(name).join(", "))+'</span><span class="lccaret">\u25be</span></button>'+
    '<div class="lcmenu" id="lcmenu" role="menu" hidden>'+
    langs.map(function(l){var on=chosen.indexOf(l)>=0;
      return '<button type="button" class="lcopt'+(on?" on":"")+'" data-l="'+esc(l)+'" role="menuitemcheckbox" aria-checked="'+(on?"true":"false")+'">'+
             '<span class="lcbox">'+(on?"\u2713":"")+'</span>'+esc(name(l))+'</button>';
    }).join("")+'</div>';
  var btn=box.querySelector("#lcbtn"), menu=box.querySelector("#lcmenu");
  btn.onclick=function(e){e.stopPropagation();menu.hidden=!menu.hidden;
    btn.setAttribute("aria-expanded",menu.hidden?"false":"true");};
  menu.querySelectorAll(".lcopt").forEach(function(op){op.onclick=function(e){e.stopPropagation();
    var l=op.dataset.l, cur=chosen.slice(), i=cur.indexOf(l);
    /* The last one standing cannot be put out: something has to be read. */
    if(i>=0){ if(cur.length>1) cur.splice(i,1); } else { cur.push(l); }
    setScriptureLangs(isOT,cur);
  };});
  return true;
}

function setScriptureLangs(isOT,langs){
  if(isOT){
    scripLang=langs[0];
    SCRIPSEL=langs.slice(1);
    try{ localStorage.setItem("plithos.scriplangs", JSON.stringify(SCRIPSEL)); }catch(e){}
    openScripture(scripLang,scripLastNr,null);
  } else {
    NTSEL=langs.slice(1);
    try{ localStorage.setItem("plithos.ntlangs", JSON.stringify(NTSEL)); }catch(e){}
    var wid="bible-"+langs[0];
    if(byId[wid]) openWork(wid); else renderLangControl();
  }
  renderLangControl();
}

/* Every other thing on the shelf. A work stands here in the languages its
   editions are printed in - one, today, for most of them - and the reader
   chooses among them the same way he chooses among the languages of the
   Liturgy. It is shown even where there is only one to choose, because the
   language a text is being read in is worth saying, and because the ones
   still to come will appear here without anything else changing.

   Scripture and the New Testament keep their own pickers, which choose
   between whole editions of the Bible rather than between printings of one
   work, and are not replaced here. */
function renderWorkLangs(head,box){
  var w=current&&byId[current];
  if(!w || w.source_class==="scripture"){
    if(head)head.style.display="none"; box.style.display="none"; return;
  }
  var eds=editionsOf(w);
  if(!eds.length) eds=[w];
  if(head){head.textContent=tr("languages");head.style.display="";}
  box.style.display="";
  var only=eds.length<2;
  box.innerHTML='<button type="button" class="lcbtn" id="lcbtn"'+
    (only?' disabled aria-disabled="true"':' aria-haspopup="true" aria-expanded="false"')+
    '><span class="lclabel">'+esc(edLabel(w))+'</span>'+
    (only?'':'<span class="lccaret">\u25be</span>')+'</button>'+
    (only?'':'<div class="lcmenu" id="lcmenu" role="menu" hidden>'+
      eds.map(function(x){var on=x.work_id===w.work_id;
        return '<button type="button" class="lcopt'+(on?" on":"")+'" data-w="'+esc(x.work_id)+
               '" role="menuitemradio" aria-checked="'+(on?"true":"false")+'">'+
               '<span class="lcbox">'+(on?"\u2713":"")+'</span>'+esc(edLabel(x))+'</button>';
      }).join("")+'</div>');
  if(only) return;
  var btn=box.querySelector("#lcbtn"), menu=box.querySelector("#lcmenu");
  btn.onclick=function(e){e.stopPropagation();menu.hidden=!menu.hidden;
    btn.setAttribute("aria-expanded",menu.hidden?"false":"true");};
  menu.querySelectorAll(".lcopt").forEach(function(op){op.onclick=function(e){e.stopPropagation();
    var id=op.dataset.w;
    if((byId[id]||{}).lazy) loadLibraryWork(id).then(function(){ openWork(id,null); });
    else openWork(id,null);
  };});
}

function setLiturgyLangs(gid,langs){
  LITSEL[gid]=langs.slice();
  try{ localStorage.setItem("plithos.litlangs", JSON.stringify(langs)); }catch(e){}
  openLiturgy(gid,langs);
  renderLangControl();
}

/* ===== home / collections view ===== */
/* The count under a shelf is a sentence, not a number with a word stuck on
   the end: how a language counts is its own business, so each form is a
   pattern the language writes for itself and %1 is where the number goes.
   English needs a singular and a plural; a language that needs neither, or
   needs more, writes what it needs. */
function cnt(k,fallback,n){return trOr(k,fallback).replace("%1",n);}
function homeCount(s){
  if(s.kind==="browse"){var n=shelf().length;return cnt(n===1?"cntTitle":"cntTitles",n===1?"%1 title":"%1 titles",n);}
  if(s.kind==="nt"){var n=WORKS.filter(function(w){return w.source_class==="scripture";}).length;return cnt("cntLanguages","%1 languages",n);}
  if(s.kind==="scripture") return trOr("cntSeptuagint","Septuagint \u00b7 many languages");
  if(s.cls==="liturgical"){var n=shelf().filter(function(e){return e.w.source_class==="liturgical";}).length;return cnt(n===1?"cntLiturgy":"cntLiturgies",n===1?"%1 liturgy":"%1 liturgies",n);}
  var n=WORKS.filter(function(w){return w.source_class===s.cls;}).length;return cnt(n===1?"cntWork":"cntWorks",n===1?"%1 work":"%1 works",n);
}
var HOME_DESC={
  browse:"Everything on the shelf at once, sorted by the one who wrote it, the century it comes from, and what it was written to do.",
  liturgy:"The Eucharistic service: the Liturgy of St John Chrysostom in parallel languages, and the older rites of Jerusalem and Alexandria.",
  scripture:"The Old Testament in the Septuagint, the Greek text received by the Church.",
  nt:"The New Testament across the languages of the Church.",
  fathers:"The writings of the early Church Fathers.",
  councils:"The creeds and canons of the Ecumenical Councils.",
  lives:"Accounts of the holy martyrs and saints."
};
function availSections(){
  return SECTIONS.filter(function(s){return (s.kind==="scripture"||s.kind==="nt"||s.kind==="browse")?true:(s.cls==="liturgical"?Object.keys(LITURGY_GROUPS).length>0:WORKS.some(function(w){return w.source_class===s.cls;}));});
}
function renderHome(){
  activeSection="home";
  var sel=document.getElementById("sectionsel"); if(sel) sel.value="home";
  var lh=document.getElementById("langhead"), lf=document.getElementById("langfilters"), lc=document.getElementById("langctl");
  if(lh)lh.style.display="none"; if(lf)lf.style.display="none"; if(lc)lc.style.display="none";
  var av=availSections();
  var cat=document.getElementById("catalog");
  renderFacetRail();
  cat.innerHTML='<div class="group">'+av.map(function(s){return '<button class="work" data-sec="'+s.id+'"><div class="wt">'+esc(secLabel(s))+'</div><div class="wa">'+esc(homeCount(s))+'</div></button>';}).join("")+'</div>';
  cat.querySelectorAll(".work").forEach(function(el){el.onclick=function(){setSection(el.dataset.sec);};});
  var tiles=av.map(function(s){return '<button class="tile" data-sec="'+s.id+'"><div class="tilename">'+esc(secLabel(s))+'</div><div class="tiledesc">'+esc(secDesc(s))+'</div><div class="tilemeta">'+esc(homeCount(s))+'</div></button>';}).join("");
  document.getElementById("stage").innerHTML='<div class="home"><h1 class="homehero">Plithos</h1><p class="homesub">'+esc(trOr("homeSub","A library of the Fathers, the Scriptures, the Councils, and the Divine Liturgy of the Orthodox Church. Choose a collection to begin."))+'</p><div class="tiles">'+tiles+'</div></div>';
  document.querySelectorAll(".tile").forEach(function(el){el.onclick=function(){setSection(el.dataset.sec);};});
  document.getElementById("stage").scrollTop=0;
}

renderTally();

/* The words inside the books belong to the one search that covers the site,
   so the Library hands its own full-text search up to it rather than keeping
   a second box for it. The shared palette calls this when it is open on this
   page; from any other page it sends the reader here with #find=, because
   five megabytes of text cannot travel in an index every page loads.

   Nothing is assumed about the caller: it gets plain records, and asks to
   open one by its work and unit. */
window.PLITHOS_BOOKS = {
  search: function(query){
    try{
      ensureCoreTexts();
      return search(query).slice(0,8).map(function(r){
        return { work: r.u.work_id, unit: r.u.unit_id,
                 name: r.u.citation_anchor, where: r.u.work_title,
                 author: r.u.author };
      });
    }catch(e){ return []; }
  },
  open: function(workId, unitId){ try{ openWork(workId, unitId); }catch(e){} },
  /* Everything the reader typed, shown whole with its passages, which is
     more than a palette row can hold. */
  showAll: function(query){
    try{ ensureCoreTexts(); renderResults(query, search(query)); }catch(e){}
  }
};

try{var _pl=JSON.parse(localStorage.getItem("plithos.litlangs")||"null");if(_pl&&_pl.length){var _g=Object.values(LITURGY_GROUPS)[0];if(_g)LITSEL[_g.id]=_pl.filter(function(l){return _g.langs.indexOf(l)>=0;});}}catch(e){}
document.addEventListener("click",function(e){var m=document.getElementById("lcmenu");if(m&&!m.hidden&&!e.target.closest("#langctl"))m.hidden=true;});
buildLangSel(); applyChrome(); renderSectionSel();
(function(){var bl=document.querySelector(".brand");if(bl){bl.setAttribute("role","button");bl.onclick=function(){renderHome();};}})();
renderHome();

/* URL state.
   Works and books of scripture now live in the address bar, so they can be
   linked, bookmarked, and walked with the back button. The open functions
   are wrapped rather than edited, so the original logic is untouched.

   `booted` matters: loadLibraryIndex() re-renders the home screen when the
   catalog arrives, and renderHome clears the hash. Without the guard that
   would wipe an incoming #work= link before routeHash ever read it. */
(function(){
  var lock=false, booted=false, bootHash=location.hash||"";

  function setHash(h){
    if(lock||!booted)return;
    if(location.hash.replace(/^#/,"")===h)return;
    lock=true;
    try{
      if(h)history.pushState(null,"","#"+h);
      else history.pushState(null,"",location.pathname+location.search);
    }catch(e){ location.hash=h; }
    lock=false;
  }

  function routeHash(){
    var h=(booted?location.hash:bootHash)||"",m;
    if((m=/[#&]work=([A-Za-z0-9._-]+)/.exec(h))){
      try{ openWork(m[1]); }catch(e){}
      return;
    }
    /* #find=<words> arrives from the one search on another page, which
       cannot carry five megabytes of text with it. */
    if((m=/[#&]find=([^&]+)/.exec(h))){
      try{ var fq=decodeURIComponent(m[1]);
        if(fq){ ensureCoreTexts(); renderResults(fq, search(fq)); return; } }catch(e){}
    }
    if(/[#&]browse\b/.test(h)){
      /* #browse=<dimension>:<value> arrives from the search box on any
         page. The value is a tag on the shelf; open the shelf with it
         already applied, so the reader lands on the answer rather than
         on the catalog. */
      var bm=/[#&]browse=([^&]+)/.exec(h);
      if(bm){ try{
        var pair=decodeURIComponent(bm[1]), c=pair.indexOf(":");
        var dim=pair.slice(0,c), val=pair.slice(c+1);
        if(facets[dim]){ FACET_DIMS.forEach(function(p){facets[p[0]].clear();});
          facets[dim].add(val); }
      }catch(e){} }
      try{ setSection("browse"); }catch(e){}
      return;
    }
    if((m=/[#&]book=(\d+)/.exec(h))){
      var nr=+m[1];
      try{
        loadScrip(function(){
          var avail=SCRIP.avail||{};
          var L=(avail[scripLang]&&avail[scripLang].indexOf(nr)>=0)
                ? scripLang
                : (Object.keys(avail).filter(function(c){return avail[c].indexOf(nr)>=0;})[0]||"en");
          openScripture(L,nr,null);
        });
      }catch(e){}
      return;
    }
    if(booted){ try{ renderHome(); }catch(e){} }
  }

  var _openWork=openWork, _openScripture=openScripture, _renderHome=renderHome;
  openWork=function(id,unitId){
    _openWork(id,unitId);
    var w=byId[id];
    if(w&&!w.lazy)setHash("work="+id);
  };
  openScripture=function(l,nr,ch){
    _openScripture(l,nr,ch);
    if(typeof scripLastNr!=="undefined"&&scripLastNr)setHash("book="+scripLastNr);
  };
  renderHome=function(){ _renderHome(); setHash(""); };

  loadLibraryIndex().then(function(){
    routeHash();
    booted=true;
  });
  window.addEventListener("popstate",routeHash);
  window.addEventListener("hashchange",routeHash);
})();
</script>
