ртных Таинств. Исправи наш путь, утверди ны во страсе Твоем вся, соблюди наш живот, утверди наша стопы, молитвами и моленьми славныя Богородицы и Приснодевы Марии и всех святых Твоих.","ro":"Mulțumim Ție, Stăpâne, Iubitorule de oameni, Binefăcătorul sufletelor noastre, că și în ziua de acum ne-ai învrednicit pe noi de cerești și nemuritoarele Tale Taine. Îndreptează calea noastră, întărește-ne pe noi întru frica Ta pe toți, păzește viața noastră, întărește pașii noștri, pentru rugăciunile și mijlocirile slăvitei Născătoare de Dumnezeu și pururea Fecioarei Maria și ale tuturor sfinților Tăi.","de":"Wir danken Dir, menschenliebender Gebieter, Wohltäter unserer Seelen, dass Du uns auch am heutigen Tage Deiner himmlischen und unsterblichen Mysterien gewürdigt hast. Leite gerade unseren Weg, festige uns alle in Deiner Furcht, behüte unser Leben, mache sicher unsere Schritte, auf die Gebete und Fürbitten der glorreichen Gottesgebärerin und immerwährenden Jungfrau Maria und aller Deiner Heiligen."},"m":"silently"},{"r":"deacon","t":{"en":"Stand upright. Having partaken of the divine, holy, most pure, immortal, heavenly, life-giving, and dread Mysteries of Christ, let us worthily give thanks to the Lord.","el":"Ὀρθοί. Μεταλαβόντες τῶν θείων, ἁγίων, ἀχράντων, ἀθανάτων, ἐπουρανίων καὶ ζωοποιῶν, φρικτῶν τοῦ Χριστοῦ μυστηρίων, ἀξίως εὐχαριστήσωμεν τῷ Κυρίῳ.","cu":"Прости, приимше Божественных, Святых, Пречистых, Безсмертных, Небесных и Животворящих, Страшных Христовых Таин, достойно благодарим Господа.","ro":"Drepți! Primind dumnezeieștile, sfintele, preacuratele, nemuritoarele, cereștile și de viață făcătoarele, înfricoșătoarele lui Hristos Taine, cu vrednicie să mulțumim Domnului.","de":"Aufrecht! Da wir der göttlichen, heiligen, makellosen, unsterblichen, himmlischen und lebenschaffenden, furchtbaren Mysterien Christi teilhaftig geworden sind, lasset uns würdig danken dem Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"Help us, save us, have mercy on us, and keep us, O God, by Thy grace.","el":"Ἀντιλαβοῦ, σῶσον, ἐλέησον καὶ διαφύλαξον ἡμᾶς, ὁ Θεός, τῇ σῇ χάριτι.","cu":"Заступи, спаси, помилуй и сохрани нас, Боже, Твоею благодатию.","ro":"Apără, mântuiește, miluiește și ne păzește pe noi, Dumnezeule, cu harul Tău.","de":"Stehe bei, errette, erbarme Dich und behüte uns, o Gott, durch Deine Gnade."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"Having asked that the whole day may be perfect, holy, peaceful, and sinless, let us commend ourselves and one another and our whole life to Christ our God.","el":"Τὴν ἡμέραν πᾶσαν τελείαν, ἁγίαν, εἰρηνικὴν καὶ ἀναμάρτητον αἰτησάμενοι, ἑαυτοὺς καὶ ἀλλήλους καὶ πᾶσαν τὴν ζωὴν ἡμῶν Χριστῷ τῷ Θεῷ παραθώμεθα.","cu":"День весь совершен, свят, мирен и безгрешен испросивше, сами себе и друг друга, и весь живот наш Христу Богу предадим.","ro":"Ziua toată desăvârșită, sfântă, în pace și fără de păcat cerând, pe noi înșine și unii pe alții și toată viața noastră lui Hristos Dumnezeu să o dăm.","de":"Da wir erbeten haben, dass der ganze Tag vollkommen, heilig, friedlich und ohne Sünde sei, lasset uns uns selbst und einander und unser ganzes Leben Christus, unserem Gott, anbefehlen."}},{"r":"choir","t":{"en":"To Thee, O Lord.","el":"Σοί, Κύριε.","cu":"Тебе, Господи.","ro":"Ție, Doamne.","de":"Dir, o Herr."}},{"r":"priest","t":{"en":"For Thou art our sanctification, and to Thee we ascribe glory, to the Father, and to the Son, and to the Holy Spirit, now and ever and unto ages of ages.","el":"Ὅτι σὺ εἶ ὁ ἁγιασμὸς ἡμῶν, καὶ σοὶ τὴν δόξαν ἀναπέμπομεν, τῷ Πατρὶ καὶ τῷ Υἱῷ καὶ τῷ Ἁγίῳ Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Яко Ты еси освящение наше, и Тебе славу возсылаем, Отцу и Сыну и Святому Духу, ныне и присно и во веки веков.","ro":"Că Tu ești sfințirea noastră și Ție slavă înălțăm, Tatălui și Fiului și Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Denn Du bist unsere Heiligung, und Dir senden wir die Verherrlichung empor, dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"rubric","x":"THE DISMISSAL BEGINS.","t":{"en":"THE DISMISSAL BEGINS.","el":"ΑΡΧΕΤΑΙ Η ΑΠΟΛΥΣΙΣ.","cu":"НАЧИНАЕТСЯ ОТПУСТ.","ro":"ÎNCEPE OTPUSTUL.","de":"DIE ENTLASSUNG BEGINNT."}},{"r":"priest","t":{"en":"Let us depart in peace.","el":"Ἐν εἰρήνῃ προέλθωμεν.","cu":"С миром изыдем.","ro":"Cu pace să ieșim.","de":"Lasset uns in Frieden hinausgehen."}},{"r":"deacon","t":{"en":"Let us pray to the Lord.","el":"Τοῦ Κυρίου δεηθῶμεν.","cu":"Господу помолимся.","ro":"Domnului să ne rugăm.","de":"Lasset uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"rubric","x":"Coming out before the holy doors and standing among the people, the priest reads aloud the Prayer behind the Ambo:","t":{"en":"Coming out before the holy doors and standing among the people, the priest reads aloud the Prayer behind the Ambo:","el":"Ἐξερχόμενος πρὸ τῶν ἁγίων θυρῶν καὶ ἱστάμενος ἐν μέσῳ τοῦ λαοῦ, ὁ ἱερεὺς ἀναγινώσκει ἐκφώνως τὴν ὀπισθάμβωνον εὐχήν:","cu":"Исходя пред святыя двери и стоя посреде людей, священник чтет велегласно заамвонную молитву:","ro":"Ieșind înaintea sfintelor uși și stând în mijlocul poporului, preotul citește cu glas tare Rugăciunea Amvonului:","de":"Vor die heiligen Türen heraustretend und inmitten des Volkes stehend, liest der Priester laut das Ambogebet:"}},{"r":"priest","t":{"en":"O Lord, who blessest those who bless Thee and sanctifiest those who put their trust in Thee: save Thy people and bless Thine inheritance; preserve the fullness of Thy Church; sanctify those who love the beauty of Thy house; glorify them in return by Thy divine power, and forsake not us who hope in Thee. Give peace to Thy world, to Thy churches, to the clergy, to the civil authorities, and to all Thy people. For every good gift and every perfect gift is from above, coming down from Thee, the Father of lights; and to Thee we ascribe glory and thanksgiving and worship, to the Father, and to the Son, and to the Holy Spirit, now and ever and unto ages of ages.","el":"Ὁ εὐλογῶν τοὺς εὐλογοῦντάς σε, Κύριε, καὶ ἁγιάζων τοὺς ἐπὶ σοὶ πεποιθότας, σῶσον τὸν λαόν σου καὶ εὐλόγησον τὴν κληρονομίαν σου· τὸ πλήρωμα τῆς Ἐκκλησίας σου φύλαξον· ἁγίασον τοὺς ἀγαπῶντας τὴν εὐπρέπειαν τοῦ οἴκου σου· σὺ αὐτοὺς ἀντιδόξασον τῇ θεϊκῇ σου δυνάμει καὶ μὴ ἐγκαταλίπῃς ἡμᾶς τοὺς ἐλπίζοντας ἐπὶ σέ. Εἰρήνην τῷ κόσμῳ σου δώρησαι, ταῖς Ἐκκλησίαις σου, τοῖς ἱερεῦσι, καὶ παντὶ τῷ λαῷ σου. Ὅτι πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστι, καταβαῖνον ἐκ σοῦ τοῦ Πατρὸς τῶν φώτων· καὶ σοὶ τὴν δόξαν καὶ εὐχαριστίαν καὶ προσκύνησιν ἀναπέμπομεν, τῷ Πατρὶ καὶ τῷ Υἱῷ καὶ τῷ Ἁγίῳ Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Благословляяй благословящыя Тя, Господи, и освящаяй на Тя уповающыя, спаси люди Твоя и благослови достояние Твое, исполнение Церкве Твоея сохрани, освяти любящыя благолепие дому Твоего: Ты тех воспрослави Божественною Твоею силою, и не остави нас, уповающих на Тя. Мир мирови Твоему даруй, церквам Твоим, священником, и всем людем Твоим. Яко всякое даяние благо и всяк дар совершен свыше есть, сходяй от Тебе Отца Светов: и Тебе славу и благодарение и поклонение возсылаем, Отцу и Сыну и Святому Духу, ныне и присно и во веки веков.","ro":"Cel ce binecuvântezi pe cei ce Te binecuvântează, Doamne, și sfințești pe cei ce nădăjduiesc întru Tine, mântuiește poporul Tău și binecuvântează moștenirea Ta; plinirea Bisericii Tale o păzește; sfințește pe cei ce iubesc podoaba casei Tale; Tu pe aceștia îi preaslăvește cu dumnezeiasca Ta putere și nu ne lăsa pe noi cei ce nădăjduim întru Tine. Pace lumii Tale dăruiește, Bisericilor Tale, preoților, și la tot poporul Tău. Că toată darea cea bună și tot darul cel desăvârșit de sus este, pogorând de la Tine, Părintele luminilor, și Ție slavă și mulțumire și închinăciune înălțăm, Tatălui și Fiului și Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Der Du die segnest, die Dich segnen, o Herr, und die heiligst, die auf Dich vertrauen: errette Dein Volk und segne Dein Erbe; bewahre die Fülle Deiner Kirche; heilige die, welche die Schönheit Deines Hauses lieben; verherrliche sie hinwieder durch Deine göttliche Kraft und verlass uns nicht, die wir auf Dich hoffen. Schenke Frieden Deiner Welt, Deinen Kirchen, den Priestern, den staatlichen Obrigkeiten und Deinem ganzen Volke. Denn jede gute Gabe und jedes vollkommene Geschenk kommt von oben herab von Dir, dem Vater der Lichter; und Dir senden wir Verherrlichung und Dank und Anbetung empor, dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}}]},"10":{"title":"The Thanksgiving and Dismissal","lines":[{"r":"rubric","x":"THE THANKSGIVING AND DISMISSAL. As the Gifts are consumed, the people sing the psalm of blessing (three times):","t":{"en":"THE THANKSGIVING AND DISMISSAL. As the Gifts are consumed, the people sing the psalm of blessing (three times):","el":"Η ΕΥΧΑΡΙΣΤΙΑ ΚΑΙ Η ΑΠΟΛΥΣΙΣ. Ἐνῷ καταλύονται τὰ Δῶρα, ὁ λαὸς ψάλλει τὸν ψαλμὸν τῆς εὐλογίας (τρίς):","cu":"БЛАГОДАРЕНИЕ И ОТПУСТ. Во время потребления Даров людие поют псалом благословения (трижды):","ro":"MULȚUMIREA ȘI OTPUSTUL. În timp ce se consumă Darurile, strana cântă psalmul binecuvântării (de trei ori):","de":"DIE DANKSAGUNG UND ENTLASSUNG. Während die Gaben verzehrt werden, singt das Volk den Segenspsalm (dreimal):"}},{"r":"choir","t":{"en":"Blessed be the name of the Lord, from this time forth and for evermore.","el":"Εἴη τὸ ὄνομα Κυρίου εὐλογημένον ἀπὸ τοῦ νῦν καὶ ἕως τοῦ αἰῶνος.","cu":"Буди имя Господне благословено отныне и до века.","ro":"Fie numele Domnului binecuvântat de acum și până în veac.","de":"Der Name des Herrn sei gepriesen von nun an bis in Ewigkeit."}},{"r":"rubric","x":"The priest says quietly the prayer at the consuming of the holy Gifts:","t":{"en":"The priest says quietly the prayer at the consuming of the holy Gifts:","el":"Ὁ ἱερεὺς λέγει μυστικῶς τὴν εὐχὴν κατὰ τὴν κατάλυσιν τῶν ἁγίων Δώρων:","cu":"Священник глаголет тайно молитву при потреблении святых Даров:","ro":"Preotul zice în taină rugăciunea la consumarea sfintelor Daruri:","de":"Der Priester spricht still das Gebet beim Verzehren der heiligen Gaben:"}},{"r":"priest","t":{"en":"O Christ our God, who art Thyself the fulfilment of the law and the prophets, and hast fulfilled all the dispensation of the Father: fill our hearts with joy and gladness always, now and ever and unto ages of ages. Amen.","el":"Τὸ πλήρωμα τοῦ νόμου καὶ τῶν προφητῶν αὐτὸς ὑπάρχων, Χριστὲ ὁ Θεὸς ἡμῶν, ὁ πληρώσας πᾶσαν τὴν πατρικὴν οἰκονομίαν, πλήρωσον χαρᾶς καὶ εὐφροσύνης τὰς καρδίας ἡμῶν, πάντοτε, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν.","cu":"Исполнение закона и пророков Сам сый, Христе Боже наш, исполнивый все отеческое смотрение, исполни радости и веселия сердца наша, всегда, ныне и присно и во веки веков. Аминь.","ro":"Plinirea Legii și a Proorocilor Tu însuți fiind, Hristoase Dumnezeul nostru, Cel ce ai plinit toată rânduiala părintească, umple de bucurie și de veselie inimile noastre, totdeauna, acum și pururea și în vecii vecilor. Amin.","de":"Der Du selbst die Erfüllung des Gesetzes und der Propheten bist, Christus, unser Gott, der Du den ganzen Heilsplan des Vaters erfüllt hast: erfülle mit Freude und Frohsinn unsere Herzen, allezeit, jetzt und immerdar und in die Ewigkeit der Ewigkeit. Amen."},"m":"silently"},{"r":"deacon","t":{"en":"Let us pray to the Lord.","el":"Τοῦ Κυρίου δεηθῶμεν.","cu":"Господу помолимся.","ro":"Domnului să ne rugăm.","de":"Lasset uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"priest","t":{"en":"The blessing of the Lord and His mercy come upon you, through His divine grace and love for mankind, always, now and ever and unto ages of ages.","el":"Εὐλογία Κυρίου καὶ ἔλεος αὐτοῦ ἔλθοι ἐφ’ ὑμᾶς, τῇ αὐτοῦ θείᾳ χάριτι καὶ φιλανθρωπίᾳ, πάντοτε, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Благословение Господне на вас, Того благодатию и человеколюбием, всегда, ныне и присно и во веки веков.","ro":"Binecuvântarea Domnului și mila Lui să vină peste voi, cu al Său dar și cu a Sa iubire de oameni, totdeauna, acum și pururea și în vecii vecilor.","de":"Der Segen des Herrn und Sein Erbarmen komme über euch, durch Seine göttliche Gnade und Menschenliebe, allezeit, jetzt und immerdar und in die Ewigkeit der Ewigkeit."}},{"r":"priest","t":{"en":"Glory to Thee, O Christ God, our hope, glory to Thee.","el":"Δόξα σοι, Χριστὲ ὁ Θεός, ἡ ἐλπὶς ἡμῶν, δόξα σοι.","cu":"Слава Тебе, Христе Боже, упование наше, слава Тебе.","ro":"Slavă Ție, Hristoase Dumnezeule, nădejdea noastră, slavă Ție.","de":"Ehre sei Dir, Christus, Gott, unsere Hoffnung, Ehre sei Dir."}},{"r":"reader","t":{"en":"Glory to the Father, and to the Son, and to the Holy Spirit, now and ever and unto ages of ages. Amen. Lord, have mercy. (Thrice.) Holy father, give the blessing.","el":"Δόξα Πατρὶ καὶ Υἱῷ καὶ Ἁγίῳ Πνεύματι, καὶ νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν. Κύριε, ἐλέησον (τρίς). Πάτερ ἅγιε, εὐλόγησον.","cu":"Слава Отцу и Сыну и Святому Духу, и ныне и присно и во веки веков. Аминь. Господи, помилуй (трижды). Честнейший отче, благослови.","ro":"Slavă Tatălui și Fiului și Sfântului Duh, și acum și pururea și în vecii vecilor. Amin. Doamne, miluiește (de trei ori). Părinte, binecuvântează.","de":"Ehre sei dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit. Amen. Herr, erbarme Dich (dreimal). Heiliger Vater, segne."}},{"r":"rubric","x":"THE DISMISSAL. Standing in the holy doors and facing the people, the priest gives the blessing (the patron of the church and the saint of the day are named in their place):","t":{"en":"THE DISMISSAL. Standing in the holy doors and facing the people, the priest gives the blessing (the patron of the church and the saint of the day are named in their place):","el":"Η ΑΠΟΛΥΣΙΣ. Ἱστάμενος εἰς τὰς ἁγίας θύρας καὶ ἐστραμμένος πρὸς τὸν λαόν, ὁ ἱερεὺς δίδει τὴν εὐλογίαν (μνημονεύονται κατὰ τὴν θέσιν των ὁ πολιοῦχος τοῦ ναοῦ καὶ ὁ ἅγιος τῆς ἡμέρας):","cu":"ОТПУСТ. Стоя во святых дверех и обратясь к людям, священник преподает благословение (на своем месте поминаются покровитель храма и святой дня):","ro":"OTPUSTUL. Stând în sfintele uși și cu fața spre popor, preotul dă binecuvântarea (la locul lor se pomenesc ocrotitorul bisericii și sfântul zilei):","de":"DIE ENTLASSUNG. In den heiligen Türen stehend und dem Volk zugewandt, erteilt der Priester den Segen (an ihrer Stelle werden der Patron der Kirche und der Heilige des Tages genannt):"}},{"r":"priest","t":{"en":"May Christ our true God, who rose from the dead, through the intercessions of His most pure Mother; by the power of the precious and life-giving Cross; through the protection of the honourable bodiless powers of heaven; at the supplication of the honourable, glorious prophet, forerunner, and baptist John; of the holy, glorious, and all-praised apostles; of our holy fathers, the great hierarchs and ecumenical teachers; of the holy, glorious, and right-victorious martyrs; of our venerable and God-bearing fathers; of the holy and righteous ancestors of God, Joachim and Anna; of Saint N., whose memory we keep; and of all the saints: have mercy on us and save us, for He is good and loves mankind.","el":"Ὁ ἀναστὰς ἐκ νεκρῶν, Χριστὸς ὁ ἀληθινὸς Θεὸς ἡμῶν, ταῖς πρεσβείαις τῆς παναχράντου καὶ παναμώμου ἁγίας αὐτοῦ Μητρός· δυνάμει τοῦ τιμίου καὶ ζωοποιοῦ Σταυροῦ· προστασίαις τῶν τιμίων ἐπουρανίων Δυνάμεων ἀσωμάτων· ἱκεσίαις τοῦ τιμίου, ἐνδόξου, προφήτου, προδρόμου καὶ βαπτιστοῦ Ἰωάννου· τῶν ἁγίων ἐνδόξων καὶ πανευφήμων Ἀποστόλων· τῶν ἁγίων ἐνδόξων καὶ καλλινίκων μαρτύρων· τῶν ὁσίων καὶ θεοφόρων Πατέρων ἡμῶν· τῶν ἁγίων καὶ δικαίων θεοπατόρων Ἰωακεὶμ καὶ Ἄννης· τοῦ ἁγίου (τοῦ δεῖνος), οὗ καὶ τὴν μνήμην ἐπιτελοῦμεν, καὶ πάντων τῶν Ἁγίων, ἐλεήσαι καὶ σώσαι ἡμᾶς, ὡς ἀγαθὸς καὶ φιλάνθρωπος καὶ ἐλεήμων Θεός.","cu":"Воскресый из мертвых, Христос истинный Бог наш, молитвами Пречистыя Своея Матере, силою Честнаго и Животворящаго Креста, предстательствы честных Небесных Сил безплотных, мольбами честнаго, славнаго пророка, Предтечи и Крестителя Иоанна, святых славных и всехвальных апостол, святых славных и добропобедных мученик, преподобных и богоносных отец наших, святых и праведных богоотец Иоакима и Анны, святаго (имярек), егоже есть память, и всех святых, помилует и спасет нас, яко благ и Человеколюбец.","ro":"Cel ce a înviat din morți, Hristos, adevăratul nostru Dumnezeu, pentru rugăciunile Preacuratei Maicii Sale; cu puterea cinstitei și de viață făcătoarei Cruci; cu folosințele cinstitelor cerești netrupești Puteri; pentru rugăciunile cinstitului, măritului prooroc, Înaintemergătorul și Botezătorul Ioan; ale sfinților, măriților și întru tot lăudaților Apostoli; ale sfinților, măriților și bunilor biruitori Mucenici; ale preacuvioșilor și de Dumnezeu purtătorilor Părinți ai noștri; ale sfinților și drepților dumnezeiești Părinți Ioachim și Ana; ale Sfântului (N), a cărui pomenire o săvârșim, și ale tuturor sfinților, să ne miluiască și să ne mântuiască pe noi, ca un bun și de oameni iubitor.","de":"Der von den Toten Auferstandene, Christus, unser wahrer Gott, möge auf die Fürbitten Seiner allreinen und ganz untadeligen heiligen Mutter; durch die Kraft des kostbaren und lebenschaffenden Kreuzes; durch den Schutz der ehrwürdigen himmlischen unkörperlichen Mächte; auf die Bitten des ehrwürdigen, glorreichen Propheten, Vorläufers und Täufers Johannes; der heiligen, glorreichen und allgepriesenen Apostel; der heiligen, glorreichen und siegreichen Märtyrer; unserer ehrwürdigen und gotttragenden Väter; der heiligen und gerechten Gottesahnen Joachim und Anna; des heiligen N., dessen Gedächtnis wir begehen, und aller Heiligen, sich unser erbarmen und uns erretten, da Er gut und menschenliebend ist."}},{"r":"priest","t":{"en":"Through the prayers of our holy fathers, O Lord Jesus Christ our God, have mercy on us and save us.","el":"Δι’ εὐχῶν τῶν ἁγίων Πατέρων ἡμῶν, Κύριε Ἰησοῦ Χριστὲ ὁ Θεός, ἐλέησον καὶ σῶσον ἡμᾶς.","cu":"Молитвами святых отец наших, Господи Иисусе Христе Боже наш, помилуй нас.","ro":"Pentru rugăciunile sfinților părinților noștri, Doamne Iisuse Hristoase, Dumnezeul nostru, miluiește-ne pe noi.","de":"Auf die Gebete unserer heiligen Väter, Herr Jesus Christus, unser Gott, erbarme Dich unser und errette uns."}},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}}]}}};

/* One reading of a letter, so that a word typed without its accents finds
   the word that carries them, and the Arabic and Greek forms that are
   written differently but read the same fall together. Both the search
   terms and the text they are looked for in pass through this. */
function fold(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[\u064b-\u065f\u0670\u0640]/g,"").replace(/[\u0622\u0623\u0625]/g,"\u0627").replace(/\u0649/g,"\u064a").replace(/\u0629/g,"\u0647").replace(/\u03c2/g,"\u03c3").normalize("NFC");}
function tok(s){const z=fold(s);const runs=z.match(/[0-9a-z\u00c0-\u024f\u0370-\u03ff\u0400-\u04ff\u0530-\u058f\u0590-\u05ff\u0600-\u06ff\u0700-\u074f\u0900-\u097f\u0980-\u09ff\u10a0-\u10ff\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]+/g)||[];const out=[];for(const r of runs){if(/^[\u3040-\u30ff\u3400-\u9fff]+$/.test(r)){if(r.length<2)out.push(r);else for(let i=0;i<r.length-1;i++)out.push(r.slice(i,i+2));}else if(/[\uac00-\ud7af]/.test(r)){out.push(r);}else if(r.length>2){out.push(r);}}return out;}
const df = new Map(); const post = []; let avglen = 0; let N = 0;
function buildIndex(){
  df.clear(); post.length = 0; avglen = 0;
  UNITS.forEach((u,i)=>{
    const tf = new Map(); const ts = tok(u.text);
    ts.forEach(t=>tf.set(t,(tf.get(t)||0)+1));
    avglen += ts.length;
    post.push({tf,len:ts.length});
    new Set(ts).forEach(t=>df.set(t,(df.get(t)||0)+1));
  });
  avglen /= (UNITS.length||1);
  N = UNITS.length;
}
buildIndex();
const idf = t => Math.log(1 + (N - (df.get(t)||0) + 0.5)/((df.get(t)||0)+0.5));

function search(query){
  const phrases = [...query.matchAll(/"([^"]+)"/g)].map(m=>m[1].toLowerCase().trim()).filter(Boolean);
  const rest = query.replace(/"[^"]*"/g," ");
  const terms = tok(rest);
  if(!terms.length && !phrases.length) return [];
  const k1=1.5,b=0.75; const scored=[];
  for(let i=0;i<UNITS.length;i++){
    const u=UNITS[i]; if(!passesFilter(u)) continue;
    const p=post[i]; let s=0,matched=0;
    for(const t of terms){
      const f=p.tf.get(t); if(!f) continue; matched++;
      s += idf(t)*(f*(k1+1))/(f + k1*(1-b+b*p.len/avglen));
    }
    let phraseHit=true;
    if(phrases.length){
      const low=u.text.toLowerCase();
      for(const ph of phrases){ if(low.includes(ph)){ s+=6; matched++; } else { phraseHit=false; } }
    }
    if(matched===0 || (phrases.length && !phraseHit)) continue;
    if(terms.length>1 && matched>=terms.length+phrases.length) s*=1.25;          // all words present
    if(tok(u.citation_anchor+" "+u.work_title).some(t=>terms.includes(t))) s+=1.2; // title/anchor hit
    scored.push([s,i]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  return scored.slice(0,50).map(([s,i])=>({u:UNITS[i],terms,phrases}));
}

const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function snippet(text,terms,phrases){
  const low=text.toLowerCase(); let at=-1;
  for(const ph of phrases){const k=low.indexOf(ph);if(k>=0&&(at<0||k<at))at=k;}
  if(at<0) for(const t of terms){const k=low.indexOf(t);if(k>=0&&(at<0||k<at))at=k;}
  if(at<0) at=0;
  let start=Math.max(0,at-110); let end=Math.min(text.length,at+200);
  if(start>0){const sp=text.indexOf(" ",start);if(sp>=0&&sp<at)start=sp+1;}
  let frag=esc(text.slice(start,end));
  const marks=[...phrases,...terms].filter(Boolean).sort((a,b)=>b.length-a.length);
  for(const m of marks){frag=frag.replace(new RegExp("("+m.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"\u0001$1\u0002");}
  frag=frag.replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");
  return (start>0?"… ":"")+frag+(end<text.length?" …":"");
}

  var pr = fetch("data/library/" + id + ".json")
    .then(function(r){
      /* Same catch-all guard as loadLibraryIndex: a missing work file comes
         back as HTTP 200 with 6.8 MB of index.html. */
      if(!r.ok) return null;
      var ct=(r.headers.get("content-type")||"").toLowerCase();
      if(ct.indexOf("json")<0) return null;
      return r.json();
    })
    .then(function(d){
      if(!d || !d.units || !d.units.length) return;
      d.units.forEach(function(u){ UNITS.push(u); });
      unitsByWork[id] = d.units;
      if(byId[id]) byId[id].lazy = false;
      buildIndex();
      LIBRARY_STATE[id] = "done";
    })
    .catch(function(){ delete LIBRARY_STATE[id]; });
  LIBRARY_STATE[id] = pr;
  return pr;
}

/* The twenty-four works whose text this page used to carry. They are files
   now, like the seventy-three added since, and the page fetches them when a
   search is made rather than sending six megabytes to every reader who never
   makes one. The palette is asked to draw again when they arrive. */
var CORE_WORKS = ["athanasius-contra-gentes", "athanasius-life-of-antony", "athanasius-on-the-incarnation", "athenagoras-plea", "basil-hexaemeron", "basil-on-the-holy-spirit", "chrysostom-on-the-priesthood", "cyril-jerusalem-catechetical-lectures", "epistle-of-barnabas", "epistle-to-diognetus", "fragments-of-papias", "gregory-nazianzen-select-orations", "gregory-nyssa-great-catechism", "ignatius-seven-epistles", "john-damascus-exposition", "justin-first-apology", "justin-second-apology", "martyrdom-of-polycarp", "nicene-constantinopolitan-creed", "polycarp-to-the-philippians", "seven-ecumenical-councils", "tatian-address-greeks", "theophilus-autolycus", "vincent-lerins-commonitory"];
var coreTexts = null;
function ensureCoreTexts(){
  if(coreTexts) return coreTexts;
  coreTexts = Promise.all(CORE_WORKS.map(loadLibraryWork)).then(function(){
    try{
      var pi = document.getElementById("pl-input");
      if(pi && pi.value) pi.dispatchEvent(new Event("input",{bubbles:true}));
      else if(lastQuery) renderResults(lastQuery, search(lastQuery));
    }catch(e){}
  });
  return coreTexts;
}

/* Four different things used to run together in one line, so a reader could
   not tell the date a work was written from the year the edition in hand was
   published, nor the man who wrote it from the man who rendered it. Each is
   named, and a row is simply absent where there is nothing to say: a text in
   its own language has no translator, and that is worth seeing. */
function provenance(w){
  const rows=[];
  if(w.date) rows.push([tr("mWritten"),esc(w.date)]);
  if(w.translator) rows.push([tr("mTrans"),esc(w.translator)]);
  /* Some editions are known by the name of the man who made them. Naming
     Cornilescu twice, once as translator and once as edition, tells the
     reader nothing the line above has not already said. */
  const named=w.translator&&w.source&&w.translator.toLowerCase().indexOf(w.source.toLowerCase())>=0;
  if(w.source&&!named) rows.push([tr("mEdition"),esc(w.source)]);
  const pub=[w.publisher?esc(w.publisher):"",w.pub_year?String(w.pub_year):""].filter(Boolean).join(", ");
  if(pub) rows.push([tr("mPub"),pub]);
  if(w.digitized) rows.push([tr("mDigit"),esc(w.digitized)]);
  rows.push([tr("mRights"),esc(tr("mPD"))]);
  if(w.saint) rows.push([tr("readLife"),
    `<a class="bylife" href="/saints#n=${encodeURIComponent(w.saint)}">${esc(w.saint)}</a>`]);
  return `<dl class="prov">`+rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${r[1]}</dd>`).join("")+`</dl>`;
}

/* Where a work exists in more than one edition here, offer them alongside.
   The Didache in Greek and the Didache in English are the same book with the
   same sixteen chapters, so they align on the chapter and nothing has to be
   guessed. Works whose editions do not divide alike are not offered. */
let EDSEL={};
try{ EDSEL=JSON.parse(localStorage.getItem("plithos.edlangs")||"{}")||{}; }catch(e){ EDSEL={}; }

function renderEditionAligned(eds){
  const n=eds.length, cols=eds.map(w=>unitsByWork[w.work_id]||[]);
  let h=`<div class="scriphd" style="--ncol:${n}"><div class="alh"></div>`;
  eds.forEach(w=>{ h+=`<div class="alh">${esc(edLabel(w))}</div>`; });
  h+=`</div>`;
  const rows=Math.max.apply(null,cols.map(c=>c.length));
  for(let i=0;i<rows;i++){
    h+=`<div class="edrow" style="--ncol:${n}"><div class="bvn">${i+1}</div>`;
    cols.forEach(function(c){
      const u=c[i];
      h+= u ? `<div class="edcell"><div class="anchor">${esc(u.citation_anchor)}</div>`+
              esc(u.text).split(/\n\n+/).map(p=>`<p>${p}</p>`).join("")+`</div>`
            : `<div class="edcell gap">${esc(tr("noVerse"))}</div>`;
    });
    h+=`</div>`;
  }
  return h;
}

function renderEditionCompare(w){
  const box=document.getElementById("edcmp"); if(!box) return;
  const eds=editionsOf(w), others=eds.filter(x=>x.work_id!==w.work_id);
  const base=w.edition_of||w.work_id;
  const chosen=(EDSEL[base]||[]).filter(id=>others.some(x=>x.work_id===id));
  const label=chosen.length
    ? chosen.map(id=>edLabel(byId[id]||{})).join(", ")
    : tr("addLang");
  box.innerHTML='<button type="button" class="lcbtn" id="edcmpbtn" aria-haspopup="true" aria-expanded="false">'+
    '<span class="lclabel">'+esc(tr("alongside"))+': '+esc(label)+'</span><span class="lccaret">\u25be</span></button>'+
    '<div class="lcmenu" id="edcmpmenu" role="menu" hidden>'+
    others.map(function(x){var on=chosen.indexOf(x.work_id)>=0;
      return '<button type="button" class="lcopt'+(on?" on":"")+'" data-w="'+esc(x.work_id)+'" role="menuitemcheckbox" aria-checked="'+(on?"true":"false")+'"><span class="lcbox">'+(on?"\u2713":"")+'</span>'+esc(edLabel(x))+'</button>';
    }).join("")+'</div>';
  const btn=box.querySelector("#edcmpbtn"), menu=box.querySelector("#edcmpmenu");
  btn.onclick=function(e){e.stopPropagation();menu.hidden=!menu.hidden;btn.setAttribute("aria-expanded",menu.hidden?"false":"true");};
  menu.querySelectorAll(".lcopt").forEach(function(op){op.onclick=function(e){e.stopPropagation();
    const id=op.dataset.w, cur=(EDSEL[base]||[]).slice(), i=cur.indexOf(id);
    if(i>=0) cur.splice(i,1); else cur.push(id);
    EDSEL[base]=cur;
    try{ localStorage.setItem("plithos.edlangs", JSON.stringify(EDSEL)); }catch(err){}
    const need=cur.filter(x=>(byId[x]||{}).lazy);
    if(need.length) Promise.all(need.map(loadLibraryWork)).then(()=>openWork(w.work_id,null));
    else openWork(w.work_id,null);
  };});

  if(!chosen.length) return;
  const show=eds.filter(x=>x.work_id===w.work_id||chosen.indexOf(x.work_id)>=0);
  if(show.some(x=>!(unitsByWork[x.work_id]||[]).length)) return;
  document.getElementById("workunits").innerHTML=renderEditionAligned(show);
}

function openWork(workId,unitId){
  const w=byId[workId]; if(!w) return;
  if(w.lazy){ loadLibraryWork(workId).then(function(){ openWork(workId,unitId); }); return; }
  if(w.source_class==="liturgical"){ const g=liturgyGroupOf(workId); if(g){ let si=null; if(unitId){ const arr=(LITURGY_GROUPS[g].byLang[w.language]||[]); si=arr.findIndex(u=>u.unit_id===unitId); if(si<0) si=null; } openLiturgy(g, LITSEL[g]||[w.language], si); return; } }
  current=workId; currentLit=null;
  document.querySelectorAll(".work").forEach(el=>el.setAttribute("aria-current",String(el.dataset.id===workId)));
  /* After the work is open, not before: setSection() paints the rail first,
     and a control asked what is open before anything is would say nothing. */
  try{ renderLangControl(); }catch(e){}
  if(w.source_class==="scripture"){ renderBible(w,null,null); return; }
  const us=unitsByWork[workId]||[];
  const feast = w.is_saint && w.feast_day ? `&nbsp;&nbsp;·&nbsp;&nbsp;feast ${esc(w.feast_day)}` : "";
  let html=`<div class="leafwrap"><article class="leaf">
    <div class="eyebrow">${esc(CLASS_LABEL[w.source_class]||w.source_class)} · ${esc(w.author)}${feast}</div>
    <h1 class="worktitle">${esc(w.title)}</h1>
    ${provenance(w)}
    <div class="dl"><span class="dll">${tr("download")}</span><button data-dl="txt">TXT</button><button data-dl="doc">Word</button><button data-dl="print">${tr("printPdf")}</button></div>
    ${w.description?`<p class="lead">${esc(w.description)}</p>`:""}${w.caution?`<div class="caution"><b class="cautionhd">${esc(tr("howReceived"))}</b>${esc(w.caution)}</div>`:""}${w.source_class==="liturgical"?'<div class="litkey"><span class="role role-priest">Priest</span><span class="role role-deacon">Deacon</span><span class="role role-choir">Choir / People</span><span class="role role-reader">Reader</span><span class="rubric">rubric</span></div>':""}`+(editionsOf(w).length>1?'<div id="edcmp" class="litlangs"></div>':"")+`<div id="workunits">`;
  us.forEach(function(u){
    var passage;
    if(w.source_class==="liturgical"){
      var e=esc(u.text);
      if(/·\s*·\s*·/.test(e)){
        var pp=e.split(/·\s*·\s*·/);
        passage='<div class="parcols"><div class="parcol">'+renderLiturgy(pp[0]||"")+'</div><div class="parcol">'+renderLiturgy(pp[1]||"")+'</div></div>';
      } else { passage='<div class="litpassage">'+renderLiturgy(e)+'</div>'; }
    } else {
      passage='<div class="passage">'+esc(u.text).split(/\n\n+/).map(function(p){return '<p>'+p+'</p>';}).join("")+'</div>';
    }
    html+='<section class="unit" id="u-'+esc(u.unit_id)+'"><div class="anchor">'+esc(u.citation_anchor)+'</div>'+passage+'</section>';
  });
  html+=`</div></article></div>`;
  stage.innerHTML=html; 
  renderEditionCompare(w);
  if(unitId){const el=document.getElementById("u-"+unitId);if(el){el.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});el.classList.add("flash");}}
  else toTop(stage);
  stage.querySelectorAll(".dl [data-dl]").forEach(b=>b.onclick=()=>doExport(b.dataset.dl,workId));
}

/* The last thing searched for, so that Scripture arriving mid-search can put
   the same question to it without the reader typing again. */
var lastQuery="";

/* The line that offers, or reports on, the Scriptures. It sits under the
   Fathers rather than above them: what is held in the page answers at once,
   and the four megabytes are only fetched by a reader who asks. */
function scripInvite(){
  if(!scripSearchAvailable()) return "";
  var mine=SCRIPFT.lang===scripSearchLang();
  if(mine && SCRIPFT.busy){
    var n=SCRIPFT.total?(" · "+SCRIPFT.seen+"/"+SCRIPFT.total):"";
    return `<div class="scripbar" aria-live="polite">${esc(tr("scripOpening"))}${n}</div>`;
  }
  if(mine && SCRIPFT.failed) return `<div class="scripbar">${esc(tr("scripFailed"))}</div>`;
  if(scripFtReady()) return "";
  return `<div class="scripbar"><button class="scripbtn" type="button" id="scripgo">${esc(tr("scripAlso"))}</button></div>`;
}

var scripHits=[];

function passagesWord(n){ return tr(n===1?"resPassage":"resPassages"); }

function renderResults(q,res){
  lastQuery=q;
  scripHits=scripFtReady()?searchScripture(q):[];
  let html=`<div class="results">`;
  if(res.length){
    html+=`<div class="resbar"><h2>${res.length} ${esc(passagesWord(res.length))}</h2><span class="echo">${esc(tr("resFor"))} ${esc(q)}</span><button class="clearbtn" id="clear">${esc(tr("resClear"))}</button></div>`;
    res.forEach((r,i)=>{
      html+=`<button class="hit" data-w="${esc(r.u.work_id)}" data-u="${esc(r.u.unit_id)}">
        <div class="hitmeta"><span class="ha">${esc(r.u.author)}</span><span class="hw">${esc(r.u.work_title)}</span><span class="hc">${esc(r.u.citation_anchor)}</span></div>
        <div class="snip">${snippet(r.u.text,r.terms,r.phrases)}</div></button>`;
    });
  } else {
    html+=`<div class="resbar"><h2>${esc(tr("resNone"))}</h2><span class="echo">${esc(tr("resFor"))} ${esc(q)}</span><button class="clearbtn" id="clear">${esc(tr("resClear"))}</button></div>
      <p class="reshint">${esc(tr("resHint"))}</p>`;
  }
  if(scripFtReady()){
    html+=`<div class="resbar scriphd"><h2>${esc(tr("scripHead"))}</h2><span class="echo">${scripHits.length?scripHits.length+" "+esc(passagesWord(scripHits.length)):esc(tr("scripNone"))}</span></div>`;
    scripHits.forEach((r,i)=>{
      var v=r.v;
      html+=`<button class="hit" data-s="${i}">
        <div class="hitmeta"><span class="ha">${esc(tr(v.ot?"secOT":"secNT"))}</span><span class="hw">${esc(v.n)}</span><span class="hc">${v.c}:${v.v}</span></div>
        <div class="snip">${snippet(v.t,r.terms,r.phrases)}</div></button>`;
    });
  }
  html+=scripInvite()+`</div>`;
  stage.innerHTML=html; toTop(stage);
  var cl=document.getElementById("clear");
  if(cl) cl.onclick=()=>{lastQuery="";openWork(current||WORKS[0].work_id);};
  stage.querySelectorAll(".hit[data-w]").forEach(h=>h.onclick=()=>openWork(h.dataset.w,h.dataset.u));
  stage.querySelectorAll(".hit[data-s]").forEach(h=>h.onclick=()=>openScripHit(scripHits[+h.dataset.s].v));
  var go=document.getElementById("scripgo");
  if(go) go.onclick=function(){
    buildScripFt(function(){
      /* Repaint only the line, so a reader reading the hits above is not
         interrupted every time a book lands. */
      var bar=stage.querySelector(".scripbar");
      if(bar && SCRIPFT.busy){
        bar.textContent=tr("scripOpening")+(SCRIPFT.total?" · "+SCRIPFT.seen+"/"+SCRIPFT.total:"");
      }
    }, function(){
      if(lastQuery) renderResults(lastQuery,res);
    });
    var bar=stage.querySelector(".scripbar");
    if(bar) bar.textContent=tr("scripOpening");
  };
}

function renderCatalog(){
  const cat=document.getElementById("catalog"); let html="";
  for(const cls of CLASS_ORDER){
    if(cls==="liturgical"){
      const groups=Object.values(LITURGY_GROUPS).filter(G=>G.langs.some(l=>{const w=byId[G.id+"-"+l];return w&&passesWork(w);}));
      if(!groups.length) continue;
      html+=`<div class="group"><div class="grouphd">${esc(CLASS_LABEL[cls])}<span>${groups.length}</span></div>${CLASS_DESC[cls]?`<div class="groupdesc">${esc(CLASS_DESC[cls])}</div>`:""}`;
      groups.forEach(G=>{const rep=G.id+"-"+(G.langs.indexOf("en")>=0?"en":G.langs[0]);html+=`<button class="work" data-id="${esc(rep)}"><div class="wt">${esc(G.title)}</div><div class="wa">${esc(G.author)} · ${G.langs.length} ${esc(tr("langsWord"))}</div></button>`;});
      html+=`</div>`;
      continue;
    }
    const ws=WORKS.filter(w=>w.source_class===cls && passesWork(w)); if(!ws.length) continue;
    html+=`<div class="group"><div class="grouphd">${esc(CLASS_LABEL[cls])}<span>${ws.length}</span></div>${CLASS_DESC[cls]?`<div class="groupdesc">${esc(CLASS_DESC[cls])}</div>`:""}`;
    ws.forEach(w=>{const sub=(w.source_class==="scripture"&&NATIVE_NT[w.language])?`<div class="wnative" lang="${w.language}">${esc(NATIVE_NT[w.language])}</div>`:`<div class="wa">${esc(w.author)}</div>`;html+=`<button class="work" data-id="${esc(w.work_id)}"><div class="wt">${esc(w.title)}</div>${sub}</button>`;});
    html+=`</div>`;
  }
  cat.innerHTML=html;
  cat.querySelectorAll(".work").forEach(el=>el.onclick=()=>{openWork(el.dataset.id);});
}

function renderFilters(){
  const wrap=document.getElementById("filters");
  const classes=CLASS_ORDER.filter(c=>WORKS.some(w=>w.source_class===c));
  wrap.innerHTML=classes.map(c=>`<button class="chip" data-c="${c}" aria-pressed="false">${esc(CLASS_LABEL[c])}</button>`).join("");
  wrap.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
    const c=ch.dataset.c;
    if(filtered.has(c)){filtered.delete(c);ch.setAttribute("aria-pressed","false");}
    else{filtered.add(c);ch.setAttribute("aria-pressed","true");}
    renderCatalog();
    if(lastQuery) renderResults(lastQuery,search(lastQuery));
  });
}

function renderLangFilters(){
  const wrap=document.getElementById("langfilters"),head=document.getElementById("langhead");
  const langs=[...new Set(WORKS.map(w=>w.language))].sort((a,b)=>(LANG_LABEL[a]||a).localeCompare(LANG_LABEL[b]||b));
  const show=langs.length>1;
  head.style.display=show?"":"none"; wrap.style.display=show?"":"none";
  wrap.innerHTML=langs.map(l=>`<button class="chip" data-l="${l}" aria-pressed="${langFiltered.has(l)?"true":"false"}">${esc(LANG_LABEL[l]||l)}</button>`).join("");
  wrap.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
    const l=ch.dataset.l;
    if(langFiltered.has(l)){langFiltered.delete(l);ch.setAttribute("aria-pressed","false");}
    else{langFiltered.add(l);ch.setAttribute("aria-pressed","true");}try{if(langFiltered.size===1)localStorage.setItem("plithos.lang",[...langFiltered][0]);}catch(e){}
    renderRail();
    if(lastQuery) renderResults(lastQuery,search(lastQuery));
  });
}
