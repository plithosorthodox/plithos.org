d zu unserer Errettung von den Himmeln Herabgestiegenen und Fleischgewordenen aus dem Heiligen Geist und der Jungfrau Maria und Menschgewordenen, den für uns unter Pontius Pilatus Gekreuzigten, der gelitten hat und begraben worden ist, den am dritten Tage Auferstandenen gemäß den Schriften, den in die Himmel Aufgestiegenen und zur Rechten des Vaters Sitzenden, den mit Herrlichkeit Wiederkommenden, zu richten die Lebenden und die Toten, dessen Königtum ohne Ende sein wird"}},{"r":"choir","t":{"en":"And in the Holy Spirit, the Lord, the Giver of Life, Who proceedeth from the Father; Who with the Father and the Son together is worshipped and glorified; Who spake by the prophets.","el":"Καὶ εἰς τὸ Πνεῦμα τὸ Ἅγιον, τὸ Κύριον, τὸ Ζωοποιόν, τὸ ἐκ τοῦ Πατρὸς ἐκπορευόμενον, τὸ σὺν Πατρὶ καὶ Υἱῷ συμπροσκυνούμενον καὶ συνδοξαζόμενον, τὸ λαλῆσαν διὰ τῶν προφητῶν","cu":"И в Духа Святаго, Господа Животворящаго. Иже от Отца исходящаго, Иже со Отцем и Сыном спокланяема и сславима, глаголавшаго пророки","ro":"Și întru Duhul Sfânt, Domnul de viață Făcătorul, Care din Tatăl purcede, Cel ce împreună cu Tatăl și cu Fiul este închinat și slăvit, Care a grăit prin prooroci","de":"und an den Heiligen Geist, den Herrn, den Lebenschaffenden, den aus dem Vater Hervorgehenden, den mit dem Vater und dem Sohn Angebeteten und Verherrlichten, der gesprochen hat durch die Propheten"}},{"r":"choir","t":{"en":"In one Holy, Catholic, and Apostolic Church. I acknowledge one baptism for the remission of sins. I look for the resurrection of the dead, and the life of the world to come. Amen.","cu":"Во едину Святую Соборную и Апостольскую Церковь. Исповедую едино Крещение во оставление грехов. Чаю воскресения мертвых, и жизни будущаго века. Аминь.","ro":"Întru una, sfântă, sobornicească și apostolească Biserică; Mărturisesc un botez spre iertarea păcatelor; Aștept învierea morților; Și viața veacului ce va să fie. Amin.","de":"An die eine, heilige, allumfassende und apostolische Kirche. Ich bekenne die eine Taufe zur Vergebung der Sünden. Ich erwarte die Auferstehung der Toten und das Leben der künftigen Welt. Amen.","el":"Εἰς μίαν, Ἁγίαν, Καθολικὴν καὶ Ἀποστολικὴν Ἐκκλησίαν. Ὁμολογῶ ἓν βάπτισμα εἰς ἄφεσιν ἁμαρτιῶν. Προσδοκῶ ἀνάστασιν νεκρῶν, καὶ ζωὴν τοῦ μέλλοντος αἰῶνος. Ἀμήν."}}]},"5":{"title":"The Anaphora","lines":[{"r":"priest","t":{"en":"Let us stand aright, let us stand with fear, let us attend, that we may offer the holy oblation in peace.","el":"Στῶμεν καλῶς· στῶμεν μετὰ φόβου· πρόσχωμεν τὴν ἁγίαν ἀναφορὰν ἐν εἰρήνῃ προσφέρειν.","cu":"Станем добре, станем со страхом, вонмем, святое возношение в мире приносити.","ro":"Să stăm bine, să stăm cu frică, să luăm aminte, sfânta jertfă cu pace a o aduce.","de":"Lasset uns recht stehen, lasset uns mit Furcht stehen, lasset uns aufmerken, die heilige Darbringung in Frieden darzubringen."}},{"r":"choir","t":{"en":"A mercy of peace, a sacrifice of praise.","el":"Ἔλεον εἰρήνης, θυσίαν αἰνέσεως.","cu":"Милость мира, жертву хваления.","ro":"Mila păcii, jertfa laudei.","de":"Eine Gnade des Friedens, ein Opfer des Lobes."}},{"r":"priest","t":{"en":"The grace of our Lord Jesus Christ, and the love of God the Father, and the communion of the Holy Spirit, be with you all.","el":"Ἡ χάρις τοῦ Κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ Θεοῦ καὶ Πατρὸς καὶ ἡ κοινωνία τοῦ Ἁγίου Πνεύματος εἴη μετὰ πάντων ὑμῶν.","cu":"Благодать Господа нашего Иисуса Христа, и любы Бога и Отца, и причастие Святаго Духа буди со всеми вами.","ro":"Harul Domnului nostru Iisus Hristos și dragostea lui Dumnezeu Tatăl și împărtășirea Sfântului Duh să fie cu voi cu toți.","de":"Die Gnade unseres Herrn Jesus Christus und die Liebe Gottes des Vaters und die Gemeinschaft des Heiligen Geistes sei mit euch allen."}},{"r":"choir","t":{"en":"And with thy spirit.","el":"Καὶ τῷ πνεύματί σου.","cu":"И со духом твоим.","ro":"Și duhului tău.","de":"Und mit deinem Geiste."}},{"r":"priest","t":{"en":"Let us lift up our hearts.","el":"Ἄνω σχῶμεν τὰς καρδίας.","cu":"Горе имеим сердца.","ro":"Sus să avem inimile.","de":"Erhoben seien unsere Herzen."}},{"r":"choir","t":{"en":"We lift them up unto the Lord.","el":"Ἔχομεν πρὸς τὸν Κύριον.","cu":"Имамы ко Господу.","ro":"Avem către Domnul.","de":"Wir haben sie beim Herrn."}},{"r":"priest","t":{"en":"Let us give thanks unto the Lord.","el":"Εὐχαριστήσωμεν τῷ Κυρίῳ.","cu":"Благодарим Господа.","ro":"Să mulțumim Domnului.","de":"Lasst uns Dank sagen dem Herrn."}},{"r":"choir","t":{"en":"It is meet and right, to worship the Father, the Son, and the Holy Spirit, the consubstantial and undivided Trinity.","el":"Ἄξιον καὶ δίκαιον.","cu":"Достойно и праведно есть покланятися Отцу и Сыну и Святому Духу, Троице Единосущной и Нераздельной.","ro":"Cu vrednicie și cu dreptate este a ne închina Tatălui și Fiului și Sfântului Duh, Treimei celei de o ființă și nedespărțite.","de":"Es ist würdig und recht, anzubeten den Vater und den Sohn und den Heiligen Geist, die wesenseine und ungetrennte Dreiheit."}},{"r":"rubric","x":"THE ANAPHORA. The priest begins the great Eucharistic prayer, praying quietly the prayer of thanksgiving:","t":{"en":"THE ANAPHORA. The priest begins the great Eucharistic prayer, praying quietly the prayer of thanksgiving:","el":"Η ΑΝΑΦΟΡΑ. Ὁ ἱερεὺς ἄρχεται τῆς μεγάλης εὐχαριστιακῆς εὐχῆς, ἀναγινώσκων μυστικῶς τὴν εὐχὴν τῆς εὐχαριστίας:","cu":"АНАФОРА (ВОЗНОШЕНИЕ). Священник начинает великую евхаристическую молитву, читая тайно молитву благодарения:","ro":"ANAFORAUA. Preotul începe marea rugăciune euharistică, citind în taină rugăciunea de mulțumire:","de":"DIE ANAPHORA. Der Priester beginnt das große eucharistische Gebet und betet still das Dankgebet:"}},{"r":"priest","t":{"en":"It is meet and right to hymn Thee, to bless Thee, to praise Thee, to give thanks to Thee, and to worship Thee in every place of Thy dominion; for Thou art God ineffable, inconceivable, invisible, incomprehensible, ever-existing and eternally the same, Thou and Thine only-begotten Son and Thy Holy Spirit. Thou it was who didst bring us out of nonexistence into being, and when we had fallen didst raise us up again, and didst not cease to do all things until Thou hadst brought us up to heaven and hadst endowed us with Thy kingdom which is to come. For all these things we give thanks to Thee, and to Thine only-begotten Son and Thy Holy Spirit; for all things of which we know and of which we know not, the benefits bestowed upon us both manifest and hidden. We give thanks to Thee also for this ministry, which Thou dost vouchsafe to receive at our hands, even though there stand before Thee thousands of archangels and hosts of angels, the Cherubim and the Seraphim, six-winged, many-eyed, soaring aloft upon their wings,","el":"Ἄξιον καὶ δίκαιον σὲ ὑμνεῖν, σὲ εὐλογεῖν, σὲ αἰνεῖν, σοὶ εὐχαριστεῖν, σὲ προσκυνεῖν ἐν παντὶ τόπῳ τῆς δεσποτείας σου. Σὺ γὰρ εἶ Θεὸς ἀνέκφραστος, ἀπερινόητος, ἀόρατος, ἀκατάληπτος, ἀεὶ ὤν, ὡσαύτως ὤν· σὺ καὶ ὁ μονογενής σου Υἱὸς καὶ τὸ Πνεῦμά σου τὸ Ἅγιον. Σὺ ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι ἡμᾶς παρήγαγες καὶ παραπεσόντας ἀνέστησας πάλιν καὶ οὐκ ἀπέστης πάντα ποιῶν, ἕως ἡμᾶς εἰς τὸν οὐρανὸν ἀνήγαγες καὶ τὴν βασιλείαν σου ἐχαρίσω τὴν μέλλουσαν. Ὑπὲρ τούτων ἁπάντων εὐχαριστοῦμέν σοι καὶ τῷ μονογενεῖ σου Υἱῷ καὶ τῷ Πνεύματί σου τῷ Ἁγίῳ, ὑπὲρ πάντων, ὧν ἴσμεν καὶ ὧν οὐκ ἴσμεν, τῶν φανερῶν καὶ ἀφανῶν εὐεργεσιῶν τῶν εἰς ἡμᾶς γεγενημένων. Εὐχαριστοῦμέν σοι καὶ ὑπὲρ τῆς λειτουργίας ταύτης, ἣν ἐκ τῶν χειρῶν ἡμῶν δέξασθαι κατηξίωσας, καίτοι σοι παρεστήκασι χιλιάδες ἀρχαγγέλων καὶ μυριάδες ἀγγέλων, τὰ Χερουβὶμ καὶ τὰ Σεραφίμ, ἑξαπτέρυγα, πολυόμματα, μετάρσια, πτερωτά","ro":"Cu vrednicie și cu dreptate este a-Ți cânta Ție, pe Tine a Te binecuvânta, pe Tine a Te lăuda, Ție a-Ți mulțumi, Ție a ne închina, în tot locul stăpânirii Tale; căci Tu ești Dumnezeu negrăit și necuprins cu gândul, nevăzut, neajuns, pururea fiind și același fiind: Tu și Unul-Născut Fiul Tău și Duhul Tău cel Sfânt. Tu din neființă la ființă ne-ai adus pe noi, și căzând noi, iarăși ne-ai ridicat și nu Te-ai depărtat, toate făcându-le, până ce ne-ai suit la cer și ne-ai dăruit împărăția Ta ce va să fie. Pentru toate acestea mulțumim Ție și Unuia-Născut Fiului Tău și Duhului Tău celui Sfânt, pentru toate pe care le știm și pe care nu le știm; pentru binefacerile Tale cele arătate și cele nearătate, ce ni s-au făcut nouă. Mulțumim Ție și pentru Liturghia aceasta, pe care ai binevoit a o primi din mâinile noastre, deși stau înaintea Ta mii de arhangheli și zeci de mii de îngeri, heruvimii cei cu ochi mulți și serafimii cei cu câte șase aripi, care se înalță zburând...","de":"Würdig ist es und recht, Dich zu preisen, Dich zu segnen, Dich zu loben, Dir Dank zu sagen und Dich anzubeten an jedem Ort Deiner Herrschaft. Denn Du bist Gott, der unaussprechliche, unergründliche, unsichtbare, unbegreifliche, immerseiende und gleichbleibende: Du und Dein einziggezeugter Sohn und Dein Heiliger Geist. Du hast uns aus dem Nichtsein ins Dasein geführt und uns Gefallene wieder aufgerichtet und hast nicht nachgelassen, alles zu tun, bis Du uns in den Himmel emporgeführt und uns Dein künftiges Königtum gnädig geschenkt hattest. Für all das danken wir Dir und Deinem einziggezeugten Sohn und Deinem Heiligen Geist, für alle uns erwiesenen Wohltaten, die wir kennen und die wir nicht kennen, die offenbaren und die verborgenen. Wir danken Dir auch für diese Liturgie, die Du aus unseren Händen anzunehmen geruhst, obgleich Dich Tausende von Erzengeln und Zehntausende von Engeln umgeben, die Cherubim und die Seraphim, die sechsflügeligen, vieläugigen, hoch schwebenden, auf Flügeln sich erhebenden","cu":"Достойно и праведно Тя пети, Тя благословити, Тя хвалити, Тя благодарити, Тебе покланятися на всяком месте владычествия Твоего. Ты бо еси Бог неизреченен, недоведомь, невидимь, непостижимь, присно сый, такожде сый, Ты и Единородный Твой Сын и Дух Твой Святый. Ты от небытия в бытие нас привел еси, и отпадшия возставил еси паки, и не отступил еси вся творя, дондеже нас на небо возвел еси, и Царство Твое даровал еси будущее. О сих всех благодарим Тя, и Единороднаго Твоего Сына, и Духа Твоего Святаго, о всех, ихже вемы и ихже не вемы, явленных и неявленных благодеяниих, бывших на нас. Благодарим Тя и о службе сей, юже от рук наших прияти изволил еси, аще и предстоят Тебе тысящы Архангелов и тмы Ангелов, Херувими и Серафими, шестокрилатии, многоочитии, возвышающиися пернатии,"},"m":"silently"},{"r":"priest","t":{"en":"singing the triumphant hymn, shouting, proclaiming, and saying:","el":"τὸν ἐπινίκιον ὕμνον ᾄδοντα, βοῶντα, κεκραγότα καὶ λέγοντα·","cu":"победную песнь поюще, вопиюще, взывающе и глаголюще:","ro":"cântarea cea de biruință cântând, strigând, glas înălțând și grăind:","de":"das Siegeslied singend, rufend, schreiend und sprechend:"},"m":"aloud"},{"r":"choir","t":{"en":"Holy, holy, holy, Lord God of Sabaoth, heaven and earth are full of Thy Glory. Hosanna in the Highest. Blessed is He that cometh in the Name of the Lord. Hosanna in the Highest.","el":"Ἅγιος, ἅγιος, ἅγιος, Κύριος Σαβαώθ· πλήρης ὁ οὐρανὸς καὶ ἡ γῆ τῆς δόξης σου. Ὡσαννά, ἐν τοῖς ὑψίστοις· εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι Κυρίου. Ὡσαννά, ὁ ἐν τοῖς ὑψίστοις.","cu":"Свят, Свят, Свят Господь Саваоф, исполнь Небо и земля славы Твоея; осанна в вышних, благословен Грядый во Имя Господне, осанна в вышних.","ro":"Sfânt, Sfânt, Sfânt, Domnul Savaot! Plin este cerul și pământul de slava Ta! Osana întru cei de sus! Binecuvântat este cel ce vine întru numele Domnului! Osana întru cei de sus! Diaconul stă în dreapta preotului, apără Cinstitele Daruri cu un acoperământ.","de":"Heilig, heilig, heilig, Herr Sabaoth. Erfüllt sind Himmel und Erde von Deiner Herrlichkeit. Hosanna in den Höhen. Gesegnet, der da kommt im Namen des Herrn. Hosanna in den Höhen."}},{"r":"rubric","x":"The priest continues quietly, recalling the love of God and the Last Supper:","t":{"en":"The priest continues quietly, recalling the love of God and the Last Supper:","el":"Ὁ ἱερεὺς συνεχίζει μυστικῶς, ἀναμιμνῃσκόμενος τὴν ἀγάπην τοῦ Θεοῦ καὶ τὸν Μυστικὸν Δεῖπνον:","cu":"Священник продолжает тайно, воспоминая любовь Божию и Тайную вечерю:","ro":"Preotul continuă în taină, aducând aminte de iubirea lui Dumnezeu și de Cina cea de Taină:","de":"Der Priester fährt still fort und gedenkt der Liebe Gottes und des Letzten Abendmahls:"}},{"r":"priest","t":{"en":"With these blessed powers, O Master who lovest mankind, we also cry aloud and say: Holy art Thou and all-holy, Thou and Thine only-begotten Son and Thy Holy Spirit; holy art Thou and all-holy, and magnificent is Thy glory; who hast so loved Thy world as to give Thine only-begotten Son, that everyone who believeth in Him should not perish, but have everlasting life; who, having come and fulfilled all the dispensation for us, in the night in which He was given up, or rather gave Himself up for the life of the world, took bread in His holy and most pure and blameless hands, and when He had given thanks and blessed and hallowed and broken it, He gave it to His holy disciples and apostles, saying:","el":"Μετὰ τούτων καὶ ἡμεῖς τῶν μακαρίων δυνάμεων, Δέσποτα φιλάνθρωπε, βοῶμεν καὶ λέγομεν· Ἅγιος εἶ καὶ πανάγιος, σὺ καὶ ὁ μονογενής σου Υἱὸς καὶ τὸ Πνεῦμά σου τὸ Ἅγιον. Ἅγιος εἶ καὶ πανάγιος καὶ μεγαλοπρεπὴς ἡ δόξα σου· ὃς τὸν κόσμον σου οὕτως ἠγάπησας, ὥστε τὸν Υἱόν σου τὸν μονογενῆ δοῦναι, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται, ἀλλ’ ἔχῃ ζωὴν αἰώνιον. Ὃς ἐλθὼν καὶ πᾶσαν τὴν ὑπὲρ ἡμῶν οἰκονομίαν πληρώσας, τῇ νυκτὶ ᾗ παρεδίδοτο, μᾶλλον δὲ ἑαυτὸν παρεδίδου ὑπὲρ τῆς τοῦ κόσμου ζωῆς, λαβὼν ἄρτον ἐν ταῖς ἁγίαις αὐτοῦ καὶ ἀχράντοις καὶ ἀμωμήτοις χερσίν, εὐχαριστήσας καὶ εὐλογήσας, ἁγιάσας, κλάσας, ἔδωκε τοῖς ἁγίοις αὐτοῦ μαθηταῖς καὶ ἀποστόλοις, εἰπών","ro":"Cu aceste fericite Puteri și noi, Iubitorule de oameni, Stăpâne, strigăm și grăim: Sfânt ești și Preasfânt, Tu și Unul-Născut Fiul Tău și Duhul Tău cel Sfânt. Sfânt ești și Preasfânt și slava Ta este plină de măreție. Căci Tu ai iubit lumea Ta atât de mult încât pe Unul-Născut Fiul Tău L-ai dat, ca tot cel ce crede într-Însul să nu piară, ci să aibă viață veșnică. Și Acesta venind și toată rânduiala cea pentru noi plinind, în noaptea întru care a fost vândut și mai vârtos Însuși pe Sine S-a dat pentru viața lumii, luând pâinea cu sfintele și preacuratele și fără prihană mâinile Sale, mulțumind și binecuvântând, sfințind și frângând, a dat Sfinților Săi Ucenici și Apostoli, zicând:","de":"Mit diesen seligen Mächten, menschenliebender Gebieter, rufen auch wir und sprechen: Heilig bist Du und allheilig, Du und Dein einziggezeugter Sohn und Dein Heiliger Geist. Heilig bist Du und allheilig, und hocherhaben ist Deine Herrlichkeit, der Du Deine Welt so sehr geliebt, dass Du Deinen einziggezeugten Sohn hingegeben hast, damit jeder, der an ihn glaubt, nicht zugrunde gehe, sondern ewiges Leben habe. Dieser ist gekommen und hat die ganze Heilsordnung für uns erfüllt. In der Nacht, in der er überliefert wurde, vielmehr jedoch sich selbst überlieferte für das Leben der Welt, nahm er Brot in seine heiligen, allreinen und makellosen Hände, dankte und segnete, heiligte, brach und gab es seinen heiligen Jüngern und Aposteln und sprach:","cu":"С сими и мы блаженными Силами, Владыко Человеколюбче, вопием и глаголем: Свят еси и Пресвят, Ты и Единородный Твой Сын и Дух Твой Святый. Свят еси и Пресвят, и великолепна слава Твоя, Иже мир Твой тако возлюбил еси, якоже Сына Твоего Единороднаго дати, да всяк веруяй в Него не погибнет, но имать живот вечный. Иже пришед, и все еже о нас смотрение исполнив, в нощь, в нюже предаяшеся, паче же Сам Себе предаяше за мирский живот, прием хлеб во святыя Своя и пречистыя и непорочныя руки, благодарив и благословив, освятив, преломив, даде святым Своим учеником и апостолом, рек:"},"m":"silently"}]},"6":{"title":"The Words of Institution","lines":[{"r":"priest","t":{"en":"Take, eat: This is My Body which is broken for you, for the remission of sins.","el":"Λάβετε, φάγετε, τοῦτό μού ἐστι τὸ σῶμα, τὸ ὑπὲρ ὑμῶν κλώμενον εἰς ἄφεσιν ἁμαρτιῶν.","cu":"Приимите, ядите. Сие есть Тело Мое, еже за вы ломимое во оставление грехов.","ro":"Luați, mâncați, acesta este Trupul Meu, Care se frânge pentru voi spre iertarea păcatelor.","de":"Nehmet, esset: dies ist mein Leib, der für euch gebrochen wird zur Vergebung der Sünden."}},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"priest","t":{"en":"Drink ye all of This: for This is My Blood, of the New Testament, Which is shed for you and for many for the remission of sins.","el":"Πίετε ἐξ αὐτοῦ πάντες· τοῦτό ἐστι τὸ αἷμά μου, τὸ τῆς καινῆς διαθήκης, τὸ ὑπὲρ ὑμῶν καὶ πολλῶν ἐκχυνόμενον εἰς ἄφεσιν ἁμαρτιῶν.","cu":"Пиите от нея вси, сия есть Кровь Моя Новаго Завета, яже за вы и за многи изливаемая во оставление грехов.","ro":"Beți dintru acesta toți, acesta este Sângele Meu, al Legii celei noi, Care pentru voi și pentru mulți se varsă, spre iertarea păcatelor.","de":"Trinket alle daraus: dies ist mein Blut des neuen Bundes, das für euch und für viele vergossen wird zur Vergebung der Sünden."}},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"priest","t":{"en":"Commemorating this command of our Saviour and all that was endured for our sake, the Cross, the Grave, the Resurrection after three days, the Ascension into Heaven and the Sitting at the right hand of the Father, and the second and glorious coming again,","el":"Μεμνημένοι τοίνυν τῆς σωτηρίου ταύτης ἐντολῆς καὶ πάντων τῶν ὑπὲρ ἡμῶν γεγενημένων, τοῦ Σταυροῦ, τοῦ τάφου, τῆς τριημέρου ἀναστάσεως, τῆς εἰς οὐρανοὺς ἀναβάσεως, τῆς ἐκ δεξιῶν καθέδρας, τῆς δευτέρας καὶ ἐνδόξου πάλιν παρουσίας,","ro":"Aducându-ne aminte, așadar, de această poruncă mântuitoare și de toate cele ce s-au făcut pentru noi: de cruce, de groapă, de învierea cea de a treia zi, de suirea la ceruri, de șederea cea de-a dreapta, și de cea de a doua și slăvită iarăși venire.","de":"Eingedenk also dieses heilbringenden Gebotes und all dessen, was für uns geschehen ist, des Kreuzes, des Grabes, der Auferstehung am dritten Tage, der Auffahrt in die Himmel, des Sitzens zur Rechten und der zweiten und herrlichen Wiederkunft,","cu":"Поминающе убо спасительную сию заповедь, и вся яже о нас бывшая: крест, гроб, тридневное воскресение, на небеса восхождение, одесную седение, второе и славное паки пришествие."}},{"r":"priest","t":{"en":"Thine own of Thine own we offer to Thee, in all and for all.","el":"Τὰ σὰ ἐκ τῶν σῶν σοὶ προσφέρομεν κατὰ πάντα καὶ διὰ πάντα.","cu":"Твоя от Твоих Тебе приносяще о всех и за вся.","ro":"Ale Tale dintru ale Tale, Ție Ți-aducem de toate și pentru toate.","de":"Das Deine von dem Deinen bringen wir Dir dar in allem und für alles."}},{"r":"choir","t":{"en":"We praise Thee, we bless Thee, we give thanks to Thee, O Lord, and we pray to Thee, our God.","el":"Σὲ ὑμνοῦμεν, σὲ εὐλογοῦμεν, σοὶ εὐχαριστοῦμεν, Κύριε, καὶ δεόμεθά σου, ὁ Θεὸς ἡμῶν.","cu":"Тебе поем. Тебе благословим, Тебе благодарим. Господи, и молим Ти ся. Боже наш.","ro":"Pe Tine Te lăudăm, pe Tine Te binecuvântăm, Ție Îți mulțumim, Doamne, și ne rugăm Ție, Dumnezeul nostru.","de":"Wir besingen Dich, wir preisen Dich, wir danken Dir, o Herr, und wir beten zu Dir, unser Gott."}},{"r":"rubric","x":"THE EPICLESIS. Bowing before the holy table, the priest prays quietly the invocation of the Holy Spirit:","t":{"en":"THE EPICLESIS. Bowing before the holy table, the priest prays quietly the invocation of the Holy Spirit:","el":"Η ΕΠΙΚΛΗΣΙΣ. Κλίνων ἐνώπιον τῆς ἁγίας τραπέζης, ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν ἐπίκλησιν τοῦ Ἁγίου Πνεύματος:","cu":"ПРИЗЫВАНИЕ СВЯТАГО ДУХА. Преклоняясь пред святым престолом, священник тайно читает призывание Святаго Духа:","ro":"EPICLEZA. Plecându-se înaintea sfintei mese, preotul citește în taină chemarea Sfântului Duh:","de":"DIE EPIKLESE. Vor dem heiligen Tisch sich verneigend, betet der Priester still die Anrufung des Heiligen Geistes:"}},{"r":"priest","t":{"en":"Again we offer Thee this reasonable and bloodless worship, and we ask Thee and pray Thee and entreat Thee: send down Thy Holy Spirit upon us and upon these gifts here set forth.","el":"Ἔτι προσφέρομέν σοι τὴν λογικὴν ταύτην καὶ ἀναίμακτον λατρείαν καὶ παρακαλοῦμέν σε καὶ δεόμεθα καὶ ἱκετεύομεν· κατάπεμψον τὸ Πνεῦμά σου τὸ Ἅγιον ἐφ’ ἡμᾶς, καὶ ἐπὶ τὰ προκείμενα δῶρα ταῦτα","ro":"Încă aducem Ție această slujbă duhovnicească și fără de sânge, și Te chemăm, Te rugăm și cu umilință la Tine cădem: Trimite Duhul Tău cel Sfânt peste noi și peste aceste Daruri, ce sunt puse înainte.","de":"So bringen wir Dir diesen geistigen und unblutigen Dienst der Anbetung dar und rufen und beten und flehen zu Dir: Sende herab Deinen Heiligen Geist auf uns und auf diese vorliegenden Gaben.","cu":"Еще приносим Ти словесную сию и безкровную службу, и просим, и молим, и мили ся деем: низпосли Духа Твоего Святаго на ны и на предлежащия Дары сия."},"m":"silently"},{"r":"rubric","x":"Blessing the holy Bread, then the cup, then both together, the priest says quietly (the deacon answering \"Amen\"):","t":{"en":"Blessing the holy Bread, then the cup, then both together, the priest says quietly (the deacon answering \"Amen\"):","el":"Εὐλογῶν τὸν ἅγιον Ἄρτον, εἶτα τὸ ποτήριον, εἶτα ἀμφότερα ὁμοῦ, ὁ ἱερεὺς λέγει μυστικῶς (τοῦ διακόνου ἀποκρινομένου «Ἀμήν»):","cu":"Благословляя святый Хлеб, потом чашу, потом обоя вкупе, священник глаголет тайно (диакону отвещающу «Аминь»):","ro":"Binecuvântând sfânta Pâine, apoi paharul, apoi pe amândouă împreună, preotul zice în taină (diaconul răspunzând „Amin”):","de":"Das heilige Brot segnend, dann den Kelch, dann beide zusammen, spricht der Priester still (während der Diakon „Amen” antwortet):"}},{"r":"priest","t":{"en":"And make this bread the precious Body of Thy Christ.","el":"Καὶ ποίησον τὸν μὲν Ἄρτον τοῦτον τίμιον Σῶμα τοῦ Χριστοῦ σου.","cu":"И сотвори убо хлеб сей честное Тело Христа Твоего.","ro":"Și fă, adică, pâinea aceasta, Cinstit Trupul Hristosului Tău.","de":"Und mache dieses Brot zum kostbaren Leib Deines Christus."},"m":"silently"},{"r":"deacon","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"priest","t":{"en":"And that which is in this cup, the precious Blood of Thy Christ.","el":"Τὸ δὲ ἐν τῷ Ποτηρίῳ τούτῳ, τίμιον Αἷμα τοῦ Χριστοῦ σου.","cu":"А еже в Чаши сей, честную Кровь Христа Твоего.","ro":"Iar ceea ce este în potirul acesta, Cinstit Sângele Hristosului Tău.","de":"Was aber in diesem Kelche ist, zum kostbaren Blute Deines Christus."},"m":"silently"},{"r":"deacon","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"priest","t":{"en":"Changing them by Thy Holy Spirit.","el":"Μεταβαλὼν τῷ Πνεύματί σου τῷ Ἁγίῳ.","cu":"Преложив Духом Твоим Святым.","ro":"Prefăcându-le cu Duhul Tău cel Sfânt.","de":"Sie verwandelnd durch Deinen Heiligen Geist."},"m":"silently"},{"r":"deacon","t":{"en":"Amen. Amen. Amen.","el":"Ἀμήν. Ἀμήν. Ἀμήν.","cu":"Аминь. Аминь. Аминь.","ro":"Amin. Amin. Amin.","de":"Amen. Amen. Amen."}},{"r":"rubric","x":"The consecration accomplished, the priest continues the intercession quietly:","t":{"en":"The consecration accomplished, the priest continues the intercession quietly:","el":"Τελεσθείσης τῆς καθαγιάσεως, ὁ ἱερεὺς συνεχίζει μυστικῶς τὴν δέησιν:","cu":"По совершении освящения священник продолжает тайно ходатайство:","ro":"Săvârșindu-se sfințirea, preotul continuă în taină mijlocirea:","de":"Nach vollzogener Wandlung setzt der Priester still die Fürbitte fort:"}},{"r":"priest","t":{"en":"so that to those who partake they may be for vigilance of soul, for remission of sins, for the communion of Thy Holy Spirit, for the fullness of the kingdom of heaven, for boldness toward Thee, and not for judgment or condemnation. Again we offer Thee this reasonable worship for those who have reposed in the faith: forefathers, fathers, patriarchs, prophets, apostles, preachers, evangelists, martyrs, confessors, ascetics, and for every righteous spirit made perfect in faith.","el":"Ὥστε γενέσθαι τοῖς μεταλαμβάνουσιν εἰς νῆψιν ψυχῆς, εἰς ἄφεσιν ἁμαρτιῶν, εἰς κοινωνίαν τοῦ Ἁγίου σου Πνεύματος, εἰς βασιλείας οὐρανῶν πλήρωμα, εἰς παρρησίαν τὴν πρὸς σέ, μὴ εἰς κρῖμα ἢ εἰς κατάκριμα. Ἔτι προσφέρομέν σοι τὴν λογικὴν ταύτην λατρείαν ὑπὲρ τῶν ἐν πίστει ἀναπαυσαμένων προπατόρων, πατέρων, πατριαρχῶν, προφητῶν, ἀποστό-λων, κηρύκων, εὐαγγελιστῶν, μαρτύρων, ὁμολογητῶν, ἐγκρατευτῶν καὶ παντὸς πνεύματος δικαίου ἐν πίστει τετελειωμένου","ro":"Pentru ca să fie celor ce se vor împărtăși, spre trezirea sufletului, spre iertarea păcatelor, spre împărtășirea cu Sfântul Tău Duh, spre plinirea împărăției cerurilor, spre îndrăznirea cea către Tine, iar nu spre judecată sau spre osândă. Încă aducem Ție această slujbă duhovnicească pentru cei adormiți întru credință: strămoși, părinți, patriarhi, prooroci, apostoli, propovăduitori, evangheliști, mucenici, mărturisitori, pustnici și pentru tot sufletul cel drept, care s-a săvârșit întru credință.","de":"Auf dass sie denen, die daran teilnehmen, zur Nüchternheit der Seele gereichen, zur Vergebung der Sünden, zur Gemeinschaft Deines Heiligen Geistes, zur Fülle des Königtums der Himmel, zum Freimut vor Dir, nicht aber zum Gericht oder zur Verdammnis. Auch bringen wir Dir diese geistige Anbetung dar für die im Glauben Ruhenden, die Vorväter, Väter, Patriarchen, Propheten, Apostel, Verkündiger, Evangelisten, Märtyrer, Bekenner, Asketen und für jeden gerechten Geist, der im Glauben vollendet ist","cu":"Якоже быти причащающымся во трезвение души, во оставление грехов, в приобщение Святаго Твоего Духа, во исполнение Царствия Небеснаго, в дерзновение еже к Тебе, не в суд или во осуждение. Еще приносим Ти словесную сию службу о иже в вере почивших, праотцех, отцех, патриарсех, пророцех, апостолех, проповедницех, евангелистех, мученицех, исповедницех, воздержницех, и о всяком дусе праведнем в вере скончавшемся."},"m":"silently"},{"r":"priest","t":{"en":"Especially for our most holy, pure, blessed, and glorious Lady, the Theotokos and ever-virgin Mary.","el":"Ἐξαιρέτως τῆς παναγίας, ἀχράντου, ὑπερευλογημένης, ἐνδόξου Δεσποίνης ἡμῶν Θεοτόκου καὶ ἀειπαρθένου Μαρίας.","cu":"Изрядно о Пресвятей, Пречистей, Преблагословенней, Славней Владычице нашей Богородице и Приснодеве Марии.","ro":"Mai ales pentru Preasfânta, curata, preabinecuvântata, mărita stăpâna noastră, de Dumnezeu Născătoarea și pururea Fecioara Maria.","de":"Besonders für unsere allheilige, allreine, über alles gesegnete und herrliche Gebieterin, die Gottesgebärerin und immerwährende Jungfrau Maria."},"m":"aloud"}]},"7":{"title":"The Hymn to the Theotokos and the Intercessions","lines":[{"r":"rubric","x":"THE HYMN TO THE THEOTOKOS. Having commemorated the Mother of God aloud, the priest continues; the people sing her praises:","t":{"en":"THE HYMN TO THE THEOTOKOS. Having commemorated the Mother of God aloud, the priest continues; the people sing her praises:","el":"Ο ΥΜΝΟΣ ΕΙΣ ΤΗΝ ΘΕΟΤΟΚΟΝ. Μνημονεύσας ἐκφώνως τὴν Μητέρα τοῦ Θεοῦ, ὁ ἱερεὺς συνεχίζει· ὁ λαὸς ψάλλει τοὺς ἐπαίνους αὐτῆς:","cu":"ПЕСНЬ БОГОРОДИЦЕ. Помянув велегласно Матерь Божию, священник продолжает; людие поют похвалу Ея:","ro":"IMNUL CĂTRE NĂSCĂTOAREA DE DUMNEZEU. Pomenind cu glas tare pe Maica lui Dumnezeu, preotul continuă; strana cântă laudele ei:","de":"DER HYMNUS AN DIE GOTTESGEBÄRERIN. Nachdem er der Mutter Gottes laut gedacht hat, fährt der Priester fort; das Volk singt ihr Lob:"}},{"r":"people","t":{"en":"It is truly meet to bless thee, the Theotokos, ever-blessed and most pure, and the Mother of our God. More honourable than the Cherubim, and beyond compare more glorious than the Seraphim; who without corruption gavest birth to God the Word: thee, the true Theotokos, we magnify.","el":"Ἄξιόν ἐστιν ὡς ἀληθῶς μακαρίζειν σε τὴν Θεοτόκον, τὴν ἀειμακάριστον καὶ παναμώμητον καὶ Μητέρα τοῦ Θεοῦ ἡμῶν. Τὴν τιμιωτέραν τῶν Χερουβεὶμ καὶ ἐνδοξοτέραν ἀσυγκρίτως τῶν Σεραφείμ, τὴν ἀδιαφθόρως Θεὸν Λόγον τεκοῦσαν, τὴν ὄντως Θεοτόκον, σὲ μεγαλύνομεν.","cu":"Достойно есть яко воистину блажити Тя, Богородицу, Присноблаженную и Пренепорочную и Матерь Бога нашего. Честнейшую Херувим и славнейшую без сравнения Серафим, без истления Бога Слова рождшую, сущую Богородицу, Тя величаем.","ro":"Cuvine-se cu adevărat să te fericim, Născătoare de Dumnezeu, cea pururea fericită și prea nevinovată și Maica Dumnezeului nostru. Ceea ce ești mai cinstită decât heruvimii și mai mărită fără de asemănare decât serafimii, care fără stricăciune pe Dumnezeu Cuvântul ai născut, pe tine, cea cu adevărat Născătoare de Dumnezeu, te mărim.","de":"Es ist in Wahrheit würdig, dich seligzupreisen, die Gottesgebärerin, die immerselige und ganz untadelige und Mutter unseres Gottes. Die du geehrter bist als die Cherubim und unvergleichlich herrlicher als die Seraphim, die du unversehrt Gott das Wort geboren hast, die du in Wahrheit Gottesgebärerin bist: dich preisen wir hoch."}},{"r":"rubric","x":"On great feasts the festal megalynarion (the hymn of the ninth ode) replaces this hymn.","t":{"en":"On great feasts the festal megalynarion (the hymn of the ninth ode) replaces this hymn.","el":"Κατὰ τὰς μεγάλας ἑορτὰς ἀντὶ τοῦ ὕμνου τούτου ψάλλεται τὸ ἑόρτιον μεγαλυνάριον (ὁ ὕμνος τῆς θ´ ᾠδῆς).","cu":"В великие праздники вместо сей песни поется праздничный задостойник (ирмос девятой песни).","ro":"La praznicele mari, în locul acestui imn se cântă axionul praznical (irmosul cântării a noua).","de":"An den großen Festen tritt an die Stelle dieses Hymnus das festliche Megalynarion (der Hymnus der neunten Ode)."}},{"r":"rubric","x":"The priest continues the great intercession quietly, commemorating the saints and the departed (the diptychs):","t":{"en":"The priest continues the great intercession quietly, commemorating the saints and the departed (the diptychs):","el":"Ὁ ἱερεὺς συνεχίζει μυστικῶς τὴν μεγάλην δέησιν, μνημονεύων τοὺς ἁγίους καὶ τοὺς κεκοιμημένους (τὰ δίπτυχα):","cu":"Священник продолжает тайно великое ходатайство, поминая святых и усопших (диптихи):","ro":"Preotul continuă în taină marea mijlocire, pomenind pe sfinți și pe cei adormiți (dipticele):","de":"Der Priester fährt still mit der großen Fürbitte fort und gedenkt der Heiligen und der Entschlafenen (die Diptychen):"}},{"r":"priest","t":{"en":"For Saint John the prophet, forerunner, and baptist; for the holy, glorious, and all-praised apostles; for Saint N., whose memory we keep; and for all Thy saints, at whose supplications visit us, O God. And remember all who have fallen asleep in the hope of resurrection unto life eternal (here the priest remembers the departed by name), and grant them rest where the light of Thy countenance keeps watch. Again we entreat Thee: remember, O Lord, every Orthodox bishopric rightly dividing the word of Thy truth, the whole priesthood, the diaconate in Christ, and every order of clergy and monastics. Again we offer Thee this reasonable worship for the whole world, for the holy, catholic, and apostolic Church, for those who live in purity and holiness, and for the civil authorities and the armed forces: grant them peace, that we too in their tranquillity may lead a calm and quiet life in all godliness and dignity.","el":"Τοῦ ἁγίου Ἰωάννου, προφήτου, προδρόμου καὶ βαπτιστοῦ· τῶν ἁγίων ἐνδόξων καὶ πανευφήμων Ἀποστόλων· τοῦ ἁγίου (τοῦ δεῖνος) , οὗ καὶ τὴν μνήμην ἐπιτελοῦμεν, καὶ πάντων σου τῶν ἁγίων, ὧν ταῖς ἱκεσίαις ἐπίσκεψαι ἡμᾶς, ὁ Θεός. Καὶ μνήσθητι πάντων τῶν κεκοιμημένων ἐπ’ ἐλπίδι ἀναστάσεως ζωῆς αἰωνίου (καὶ μνημονεύει ἐνταῦθα ὁ ἱερουργῶν ὀνομαστὶ ὧν βούλεται τεθνεώτων) καὶ ἀνάπαυσον αὐτούς, ὁ Θεὸς ἡμῶν, ὅπου ἐπισκοπεῖ τὸ φῶς τοῦ προσώπου σου. Ἔτι παρακαλοῦμέν σε· μνήσθητι, Κύριε, πάσης ἐπισκοπῆς ὀρθοδόξων, τῶν ὀρθοτομούντων τὸν λόγον τῆς σῆς ἀληθείας, παντὸς τοῦ πρεσβυτερίου, τῆς ἐν Χριστῷ διακονίας καὶ παντὸς ἱερατικοῦ καὶ μοναχικοῦ τάγματος. Ἔτι προσφέρομέν σοι τὴν λογικὴν ταύτην λατρείαν ὑπὲρ τῆς οἰκουμένης· ὑπὲρ τῆς ἁγίας καθολικῆς καὶ ἀποστολικῆς Ἐκκλησίας· ὑπὲρ τῶν ἐν ἁγνείᾳ καὶ σεμνῇ πολιτείᾳ διαγόντων· ὑπὲρ τῶν ἀρχόντων καὶ τοῦ στρατοῦ ἡμῶν. Δὸς αὐτοῖς, Κύριε, εἰρηνικὸν τὸ πολίτευμα, ἵνα καὶ ἡμεῖς ἐν τῇ γαλήνῃ αὐτῶν ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι","ro":"Pentru Sfântul Ioan Proorocul, Înaintemergătorul și Botezătorul, pentru Sfinții măriții și întru tot lăudații Apostoli, pentru Sfântul (N), a cărui pomenire o săvârșim, și pentru toți sfinții Tăi; cu ale căror rugăciuni, cercetează-ne pe noi, Dumnezeule. Și pomenește pe toți cei adormiți întru nădejdea învierii și a vieții celei de veci și-i odihnește pe dânșii, Dumnezeul nostru, acolo unde strălucește lumina feței Tale. Încă Te rugăm: Pomenește, Doamne, pe toți episcopii ortodocși, care drept învață cuvântul adevărului Tău, toată preoțimea, cea întru Hristos diaconime și tot cinul preoțesc și monahicesc. Încă aducem Ție această slujbă duhovnicească pentru toată lumea, pentru sfânta sobornicească și apostolească Biserică; pentru cei ce în curăție și în viață cinstită viețuiesc, pentru (aici se pomenește cârmuirea țării, după îndrumările Sfântului Sinod). Dă lor, Doamne, pașnică ocârmuire, ca și noi, întru liniștea lor, viață pașnică și netulburată să trăim, în toată cucernicia și curăția.","de":"Für den heiligen Propheten, Vorläufer und Täufer Johannes , die heiligen, herrlichen und allgepriesenen Apostel, den / die heilige(n) N. (des / der Tagesheiligen), dessen / deren Gedächtnis wir begehen, und alle Deine Heiligen. Auf ihre flehentlichen Bitten suche uns heim, o Gott. Gedenke auch aller, die entschlafe n sind in der Hoffnung auf die Auferstehung zum ewigen Leben (und der Priester gedenkt jener Verstorbenen, derer er will) und schenke ihnen Ruhe, wo das Licht Deines Angesichts wacht. Auch rufen wir Dich an: Gedenke, Herr, des ganzen Episkopates der Orthodoxen, derer, die das Wort Deiner Wahrheit recht verwalten, der ganzen Priesterschaft, des Diakonates in Christus und jedes geistlichen [und monastischen] Standes. Auch bringen wir Dir diese geistige Anbetung dar für den Erdkreis, für die heilige, allumfassende und apostolische Kirche, für die, welche einen reinen und ehrbaren Lebenswandel führen, für unser Land und Volk und alle, die es regieren und beschützen, damit wir ein ruhiges und stilles Leben führen in aller Frömmigkeit und Ehrbarkeit","cu":"О святем Иоанне Пророце, Предтечи и Крестители, о святых славных и всехвальных Апостолех, о святем (имя рек), егоже и память совершаем, и о всех святых Твоих, ихже молитвами посети нас, Боже. И помяни всех усопших о надежди воскресения жизни вечныя, и упокой их, идеже присещает свет лица Твоего. Еще молим Тя: помяни, Господи, всякое епископство православных, право правящих слово Твоея истины, всякое пресвитерство, во Христе диаконство и всякий священнический и монашеский чин. Еще приносим Ти словесную сию службу о вселенней, о святей соборней и апостольстей Церкви, о иже в чистоте и честнем жительстве пребывающих, о властех и воинстве: даруй им, Господи, мирное правление, да и мы в тишине их тихое и безмолвное житие поживем во всяком благочестии и чистоте."},"m":"silently"},{"r":"rubric","x":"Aloud, the priest commemorates the chief hierarch by name (the local bishop and the primate of the autocephalous Church are named here):","t":{"en":"Aloud, the priest commemorates the chief hierarch by name (the local bishop and the primate of the autocephalous Church are named here):","el":"Ἐκφώνως, ὁ ἱερεὺς μνημονεύει ὀνομαστὶ τὸν πρῶτον ἀρχιερέα (ἐνταῦθα μνημονεύονται ὁ ἐπιχώριος ἐπίσκοπος καὶ ὁ προκαθήμενος τῆς αὐτοκεφάλου Ἐκκλησίας):","cu":"Велегласно священник поминает по имени первенствующего архиерея (зде поминаются местный епископ и предстоятель автокефальной Церкве):","ro":"Cu glas tare, preotul pomenește pe nume pe întâistătătorul ierarh (aici se pomenesc episcopul locului și întâistătătorul Bisericii autocefale):","de":"Laut gedenkt der Priester namentlich des obersten Hierarchen (hier werden der Ortsbischof und das Oberhaupt der autokephalen Kirche genannt):"}},{"r":"commem","x":"Among the first, remember, O Lord, our father and Archbishop N. (and the primate of the local Church): grant that they may serve Thy holy churches in peace, whole, honourable, and in health, rightly proclaiming the word of Thy truth. (Named according to local use.)","t":{"en":"Among the first, remember, O Lord, our father and Archbishop N. (and the primate of the local Church): grant that they may serve Thy holy churches in peace, whole, honourable, and in health, rightly proclaiming the word of Thy truth. (Named according to local use.)","el":"Ἐν πρώτοις μνήσθητι, Κύριε, τοῦ πατρὸς καὶ ἀρχιεπισκόπου ἡμῶν (δεῖνος) (καὶ τοῦ προκαθημένου τῆς τοπικῆς Ἐκκλησίας)· χάρισαι αὐτοῖς ἐν εἰρήνῃ, σῶον, ἔντιμον, ὑγιᾶ, μακροημερεύοντα καὶ ὀρθοτομοῦντα τὸν λόγον τῆς σῆς ἀληθείας. (Μνημονεύεται κατὰ τὴν τοπικὴν τάξιν.)","cu":"В первых помяни, Господи, отца и архиепископа нашего, имярек (и предстоятеля местныя Церкве): даруй их святым Твоим церквам в мире, цела, честна, здрава, право правяща слово Твоея истины. (Поминается по местному уставу.)","ro":"Întâi pomenește, Doamne, pe părintele și arhiepiscopul nostru (N) (și pe întâistătătorul Bisericii locale): dăruiește-i sfintelor Tale biserici în pace, întreg, cinstit, sănătos, drept învățând cuvântul adevărului Tău. (Se pomenește după rânduiala locului.)","de":"Zuerst gedenke, o Herr, unseres Vaters und Erzbischofs N. (und des Oberhauptes der Ortskirche): gewähre, dass sie Deinen heiligen Kirchen in Frieden dienen, unversehrt, geehrt, gesund, recht verkündend das Wort Deiner Wahrheit. (Wird nach örtlichem Brauch genannt.)"}},{"r":"deacon","t":{"en":"And those whom each has in mind, and all men and women.","el":"Καὶ ὧν ἕκαστος κατὰ διάνοιαν ἔχει, καὶ πάντων καὶ πασῶν.","cu":"И ихже кийждо в помышлении имать, и всех и вся.","ro":"Și pe aceia pe care fiecare îi are în cuget, și pe toți și pe toate.","de":"Und derer, die ein jeder im Sinne hat, und aller und jeder."}},{"r":"choir","t":{"en":"And all men and women.","el":"Καὶ πάντων καὶ πασῶν.","cu":"И всех и вся.","ro":"Și pe toți și pe toate.","de":"Und aller und jeder."}},{"r":"rubric","x":"The priest continues quietly:","t":{"en":"The priest continues quietly:","el":"Ὁ ἱερεὺς συνεχίζει μυστικῶς:","cu":"Священник продолжает тайно:","ro":"Preotul continuă în taină:","de":"Der Priester fährt still fort:"}},{"r":"priest","t":{"en":"Remember, O Lord, the city in which we dwell, and every city and land, and the faithful who dwell in them. Remember, O Lord, those who travel by land, sea, and air, the sick, the suffering, the captives, and their salvation. Remember those who bring forth fruit and do good works in Thy holy churches, and those who are mindful of the poor; and upon us all send forth Thy mercies.","el":"Μνήσθητι, Κύριε, τῆς πόλεως ταύτης, ἐν ᾗ παροικοῦμεν καὶ πάσης πόλεως καὶ χώρας καὶ τῶν πίστει οἰκούντων ἐν αὐταῖς. Μνήσθητι, Κύριε, πλεόντων, ὁδοιπορούντων, νοσούντων, καμνόντων, αἰχμαλώτων καὶ τῆς σωτηρίας αὐτῶν. Μνήσθητι, Κύριε, τῶν καρποφορούντων καὶ καλλιεργούντων ἐν ταῖς ἁγίαις σου Ἐκκλησίαις καὶ μεμνημένων τῶν πενήτων, καὶ ἐπὶ πάντας ἡμᾶς τὰ ἐλέη σου ἐξαπόστειλον","ro":"Adu-Ți aminte, Doamne, de orașul (sau: de satul, sau: de sfânt locașul) acesta, în care viețuim și de toate orașele și satele și de cei ce cu credință viețuiesc într-însele. Adu-Ți aminte, Doamne, de cei ce călătoresc pe ape, pe uscat și prin aer, de cei bolnavi, de cei ce pătimesc, de cei robiți și de mântuirea lor. Adu-Ți aminte, Doamne, de cei ce aduc daruri și fac bine în sfintele Tale biserici, și își aduc aminte de cei săraci; și trimite peste noi toți milele Tale","de":"Gedenke, Herr, dieser Stadt [oder dieses Dorfes oder dieses heiligen Klosters], in der (dem) wir wohnen, jeder Stadt und allen Landes und der Gläubigen, die darin leben. Gedenke, Herr, der Reisenden, der Kranken, der Notleidenden, der Gefangenen und ihrer Errettung. Gedenke, Herr, derer, die Früchte bringen und Gutes wirken in Deinen heiligen Kirchen und die der Armen gedenken, und auf uns alle sende herab Deine Erbarmungen","cu":"Помяни, Господи, град сей, в немже живем, и всякий град и страну, и верою живущих в них. Помяни, Господи, плавающих, путешествующих, недугующих, страждущих, плененных, и спасение их. Помяни, Господи, плодоносящих и добротворящих во святых Твоих церквах, и поминающих убогия, и на вся ны милости Твоя низпосли."},"m":"silently"},{"r":"priest","t":{"en":"And grant that with one mouth and one heart we may glorify and praise Thine all-honourable and majestic name, of the Father, and of the Son, and of the Holy Spirit, now and ever and unto ages of ages.","el":"Καὶ δὸς ἡμῖν ἐν ἑνὶ στόματι καὶ μιᾷ καρδίᾳ δοξάζειν καὶ ἀνυμνεῖν τὸ πάντιμον καὶ μεγαλοπρεπὲς ὄνομά σου, τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ Ἁγίου Πνεύματος, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"И даждь нам единеми усты и единем сердцем славити и воспевати пречестное и великолепое имя Твое, Отца и Сына и Святаго Духа, ныне и присно и во веки веков.","ro":"Și ne dă nouă, cu o gură și cu o inimă, a slăvi și a cânta preacinstitul și de mare cuviință numele Tău, al Tatălui și al Fiului și al Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Und gib uns, mit einem Munde und einem Herzen zu verherrlichen und zu besingen Deinen allverehrten und hocherhabenen Namen, des Vaters und des Sohnes und des Heiligen Geistes, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"priest","t":{"en":"And the mercies of our great God and Saviour Jesus Christ shall be with you all.","el":"Καὶ ἔσται τὰ ἐλέη τοῦ μεγάλου Θεοῦ καὶ Σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.","cu":"И да будут милости великаго Бога и Спаса нашего Иисуса Христа со всеми вами.","ro":"Și să fie milele marelui Dumnezeu și Mântuitorului nostru Iisus Hristos cu voi cu toți.","de":"Und es seien die Erbarmungen des großen Gottes und unseres Erlösers Jesus Christus mit euch allen."},"m":"aloud"},{"r":"choir","t":{"en":"And to thy spirit.","el":"Καὶ τῷ πνεύματί σου.","cu":"И духови твоему.","ro":"Și duhului tău.","de":"Und deinem Geiste."}},{"r":"rubric","x":"THE LITANY OF SUPPLICATION before the Lord's Prayer. To each of the first petitions the people answer, \"Lord, have mercy.\"","t":{"en":"THE LITANY OF SUPPLICATION before the Lord's Prayer. To each of the first petitions the people answer, \"Lord, have mercy.\"","el":"ΤΑ ΠΛΗΡΩΤΙΚΑ πρὸ τῆς Κυριακῆς προσευχῆς. Εἰς ἕκαστον τῶν πρώτων αἰτημάτων ὁ λαὸς ἀποκρίνεται: «Κύριε, ἐλέησον.»","cu":"ПРОСИТЕЛЬНАЯ ЕКТЕНИЯ пред молитвою Господнею. На каждое из первых прошений людие отвещают: «Господи, помилуй.»","ro":"ECTENIA CERERILOR înaintea Rugăciunii Domnești. La fiecare dintre cele dintâi cereri, strana răspunde: „Doamne, miluiește.”","de":"DIE BITTEKTENIE vor dem Gebet des Herrn. Auf jede der ersten Bitten antwortet das Volk: „Herr, erbarme Dich.”"}},{"r":"deacon","t":{"en":"Having commemorated all the saints, again and again in peace let us pray to the Lord.","el":"Πάντων τῶν Ἁγίων μνημονεύσαντες, ἔτι καὶ ἔτι ἐν εἰρήνῃ τοῦ Κυρίου δεηθῶμεν.","cu":"Вся святыя помянувше, паки и паки миром Господу помолимся.","ro":"Pe toți sfinții pomenindu-i, iară și iară, cu pace, Domnului să ne rugăm.","de":"Aller Heiligen haben wir gedacht; wieder und wieder in Frieden lasset uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For the precious Gifts here offered and sanctified, let us pray to the Lord.","el":"Ὑπὲρ τῶν προσκομισθέντων καὶ ἁγιασθέντων τιμίων Δώρων τοῦ Κυρίου δεηθῶμεν.","cu":"О принесенных и освященных Честных Дарех Господу помолимся.","ro":"Pentru cinstitele daruri ce s-au adus și s-au sfințit, Domnului să ne rugăm.","de":"Für die dargebrachten und geheiligten kostbaren Gaben lasset uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"That our God who loves mankind, having received them at His holy and most heavenly and noetic altar as a sweet spiritual fragrance, may send down upon us divine grace and the gift of the Holy Spirit, let us pray.","el":"Ὅπως ὁ φιλάνθρωπος Θεὸς ἡμῶν, ὁ προσδεξάμενος αὐτὰ εἰς τὸ ἅγιον καὶ ὑπερουράνιον καὶ νοερὸν αὐτοῦ θυσιαστήριον εἰς ὀσμὴν εὐωδίας πνευματικῆς, ἀντικαταπέμψῃ ἡμῖν τὴν θείαν χάριν καὶ τὴν δωρεὰν τοῦ Ἁγίου Πνεύματος, δεηθῶμεν.","cu":"Яко да Человеколюбец Бог наш, приемый я во святый и пренебесный и мысленный Свой жертвенник, в воню благоухания духовнаго, возниспослет нам Божественную благодать и дар Святаго Духа, помолимся.","ro":"Ca iubitorul de oameni Dumnezeul nostru, Cel ce le-a primit pe ele în sfântul, cel mai presus de ceruri și duhovnicescul Său jertfelnic, întru miros de bună mireasmă duhovnicească, să ne trimită nouă dumnezeiescul har și darul Sfântului Duh, să ne rugăm.","de":"Auf dass unser menschenliebender Gott, der sie auf Seinen heiligen und überhimmlischen und geistigen Altar als Duft geistlichen Wohlgeruchs angenommen hat, uns herabsende die göttliche Gnade und die Gabe des Heiligen Geistes, lasset uns beten."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"deacon","t":{"en":"For our deliverance from all tribulation, wrath, danger, and necessity, let us pray to the Lord.","el":"Ὑπὲρ τοῦ ῥυσθῆναι ἡμᾶς ἀπὸ πάσης θλίψεως, ὀργῆς, κινδύνου καὶ ἀνάγκης τοῦ Κυρίου δεηθῶμεν.","cu":"О избавитися нам от всякия скорби, гнева и нужды, Господу помолимся.","ro":"Pentru izbăvirea noastră de tot necazul, mânia, primejdia și nevoia, Domnului să ne rugăm.","de":"Für unsere Errettung aus aller Bedrängnis, Zorn, Gefahr und Not lasset uns beten zum Herrn."}},{"r":"choir","t":{"en":"Lord, have mercy.","el":"Κύριε, ἐλέησον.","cu":"Господи, помилуй.","ro":"Doamne, miluiește.","de":"Herr, erbarme Dich."}},{"r":"rubric","x":"The priest prays quietly:","t":{"en":"The priest prays quietly:","el":"Ὁ ἱερεὺς εὔχεται μυστικῶς:","cu":"Священник молится тайно:","ro":"Preotul se roagă în taină:","de":"Der Priester betet still:"}},{"r":"priest","t":{"en":"To Thee, O Master who lovest mankind, we entrust our whole life and hope, and we entreat and pray and supplicate Thee: make us worthy to partake of Thy heavenly and dread Mysteries at this sacred and spiritual table with a pure conscience, unto remission of sins, unto forgiveness of transgressions, unto communion of the Holy Spirit, unto inheritance of the kingdom of heaven, unto boldness toward Thee, and not unto judgment or condemnation.","el":"Σοὶ παρακατατιθέμεθα τὴν ζωὴν ἡμῶν ἅπασαν καὶ τὴν ἐλπίδα, Δέσποτα φιλάνθρωπε, καὶ παρακαλοῦμέν σε καὶ δεόμεθα καὶ ἱκετεύομεν· καταξίωσον ἡμᾶς μεταλαβεῖν τῶν ἐπουρανίων σου καὶ φρικτῶν μυστηρίων ταύτης τῆς ἱερᾶς καὶ πνευματικῆς τραπέζης μετὰ καθαροῦ συνειδότος, εἰς ἄφεσιν ἁμαρτιῶν, εἰς συγχώρησιν πλημμελημάτων, εἰς Πνεύματος Ἁγίου κοινωνίαν, εἰς βασιλείας οὐρανῶν κληρονομίαν, εἰς παρρησίαν τὴν πρὸς σέ, μὴ εἰς κρῖμα ἢ εἰς κατάκριμα","ro":"Ție, Stăpâne, Iubitorule de oameni, Îți încredințăm toată viața și nădejdea noastră și cerem și ne rugăm și cu umilință cădem înaintea Ta: Învrednicește-ne să ne împărtășim cu cuget curat, cu cereștile și înfricoșătoarele Tale Taine ale acestor sfinte și duhovnicești mese, spre lăsarea păcatelor, spre iertarea greșelilor spre împărtășirea cu Sfântul Duh, spre moștenirea împărăției cerurilor, spre îndrăznirea cea către Tine, iar nu spre judecată, sau spre osândă","de":"Dir befehlen wir unser ganzes Leben und unsere ganze Hoffnung an, menschenliebender Gebieter, und rufen zu Dir und bitten und flehen: Würdige uns, mit reinem Gewissen teilzunehmen an Deinen himmlischen und schauererregenden Mysterien dieses geheiligten und geistlichen Tisches zur Vergebung der Sünden, zur Verzeihung der Verfehlungen, zur Gemeinschaft des Heiligen Geistes, zur Erbschaft des Königtums der Himmel, zum Freimut vor Dir, nicht aber zum Gericht oder zur Verdammnis","cu":"Тебе предлагаем живот наш весь и надежду, Владыко Человеколюбче, и просим, и молим, и мили ся деем: сподоби нас причаститися небесных Твоих и страшных Таин, сея священныя и духовныя трапезы, с чистою совестию, во оставление грехов, в прощение согрешений, во общение Духа Святаго, в наследие Царствия Небеснаго, в дерзновение еже к Тебе, не в суд или во осуждение."},"m":"silently"},{"r":"deacon","t":{"en":"Help us, save us, have mercy on us, and keep us, O God, by Thy grace.","el":"Ἀντιλαβοῦ, σῶσον, ἐλέησον καὶ διαφύλαξον ἡμᾶς, ὁ Θεός, τῇ σῇ χάριτι.","cu":"Заступи, спаси, помилуй и сохрани нас, Боже, Твоею благодатию.","ro":"Apără, mântuiește, miluiește și ne păzește pe noi, Dumnezeule, cu harul Tău.","de":"Stehe bei, errette, erbarme Dich und behüte uns, o Gott, durch Deine Gnade."}},{"r":"deacon","t":{"en":"That the whole day may be perfect, holy, peaceful, and sinless, let us ask of the Lord.","el":"Τὴν ἡμέραν πᾶσαν τελείαν, ἁγίαν, εἰρηνικὴν καὶ ἀναμάρτητον παρὰ τοῦ Κυρίου αἰτησώμεθα.","cu":"Дне всего совершенна, свята, мирна и безгрешна у Господа просим.","ro":"Ziua toată desăvârșită, sfântă, în pace și fără de păcat, la Domnul să cerem.","de":"Dass der ganze Tag vollkommen, heilig, friedlich und ohne Sünde sei, lasset uns erbitten vom Herrn."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"An angel of peace, a faithful guide, a guardian of our souls and bodies, let us ask of the Lord.","el":"Ἄγγελον εἰρήνης, πιστὸν ὁδηγόν, φύλακα τῶν ψυχῶν καὶ τῶν σωμάτων ἡμῶν παρὰ τοῦ Κυρίου αἰτησώμεθα.","cu":"Ангела мирна, верна наставника, хранителя душ и телес наших у Господа просим.","ro":"Înger de pace, credincios îndreptător, păzitor al sufletelor și al trupurilor noastre, la Domnul să cerem.","de":"Einen Engel des Friedens, einen treuen Führer, einen Hüter unserer Seelen und Leiber, lasset uns erbitten vom Herrn."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"Pardon and remission of our sins and transgressions, let us ask of the Lord.","el":"Συγγνώμην καὶ ἄφεσιν τῶν ἁμαρτιῶν καὶ τῶν πλημμελημάτων ἡμῶν παρὰ τοῦ Κυρίου αἰτησώμεθα.","cu":"Прощения и оставления грехов и прегрешений наших у Господа просим.","ro":"Milă și iertare de păcatele și de greșealele noastre, la Domnul să cerem.","de":"Verzeihung und Nachlass unserer Sünden und Vergehen, lasset uns erbitten vom Herrn."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"Things good and profitable for our souls, and peace for the world, let us ask of the Lord.","el":"Τὰ καλὰ καὶ συμφέροντα ταῖς ψυχαῖς ἡμῶν καὶ εἰρήνην τῷ κόσμῳ παρὰ τοῦ Κυρίου αἰτησώμεθα.","cu":"Добрых и полезных душам нашим, и мира мирови у Господа просим.","ro":"Cele bune și de folos sufletelor noastre și pace lumii, la Domnul să cerem.","de":"Das Gute und Nützliche für unsere Seelen und Frieden für die Welt, lasset uns erbitten vom Herrn."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"That we may complete the remaining time of our life in peace and repentance, let us ask of the Lord.","el":"Τὸν ὑπόλοιπον χρόνον τῆς ζωῆς ἡμῶν ἐν εἰρήνῃ καὶ μετανοίᾳ ἐκτελέσαι παρὰ τοῦ Κυρίου αἰτησώμεθα.","cu":"Прочее время живота нашего в мире и покаянии скончати у Господа просим.","ro":"Cealaltă vreme a vieții noastre în pace și pocăință a o săvârși, la Domnul să cerem.","de":"Dass wir die übrige Zeit unseres Lebens in Frieden und Buße vollenden, lasset uns erbitten vom Herrn."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"A Christian ending to our life, painless, blameless, and peaceful, and a good defence before the dread judgment seat of Christ, let us ask.","el":"Χριστιανὰ τὰ τέλη τῆς ζωῆς ἡμῶν, ἀνώδυνα, ἀνεπαίσχυντα, εἰρηνικά, καὶ καλὴν ἀπολογίαν τὴν ἐπὶ τοῦ φοβεροῦ βήματος τοῦ Χριστοῦ αἰτησώμεθα.","cu":"Христианския кончины живота нашего, безболезненны, непостыдны, мирны, и добраго ответа на Страшнем Судищи Христове просим.","ro":"Sfârșit creștinesc vieții noastre, fără durere, neînfruntat, în pace, și răspuns bun la înfricoșătoarea judecată a lui Hristos, să cerem.","de":"Ein christliches Ende unseres Lebens, schmerzlos, ohne Scham, friedlich, und eine gute Verantwortung vor dem furchtbaren Richterstuhl Christi, lasset uns erbitten."}},{"r":"choir","t":{"en":"Grant this, O Lord.","el":"Παράσχου, Κύριε.","cu":"Подай, Господи.","ro":"Dă, Doamne.","de":"Gewähre, o Herr."}},{"r":"deacon","t":{"en":"Having asked for the unity of the faith and the communion of the Holy Spirit, let us commend ourselves and one another and our whole life to Christ our God.","el":"Τὴν ἑνότητα τῆς πίστεως καὶ τὴν κοινωνίαν τοῦ Ἁγίου Πνεύματος αἰτησάμενοι, ἑαυτοὺς καὶ ἀλλήλους καὶ πᾶσαν τὴν ζωὴν ἡμῶν Χριστῷ τῷ Θεῷ παραθώμεθα.","cu":"Соединение веры и причастие Святаго Духа испросивше, сами себе и друг друга, и весь живот наш Христу Богу предадим.","ro":"Unirea credinței și împărtășirea Sfântului Duh cerând, pe noi înșine și unii pe alții și toată viața noastră lui Hristos Dumnezeu să o dăm.","de":"Die Einheit des Glaubens und die Gemeinschaft des Heiligen Geistes haben wir erbeten; uns selbst und einander und unser ganzes Leben Christus, unserem Gott, lasset uns anbefehlen."}},{"r":"choir","t":{"en":"To Thee, O Lord.","el":"Σοί, Κύριε.","cu":"Тебе, Господи.","ro":"Ție, Doamne.","de":"Dir, o Herr."}},{"r":"priest","t":{"en":"And make us worthy, O Master, that with boldness and without condemnation we may dare to call upon Thee, the heavenly God, as Father, and to say:","el":"Καὶ καταξίωσον ἡμᾶς, Δέσποτα, μετὰ παρρησίας ἀκατακρίτως τολμᾶν ἐπικαλεῖσθαι σὲ τὸν ἐπουράνιον Θεὸν Πατέρα καὶ λέγειν:","cu":"И сподоби нас, Владыко, со дерзновением, неосужденно смети призывати Тебе, Небеснаго Бога Отца, и глаголати:","ro":"Și ne învrednicește pe noi, Stăpâne, cu îndrăznire, fără de osândă, să cutezăm a Te chema pe Tine, Dumnezeul cel ceresc, Tată, și a zice:","de":"Und würdige uns, Gebieter, dass wir es wagen, mit Zuversicht und ohne Verurteilung Dich, den himmlischen Gott, als Vater anzurufen und zu sprechen:"},"m":"aloud"}]},"8":{"title":"The Lord's Prayer","lines":[{"r":"choir","t":{"en":"Our Father, which art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread. And forgive us our trespasses, as we forgive them that trespass against us. And lead us not into temptation; but deliver us from evil.","el":"Πάτερ ἡμῶν, ὁ ἐν τοῖς οὐρανοῖς, ἁγιασθήτω τὸ ὄνομά σου, ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς. Τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ἀφίεμεν τοῖς ὀφειλέταις ἡμῶν, καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ρῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ.","cu":"Отче наш, Иже еси на небесех! Да святится Имя Твое, да приидет Царствие Твое, да будет воля Твоя, яко на небеси и на земли. Хлеб наш насущный даждь нам днесь, и остави нам долги наша, якоже и мы оставлям должником нашим; и не введи нас во искушение, но избави нас от лукаваго.","ro":"Tatăl nostru, Care ești în ceruri, sfințească-se numele Tău, vie împărăția Ta, facă-se voia Ta, precum în cer așa și pe pământ; pâinea noastră cea spre ființă dă-ne-o nouă astăzi, și ne iartă nouă greșelile noastre, precum și noi iertăm greșiților noștri, și nu ne duce pe noi în ispită, ci ne izbăvește de cel rău.","de":"Vater unser, der Du bist in den Himmeln, geheiligt werde Dein Name, Dein Königtum komme, Dein Wille geschehe wie im Himmel, so auf Erden. Unser notwendiges Brot gib uns heute und vergib uns unsere Schulden, wie auch wir vergeben unseren Schuldigern, und führe uns nicht in Versuchung, sondern erlöse uns von dem Bösen."}},{"r":"priest","t":{"en":"For Thine is the kingdom, and the power, and the glory, of the Father, and of the Son, and of the Holy Spirit, now and ever and unto ages of ages.","el":"Ὅτι σοῦ ἐστιν ἡ βασιλεία καὶ ἡ δύναμις καὶ ἡ δόξα, τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ Ἁγίου Πνεύματος, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Яко Твое есть Царство, и сила, и слава. Отца и Сына и Святаго Духа, ныне и присно и во веки веков.","ro":"Că a Ta este împărăția și puterea și slava, a Tatălui și a Fiului și a Sfântului Duh, acum și pururea și în vecii vecilor.","de":"Denn Dein ist das Königtum und die Macht und die Herrlichkeit, des Vaters und des Sohnes und des Heiligen Geistes, jetzt und immerdar und in die Ewigkeit der Ewigkeit."}},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"priest","t":{"en":"Peace be unto all.","el":"Εἰρήνη πᾶσι.","cu":"Мир всем.","ro":"Pace tuturor.","de":"Friede allen."}},{"r":"choir","t":{"en":"And with thy spirit.","el":"Καὶ τῷ πνεύματί σου.","cu":"И духови твоему.","ro":"Și duhului tău.","de":"Und mit deinem Geiste."}},{"r":"deacon","t":{"en":"Let us bow our heads unto the Lord.","el":"Τὰς κεφαλὰς ἡμῶν τῷ Κυρίῳ κλίνωμεν.","cu":"Главы ваша Господеви приклоните.","ro":"Capetele voastre Domnului să le plecați.","de":"Beuget eure Häupter dem Herrn."}},{"r":"choir","t":{"en":"To Thee, O Lord.","el":"Σοί, Κύριε.","cu":"Тебе, Господи.","ro":"Ție, Doamne.","de":"Dir, o Herr."}},{"r":"rubric","x":"The priest prays quietly the Prayer of the Bowing of Heads:","t":{"en":"The priest prays quietly the Prayer of the Bowing of Heads:","el":"Ὁ ἱερεὺς ἀναγινώσκει μυστικῶς τὴν εὐχὴν τῆς κεφαλοκλισίας:","cu":"Священник тайно читает молитву главопреклонения:","ro":"Preotul citește în taină Rugăciunea plecării capetelor:","de":"Der Priester betet still das Gebet der Häupterneigung:"}},{"r":"priest","t":{"en":"We give thanks unto Thee, O invisible King, who by Thine immeasurable power hast created all things, and in the multitude of Thy mercy hast brought all things out of nonexistence into being. Do Thou Thyself, O Master, look down from heaven upon those who have bowed their heads unto Thee; for they have bowed not to flesh and blood, but to Thee, the awesome God. Do Thou, therefore, O Master, distribute these things here set forth unto us all for good, according to the particular need of each: sail with those who sail, journey with those who travel, heal the sick, O Physician of our souls and bodies.","el":"Εὐχαριστοῦμέν σοι, βασιλεῦ ἀόρατε, ὁ τῇ ἀμετρήτῳ σου δυνάμει τὰ πάντα δημιουργήσας καὶ τῷ πλήθει τοῦ ἐλέους σου ἐξ οὐκ ὄντων εἰς τὸ εἶναι τὰ πάντα παραγαγών. Αὐτός, Δέσποτα, οὐρανόθεν ἔπιδε ἐπὶ τοὺς ὑποκεκλικότας σοι τὰς ἑαυτῶν κεφαλάς· οὐ γὰρ ἔκλιναν σαρκὶ καὶ αἵματι, ἀλλὰ σοὶ τῶ φοβερῷ Θεῷ. Σὺ οὖν, Δέσποτα, τὰ προκείμενα πᾶσιν ἡμῖν εἰς ἀγαθὸν ἐξομάλισον κατὰ τὴν ἑκάστου ἰδίαν χρείαν· τοῖς πλέουσι σύμπλευσον, τοῖς ὁδοιποροῦσι συνόδευσον, τοὺς νοσοῦντας ἴασαι, ὁ ἰατρὸς τῶν ψυχῶν καὶ τῶν σωμάτων ἡμῶν","ro":"Mulțumim Ție, Împărate nevăzut, Cel ce toate le-ai făcut cu puterea Ta cea nemăsurată și cu mulțimea milei Tale din neființă la ființă toate le-ai adus. Însuți, Stăpâne, caută din cer spre cei ce și-au plecat Ție capetele lor; că nu le-au plecat trupului și sângelui, ci Ție, înfricoșătorului Dumnezeu. Tu deci, Stăpâne, cele puse înainte nouă tuturor, spre bine le întocmește, după trebuința deosebită a fiecăruia: cu cei ce călătoresc pe ape, pe uscat și prin aer împreună călătorește, pe cei bolnavi îi tămăduiește, Cel ce ești doctorul sufletelor și al trupurilor noastre","de":"Wir danken Dir, unsichtbarer König, der Du in Deiner unermesslichen Macht alles geschaffen und in der Fülle Deines Erbarmens alles aus dem Nichtsein ins Dasein geführt hast. Du selbst, Gebieter, sieh vom Himmel her auf die, welche Dir ihre Häupter gebeugt haben; denn nicht haben sie diese gebeugt vor Fleisch und Blut, sondern vor Dir, dem furchterregenden Gott. Du also, Gebieter, lass die vorliegenden Gaben uns allen gleichermaßen zum Guten gereichen, nach dem besonderen Bedürfnis eines jeden: reise mit den Reisenden, heile die Kranken, Du Arzt unserer Seelen und Leiber","cu":"Благодарим Тя, Царю невидимый, Иже несодеянною Твоею силою вся содетельствовавый, и множеством милости Твоея от небытия в бытие вся приведый. Сам, Владыко, с небесе призри на подклоньшыя Тебе главы своя: не бо подклониша плоти и крови, но Тебе, страшному Богу. Ты убо, Владыко, предлежащая всем нам во благое изравняй, по коегождо своей потребе: плавающым сплавай, путешествующым спутешествуй, недугующыя исцели, врачу душ и телес наших."},"m":"silently"},{"r":"priest","t":{"en":"by the grace and compassion and love for mankind of Thine only-begotten Son, with whom Thou art blessed, together with Thine all-holy and good and life-giving Spirit, now and ever and unto ages of ages.","el":"Χάριτι καὶ οἰκτιρμοῖς καὶ φιλανθρωπίᾳ τοῦ μονογενοῦς σου Υἱοῦ, μεθ’ οὗ εὐλογητὸς εἶ, σὺν τῷ παναγίῳ καὶ ἀγαθῷ καὶ ζωοποιῷ σου Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"Благодатию и щедротами и человеколюбием Единороднаго Сына Твоего, с Нимже благословен еси, со Пресвятым и Благим и Животворящим Твоим Духом, ныне и присно и во веки веков.","ro":"Cu harul și cu îndurările și cu iubirea de oameni a Unuia-Născut Fiului Tău, cu Care ești binecuvântat, împreună cu Preasfântul și bunul și de viață făcătorul Tău Duh, acum și pururea și în vecii vecilor.","de":"Durch die Gnade und das Erbarmen und die Menschenliebe Deines einziggezeugten Sohnes, mit dem Du gepriesen bist, samt Deinem allheiligen und guten und lebendigmachenden Geist, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"rubric","x":"The priest elevates the holy Bread:","t":{"en":"The priest elevates the holy Bread:","el":"Ὁ ἱερεὺς ὑψώνει τὸν ἅγιον Ἄρτον:","cu":"Священник возвышает святый Хлеб:","ro":"Preotul înalță sfânta Pâine:","de":"Der Priester erhebt das heilige Brot:"}},{"r":"deacon","t":{"en":"Let us attend.","el":"Πρόσχωμεν.","cu":"Вонмем.","ro":"Să luăm aminte.","de":"Lasset uns aufmerken."}},{"r":"priest","t":{"en":"The holy Things for the holy.","el":"Τὰ Ἅγια τοῖς ἁγίοις.","cu":"Святая святым.","ro":"Sfintele, sfinților.","de":"Das Heilige den Heiligen."},"m":"aloud"},{"r":"choir","t":{"en":"One is holy, one is Lord, Jesus Christ, to the glory of God the Father. Amen.","el":"Εἷς Ἅγιος, εἷς Κύριος, Ἰησοῦς Χριστός, εἰς δόξαν Θεοῦ Πατρός. Ἀμήν.","cu":"Един Свят, Един Господь, Иисус Христос, во славу Бога Отца. Аминь.","ro":"Unul Sfânt, unul Domn, Iisus Hristos, întru slava lui Dumnezeu Tatăl. Amin.","de":"Einer ist heilig, einer ist Herr: Jesus Christus, zur Ehre Gottes des Vaters. Amen."}},{"r":"rubric","x":"The communion hymn (the koinonikon) appointed for the day is sung.","t":{"en":"The communion hymn (the koinonikon) appointed for the day is sung.","el":"Ψάλλεται τὸ κοινωνικὸν τῆς ἡμέρας.","cu":"Поется причастен (киноник) дня.","ro":"Se cântă chinonicul (priceasna) rânduit zilei.","de":"Das Kommunionlied (das Koinonikon) des Tages wird gesungen."}}]},"9":{"title":"Holy Communion","lines":[{"r":"rubric","x":"THE PREPARATION OF THE CHALICE. The priest breaks the holy Bread; the deacon pours the wine into the cup and adds the warm water (the zeon).","t":{"en":"THE PREPARATION OF THE CHALICE. The priest breaks the holy Bread; the deacon pours the wine into the cup and adds the warm water (the zeon).","el":"Η ΠΡΟΕΤΟΙΜΑΣΙΑ ΤΟΥ ΠΟΤΗΡΙΟΥ. Ὁ ἱερεὺς μελίζει τὸν ἅγιον Ἄρτον· ὁ διάκονος ἐγχέει τὸν οἶνον εἰς τὸ ποτήριον καὶ προσθέτει τὸ ζέον.","cu":"ПРИГОТОВЛЕНИЕ ЧАШИ. Священник раздробляет святый Хлеб; диакон вливает вино в чашу и прилагает теплоту.","ro":"PREGĂTIREA POTIRULUI. Preotul frânge sfânta Pâine; diaconul toarnă vinul în potir și adaugă căldura (zeonul).","de":"DIE BEREITUNG DES KELCHES. Der Priester bricht das heilige Brot; der Diakon gießt den Wein in den Kelch und fügt das warme Wasser (das Zeon) hinzu."}},{"r":"deacon","t":{"en":"Fill, master, the holy cup.","el":"Πλήρωσον, δέσποτα, τὸ ἅγιον ποτήριον.","cu":"Исполни, владыко, святый потир.","ro":"Plinește, stăpâne, sfântul potir.","de":"Fülle, Gebieter, den heiligen Kelch."}},{"r":"priest","t":{"en":"The fullness of the cup of faith, of the Holy Spirit. Amen.","el":"Πλήρωμα ποτηρίου πίστεως Πνεύματος Ἁγίου. Ἀμήν.","cu":"Исполнение Духа Святаго. Аминь.","ro":"Plinirea paharului credinței, a Sfântului Duh. Amin.","de":"Die Fülle des Kelches des Glaubens, des Heiligen Geistes. Amen."}},{"r":"deacon","t":{"en":"Bless, master, the warm water.","el":"Εὐλόγησον, δέσποτα, τὸ ζέον.","cu":"Благослови, владыко, теплоту.","ro":"Binecuvântează, stăpâne, căldura.","de":"Segne, Gebieter, das warme Wasser."}},{"r":"priest","t":{"en":"Blessed is the fervour of Thy saints, always, now and ever and unto ages of ages. Amen.","el":"Εὐλογημένη ἡ ζέσις τῶν ἁγίων σου, πάντοτε, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν.","cu":"Благословенна теплота святых Твоих всегда, ныне и присно и во веки веков. Аминь.","ro":"Binecuvântată este căldura sfinților Tăi, totdeauna, acum și pururea și în vecii vecilor. Amin.","de":"Gesegnet ist die Glut Deiner Heiligen, allezeit, jetzt und immerdar und in die Ewigkeit der Ewigkeit. Amen."}},{"r":"deacon","t":{"en":"The fervour of faith, full of the Holy Spirit. Amen.","el":"Ζέσις πίστεως πλήρης Πνεύματος Ἁγίου. Ἀμήν.","cu":"Теплота веры исполнь Духа Святаго. Аминь.","ro":"Căldura credinței, plină de Duhul Sfânt. Amin.","de":"Die Glut des Glaubens, voll des Heiligen Geistes. Amen."}},{"r":"rubric","x":"Before communing, the clergy and the faithful say the prayers before Holy Communion:","t":{"en":"Before communing, the clergy and the faithful say the prayers before Holy Communion:","el":"Πρὸ τῆς μεταλήψεως, οἱ κληρικοὶ καὶ οἱ πιστοὶ λέγουν τὰς εὐχὰς πρὸ τῆς Θείας Κοινωνίας:","cu":"Прежде причащения священнослужители и верные глаголют молитвы пред Святым Причащением:","ro":"Înainte de împărtășire, slujitorii și credincioșii zic rugăciunile dinaintea Sfintei Împărtășanii:","de":"Vor dem Empfang sprechen die Geistlichen und die Gläubigen die Gebete vor der Heiligen Kommunion:"}},{"r":"priestdeacon","t":{"en":"I believe, O Lord, and I confess that Thou art truly the Christ, the Son of the living God, who camest into the world to save sinners, of whom I am chief. Moreover, I believe that this is Thine own most pure Body, and that this is Thine own precious Blood. Wherefore I pray Thee: have mercy on me and forgive my transgressions, voluntary and involuntary, in word and deed, in knowledge and in ignorance; and make me worthy to partake without condemnation of Thy most pure Mysteries, unto remission of sins and unto life everlasting. Amen.","el":"Πιστεύω, Κύριε, καὶ ὁμολογῶ ὅτι σὺ εἶ ἀληθῶς ὁ Χριστός, ὁ Υἱὸς τοῦ Θεοῦ τοῦ ζῶντος, ὁ ἐλθὼν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι, ὧν πρῶτός εἰμι ἐγώ. Ἔτι πιστεύω ὅτι τοῦτο αὐτό ἐστι τὸ ἄχραντον Σῶμά σου καὶ τοῦτο αὐτό ἐστι τὸ τίμιον Αἷμά σου. Δέομαι οὖν σου· ἐλέησόν με καὶ συγχώρησόν μοι τὰ παραπτώματά μου, τὰ ἑκούσια καὶ τὰ ἀκούσια, τὰ ἐν λόγῳ, τὰ ἐν ἔργῳ, τὰ ἐν γνώσει καὶ ἀγνοίᾳ· καὶ ἀξίωσόν με ἀκατακρίτως μετασχεῖν τῶν ἀχράντων σου μυστηρίων, εἰς ἄφεσιν ἁμαρτιῶν καὶ εἰς ζωὴν αἰώνιον. Ἀμήν.","cu":"Верую, Господи, и исповедую, яко Ты еси воистину Христос, Сын Бога живаго, пришедый в мир грешныя спасти, от нихже первый есмь аз. Еще верую, яко сие есть самое пречистое Тело Твое, и сия есть самая честная Кровь Твоя. Молюся убо Тебе: помилуй мя, и прости ми прегрешения моя, вольная и невольная, яже словом, яже делом, яже ведением и неведением, и сподоби мя неосужденно причаститися пречистых Твоих Таинств, во оставление грехов и в жизнь вечную. Аминь.","ro":"Cred, Doamne, și mărturisesc că Tu ești cu adevărat Hristos, Fiul lui Dumnezeu celui viu, Care ai venit în lume să mântuiești pe cei păcătoși, dintre care cel dintâi sunt eu. Încă cred că acesta este însuși preacurat Trupul Tău și acesta este însuși scump Sângele Tău. Deci, mă rog Ție: miluiește-mă și-mi iartă greșealele mele cele de voie și cele fără de voie, cele cu cuvântul sau cu fapta, cele cu știință și cu neștiință, și mă învrednicește să mă împărtășesc fără de osândă cu preacuratele Tale Taine, spre iertarea păcatelor și spre viața de veci. Amin.","de":"Ich glaube, Herr, und bekenne, dass Du wahrhaft der Christus bist, der Sohn des lebendigen Gottes, der Du in die Welt gekommen bist, die Sünder zu retten, unter denen ich der erste bin. Auch glaube ich, dass dies Dein makelloser Leib selbst und dies Dein kostbares Blut selbst ist. Darum bitte ich Dich: Erbarme Dich meiner und vergib mir meine Vergehen, die freiwilligen und die unfreiwilligen, die in Wort und Tat, in Wissen und Unwissenheit; und mache mich würdig, ohne Verurteilung an Deinen makellosen Mysterien teilzuhaben, zur Vergebung der Sünden und zum ewigen Leben. Amen."}},{"r":"priestdeacon","t":{"en":"Of Thy Mystical Supper, O Son of God, receive me today as a communicant; for I will not speak of Thy Mystery to Thine enemies, neither like Judas will I give Thee a kiss; but like the thief will I confess Thee: Remember me, O Lord, in Thy kingdom.","el":"Τοῦ δείπνου σου τοῦ μυστικοῦ σήμερον, Υἱὲ Θεοῦ, κοινωνόν με παράλαβε· οὐ μὴ γὰρ τοῖς ἐχθροῖς σου τὸ μυστήριον εἴπω· οὐ φίλημά σοι δώσω καθάπερ ὁ Ἰούδας· ἀλλ’ ὡς ὁ λῃστὴς ὁμολογῶ σοι· Μνήσθητί μου, Κύριε, ἐν τῇ βασιλείᾳ σου.","cu":"Вечери Твоея тайныя днесь, Сыне Божий, причастника мя приими; не бо врагом Твоим тайну повем, ни лобзания Ти дам яко Иуда, но яко разбойник исповедаю Тя: помяни мя, Господи, во Царствии Твоем.","ro":"Cinei Tale celei de taină astăzi, Fiul lui Dumnezeu, părtaș mă primește, că nu voi spune vrăjmașilor Tăi taina Ta, nici sărutare Îți voi da ca Iuda, ci ca tâlharul mărturisindu-Te, strig Ție: Pomenește-mă, Doamne, întru împărăția Ta.","de":"Deines mystischen Mahles mache mich heute teilhaftig, Sohn Gottes; denn ich werde Deinen Feinden das Geheimnis nicht verraten, noch Dir einen Kuss geben wie Judas, sondern wie der Schächer bekenne ich Dich: Gedenke meiner, o Herr, in Deinem Reiche."}},{"r":"priestdeacon","t":{"en":"Let not the communion of Thy holy Mysteries be unto me for judgment or condemnation, O Lord, but for the healing of soul and body.","el":"Μὴ εἰς κρῖμα ἢ εἰς κατάκριμα γένοιτό μοι ἡ μετάληψις τῶν ἁγίων σου μυστηρίων, Κύριε, ἀλλ’ εἰς ἴασιν ψυχῆς καὶ σώματος.","cu":"Да не в суд или во осуждение будет мне причащение Святых Твоих Таин, Господи, но во исцеление души и тела.","ro":"Să nu-mi fie mie spre osândă împărtășirea Sfintelor Tale Taine, Doamne, ci spre tămăduirea sufletului și a trupului.","de":"Nicht zum Gericht oder zur Verdammnis gereiche mir der Empfang Deiner heiligen Mysterien, o Herr, sondern zur Heilung der Seele und des Leibes."}},{"r":"rubric","x":"The clergy commune of the holy Body and Blood within the sanctuary, each saying the words of communion quietly.","t":{"en":"The clergy commune of the holy Body and Blood within the sanctuary, each saying the words of communion quietly.","el":"Οἱ κληρικοὶ κοινωνοῦν τοῦ ἁγίου Σώματος καὶ Αἵματος ἐντὸς τοῦ ἱεροῦ βήματος, ἕκαστος λέγων μυστικῶς τὰ λόγια τῆς μεταλήψεως.","cu":"Священнослужители причащаются святаго Тела и Крове во святом алтаре, кийждо глаголя тайно словеса причащения.","ro":"Slujitorii se împărtășesc cu sfântul Trup și Sânge în altar, fiecare zicând în taină cuvintele împărtășirii.","de":"Die Geistlichen empfangen den heiligen Leib und das Blut im Altarraum, ein jeder die Worte der Kommunion still sprechend."}},{"r":"rubric","x":"THE COMMUNION OF THE FAITHFUL. The holy doors are opened, and the deacon (or the priest), elevating the chalice, summons the people:","t":{"en":"THE COMMUNION OF THE FAITHFUL. The holy doors are opened, and the deacon (or the priest), elevating the chalice, summons the people:","el":"Η ΘΕΙΑ ΚΟΙΝΩΝΙΑ ΤΩΝ ΠΙΣΤΩΝ. Ἀνοίγονται αἱ ἅγιαι θύραι, καὶ ὁ διάκονος (ἢ ὁ ἱερεύς), ὑψώνων τὸ ποτήριον, προσκαλεῖ τὸν λαόν:","cu":"ПРИЧАЩЕНИЕ ВЕРНЫХ. Отверзаются святыя двери, и диакон (или священник), возвышая чашу, призывает людей:","ro":"ÎMPĂRTĂȘIREA CREDINCIOȘILOR. Se deschid sfintele uși, și diaconul (sau preotul), înălțând potirul, cheamă pe popor:","de":"DIE KOMMUNION DER GLÄUBIGEN. Die heiligen Türen werden geöffnet, und der Diakon (oder der Priester) ruft, den Kelch erhebend, das Volk herbei:"}},{"r":"deacon","t":{"en":"With the fear of God, with faith and love, draw near.","el":"Μετὰ φόβου Θεοῦ, πίστεως καὶ ἀγάπης προσέλθετε.","cu":"Со страхом Божиим и верою приступите.","ro":"Cu frică de Dumnezeu, cu credință și cu dragoste să vă apropiați.","de":"Mit Gottesfurcht, mit Glauben und Liebe tretet hinzu."}},{"r":"choir","t":{"en":"Blessed is He that cometh in the name of the Lord. The Lord is God, and hath appeared unto us.","el":"Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι Κυρίου· Θεὸς Κύριος καὶ ἐπέφανεν ἡμῖν.","cu":"Благословен Грядый во имя Господне; Бог Господь и явися нам.","ro":"Bine este cuvântat Cel ce vine întru numele Domnului; Dumnezeu este Domnul și S-a arătat nouă.","de":"Gepriesen sei, der da kommt im Namen des Herrn; der Herr ist Gott und ist uns erschienen."}},{"r":"rubric","x":"The faithful approach with reverence, arms crossed, to receive the holy Mysteries. As each communes, the priest says:","t":{"en":"The faithful approach with reverence, arms crossed, to receive the holy Mysteries. As each communes, the priest says:","el":"Οἱ πιστοὶ προσέρχονται μετ' εὐλαβείας, σταυρώνοντες τὰς χεῖρας, διὰ νὰ μεταλάβουν τῶν ἁγίων Μυστηρίων. Καθὼς ἕκαστος μεταλαμβάνει, ὁ ἱερεὺς λέγει:","cu":"Верные приступают со благоговением, сложивше руки крестообразно, ко причащению святых Таин. Егда кийждо причащается, священник глаголет:","ro":"Credincioșii se apropie cu evlavie, cu mâinile încrucișate, spre a primi sfintele Taine. Când fiecare se împărtășește, preotul zice:","de":"Die Gläubigen treten ehrfürchtig, mit gekreuzten Armen, hinzu, um die heiligen Mysterien zu empfangen. Wenn ein jeder kommuniziert, spricht der Priester:"}},{"r":"priest","t":{"en":"The servant of God N. partakes of the holy and most pure Body and Blood of our Lord and God and Saviour Jesus Christ, unto the remission of sins and life everlasting.","el":"Μεταλαμβάνει ὁ δοῦλος τοῦ Θεοῦ (ὁ δεῖνα) τὸ ἅγιον καὶ ἄχραντον Σῶμα καὶ Αἷμα τοῦ Κυρίου καὶ Θεοῦ καὶ Σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ, εἰς ἄφεσιν ἁμαρτιῶν καὶ εἰς ζωὴν αἰώνιον.","cu":"Причащается раб Божий (имярек) Честнаго и Святаго Тела и Крове Господа и Бога и Спаса нашего Иисуса Христа, во оставление грехов своих и в жизнь вечную.","ro":"Se împărtășește robul lui Dumnezeu (N) cu cinstitul și sfântul Trup și Sânge al Domnului și Dumnezeului și Mântuitorului nostru Iisus Hristos, spre iertarea păcatelor și spre viața de veci.","de":"Es empfängt der Knecht Gottes N. den heiligen und makellosen Leib und das Blut unseres Herrn und Gottes und Erlösers Jesus Christus, zur Vergebung der Sünden und zum ewigen Leben."}},{"r":"rubric","x":"After all have communed, the priest blesses the people with the holy cup:","t":{"en":"After all have communed, the priest blesses the people with the holy cup:","el":"Ἀφοῦ μεταλάβουν πάντες, ὁ ἱερεὺς εὐλογεῖ τὸν λαὸν μὲ τὸ ἅγιον ποτήριον:","cu":"По причащении всех священник благословляет людей святою чашею:","ro":"După ce s-au împărtășit toți, preotul binecuvântează pe popor cu sfântul potir:","de":"Nachdem alle kommuniziert haben, segnet der Priester das Volk mit dem heiligen Kelch:"}},{"r":"priest","t":{"en":"O God, save Thy people and bless Thine inheritance.","el":"Σῶσον, ὁ Θεός, τὸν λαόν σου καὶ εὐλόγησον τὴν κληρονομίαν σου.","cu":"Спаси, Боже, люди Твоя и благослови достояние Твое.","ro":"Mântuiește, Dumnezeule, poporul Tău și binecuvântează moștenirea Ta.","de":"Errette, o Gott, Dein Volk und segne Dein Erbe."}},{"r":"choir","t":{"en":"We have seen the true Light, we have received the heavenly Spirit, we have found the true Faith, worshipping the undivided Trinity; for He hath saved us.","el":"Εἴδομεν τὸ φῶς τὸ ἀληθινόν, ἐλάβομεν Πνεῦμα ἐπουράνιον, εὕρομεν πίστιν ἀληθῆ, ἀδιαίρετον Τριάδα προσκυνοῦντες· αὕτη γὰρ ἡμᾶς ἔσωσεν.","cu":"Видехом свет истинный, прияхом Духа Небеснаго, обретохом веру истинную, Нераздельней Троице покланяемся: Та бо нас спасла есть.","ro":"Am văzut Lumina cea adevărată, am primit Duhul cel ceresc, am aflat credința cea adevărată, nedespărțitei Treimi închinându-ne, că Aceasta ne-a mântuit pe noi.","de":"Wir haben das wahre Licht geschaut, wir haben den himmlischen Geist empfangen, wir haben den wahren Glauben gefunden, die unteilbare Dreifaltigkeit anbetend; denn sie hat uns errettet."}},{"r":"rubric","x":"The priest censes the holy Gifts, and carrying them to the table of preparation, says quietly:","t":{"en":"The priest censes the holy Gifts, and carrying them to the table of preparation, says quietly:","el":"Ὁ ἱερεὺς θυμιᾷ τὰ ἅγια Δῶρα καί, μεταφέρων αὐτὰ εἰς τὴν πρόθεσιν, λέγει μυστικῶς:","cu":"Священник кадит святыя Дары и, относя их на жертвенник, глаголет тайно:","ro":"Preotul tămâiază sfintele Daruri și, ducându-le la proscomidiar, zice în taină:","de":"Der Priester beräuchert die heiligen Gaben und spricht, sie zum Rüsttisch tragend, still:"}},{"r":"priest","t":{"en":"Be Thou exalted, O God, above the heavens, and Thy glory above all the earth. (Thrice.)","el":"Ὑψώθητι ἐπὶ τοὺς οὐρανούς, ὁ Θεός, καὶ ἐπὶ πᾶσαν τὴν γῆν ἡ δόξα σου.","cu":"Вознесися на Небеса, Боже, и по всей земли слава Твоя.","ro":"Înalță-Te peste ceruri, Dumnezeule, și peste tot pământul slava Ta.","de":"Erhebe Dich über die Himmel, o Gott, und über die ganze Erde Deine Herrlichkeit."},"m":"silently"},{"r":"priest","t":{"en":"Blessed is our God,","el":"Εὐλογητὸς ὁ Θεὸς ἡμῶν,","cu":"Благословен Бог наш,","ro":"Binecuvântat este Dumnezeul nostru,","de":"Gepriesen sei unser Gott,"}},{"r":"priest","t":{"en":"always, now and ever and unto ages of ages.","el":"πάντοτε, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων.","cu":"всегда, ныне и присно и во веки веков.","ro":"totdeauna, acum și pururea și în vecii vecilor.","de":"allezeit, jetzt und immerdar und in die Ewigkeit der Ewigkeit."},"m":"aloud"},{"r":"choir","t":{"en":"Amen.","el":"Ἀμήν.","cu":"Аминь.","ro":"Amin.","de":"Amen."}},{"r":"rubric","x":"THE THANKSGIVING. The priest gives thanks quietly for the holy gifts received, then the deacon bids the people give thanks:","t":{"en":"THE THANKSGIVING. The priest gives thanks quietly for the holy gifts received, then the deacon bids the people give thanks:","el":"Η ΕΥΧΑΡΙΣΤΙΑ. Ὁ ἱερεὺς εὐχαριστεῖ μυστικῶς διὰ τὰ ληφθέντα ἅγια δῶρα, ἔπειτα ὁ διάκονος προτρέπει τὸν λαὸν εἰς εὐχαριστίαν:","cu":"БЛАГОДАРЕНИЕ. Священник благодарит тайно о принятых святых дарех, потом диакон призывает людей к благодарению:","ro":"MULȚUMIREA. Preotul mulțumește în taină pentru sfintele daruri primite, apoi diaconul îndeamnă pe popor la mulțumire:","de":"DIE DANKSAGUNG. Der Priester dankt still für die empfangenen heiligen Gaben, dann fordert der Diakon das Volk zur Danksagung auf:"}},{"r":"priest","t":{"en":"We thank Thee, O Master who lovest mankind, benefactor of our souls, that on this day Thou hast made us worthy of Thy heavenly and immortal Mysteries. Make straight our way, establish us all in Thy fear, guard our life, make firm our steps, through the prayers and supplications of the glorious Theotokos and ever-virgin Mary and of all Thy saints.","el":"Εὐχαριστοῦμέν σοι, Δέσποτα φιλάνθρωπε, εὐεργέτα τῶν ψυχῶν ἡμῶν, ὅτι καὶ τῇ παρούσῃ ἡμέρᾳ κατηξίωσας ἡμᾶς τῶν ἐπουρανίων σου καὶ ἀθανάτων μυστηρίων. Ὀρθοτόμησον ἡμῶν τὴν ὁδόν, στήριξον ἡμᾶς ἐν τῷ φόβῳ σου τοὺς πάντας, φρούρησον ἡμῶν τὴν ζωήν, ἀσφάλισαι ἡμῶν τὰ διαβήματα, εὐχαῖς καὶ ἱκεσίαις τῆς ἐνδόξου Θεοτόκου καὶ ἀειπαρθένου Μαρίας καὶ πάντων τῶν ἁγίων σου.","cu":"Благодарим Тя, Владыко Человеколюбче, благодетелю душ наших, яко и в настоящий день сподобил еси нас небесных Твоих и безсме
