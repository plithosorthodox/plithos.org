}

function loadLang(L,cb){
  if(L==="en"||I18N[L]){ cb&&cb(); return; }
  fetch("data/prayers-i18n.v2."+L+".json")

      if(!r.ok)return null;

    .then(function(j){ I18N[L]=j||{}; })
    .catch(function(){ I18N[L]={}; })

function view(p){
  var m=(lang!=="en"&&I18N[lang])?I18N[lang][p.title]:null;
  return {
    title:(m&&m.title)||p.title,
    body:(m&&m.body)||p.body,
    translated:!!(m&&m.body),
    p:p
  };
}

function matches(p){
  if(!query)return true;
  var v=view(p);
  return fold(v.title).indexOf(query)>=0 || fold(v.body).indexOf(query)>=0 ||
         fold(p.title).indexOf(query)>=0 || fold(p.cat).indexOf(query)>=0;
}

function visible(){
  var order={};
  DATA.sections.forEach(function(s,n){ order[s.id]=n; });
  return DATA.prayers.filter(function(p){
    if(section!=="all"&&p.s!==section)return false;
    return matches(p);
  }).sort(function(a,b){
    /* "All prayers" must read in prayer-book order - the daily rule first,
       then the Hours, and so on - not in the order the array happened to be
       written in. Within a section the original sequence is kept. */
    var d=(order[a.s]||0)-(order[b.s]||0);
    return d || (a.i-b.i);
  });
}

function renderRail(){
  var host=$("seclist"), html="";
  var counts={}, i;
  DATA.prayers.forEach(function(p){ if(matches(p)) counts[p.s]=(counts[p.s]||0)+1; });
  var total=DATA.prayers.filter(matches).length;
  html+='<button class="secbtn'+(section==="all"?" on":"")+'" data-s="all">'+
        '<span>'+esc(tr(lang,"all"))+'</span><span class="n">'+total+'</span></button>';
  DATA.sections.forEach(function(s){
    var n=counts[s.id]||0;
    var stitle=(s.tr&&s.tr[lang])||s.title;
    html+='<button class="secbtn'+(section===s.id?" on":"")+'" data-s="'+esc(s.id)+'">'+
          '<span>'+esc(stitle)+'</span><span class="n">'+n+'</span></button>';
  });
  host.innerHTML=html;
  var b=host.querySelectorAll(".secbtn");
  for(i=0;i<b.length;i++)b[i].addEventListener("click",function(){
    section=this.getAttribute("data-s"); current=null;
    setHash(section==="all"?"":"s="+section);
    render();
  });
}

function renderList(){
  var list=visible(), html="", i;
  if(!list.length){ return '<div class="empty">'+esc(tr(lang,"none"))+"</div>"; }
  var n=list.length;
  if(section!=="all"){
    var sec=null;
    DATA.sections.forEach(function(x){ if(x.id===section)sec=x; });
    var sdesc=(sec&&sec.descTr&&sec.descTr[lang])||(sec&&sec.desc);
    if(sdesc)html+='<p class="secdesc">'+esc(sdesc)+"</p>";
  }
  html+='<p class="count">'+esc(n===1?tr(lang,"n_one"):tr(lang,"n_many").replace("#",n))+"</p>";
  /* Communion prayers group by where they fall in the sequence - the Order of
     Preparation, the two said at the chalice, the thanksgiving after - which
     is more useful than the single "Before Holy Communion" heading. */
  var byCat={}, order=[];
  list.forEach(function(p){
    var key=p.phaseLabel||p.cat;
    if(!byCat[key]){byCat[key]=[];order.push(key);}
    byCat[key].push(p);
  });
  order.forEach(function(cat){
    var blurb=say("groupDescs",(byCat[cat][0]||{}).phaseDesc||"");
    var gh=(DATA.groups&&DATA.groups[cat]&&DATA.groups[cat][lang])||cat;
    html+='<div class="catgrp"><h2 class="cathead">'+esc(gh)+"</h2>";
    if(blurb)html+='<p class="catdesc">'+esc(blurb)+"</p>";
    html+='<div class="plist">';
    byCat[cat].forEach(function(p){
      var v=view(p);
      /* Where a prayer has been described, show that and its length rather
         than the first few words of its body - the reader needs to know what
         it is and how long it is in order to choose. */
      var snip=say("descs",p.desc)||v.body.replace(/\s+/g," ").slice(0,90);
      var len=p.words?('<span class="wlen">'+p.words+' '+esc(tr(lang,"words"))+'</span>'):"";
      html+='<button class="pbtn" data-i="'+p.i+'"><span class="pttl">'+esc(v.title)+'</span>'+len+'<span class="snip">'+esc(snip)+'</span></button>';
    });
    html+="</div></div>";
  });
  return html;
}

function renderReading(p){
  var v=view(p), html="";
  html+='<div class="rbar">'+
        '<button class="rbtn" id="backbtn">&larr; '+esc(tr(lang,"back"))+'</button>'+
        '<button class="rbtn" id="copybtn">'+esc(tr(lang,"copy"))+'</button>'+
        "</div>";
  html+='<article class="reading"'+(RTL[lang]?' dir="rtl"':"")+">";
  html+="<h2>"+esc(v.title)+"</h2>";
  html+='<p class="rcat">'+esc(say("groups",p.phaseLabel||p.cat))+(p.words?(" \u00b7 "+p.words+" "+tr(lang,"words")):"")+"</p>";
  if(p.desc)html+='<p class="rdesc">'+esc(say("descs",p.desc))+"</p>";
  if(lang!=="en"&&!v.translated)html+='<div class="partial">'+esc(tr(lang,"partial"))+"</div>";
  v.body.split(/\n\n+/).forEach(function(par){ html+="<p>"+esc(par)+"</p>"; });
  if(p.note)html+='<div class="note">'+esc(say("notes",p.note))+"</div>";
  if(p.src)html+='<div class="src">'+esc(tr(lang,"src"))+": "+esc(say("sources",p.src))+"</div>";
  html+="</article>";
  return html;
}

function render(){
  document.documentElement.lang=lang;
  document.documentElement.dir=RTL[lang]?"rtl":"ltr";
  var els=document.querySelectorAll("[data-t]"), i;
  for(i=0;i<els.length;i++){
    var v=tr(lang,els[i].getAttribute("data-t"));
    if(v)els[i].textContent=v;
  }
  $("q").placeholder=tr(lang,"ph");
  var mz=(DATA&&DATA.measure&&(DATA.measure[lang]||DATA.measure.en));
  var mel=$("measure");
  if(mel&&mz){
    mel.innerHTML='<p><strong>'+esc(mz.h)+"</strong> "+esc(mz.b)+
      ' <em>'+esc(mz.q)+"</em> "+esc(mz.c)+"</p>"+
      '<p><a href="/rule">'+esc(mz.link)+" &rarr;</a></p>";
  }
  document.title=(lang==="en"?PL_TITLE:"Plithos: "+tr(lang,"h1"));
  renderRail();

  if(current!=null){
    var p=DATA.prayers[current];
    if(p){
      $("body").innerHTML=renderReading(p);
      $("backbtn").addEventListener("click",function(){ current=null; setHash(section==="all"?"":"s="+section); render(); });
      $("copybtn").addEventListener("click",function(){
        var v=view(p), txt=v.title+"\n\n"+v.body+(p.src?"\n\n"+p.src:"");
        var btn=this, done=function(){ btn.textContent=tr(lang,"copied"); setTimeout(function(){btn.textContent=tr(lang,"copy");},1500); };
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,function(){});
        else done();
      });
      window.scrollTo(0,0);
      return;
    }
  }
  $("body").innerHTML=renderList();
  var btns=$("body").querySelectorAll(".pbtn");
  for(i=0;i<btns.length;i++)btns[i].addEventListener("click",function(){
    current=+this.getAttribute("data-i");
    setHash("p="+current);
    render();
  });
}

/* ------------------------------------------------------------- URL state */
var _lock=false;
function setHash(h){
  if(_lock)return;
  if(location.hash.replace(/^#/,"")===h)return;
  _lock=true;
  try{
    if(h)history.pushState(null,"","#"+h);
    else history.pushState(null,"",location.pathname+location.search);
  }catch(e){ location.hash=h; }
  _lock=false;
}
function route(){
  var h=location.hash||"",m;
  if((m=/[#&]p=(\d+)/.exec(h))){ current=+m[1]; render(); return; }
  current=null;
  if((m=/[#&]s=([a-z]+)/.exec(h))){ section=m[1]; } else { section="all"; }
  render();
}

function boot(){
  lang=readLang();
  var sel=$("langpick");
  Object.keys(LANG_NAMES).forEach(function(c){
    var o=document.createElement("option");
    o.value=c; o.textContent=LANG_NAMES[c];
    if(c===lang)o.selected=true;
    sel.appendChild(o);
  });
  sel.addEventListener("change",function(){
    lang=sel.value;
    try{ localStorage.setItem("plithos.lang",lang); }catch(e){}document.dispatchEvent(new CustomEvent("plithos:lang",{detail:lang}));
    loadLang(lang,render);
  });
  $("q").addEventListener("input",function(){
    query=fold(this.value);
    current=null;
    render();
  });
  window.addEventListener("popstate",route);
  window.addEventListener("hashchange",route);

  fetch("data/prayers.v2.json")
    .then(function(r){
      if(!r.ok)return null;
      var ct=(r.headers.get("content-type")||"").toLowerCase();
      if(ct.indexOf("json")<0)return null;
      return r.json();
    })
    .then(function(d){
      if(!d){ $("body").innerHTML='<div class="empty">The prayers could not be loaded.</div>'; return; }
      DATA=d;
      if(d.ui){ for(var L in d.ui){ T[L]=d.ui[L]; } }
      loadLang(lang,route);
    })
    .catch(function(){ $("body").innerHTML='<div class="empty">The prayers could not be loaded.</div>'; });
}
boot();
</script>
