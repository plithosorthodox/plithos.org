function tr(L,k){ return (T[L]&&T[L][k]) || T.en[k] || ""; }
/* The headings, descriptions, notes and source lines that travel with a
   prayer are carried in tables keyed by the English line itself, so a prayer
   added before its descriptive matter is ready still reads. */
function say(table,s){
  if(!s)return "";
  var m=DATA&&DATA[table]&&DATA[table][s];
  return (m&&m[lang])||s;
}

var DATA=null, I18N={}, lang="en", section="all", subtype=null, topic=null, query="", current=null;
var returnState=null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fold(s){ s=(s||"").toLowerCase(); if(s.normalize)s=s.normalize("NFD").replace(/[̀-ͯ]/g,""); return s; }

function readLang(){
  var L=null;
  try{ L=localStorage.getItem("plithos.lang"); }catch(e){}
  if(L&&LANG_NAMES[L])return L;
  var n=(navigator.language||"en").toLowerCase().split("-")[0];
  return LANG_NAMES[n]?n:"en";
}

/* The prayer translations are keyed by the English title. */
function loadLang(L,cb){
  if(L==="en"||I18N[L]){ cb&&cb(); return; }
  fetch("data/prayers-i18n.v2."+L+".json")
    .then(function(r){
      if(!r.ok)return null;
      var ct=(r.headers.get("content-type")||"").toLowerCase();
      if(ct.indexOf("json")<0)return null;   /* Pages returns index.html for missing paths */
      return r.json();
    })
    .then(function(j){ I18N[L]=j||{}; })
    .catch(function(){ I18N[L]={}; })
    .then(function(){ cb&&cb(); });
}

function view(p){
  var m=(lang!=="en"&&I18N[lang])?I18N[lang][p.title]:null;
  return {
    title:(m&&m.title)||p.title,
    body:(m&&m.body)||p.body,
    translated:!!(m&&m.body),
    p:p
  };
}

function topicRow(id){
  var out=null;
  (DATA.topics||[]).forEach(function(t){if(t.id===id)out=t;});
  return out;
}
function topicLabel(id,L){
  var t=topicRow(id), use=L||lang;
  return t?((t.tr&&t.tr[use])||t.title):id;
}
function groupLabel(g){return (g.tr&&g.tr[lang])||g.title;}
function scoreText(text,exact,prefix,contains){
  var s=fold(text);
  if(!s)return 0;
  if(s===query)return exact;
  if(s.indexOf(query)===0)return prefix;
  if(s.indexOf(query)>=0)return contains;
  return 0;
}
function searchScore(p){
  if(!query)return 0;
  var v=view(p), score=0, labels=[];
  score=Math.max(score,scoreText(v.title,1000,900,750));
  score=Math.max(score,scoreText(p.title,980,880,730));
  (p.topics||[]).forEach(function(id){labels.push(topicLabel(id));labels.push(topicLabel(id,"en"));});
  labels.push(p.cat||"");labels.push(p.phaseLabel||"");
  if(fold(labels.join(" ")).indexOf(query)>=0)score=Math.max(score,600);
  if(fold(say("descs",p.desc)||"").indexOf(query)>=0)score=Math.max(score,400);
  if(fold(v.body).indexOf(query)>=0)score=Math.max(score,100);
  return score;
}
function prayerOrder(a,b){
  var order={};
  DATA.sections.forEach(function(s,n){order[s.id]=n;});
  var d=(order[a.s]||0)-(order[b.s]||0);
  return d||(a.i-b.i);
}
function subtypeSlug(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function subtypeId(p){return p.s+"-"+subtypeSlug(p.phaseLabel||p.cat);}
function orderSubtypes(){
  var rows=[], seen={};
  DATA.prayers.forEach(function(p){
    var id=subtypeId(p);
    if(!seen[id]){seen[id]=1;rows.push({id:id,s:p.s,label:p.phaseLabel||p.cat});}
  });
  return rows;
}
function subtypeRow(id){
  var out=null;
  orderSubtypes().forEach(function(row){if(row.id===id)out=row;});
  return out;
}
function visible(){
  return DATA.prayers.filter(function(p){
    if(query)return searchScore(p)>0;
    if(topic&&(p.topics||[]).indexOf(topic)<0)return false;
    if(section!=="all"&&p.s!==section)return false;
    if(subtype&&subtypeId(p)!==subtype)return false;
    return true;
  }).sort(function(a,b){
    if(query){var d=searchScore(b)-searchScore(a);if(d)return d;}

function renderTopics(){

  if(topic){
    html='<div class="filterhead"><strong id="topics-heading">'+esc(topicLabel(topic))+'</strong><a class="alltopics" href="#" data-all-topics="1">'+esc(tr(lang,"allTopics"))+'</a></div>';
  }else{

      html+='<section class="topicgroup"><h3>'+esc(groupLabel(g))+'</h3><div class="topiclinks">';
      (g.topics||[]).forEach(function(id){
        html+='<a class="topiclink" href="#topic='+encodeURIComponent(id)+'" data-topic="'+esc(id)+'"><span>'+esc(topicLabel(id))+'</span><span class="topiccount">'+(counts[id]||0)+'</span></a>';

function renderOrder(){
  var sel=$("secsel"), counts={}, subtypeCounts={}, rows=orderSubtypes(), opts="", selected="all";
  DATA.prayers.forEach(function(p){
    counts[p.s]=(counts[p.s]||0)+1;

  });
  opts='<option value="all">'+esc(tr(lang,"all"))+" ("+DATA.prayers.length+")</option>";
  DATA.sections.forEach(function(s){
    var stitle=(s.tr&&s.tr[lang])||s.title;
    opts+='<optgroup label="'+esc(stitle)+'">';
    opts+='<option value="section:'+esc(s.id)+'">'+esc(stitle+" - "+tr(lang,"all"))+" ("+(counts[s.id]||0)+")</option>";
    rows.forEach(function(row){
      if(row.s!==s.id)return;
      opts+='<option value="subtype:'+esc(row.id)+'">'+esc(say("groups",row.label))+" ("+(subtypeCounts[row.id]||0)+")</option>";

function renderList(){

    html+='<div class="plist">';
    byCat[cat].forEach(function(p){html+=prayerLink(p);});
    html+="</div></div>";

function prayerHash(p){
  var parts=[];
  if(topic)parts.push("topic="+encodeURIComponent(topic));
  else{
    if(section!=="all")parts.push("s="+encodeURIComponent(section));
    if(subtype)parts.push("sub="+encodeURIComponent(subtype));
  }
  parts.push("prayer="+encodeURIComponent(p.id));
  return "#"+parts.join("&");
}
function prayerLink(p){
  var v=view(p), snip=say("descs",p.desc)||v.body.replace(/\s+/g," ").slice(0,90);
  var len=p.words?('<span class="wlen">'+p.words+' '+esc(tr(lang,"words"))+'</span>'):"";
  return '<a class="pbtn" id="prayer-link-'+esc(p.id)+'" href="'+prayerHash(p)+'" data-prayer="'+esc(p.id)+'"><span class="pttl">'+esc(v.title)+'</span>'+len+'<span class="snip">'+esc(snip)+'</span></a>';
}

function renderReading(p){
  var v=view(p), html="";
  html+='<div class="rbar">'+
        '<button class="rbtn" id="backbtn">&larr; '+esc(tr(lang,"backResults"))+'</button>'+
        '<button class="rbtn" id="copybtn">'+esc(tr(lang,"copy"))+'</button>'+
        "</div>";
  html+='<article class="reading" aria-labelledby="reading-title"'+(RTL[lang]?' dir="rtl"':"")+">";
  html+='<h2 id="reading-title" tabindex="-1">'+esc(v.title)+"</h2>";
  html+='<p class="rcat">'+esc(say("groups",p.phaseLabel||p.cat))+(p.words?(" \u00b7 "+p.words+" "+tr(lang,"words")):"")+"</p>";
  if(p.desc)html+='<p class="rdesc">'+esc(say("descs",p.desc))+"</p>";
  if(lang!=="en"&&!v.translated)html+='<div class="partial">'+esc(tr(lang,"partial"))+"</div>";
  v.body.split(/\n\n+/).forEach(function(par){ html+="<p>"+esc(par)+"</p>"; });
  if(p.note)html+='<div class="note">'+esc(say("notes",p.note))+"</div>";
  if(p.src)html+='<div class="src">'+esc(tr(lang,"src"))+": "+esc(say("sources",p.src))+"</div>";
  html+="</article>";
  return html;
}

function prayerById(id){
  var out=null;
  DATA.prayers.forEach(function(p){if(p.id===id)out=p;});
  return out;
}
function listHash(){
  if(topic)return "topic="+encodeURIComponent(topic);
  var parts=[];
  if(section!=="all")parts.push("s="+encodeURIComponent(section));
  if(subtype)parts.push("sub="+encodeURIComponent(subtype));
  return parts.join("&");
}
function restoreListState(){
  var st=returnState;
  if(!st)return;
  query=st.query;topic=st.topic;section=st.section;subtype=st.subtype;current=null;
  $("q").value=st.raw;st.restore=true;
  render();
}
function finishReturn(){
  if(!returnState||!returnState.restore)return;
  var st=returnState;
  setTimeout(function(){
    var el=$(st.focus);
    if(el){try{el.focus({preventScroll:true});}catch(e){el.focus();}}
    window.scrollTo(0,st.scroll);
    returnState=null;
  },0);
}
function render(){
  document.documentElement.lang=lang;
  document.documentElement.dir=RTL[lang]?"rtl":"ltr";
  var els=document.querySelectorAll("[data-t]"), i;
  for(i=0;i<els.length;i++){
    var text=tr(lang,els[i].getAttribute("data-t"));
    if(text)els[i].textContent=text;
  }
  $("q").placeholder=tr(lang,"ph");
  $("clearq").hidden=!query;
  var count=current?0:visible().length, status="";
  if(query)status=tr(lang,"searchingAll")+". "+(count===1?tr(lang,"n_one"):tr(lang,"n_many").replace("#",count));
  else if(topic)status=topicLabel(topic)+". "+tr(lang,"topicResults")+": "+(count===1?tr(lang,"n_one"):tr(lang,"n_many").replace("#",count));
  else if(subtype){var subrow=subtypeRow(subtype);if(subrow)status=say("groups",subrow.label)+". "+(count===1?tr(lang,"n_one"):tr(lang,"n_many").replace("#",count));}
  $("searchstate").textContent=status;
  var mz=(DATA&&DATA.measure&&(DATA.measure[lang]||DATA.measure.en));
  var mel=$("measure"), summary=$("measure-summary");
  if(mel&&summary&&mz){
    summary.textContent=mz.h;
    mel.innerHTML='<p>'+esc(mz.b)+' <em>'+esc(mz.q)+"</em> "+esc(mz.c)+"</p>"+
      '<p><a href="/rule">'+esc(mz.link)+" &rarr;</a></p>";
  }
  document.querySelector(".measure").hidden=!!current;
  document.title=(lang==="en"?PL_TITLE:"Plithos: "+tr(lang,"h1"));
  renderTopics();renderOrder();

  if(current){
    var p=prayerById(current);
    if(p){
      $("body").innerHTML=renderReading(p);
      $("backbtn").addEventListener("click",function(){
        if(returnState){history.back();return;}
        current=null;setHash(listHash());render();
      });
      $("copybtn").addEventListener("click",function(){
        var pv=view(p), txt=pv.title+"\n\n"+pv.body+(p.src?"\n\n"+p.src:"");
        var btn=this, done=function(){btn.textContent=tr(lang,"copied");setTimeout(function(){btn.textContent=tr(lang,"copy");},1500);};
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,function(){});
        else done();
      });
      window.scrollTo(0,0);
      setTimeout(function(){var h=$("reading-title");if(h)h.focus();},0);
      return;
    }
    current=null;
  }
  $("body").innerHTML=renderList();
  var links=$("body").querySelectorAll("[data-prayer]");
  for(i=0;i<links.length;i++)links[i].addEventListener("click",function(e){
    e.preventDefault();
    returnState={query:query,raw:$("q").value,topic:topic,section:section,subtype:subtype,focus:this.id,scroll:window.pageYOffset||document.documentElement.scrollTop||0,restore:false};
    current=this.getAttribute("data-prayer");
    setHash(this.getAttribute("href").replace(/^#/,""));render();
  });
  finishReturn();
}

/* ------------------------------------------------------------- URL state */
var _lock=false;
function setHash(h,replace){
  if(_lock)return;
  if(location.hash.replace(/^#/,"")===h)return;
  _lock=true;
  try{
    var url=h?("#"+h):(location.pathname+location.search);
    if(replace)history.replaceState(null,"",url);else history.pushState(null,"",url);
  }catch(e){ location.hash=h; }
  _lock=false;
}
function parseHash(){
  var out={}, raw=location.hash.replace(/^#/,""), parts=raw?raw.split("&"):[], i, bit, key, val;
  for(i=0;i<parts.length;i++){
    bit=parts[i].split("=");key=bit.shift();val=bit.join("=");
    try{key=decodeURIComponent(key);val=decodeURIComponent(val);}catch(e){}
    if(key)out[key]=val;
  }
  return out;
}
function route(){
  if(!DATA)return;
  var h=parseHash(), p=null, prior=current, subrow=null;
  if(returnState&&returnState.restore)return;
  if(h.prayer)p=prayerById(h.prayer);
  else if(/^\d+$/.test(h.p||"")&&DATA.prayers[+h.p])p=DATA.prayers[+h.p];
  if(prior&&returnState&&!p){restoreListState();return;}
  query="";$("q").value="";
  topic=(h.topic&&topicRow(h.topic))?h.topic:null;
  section="all";subtype=null;
  DATA.sections.forEach(function(s){if(h.s===s.id)section=s.id;});
  if(h.sub){subrow=subtypeRow(h.sub);if(subrow){subtype=subrow.id;section=subrow.s;}}
  current=p?p.id:null;
  if(topic){section="all";subtype=null;}
  render();
}

function boot(){
  lang=readLang();
  var sel=$("langpick");
  Object.keys(LANG_NAMES).forEach(function(c){
    var o=document.createElement("option");
    o.value=c; o.textContent=LANG_NAMES[c];
    if(c===lang)o.selected=true;
    sel.appendChild(o);
  });
  sel.addEventListener("change",function(){
    lang=sel.value;
    try{ localStorage.setItem("plithos.lang",lang); }catch(e){}document.dispatchEvent(new CustomEvent("plithos:lang",{detail:lang}));
    loadLang(lang,render);
  });
  $("q").addEventListener("input",function(){
    query=fold(this.value);
    current=null;topic=null;section="all";subtype=null;returnState=null;
    setHash("",true);
    render();
  });
  $("clearq").addEventListener("click",function(){
    query="";subtype=null;this.hidden=true;$("q").value="";setHash("",true);render();$("q").focus();
  });
  var pendingRoute=false;
  function scheduleRoute(){if(pendingRoute)return;pendingRoute=true;setTimeout(function(){pendingRoute=false;route();},0);}
  window.addEventListener("popstate",scheduleRoute);
  window.addEventListener("hashchange",scheduleRoute);

  fetch("data/prayers.v3.json")
    .then(function(r){
      if(!r.ok)return null;
      var ct=(r.headers.get("content-type")||"").toLowerCase();
      if(ct.indexOf("json")<0)return null;
      return r.json();
    })
    .then(function(d){
      if(!d){ $("body").innerHTML='<div class="empty">The prayers could not be loaded.</div>'; return; }
      DATA=d;
      if(d.ui){ for(var L in d.ui){ T[L]=d.ui[L]; } }
      for(var k in UI_DEFAULTS){if(!T.en[k])T.en[k]=UI_DEFAULTS[k];}
      loadLang(lang,route);
    })
    .catch(function(){ $("body").innerHTML='<div class="empty">The prayers could not be loaded.</div>'; });
}
boot();
</script>
